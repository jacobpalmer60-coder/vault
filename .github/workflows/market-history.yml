name: Market history

# The Player Market's trade history and timing (2026-10-27): every crawled Sleeper trade
# since 2024 summed up per player (data/market-history/player-history.json) and when each
# kind of player is cheapest in the year from KTC's history (seasonal.json). Weekly, after
# the nightly data update has added the week's KTC prices; the hourly crawl keeps the raw
# trades on the "sleeper-trades" release. Trade Lab's trade-lab.json needs the local
# judging run and is rebuilt by hand.
on:
  schedule:
    - cron: '0 10 * * 1'   # Mondays, after Update data (06:00/07:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get the crawled trades
        run: |
          mkdir -p data/sleeper-trades
          gh release download sleeper-trades --pattern '*.json.gz' --dir data/sleeper-trades --clobber

      - run: node scripts/market-history/build-seasonal.js
      - run: node --max-old-space-size=6144 scripts/market-history/build-player-history.js

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-history/player-history.json data/market-history/seasonal.json
          git diff --cached --quiet && exit 0
          git commit -m "Update market history"
          # The hourly crawl and the nightly update also push: catch up first.
          git pull --rebase --autostash
          git push
