name: Check site code

# vault-core.js also runs in Node, for the crawl's pricing and the nightly update, so code that
# only works in a browser can stop both (2026-11-05). This turns the commit red and emails the
# owner the moment that happens, instead of it showing up as a stopped crawl hours later.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - vault-core.js
      - league-intelligence.js
      - market-data.js
      - coach.js
      - negotiation.js
      - trade.html
      - trade_grades.html
      - managers.html
      - app.html
      - team-analyzer.html
      - draft.html
      - draft-center.js
      - draft-rules.js
      - activity.html
      - activity.js
      - activity-model.js
      - vault-nav.js
      - trade-evidence.js
      - vault.css
      - .github/workflows/check-site.yml
      - trade_lab.html
      - league_history.html
      - scripts/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-core-loads.js
      - run: node scripts/check-math.js
      - run: node scripts/check-coach-reality.cjs
      - run: node scripts/check-coach-discover.cjs
      - run: node scripts/check-intelligence-integration.cjs
      - run: node scripts/check-relative-growth.js
      - run: node scripts/check-prospective-prices.js
      - run: node scripts/check-manager-negotiation-evidence.cjs
      - run: node scripts/check-simple-dashboard.cjs
      - run: node scripts/check-audit-regressions.js
      - run: node scripts/check-calculator-deep.js
      - run: node scripts/check-leaguewide-parity.js
      - run: node scripts/check-history-roster-evidence.js
      - run: node scripts/check-league-history.js
      - run: node scripts/check-manager-record-parity.js
      - run: node scripts/check-trade-evidence.js
      - run: node scripts/check-html-scripts.js
      - run: node scripts/check-sitewide-quality.js
      - run: node scripts/check-draft-activity.js
      - run: node scripts/stamp-assets.js --check
      - name: KTC refresh parser regression (mocked page)
        run: node scripts/check-ktc-refresh.js
      - name: Unified Sleeper ingestion integration test (mocked API)
        run: node scripts/check-unified-sleeper.js
      - name: Audit every static page and research freshness labels
        run: node scripts/check-site-assets.js
      - name: Trade calculator, manager, draft and model regressions
        run: |
          failures=0
          for test in \
            check-manager-trade-freshness \
            check-market-price-rollout \
            check-trade-reliability-pass \
            check-trade-decision-policy \
            check-trade-pricing-reconciliation \
            check-trade-price-separation \
            check-trade-mobile-tabs \
            check-trade-stress \
            check-trade-stress-ui \
            check-team-impact \
            check-trade-walkthrough-audit \
            check-trade-accuracy-diagnostics \
            check-historical-outcomes \
            check-trade-outcome-independence \
            check-rebuild-forecast-chronology \
            check-rookie-pick-outcomes \
            check-rookie-slot \
            check-rookie-slot-benchmark \
            check-rookie-slot-weighting \
            check-rookie-summary
          do
            echo "::group::$test"
            if ! node "scripts/$test.js"; then failures=$((failures + 1)); fi
            echo "::endgroup::"
          done
          if [ "$failures" -gt 0 ]; then echo "$failures regression(s) failed"; exit 1; fi
      - name: Market summarizer sharded end-to-end fixture
        run: node scripts/check-summarizer-sharding.js
      - name: Current Trade Lab aggregation safety
        run: node scripts/check-trade-lab-current.js
      - name: Shared league intelligence regression
        run: node scripts/check-league-intelligence.js
      - name: Every script parses
        run: for f in vault-core.js vault-nav.js trade-evidence.js market-data.js draft-center.js draft-rules.js activity.js activity-model.js scripts/*.js scripts/*.cjs scripts/market-history/*.js; do node --check "$f" || exit 1; done
