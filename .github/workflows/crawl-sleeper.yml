name: Crawl Sleeper trades

# Builds a long-run history of real dynasty trades from Sleeper (see
# scripts/crawl-sleeper-trades.js). A run starts every hour and crawls for
# ~48 minutes at up to 500 calls a minute (Sleeper asks for under 1000 a minute).
# Each successful run then starts the next one (workflow_dispatch), so it
# crawls around the clock without waiting on GitHub's schedule, which is
# only a backup. One run at a time (concurrency); a failed run doesn't
# chain, so the hourly schedule picks it back up.
#
# The raw trades (gzipped) live as assets on the "sleeper-trades"
# GitHub Release, not in git, so the repo doesn't grow with them. The
# crawl's to-do list (Sleeper ids) is kept in the Actions cache, never
# published.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch: {}
  # A change to the crawler starts a run right away instead of waiting for the hour.
  push:
    branches: [main]
    paths:
      - scripts/crawl-sleeper-trades.js
      - .github/workflows/crawl-sleeper.yml

permissions:
  contents: write
  actions: write   # to start the next run

concurrency:
  group: crawl-sleeper
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_MINUTES: '48'   # leaves room to price and publish inside the hour
      CALLS_PER_MIN: '500'   # half of Sleeper's 1000-a-minute guidance; stops on any 429
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: .crawl
          key: sleeper-crawl-${{ github.run_id }}
          restore-keys: sleeper-crawl-

      - name: Get the trades collected so far
        run: |
          gh release view sleeper-trades >/dev/null 2>&1 || gh release create sleeper-trades --title "Sleeper trade history (data)" --notes "Raw dynasty trades collected by scripts/crawl-sleeper-trades.js, one file per season. Updated hourly." --latest=false
          mkdir -p data/sleeper-trades
          gh release download sleeper-trades --pattern '*.json.gz' --dir data/sleeper-trades --clobber || true

      - run: node scripts/crawl-sleeper-trades.js

      - name: Save them back to the release
        run: |
          ls data/sleeper-trades/*.json.gz >/dev/null 2>&1 || exit 0
          gh release upload sleeper-trades data/sleeper-trades/*.json.gz --clobber

      # Price everything at each trade's own date and publish the small summaries
      # the site reads (data/market-history/), so new trades show up within the hour.
      # The only job that writes these files.
      - name: Price and publish
        run: |
          git pull --rebase --autostash --quiet   # today's price history from Update data (crawl-stats.json may be modified)
          node scripts/summarize-sleeper-trades.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-history/
          git diff --cached --quiet && exit 0
          git commit -m "Price Sleeper trades"
          git pull --rebase --autostash
          git push

      # Keep it going: start the next run (queued behind this one until it ends).
      - name: Start the next run
        if: success()
        run: gh workflow run crawl-sleeper.yml --ref main
