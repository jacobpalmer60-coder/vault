name: Crawl Sleeper trades

# Builds a long-run history of real dynasty trades from Sleeper (see
# scripts/crawl-sleeper-trades.js). A run starts every hour and crawls for
# ~42 minutes at up to 500 calls a minute (Sleeper asks for under 1000 a minute).
# Each successful run then starts the next one (workflow_dispatch), so it
# crawls around the clock without waiting on GitHub's schedule, which is
# only a backup, and often hours late. One run at a time (concurrency). A failed run
# tries once more by itself (2026-11-05: a crash stopped the crawl with the schedule hours
# behind); a second failure in a row waits for the schedule, so a real problem can't loop.
#
# The raw trades (gzipped) live as assets on the "sleeper-trades"
# GitHub Release, not in git, so the repo doesn't grow with them. The
# crawl's to-do list (Sleeper ids) is kept in the Actions cache, never
# published.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch: {}
  # A change to the crawler starts a run right away instead of waiting for the hour.
  push:
    branches: [main]
    paths:
      - scripts/crawl-sleeper-trades.js
      - .github/workflows/crawl-sleeper.yml

permissions:
  contents: write
  actions: write   # to start the next run

concurrency:
  group: crawl-sleeper
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 2 minutes of setup, ~44 crawling, ~1 saving, and pricing, which passed 13 minutes with 4.9M trades
    # (at 58 the job was killed mid-publish, 2026-11-05). A run ends before the next starts, so a long one costs nothing.
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      # 42 leaves room to save, price and publish inside the job's limit
      # (pricing every season takes 5-10 minutes now; at 48 most runs timed out
      # mid-publish, 2026-10-20).
      RUN_MINUTES: '42'
      CALLS_PER_MIN: '500'   # half of Sleeper's 1000-a-minute guidance; stops on any 429
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The crawl's to-do list. Restored here and saved right after the trades are
      # uploaded (not at the end of the job), so a run that times out while pricing
      # still keeps its progress instead of the next run re-crawling the same leagues.
      - uses: actions/cache/restore@v4
        with:
          path: .crawl
          key: sleeper-crawl-${{ github.run_id }}
          restore-keys: sleeper-crawl-

      - name: Get the trades collected so far
        run: |
          gh release view sleeper-trades >/dev/null 2>&1 || gh release create sleeper-trades --title "Sleeper trade history (data)" --notes "Raw dynasty trades collected by scripts/crawl-sleeper-trades.js, one file per season. Updated hourly." --latest=false
          mkdir -p data/sleeper-trades
          # No "|| true": a season that doesn't download would be rebuilt from nothing and saved
          # over the real one (2026 lost 1.4M trades that way on 2026-11-04).
          gh release download sleeper-trades --pattern '*.json.gz' --dir data/sleeper-trades --clobber
          node scripts/crawl-guard.js check

      # Restoring lost seasons: anything on the crawl-restore branch is merged in, every trade
      # from both kept, so it's safe to run more than once. Delete the branch when it's done.
      - name: Merge a restore, if there is one
        run: |
          git fetch --depth=1 origin crawl-restore 2>/dev/null || exit 0
          mkdir -p "$RUNNER_TEMP/restore"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/restore"
          node scripts/crawl-guard.js merge "$RUNNER_TEMP/restore"
          gh release upload sleeper-trades data/sleeper-trades/*.json.gz --clobber

      # A day-old copy of everything, since the release keeps no earlier versions.
      - name: Daily backup
        run: |
          gh release view sleeper-trades-backup >/dev/null 2>&1 || gh release create sleeper-trades-backup --title "Sleeper trade history, daily backup" --notes "A copy of the sleeper-trades assets, made once a day by the crawl after they pass the guard." --latest=false
          last=$(gh release view sleeper-trades-backup --json assets --jq '[.assets[].updatedAt] | sort | last // ""')
          [ "${last:0:10}" = "$(date -u +%F)" ] && exit 0
          gh release upload sleeper-trades-backup data/sleeper-trades/*.json.gz --clobber

      - run: node scripts/crawl-guard.js mark "$RUNNER_TEMP/crawl-counts.json"

      - run: node scripts/crawl-sleeper-trades.js

      - name: Save them back to the release
        run: |
          ls data/sleeper-trades/*.json.gz >/dev/null 2>&1 || exit 0
          node scripts/crawl-guard.js same "$RUNNER_TEMP/crawl-counts.json"
          gh release upload sleeper-trades data/sleeper-trades/*.json.gz --clobber

      - uses: actions/cache/save@v4
        with:
          path: .crawl
          key: sleeper-crawl-${{ github.run_id }}

      # Price everything at each trade's own date and publish the small summaries
      # the site reads (data/market-history/), so new trades show up within the hour.
      # The only job that writes these files, apart from player-history.json and
      # seasonal.json (market-history.yml, weekly).
      - name: Price and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The crawl just rewrote crawl-stats.json, which is tracked: set it aside,
          # pull main clean (today's price history, any newer publish), then put
          # this run's stats back. (An autostash here can't commit without the
          # identity above, and would conflict with the last run's stats anyway.)
          cp data/market-history/crawl-stats.json "$RUNNER_TEMP/crawl-stats.json"
          rm data/market-history/crawl-stats.json
          git checkout -- data/market-history/
          git pull --rebase --quiet
          cp "$RUNNER_TEMP/crawl-stats.json" data/market-history/crawl-stats.json
          node --max-old-space-size=6144 scripts/summarize-sleeper-trades.js
          git add data/market-history/
          git diff --cached --quiet && exit 0
          git commit -m "Price Sleeper trades"
          git pull --rebase --autostash
          git push

      # GitHub runs scheduled jobs hours late (projections every 4-11 hours on a 3-hour schedule),
      # so each crawl starts them too: injury news reaches lineups and odds within the hour.
      - name: Refresh projections
        if: success()
        run: gh workflow run refresh-projections.yml --ref main

      # Keep it going: start the next run (queued behind this one until it ends).
      - name: Start the next run
        if: success()
        run: gh workflow run crawl-sleeper.yml --ref main

      - name: Try once more after a failure
        if: failure()
        run: |
          before=$(gh run list --workflow crawl-sleeper.yml --limit 2 --json conclusion --jq '.[1].conclusion')
          if [ "$before" = "failure" ]; then echo "Two failures in a row: waiting for the schedule"; exit 0; fi
          sleep 300
          gh workflow run crawl-sleeper.yml --ref main
