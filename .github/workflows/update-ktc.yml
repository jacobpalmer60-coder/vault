name: Update KTC values

on:
  schedule:
    - cron: '0 9 * * *'  # daily, 9am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node scripts/fetch-ktc.js

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ktc-values.json
          git diff --cached --quiet || git commit -m "Update KTC dynasty values"
          git push
