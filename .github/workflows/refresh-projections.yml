name: Refresh projections

# Sleeper updates its projections through the week (injury news, depth charts,
# matchups), so this season's lineups and projected records refresh after every
# crawl run, about every 50 minutes; the 3-hour schedule is the backup, because GitHub
# delays scheduled jobs by hours. It publishes only when something changed. Only data/projections.json
# (about 100 KB compressed); injury labels still come from the nightly Sleeper
# player list, which Sleeper asks apps to fetch once a day.
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-projections
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node scripts/fetch-projections.js

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the timestamp changed: nothing to publish.
          if git show HEAD:data/projections.json | node -e "const a = JSON.parse(require('fs').readFileSync(0, 'utf8')), b = require('./data/projections.json'); process.exit(JSON.stringify([a.players, a.fromWeek]) === JSON.stringify([b.players, b.fromWeek]) ? 0 : 1)"; then
            echo "Projections unchanged"; git checkout -- data/projections.json; exit 0
          fi
          git add data/projections.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh projections"
          # The hourly Sleeper crawl and the nightly update also push, so catch up first.
          git pull --rebase
          git push

      # ESPN's injury details through game days (Thursday, Saturday to Monday), so Q and Out
      # changes reach the cards before kickoff, not the next night. Published only if they moved.
      - name: Injury details on game days
        run: |
          case "$(date -u +%u)" in 4|5|6|7|1) ;; *) echo "Not a game day"; exit 0;; esac
          git pull --rebase --quiet
          cp data/injury-details.json "$RUNNER_TEMP/before.json"
          node scripts/fetch-injury-details.js || exit 0
          if node -e "const f = p => { const j = JSON.parse(require('fs').readFileSync(p, 'utf8')); delete j.updated; return JSON.stringify(j); }; process.exit(f(process.argv[1]) === f('data/injury-details.json') ? 0 : 1)" "$RUNNER_TEMP/before.json"; then
            echo "Injury details unchanged"; git checkout -- data/injury-details.json; exit 0
          fi
          git add data/injury-details.json
          git commit -m "Refresh injury details"
          git pull --rebase
          git push
