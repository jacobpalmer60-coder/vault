name: Export crawl list (encrypted)

# One-time hand-off of the crawl's to-do list (Sleeper league and user ids, kept
# in the Actions cache, never published) to the research machine, which pulls
# those leagues whole for the trade-verdict study (VaultValues, local only).
# The list is encrypted before it leaves the runner: a fresh AES-256 key for the
# file, itself encrypted to the public key in scripts/keys/crawl-export.pub.pem,
# whose private key exists only on that machine. Only ciphertext is uploaded (to
# the "crawl-export" release), and it's deleted once downloaded.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-crawl-state.yml

permissions:
  contents: write

concurrency:
  group: crawl-sleeper   # waits for a crawl in progress, so the list is its latest
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Downloaded and decrypted on 2026-10-13: the ciphertext is removed. To export
      # again, put back the restore + encrypt + upload steps (git history).
      - name: Remove the hand-off
        run: gh release delete crawl-export --yes --cleanup-tag --repo ${{ github.repository }} || true
