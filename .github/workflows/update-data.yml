name: Update data

on:
  schedule:
    # Midnight Mountain Time, US — cron is UTC-only and doesn't shift for DST, so two
    # entries cover both offsets (MDT UTC-6 ~mid-Mar to early Nov, MST UTC-7 the rest
    # of the year). Whichever one isn't "real" midnight that time of year still lands
    # within the same UTC calendar day (Mountain is behind UTC, so no date wraparound)
    # and snapshot-value-history.js's same-day dedup means the second run just
    # overwrites the first with ~an hour-newer data instead of creating a duplicate.
    - cron: '0 6 * * *'  # midnight MDT (UTC-6)
    - cron: '0 7 * * *'  # midnight MST (UTC-7)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node scripts/fetch-ktc.js
      - run: node scripts/fetch-projections.js
      - run: node scripts/fetch-ktc-trades.js
      - run: node scripts/snapshot-value-history.js

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ktc-values.json data/projections.json data/ktc-trades.json data/team-value-history.json data/player-value-history.json
          git diff --cached --quiet || git commit -m "Update KTC values, projections, trade database, and value history"
          git push
