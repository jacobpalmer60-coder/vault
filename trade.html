    <div id="analysisB" class="hidden min-w-0 lg:col-start-3 lg:row-start-1"></div>

<script src="vault-core.js"></script>
<script src="vault-nav.js"></script>
<script>
let teams = [], league = null, slots = [], rosterCap = 0;
let playerTrend = new Map(), pickTrend = new Map(), playerVolatility = new Map();
let selectedA = new Set();
let selectedB = new Set();
let filterA = 'ALL', filterB = 'ALL';
// Who's offering this trade to whom — null (the default) keeps today's neutral,
// both-sides-considered verdict. Picking a side reframes the SAME top verdict as a
// direct "should the other team accept this" recommendation instead — see
// acceptanceVerdict. Deliberately NOT touched by resetTrade(): if you're evaluating
// "should I accept this from Team A" you're probably about to try a few
// counter-packages, and re-picking who's offering every time would be busywork.
let offeredBy = null;
const POS_FILTERS = ['ALL', 'QB', 'RB', 'WR', 'TE', 'PICK'];

const TONE = { good: 'text-emerald-400', bad: 'text-rose-400', neutral: 'text-amber-300/80' };
const TONE_DOT = { good: 'bg-emerald-400', bad: 'bg-rose-400', neutral: 'bg-amber-400/60' };
// The verdict card's whole point is to be the one thing on this page you can't
// miss — a tinted border/background per tone gives it a banner presence the plain
// "card" background can't, at a glance, before reading a word of it.
const TONE_BANNER = {
  good: 'bg-emerald-500/[0.06] border-emerald-500/25',
  bad: 'bg-rose-500/[0.06] border-rose-500/25',
  neutral: 'bg-amber-500/[0.06] border-amber-500/25'
};
const TIER_COLOR = { early: 'text-emerald-400', mid: 'text-amber-300', late: 'text-rose-400' };

function assetsFor(team) {
  const players = team.plist.filter(p => p.value > 0).map(p => ({ type: 'player', key: 'p_' + p.id, ...p, trend: playerTrend.get(Vault.normalizeName(p.name)) ?? null, volatilityPct: playerVolatility.get(Vault.normalizeName(p.name)) ?? null }));
  // Picks already carry volatilityPct from Vault.buildLeagueTeams (the round's own
  // early/late spread this year — see Vault.pickVolatilityPct) via the ...p spread.
  const picks = team.picks.map(p => ({ type: 'pick', key: `k_${p.season}-${p.round}-${p.original}`, name: `${p.season} R${p.round}`, pos: 'PICK', ...p, trend: pickTrendFor(p.season, p.round, p.tier) }));
  return [...players, ...picks].sort((a, b) => b.value - a.value);
}

// Mirrors Vault.buildKtcPickMap's season fallback: a pick label too far out for KTC
// to have priced yet (e.g. 2029, confirmed only ~2 draft classes out get tracked)
// reuses the nearest tracked season's trend — same fallback its current VALUE
// already goes through, so the two numbers stay consistent with each other.
function pickTrendFor(season, round, tier) {
  const key = `${season}-${round}-${tier}`;
  if (pickTrend.has(key)) return pickTrend.get(key);
  const seasons = [...new Set([...pickTrend.keys()].map(k => +k.split('-')[0]))];
  if (!seasons.length) return null;
  const nearest = seasons.reduce((best, y) => Math.abs(y - season) < Math.abs(best - season) ? y : best, seasons[0]);
  return pickTrend.get(`${nearest}-${round}-${tier}`) ?? null;
}

// 90-day value trend per asset — same "is this rising or falling" signal
// player_rankings.html shows, surfaced here because it's directly relevant to a
// trade decision: two assets priced the same today can be headed opposite
// directions. Delta-only (first vs. last resolved value in the window), not a
// full series — this just needs a quick "up or down and by how much" per asset
// in a dense roster list, not a chart.
const TREND_WINDOW_DAYS = 90;
function buildTrendDeltas(snapshots, listField, isSF, bonusRecTe) {
  const cutoff = Date.now() - TREND_WINDOW_DAYS * 24 * 60 * 60 * 1000;
  const byKey = new Map();
  (snapshots || []).forEach(s => {
    if (new Date(s.date).getTime() < cutoff) return;
    Object.entries(s[listField] || {}).forEach(([key, entry]) => {
      const v = Vault.resolveHistoricalValue(entry, isSF, bonusRecTe);
      if (!Number.isFinite(v)) return;
      if (!byKey.has(key)) byKey.set(key, []);
      byKey.get(key).push(v);
    });
  });
  const deltas = new Map();
  byKey.forEach((vals, key) => { if (vals.length >= 2) deltas.set(key, vals[vals.length - 1] - vals[0]); });
  return deltas;
}


// Surfaces the same need/surplus/timeline/pick-capital fit read Team Analyzer uses
// to suggest trade partners, but here — while a trade is actually being built —
// rather than stranded on a separate page.
function renderPartnerSuggestions() {
  const setupA = document.getElementById('teamASetup'), setupB = document.getElementById('teamBSetup');
  const box = document.getElementById('partnerSuggest');
  const t = teams.find(x => String(x.rosterId) === setupA.value);
  if (!t) { box.classList.add('hidden'); return; }

  const partners = Vault.tradePartnerSuggestions(t, teams, 3);
  document.getElementById('partnerForTeam').textContent = t.teamName;
  document.getElementById('partnerList').innerHTML = partners.map(p => `
    <button onclick="useSuggestedPartner(${p.rosterId})" class="w-full text-left px-3 py-2 rounded-lg border border-white/[0.08] hover:border-amber-500/40 hover:bg-amber-500/5 transition-colors">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[13px] font-medium text-zinc-200">${Vault.escapeHtml(p.teamName)}</span>
        <span class="text-[10px] text-zinc-400 uppercase tracking-wider">Use →</span>
      </div>
      <div class="text-[11px] text-zinc-400 mt-0.5">${Vault.escapeHtml(p.reasons[0])}</div>
    </button>`).join('');
  box.classList.remove('hidden');
}

function useSuggestedPartner(rosterId) {
  document.getElementById('teamBSetup').value = rosterId;
  prevBSetup = String(rosterId);
}

// Team A and Team B can never end up on the same team — trading with yourself
// isn't a real trade. Previously enforced by disabling the other side's current
// team in each dropdown's own option list, which meant clicking a team you could
// plainly see in the list appeared to do nothing. Now any team is always
// clickable, and picking one that's already on the other side bumps that other
// side to whichever team THIS side used to hold instead — resolving the
// collision the way a person would (swap them) rather than silently blocking it.
// Needs each select's own previous value tracked (a plain "current value" read
// after the fact is already the NEW one), updated after every resolution.
let prevA = null, prevB = null, prevASetup = null, prevBSetup = null;
function resolveDup(newVal, otherEl, prevOfChanged) {
  if (newVal === otherEl.value) { otherEl.value = prevOfChanged; return true; }
  return false;
}

async function init() {
  try {
    const built = await Vault.buildLeagueTeams(Vault.getLeagueId());
    league = built.league; slots = built.slots;
    // The ACTIVE roster cap — taxi and IR are separate pools Sleeper tracks (see
    // team.taxiIds/reserveIds), but they're not generic overflow capacity a newly
    // -acquired trade piece can just slot into: taxi needs rookie/sophomore
    // eligibility plus a league-specific deadline, IR needs an actual injury
    // designation. A team can legitimately carry more total players than this
    // (already-stashed taxi/IR players don't count against it), but a HEALTHY
    // veteran received in a trade needs a real active/bench slot, so this is the
    // number that matters for "does this trade force a drop." Filters out literal
    // 'IR'/'TAXI' entries in case a league puts those directly in roster_positions
    // instead of the separate taxi_slots/reserve_slots settings.
    rosterCap = (league.roster_positions || []).filter(s => s !== 'IR' && s !== 'TAXI').length;

    const bonusRecTe = league.scoring_settings?.bonus_rec_te;
    const [playerHist, pickHist] = await Promise.all([Vault.fetchPlayerValueHistory(built.isSF, bonusRecTe), Vault.fetchPickValueHistory()]);
    playerTrend = buildTrendDeltas(playerHist.snapshots, 'players', built.isSF, bonusRecTe);
    pickTrend = buildTrendDeltas(pickHist.snapshots, 'picks', built.isSF, bonusRecTe);
    playerVolatility = Vault.buildPlayerVolatilityMap(playerHist.snapshots, built.isSF, bonusRecTe);

    teams = built.teams.map(t => ({ ...t, assets: [] }));
    teams.forEach(t => t.assets = assetsFor(t));
    teams.sort((a, b) => b.overall - a.overall);

    const opts = teams.map(t => `<option value="${t.rosterId}">${Vault.escapeHtml(t.teamName)}</option>`).join('');
    const selA = document.getElementById('teamA'), selB = document.getElementById('teamB');
    const setupA = document.getElementById('teamASetup'), setupB = document.getElementById('teamBSetup');
    [selA, selB, setupA, setupB].forEach(sel => sel.innerHTML = opts);
    // Opens on your team (Vault.myTeam) as Team A when we know it.
    const mine = Vault.myTeam(teams) || teams[0];
    selA.value = setupA.value = mine.rosterId;
    selB.value = setupB.value = (teams.find(t => t !== mine) || mine).rosterId;
    prevA = prevASetup = selA.value;
    prevB = prevBSetup = selB.value;

    selA.onchange = () => {
      if (resolveDup(selA.value, selB, prevA)) { prevB = selB.value; selectedB.clear(); filterB = 'ALL'; renderPosFilter('B'); render('B'); }
      prevA = selA.value;
      selectedA.clear(); filterA = 'ALL'; renderPosFilter('A'); render('A');
    };
    selB.onchange = () => {
      if (resolveDup(selB.value, selA, prevB)) { prevA = selA.value; selectedA.clear(); filterA = 'ALL'; renderPosFilter('A'); render('A'); }
      prevB = selB.value;
      selectedB.clear(); filterB = 'ALL'; renderPosFilter('B'); render('B');
    };

    setupA.onchange = () => {
      if (resolveDup(setupA.value, setupB, prevASetup)) prevBSetup = setupB.value;
      prevASetup = setupA.value;
      renderPartnerSuggestions();
    };
    setupB.onchange = () => {
      if (resolveDup(setupB.value, setupA, prevBSetup)) prevASetup = setupA.value;
      prevBSetup = setupB.value;
    };
    renderPartnerSuggestions();

    document.getElementById('status').textContent = `${teams.length} teams • ${league.name} • ${built.isSF ? 'Superflex' : '1QB'}`;
    document.getElementById('status').className = 'text-[13px] text-emerald-400/80 mt-1';

    document.getElementById('loadRostersBtn').onclick = () => {
      selA.value = setupA.value;
      selB.value = setupB.value;
      prevA = selA.value; prevB = selB.value;
      selectedA.clear(); selectedB.clear();
      filterA = 'ALL'; filterB = 'ALL';
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('workspace').classList.remove('hidden');
      document.getElementById('finderPickerBtn').classList.remove('hidden');
      document.getElementById('suggestBtn').classList.remove('hidden');
      document.getElementById('offeredByWrap').classList.remove('hidden');
      renderPosFilter('A'); renderPosFilter('B');
      render('A'); render('B');
    };
    applyTradeFromUrl();
  } catch (e) {
    document.getElementById('status').textContent = e.message || 'Failed to load';
    document.getElementById('status').className = 'text-[13px] text-rose-400 mt-1';
    console.error(e);
  }
}

function backToSetup() {
  history.replaceState(null, '', Vault.linkTo('trade.html'));
  document.getElementById('workspace').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('finderPickerBtn').classList.add('hidden');
  document.getElementById('suggestBtn').classList.add('hidden');
  document.getElementById('suggestPanel').classList.add('hidden');
  closeFinder();
}

function teamOf(side) { return teams.find(t => t.rosterId == document.getElementById(`team${side}`).value); }
function otherSide(side) { return side === 'A' ? 'B' : 'A'; }

/* ---------- Shareable trade links ----------
   The trade lives in the URL (league_id, a/b = the two teams' roster ids,
   give_a/give_b = asset keys, by = who's offering), kept current on every
   change via updateTrade, so "Share" is just this page's address. Opening a
   link rebuilds the same trade and verdict for whoever clicks it. */
function syncTradeUrl() {
  if (document.getElementById('workspace').classList.contains('hidden')) return;
  const p = new URLSearchParams({ league_id: Vault.getLeagueId(), a: document.getElementById('teamA').value, b: document.getElementById('teamB').value });
  if (selectedA.size) p.set('give_a', [...selectedA].join(','));
  if (selectedB.size) p.set('give_b', [...selectedB].join(','));
  if (offeredBy) p.set('by', offeredBy);
  const url = `${location.pathname}?${p.toString().replace(/%2C/g, ',')}`;
  if (url !== location.pathname + location.search) history.replaceState(null, '', url);
}

function applyTradeFromUrl() {
  const p = new URLSearchParams(location.search);
  const a = teams.find(t => String(t.rosterId) === p.get('a'));
  const b = teams.find(t => String(t.rosterId) === p.get('b'));
  if (!a || !b || a === b) return;
  document.getElementById('teamASetup').value = a.rosterId;
  document.getElementById('teamBSetup').value = b.rosterId;
  document.getElementById('loadRostersBtn').onclick();
  const wanted = side => (p.get(side === 'A' ? 'give_a' : 'give_b') || '').split(',').filter(Boolean);
  let missing = 0;
  [['A', a, selectedA], ['B', b, selectedB]].forEach(([side, team, set]) => wanted(side).forEach(k => {
    if (team.assets.some(x => x.key === k)) set.add(k); else missing++;
  }));
  if (p.get('by') === 'A' || p.get('by') === 'B') offeredBy = p.get('by');
  render('A'); render('B');
  // A link can outlive the rosters it was made from (a player got traded or
  // dropped since) — say so instead of silently showing a different trade.
  if (missing) {
    const bar = document.getElementById('gapClose');
    bar.classList.remove('hidden');
    bar.insertAdjacentHTML('afterbegin', `<div class="text-[12px] text-amber-300 mb-2">${missing} piece${missing === 1 ? '' : 's'} from this shared link ${missing === 1 ? 'is' : 'are'} no longer on ${missing === 1 ? 'that' : 'those'} roster${missing === 1 ? '' : 's'}, so ${missing === 1 ? 'it was' : 'they were'} left out.</div>`);
  }
}

async function shareTrade(btn) {
  syncTradeUrl();
  const url = location.href;
  // Phones get the native share sheet (text it straight to the other manager);
  // everywhere else the link goes to the clipboard.
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ title: 'Trade on The Vault', url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); flashButtonMessage(btn, 'Link copied'); }
  catch { window.prompt('Copy this link:', url); }
}

// Same colored position pill Player Rankings already uses (vault.css's
// .pos-badge-*), instead of plain grey position text — one consistent color
// system across the site instead of one page having it and the rest not.
const POS_BADGE = pos => `pos-badge-${['QB', 'RB', 'WR', 'TE'].includes(pos) ? pos : 'default'}`;
function assetRow(side, a, isSelected, extra) {
  const sub = a.type === 'pick' ? `<span class="text-[11px] font-mono ${TIER_COLOR[a.tier] || ''}">${a.tier || ''}</span>` : `<span class="inline-flex items-center px-1.5 py-px rounded text-[10px] font-semibold border ${POS_BADGE(a.pos)}">${a.pos}</span><span class="text-[11px] text-zinc-400">${a.team || ''}</span>`;
  // Only the "volatile" tier gets a badge, not "moderate" — this needs to stay rare
  // enough to actually mean something, not turn into visual noise on half the roster.
  // Picks use their own thresholds (Vault.pickVolatilityLabel) — reusing the
  // player-calibrated ones flagged nearly every pick on the board as "volatile",
  // which stopped meaning anything.
  const volLabel = a.type === 'pick' ? Vault.pickVolatilityLabel(a.volatilityPct) : Vault.volatilityLabel(a.volatilityPct);
  const volBadge = volLabel === 'volatile'
    ? `<span class="text-[9px] px-1 py-px rounded border border-amber-500/30 text-amber-400/80 uppercase tracking-wide" title="${a.type === 'pick' ? "This pick's real slot is still unsettled — its value could move more than most picks once this team's season plays out" : "This player's price has swung a lot recently — treat today's value as less certain than most"}">volatile</span>` : '';
  // Team A's row is the user's own asset: "Match" auto-builds a package from Team B
  // to hit its value, "Find" shops it against every team in the league. A Team B row
  // is a player the user doesn't own, so both need different jobs there — "Find"
  // becomes acquire mode (what package from Team A it'd take to go get THIS specific
  // player), and "Match" becomes a league-wide value browser (who else, on ANY team,
  // is priced like this) rather than silently building the same kind of package Find
  // already builds, which just made the two buttons redundant on a Team B row.
  const matchAction = side === 'A' ? `matchTarget('A','${a.key}')` : `openSimilarAcrossLeague('B','${a.key}')`;
  const matchTitle = side === 'A' ? 'Build a package from the other side to match this' : 'Show players of similar value throughout the league';
  const findAction = side === 'A' ? `openFinder('A','${a.key}')` : `openAcquireFinder('A','${a.key}',${teamOf('B').rosterId})`;
  const findTitle = side === 'A' ? 'Shop this against every team in the league' : 'Put together a package from your roster to go get this';
  // Two fixed lines instead of one shared row everything competed for space on —
  // name/value/checkbox (the "what is this and is it selected" identity) always on
  // line 1, badges/trend/actions (secondary metadata) always on line 2. Each piece
  // of text now lives in its own section that nothing else can crowd into, rather
  // than a single flex-wrap row where a pick's tier+volatile badges could still
  // collide with a long player's name depending on exactly how much room was left.
  return `
    <div class="group/item ${extra || ''}">
      <div onclick="toggle('${side}','${a.key}')" class="px-3 py-2.5 mx-1 my-0.5 rounded-xl cursor-pointer transition-all ${isSelected ? 'bg-amber-500/10 ring-1 ring-amber-500/30' : 'hover:bg-white/[0.03]'}">
        <div class="flex items-center gap-2">
          <span class="text-[14px] truncate flex-1 min-w-0 ${isSelected ? 'text-white' : 'text-zinc-100 group-hover/item:text-white'}" title="${Vault.escapeHtml(a.name)}">${Vault.escapeHtml(a.name)}</span>
          <div class="text-[13px] mono font-medium shrink-0 ${isSelected ? 'text-white' : 'text-zinc-400'}">${Math.round(a.value).toLocaleString()}</div>
          <div class="w-4 h-4 rounded-md border-2 flex items-center justify-center transition-all shrink-0 ${isSelected ? 'bg-amber-400 border-amber-400' : 'border-white/10 group-hover/item:border-amber-500/40'}">
            ${isSelected ? '<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 6l2 2 4-4" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>' : ''}
          </div>
        </div>
        <div class="flex items-center justify-between gap-2 mt-1">
          <div class="flex items-center gap-1.5 flex-wrap min-w-0">
            ${sub}
            ${volBadge}
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${a.trend != null ? `<div class="text-[10px] mono ${a.trend >= 0 ? 'text-emerald-400' : 'text-rose-400'}" title="Value change over the last ${TREND_WINDOW_DAYS} days">${a.trend >= 0 ? '+' : ''}${Math.round(a.trend).toLocaleString()}</div>` : ''}
            <div class="flex gap-1.5 opacity-0 group-hover/item:opacity-100 transition-opacity">
              <button onclick="event.stopPropagation(); ${matchAction}" title="${matchTitle}" class="text-[11px] px-2 py-1 rounded-lg border border-white/10 text-amber-300/70 hover:text-white hover:border-amber-500/40">Match</button>
              <button onclick="event.stopPropagation(); ${findAction}" title="${findTitle}" class="text-[11px] px-2 py-1 rounded-lg border border-sky-500/20 text-sky-300/70 hover:text-sky-200 hover:border-sky-500/40">Find</button>
            </div>
          </div>
        </div>
      </div>
      ${isSelected ? similarRow(side, a) : ''}
    </div>`;
}

function similarRow(side, a) {
  const team = teamOf(side);
  const selected = side === 'A' ? selectedA : selectedB;
  const alts = team.assets.filter(x => x.key !== a.key && !selected.has(x.key)).sort((x, y) => Math.abs(x.value - a.value) - Math.abs(y.value - a.value)).slice(0, 3);
  if (!alts.length) return '';
  return `<div class="mx-1 mb-1 px-3 py-1.5 rounded-lg bg-black/30 flex items-center gap-2 flex-wrap text-[11px]">
    <span class="text-zinc-400 uppercase tracking-wider">Similar value</span>
    ${alts.map(x => `<button onclick="event.stopPropagation(); swap('${side}','${a.key}','${x.key}')" class="px-2 py-1 rounded-lg border border-white/10 hover:border-amber-500/40 hover:text-white text-zinc-300">${Vault.escapeHtml(x.name)} <span class="mono text-zinc-400">${Math.round(x.value).toLocaleString()}</span></button>`).join('')}
  </div>`;
}

const POS_LABEL = { qb: 'QB', rb: 'RB', wr: 'WR', te: 'TE' };

// So you can see what the OTHER side actually needs while picking what to offer
// them, not just discover it after the fact in the post-trade breakdown. Same
// Vault.positionalProfile read as the fit-check notes and Best Trade Partners, just
// surfaced up front on the roster this team is currently loaded as (this team's
// CURRENT roster, before any assets are selected — it doesn't shift as you build
// the trade, since "what do they need" is the question you're building the trade
// to answer, not something the trade itself should be allowed to quietly move).
function renderNeeds(side, team) {
  const { needs, surpluses } = Vault.positionalProfile(team, teams);
  const el = document.getElementById(`needs${side}`);
  const parts = [];
  if (needs.length) parts.push(`<span class="text-emerald-400/80">Needs ${needs.map(k => POS_LABEL[k]).join(', ')}</span>`);
  if (surpluses.length) parts.push(`<span class="text-zinc-400">Deep at ${surpluses.map(k => POS_LABEL[k]).join(', ')}</span>`);
  el.innerHTML = parts.join('<span class="text-zinc-400 mx-1.5">·</span>');
}

function render(side) {
  const team = teamOf(side);
  const selected = side === 'A' ? selectedA : selectedB;
  const filter = side === 'A' ? filterA : filterB;
  const container = document.getElementById(`players${side}`);
  document.getElementById(`total${side}`).textContent = `${team.assets.length} assets • ${Math.round(team.overall).toLocaleString()}`;
  const archEl = document.getElementById(`arch${side}`);
  archEl.textContent = team.arch;
  archEl.title = Vault.ARCHETYPE_INFO[team.arch]?.desc || '';
  archEl.className = `text-[11px] px-2 py-0.5 rounded-full border inline-block mt-1 ${team.archCls.replace(/from-\S+|to-\S+/g, '').trim()}`;
  renderNeeds(side, team);

  const visible = filter === 'ALL' ? team.assets : team.assets.filter(a => filter === 'PICK' ? a.type === 'pick' : a.pos === filter);
  container.innerHTML = visible.length
    ? visible.map(a => assetRow(side, a, selected.has(a.key))).join('')
    : `<div class="text-center text-[12px] text-zinc-400 py-8">No ${filter} assets on this roster</div>`;
  updateTrade();
}

function renderPosFilter(side) {
  const team = teamOf(side);
  const state = side === 'A' ? filterA : filterB;
  document.getElementById(`posFilter${side}`).innerHTML = POS_FILTERS.map(p => {
    const count = p === 'ALL' ? team.assets.length : team.assets.filter(a => p === 'PICK' ? a.type === 'pick' : a.pos === p).length;
    return `<button onclick="setPosFilter('${side}','${p}')" class="text-[11px] px-2.5 py-1 rounded-lg border transition-colors ${state === p ? 'bg-amber-500/15 border-amber-500/40 text-zinc-300' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${p === '1-FOR-2' ? '1-for-2' : p} <span class="opacity-60">${count}</span></button>`;
  }).join('');
}

function setPosFilter(side, pos) {
  if (side === 'A') filterA = pos; else filterB = pos;
  renderPosFilter(side);
  render(side);
}

function toggle(side, key) {
  const set = side === 'A' ? selectedA : selectedB;
  set.has(key) ? set.delete(key) : set.add(key);
  render(side);
}

function resetTrade() {
  selectedA.clear(); selectedB.clear();
  render('A'); render('B');
}

// Filters a roster down to assets actually worth anchoring a trade around — skips
// deep-bench chaff so the search stays fast and the results stay realistic (nobody
// is trading their QB4 as the headline of a deal).
function tradeableAssets(team) {
  const floor = Math.max(300, team.total * 0.02);
  return team.assets.filter(a => a.value >= floor).sort((a, b) => b.value - a.value).slice(0, 15);
}

// Closest-to-even pair from `pool` for one `single` asset, by real consolidation-
// adjusted % off — null unless it already reads Fair. `singleIsMine` says which
// side of the trade the single asset sits on (tradeSideValues is order-sensitive).
// Pairs whose raw sum is nowhere near the single piece are skipped before any
// real math runs.
function bestPairFor(single, pool, singleIsMine) {
  let best = null, bestPct = Infinity;
  for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) {
    const pair = [pool[i], pool[j]];
    const raw = pair[0].value + pair[1].value;
    if (raw < single.value * 0.8 || raw > single.value * 2.2) continue;
    const { valueA, valueB } = singleIsMine ? Vault.tradeSideValues([single], pair) : Vault.tradeSideValues(pair, [single]);
    const pct = Math.abs(valueA - valueB) / (((valueA + valueB) / 2) || 1) * 100;
    if (pct < bestPct) { bestPct = pct; best = pair; }
  }
  return bestPct < VAULT_CONFIG.FAIR_PCT ? best : null;
}

// "1-for-2" / "2-for-1" from Team A's side, or null for any other shape.
function tradeShape(c) {
  const a = c.giveA.length, b = c.giveB.length;
  return a === 1 && b === 2 ? '1-for-2' : a === 2 && b === 1 ? '2-for-1' : null;
}

let suggestState = [];
let allSuggestions = [];
let suggestPosFilter = 'ALL';

// Searches every other team for a trade that reads as genuinely fair for Team A —
// no manual asset-picking required. For each partner, tries sending each of Team A's
// meaningful assets for the partner's best matching package back (and the reverse:
// acquiring each of the partner's meaningful assets for Team A's best matching
// package), scores every candidate through the exact same holistic verdict the
// manual builder uses, and keeps only the ones that don't grade as lopsided.
function suggestTrade() {
  closeFinder();
  const box = document.getElementById('suggestPanel');
  box.classList.remove('hidden');
  box.innerHTML = `<div class="text-[12px] text-zinc-400 py-2">Searching the league for fair trades…</div>`;
  setTimeout(runSuggestTradeSearch, 30);
}

function runSuggestTradeSearch() {
  const myTeam = teamOf('A');
  const partners = teams.filter(t => t.rosterId !== myTeam.rosterId);
  const myAnchors = tradeableAssets(myTeam);
  const candidates = [];
  // Computed once per team, not per candidate — positionalProfile loops the whole
  // league itself, and this search already runs it against up to ~9 partners x
  // ~15-30 anchors each.
  const myProfile = Vault.positionalProfile(myTeam, teams);

  const consider = (partner, giveA, giveB) => {
    const { valueA: aValAdj, valueB: bValAdj } = Vault.tradeSideValues(giveA, giveB);
    const result = computeTradeAnalysis(myTeam, partner, giveA, giveB, aValAdj, bValAdj);
    if (result.verdict.tone !== 'bad') candidates.push({ partner, giveA, giveB, result });
  };

  partners.forEach(partner => {
    const partnerProfile = Vault.positionalProfile(partner, teams);
    // Direction 1: Team A sends one meaningful asset, gets back the partner's best
    // matching package (mirrors the "Find" shop-out flow, run automatically). The
    // package flows to ME, so it's searched against MY profile — a package that
    // actually fills my need can settle for less sticker value and still get found.
    myAnchors.forEach(mine => {
      const combo = bestCombo(partner.assets, mine.value, myProfile);
      if (combo) consider(partner, [mine], combo.combo);
    });
    // Direction 2: Team A acquires one of the partner's meaningful assets, sending
    // its own best matching package (mirrors the Finder's acquire-mode flow) — this
    // package flows to THEM, so it's searched against their profile instead.
    tradeableAssets(partner).forEach(theirs => {
      const combo = bestCombo(myTeam.assets, theirs.value, partnerProfile);
      if (combo) consider(partner, combo.combo, [theirs]);
    });

    // Explicit 1-for-2s, both directions — the searches above lean 1-for-1 (every
    // extra piece carries COMBO_SIZE_PENALTY_PCT), so a genuinely fair 2-for-1
    // rarely surfaced on its own. Scored with the real two-sided KTC math
    // (Vault.tradeSideValues), since the consolidation premium is exactly what
    // decides whether two pieces really match one.
    const myTop = tradeableAssets(myTeam), theirTop = tradeableAssets(partner);
    myTop.forEach(mine => {
      const pair = bestPairFor(mine, theirTop, true);
      if (pair) consider(partner, [mine], pair);
    });
    theirTop.forEach(theirs => {
      const pair = bestPairFor(theirs, myTop, false);
      if (pair) consider(partner, pair, [theirs]);
    });
  });

  // The two search directions (send-an-anchor vs. acquire-an-anchor) can converge
  // on the exact same give/get pair from different starting points — dedupe by the
  // actual assets moved before ranking, or the same trade can show up twice.
  const seen = new Set();
  const deduped = candidates.filter(c => {
    const key = c.partner.rosterId + '|' + [...c.giveA.map(a => a.key)].sort().join(',') + '|' + [...c.giveB.map(a => a.key)].sort().join(',');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  // Ranked purely by fairness (raw value-diff % — see computeTradeAnalysis's
  // pctDiff, the same number that gates the Fair/Lopsided/Unfair verdict) —
  // most fair first. Every candidate here
  // already cleared the "not bad" bar in consider() above, so this ordering is
  // specifically "which of these genuinely-viable trades is closest to even", not a
  // blend with fit/archetype scoring (that's still visible per-card via the verdict
  // label, just not what determines the order). Pick-for-pick trades sort last
  // within that — they're trivial to price almost perfectly even (two same-asset-
  // class items of similar cost), so "closest to fair" isn't a meaningful quality
  // signal for them the way it is for a real trade moving rostered talent, and
  // ranking by raw fairness alone would let them claim the top spots on that
  // technicality alone.
  const isPickForPick = c => c.giveA.every(a => a.type === 'pick') && c.giveB.every(a => a.type === 'pick');
  deduped.sort((x, y) => {
    const px = isPickForPick(x) ? 1 : 0, py = isPickForPick(y) ? 1 : 0;
    if (px !== py) return px - py;
    return x.result.overallPct - y.result.overallPct;
  });

  // Cap per-partner, not just overall — otherwise the pool fills up with
  // near-duplicate variations against whichever single team fits best, crowding out
  // genuinely different opportunities with the rest of the league. Not capped to a
  // small overall number here — that happens in renderSuggestions, so filtering by
  // position can still surface a good trade that didn't make the default top-5.
  // 3 rather than 2 now that 1-for-2s are in the candidate pool too.
  const MAX_PER_PARTNER = 3;
  // A real pick-for-pick trade is a legitimate suggestion sometimes (consolidating
  // capital, converting a far-future pick into a nearer one) — the actual problem
  // was every top result being one, not that any exist at all. Sorted to the back
  // above and capped here too, so a couple can still surface once every real
  // player trade is exhausted, without crowding out trades that actually move
  // rostered talent.
  const MAX_PICK_FOR_PICK = 2;
  const partnerCounts = new Map();
  let pickForPickCount = 0;
  const pool = [];
  for (const c of deduped) {
    const n = partnerCounts.get(c.partner.rosterId) || 0;
    if (n >= MAX_PER_PARTNER) continue;
    if (isPickForPick(c)) {
      if (pickForPickCount >= MAX_PICK_FOR_PICK) continue;
      pickForPickCount++;
    }
    pool.push(c);
    partnerCounts.set(c.partner.rosterId, n + 1);
  }

  allSuggestions = pool;
  suggestPosFilter = 'ALL';
  renderSuggestions();
}

// A candidate "involves" a position if either side of the trade includes an asset
// there — lets "show me RB trades" surface deals where you'd give OR get an RB,
// same semantics as the roster position filters above (POS_FILTERS).
function suggestionMatchesPos(c, pos) {
  if (pos === 'ALL') return true;
  if (pos === '1-FOR-2') return !!tradeShape(c); // either direction
  return [...c.giveA, ...c.giveB].some(a => pos === 'PICK' ? a.type === 'pick' : a.pos === pos);
}

function setSuggestPosFilter(pos) {
  suggestPosFilter = pos;
  renderSuggestions();
}

// Whoever takes in more players than they send may be over the active-roster
// limit afterward — worth saying on the card, since a 1-for-2 can be fair on
// value and still force a drop (see projectedRosterCount).
function suggestionRosterNote(c) {
  if (!rosterCap) return '';
  const myTeam = teamOf('A');
  const notes = [[myTeam, c.giveA, c.giveB], [c.partner, c.giveB, c.giveA]].map(([team, out, inc]) => {
    const over = projectedRosterCount(team, out, inc) - rosterCap;
    return over > 0 ? `${team === myTeam ? 'You' : Vault.escapeHtml(team.teamName)} would need to drop ${over}` : '';
  }).filter(Boolean);
  return notes.length ? `<span class="text-[11px] text-amber-300/80">${notes.join(' · ')}</span>` : '';
}

function suggestionCard(c, i) {
  const shape = c.giveA.length === 1 && c.giveB.length === 1 ? null : `${c.giveA.length}-for-${c.giveB.length}`;
  return `
    <div class="p-3 rounded-xl bg-black/30">
      <div class="flex items-center justify-between gap-4 flex-wrap mb-1.5">
        <div class="flex items-center gap-2">
          <div class="text-[13px] font-medium">vs. ${Vault.escapeHtml(c.partner.teamName)}</div>
          ${shape ? `<span class="text-[10px] px-1.5 py-0.5 rounded border border-sky-500/30 bg-sky-500/10 text-sky-300">${shape}</span>` : ''}
        </div>
        <button onclick="useSuggestion(${i})" class="text-[12px] px-3 py-1.5 rounded-lg btn-gold-solid shrink-0">Use This Trade</button>
      </div>
      <div class="text-[12px] text-zinc-300 mb-1.5">You send <span class="text-zinc-200">${c.giveA.map(a => Vault.escapeHtml(a.name)).join(', ')}</span> for <span class="text-zinc-200">${c.giveB.map(a => Vault.escapeHtml(a.name)).join(', ')}</span></div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="size-2 rounded-full ${verdictDot(c.result.verdict.tone, c.result.bucket)}"></span>
        <span class="text-[12px] font-medium ${verdictColor(c.result.verdict.tone, c.result.bucket)}">${c.result.verdict.label}</span>
        <span class="text-[11px] text-zinc-400">${capPct(c.result.overallPct).toFixed(0)}% off</span>
        ${suggestionRosterNote(c)}
      </div>
    </div>`;
}

function renderSuggestions() {
  const box = document.getElementById('suggestPanel');
  const myTeam = teamOf('A');
  if (!allSuggestions.length) {
    box.innerHTML = `<div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-2">Suggested Trades</div><div class="text-[12px] text-zinc-400 py-2">No trade across the league reads as genuinely fair for ${Vault.escapeHtml(myTeam.teamName)} right now — try building one manually below, or check back after rosters change.</div>`;
    return;
  }

  // allSuggestions is already sorted most-fair-to-least (see runSuggestTradeSearch),
  // so slicing to 5 here — for ANY filter, not just ALL — keeps that same "most fair
  // first" ordering while capping the list to a reviewable size. The filter buttons
  // below still show the true total per position, even when only 5 are displayed.
  const MAX_DISPLAYED = 5;
  const candidates = allSuggestions.filter(c => suggestionMatchesPos(c, suggestPosFilter)).slice(0, MAX_DISPLAYED);
  suggestState = candidates; // useSuggestion(i) indexes into whatever's currently displayed

  const filterBar = [...POS_FILTERS, '1-FOR-2'].map(p => {
    const count = allSuggestions.filter(c => suggestionMatchesPos(c, p)).length;
    const active = suggestPosFilter === p;
    return `<button onclick="setSuggestPosFilter('${p}')" class="text-[11px] px-2.5 py-1 rounded-lg border transition-colors ${active ? 'bg-amber-500/15 border-amber-500/40 text-zinc-300' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${p === '1-FOR-2' ? '1-for-2' : p} <span class="opacity-60">${count}</span></button>`;
  }).join('');

  box.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <div class="text-[11px] text-zinc-400 uppercase tracking-wider">Suggested Trades for ${Vault.escapeHtml(myTeam.teamName)}</div>
      <button onclick="document.getElementById('suggestPanel').classList.add('hidden')" class="text-[11px] px-2.5 py-1.5 rounded-lg border border-white/10 text-zinc-400 hover:text-white hover:border-white/20">Close</button>
    </div>
    <div class="flex gap-1.5 flex-wrap mb-3">${filterBar}</div>
    ${candidates.length
      ? `<div class="space-y-2 max-h-[480px] overflow-y-auto pr-1 scrollbar">${candidates.map((c, i) => suggestionCard(c, i)).join('')}</div>`
      : `<div class="text-[12px] text-zinc-400 py-2">No suggested ${suggestPosFilter} trades right now — try another position or build one manually below.</div>`}`;
}

function useSuggestion(i) {
  const c = suggestState[i];
  if (!c) return;
  document.getElementById('teamB').value = c.partner.rosterId;
  prevB = String(c.partner.rosterId);
  selectedA.clear(); selectedB.clear();
  c.giveA.forEach(a => selectedA.add(a.key));
  c.giveB.forEach(a => selectedB.add(a.key));
  document.getElementById('suggestPanel').classList.add('hidden');
  render('A'); render('B');
}

// Per-side balance: the OTHER side's selection is held completely fixed (it's what
// you're already comfortable with). Two tiers on MY side, in order:
//   1. Keep whatever I already have selected and only ADD pieces from the rest of
//      my roster to close the value gap — the result still visibly contains the
//      trade you were building instead of reading as an unrelated replacement.
//   2. Only if nothing built on top of my current selection reaches a good fit,
//      fall back to a fresh search across my whole roster — a genuinely different
//      package, reached only when the piece(s) you had selected are themselves
//      the problem (e.g. the wrong asset type for your timeline).
// Works in adjusted-value space throughout (comboSearchTopN, not bestCombos) since
// the target here is a SUM of the other side's current assets, not one raw KTC
// value bestCombos could re-derive VBA from.
function balanceSide(mySide, btn) {
  const other = otherSide(mySide);
  const myTeam = teamOf(mySide), otherTeam = teamOf(other);
  const otherSel = other === 'A' ? selectedA : selectedB;
  const otherAssets = [...otherSel].map(k => otherTeam.assets.find(a => a.key === k)).filter(Boolean);
  if (!otherAssets.length) return flashButtonMessage(btn, `Select something on Team ${other} first`);

  const mySel = mySide === 'A' ? selectedA : selectedB;
  const myCurrent = [...mySel].map(k => myTeam.assets.find(a => a.key === k)).filter(Boolean);
  const targetAdj = otherAssets.reduce((s, a) => s + Vault.adjustedValue(a.value), 0);
  // This package flows FROM myTeam TO otherTeam, so the search should credit it
  // for filling otherTeam's actual needs, not just matching sticker value.
  const otherProfile = Vault.positionalProfile(otherTeam, teams);

  // computeTradeAnalysis's fit score already folds in positional need/surplus (via
  // Vault.positionalFitNotes), but that contribution is scaled to a whole roster
  // (dollarSwing / team total * 120) — for any single throw-in-sized asset it comes
  // out to a few tenths of a point, easily buried under the timeline/archetype/VORP
  // swings the same fit score also carries. That's fine when those other factors are
  // genuinely what's at stake, but it means a real need-fit piece (a TE for a
  // TE-needy team) can lose out to a same-priced surplus piece (a bench WR) whose
  // unrelated stats happen to nudge the score higher — exactly the "still
  // recommends the throw-in" gap bestFit/buildBalancedOffer closed for the Finder
  // but this evaluate-a-few-candidates design never got. A direct per-asset bonus
  // for otherTeam's actual need/surplus positions makes sure fit alone can't be the
  // one carrying that decision.
  const needBias = combo => combo.reduce((s, a) => {
    const pos = (a.pos || '').toLowerCase();
    if (otherProfile.needs.includes(pos)) return s + 1;
    if (otherProfile.surpluses.includes(pos)) return s - 1;
    return s;
  }, 0);

  // Fit alone has no idea whether the combo is anywhere close to a fair dollar
  // match — "keep the current selection, change nothing" is always a candidate
  // (see additive.push(myCurrent) below), so without a fairness penalty, a
  // wildly lopsided trade can win purely because giving away that one asset
  // happens to help the giver's own timeline/archetype score, even at 100%+ off.
  // Real case that surfaced this: Balance recommended giving away a $9,500 QB for
  // a $1,000 throw-in (148% off) over swapping in a genuinely value-matched
  // bench piece (~0% off), because dumping the QB scored better on fit alone.
  // Scaled by /5 so it barely matters inside Fair (max ~14/5≈2.8, on par with a
  // typical fit swing), meaningfully discourages Lopsided (max ~41/5≈8.2), and
  // overwhelms any realistic fit score once a combo is genuinely Unfair.
  const evaluate = combo => {
    const giveA = mySide === 'A' ? combo : otherAssets;
    const giveB = mySide === 'A' ? otherAssets : combo;
    const { valueA: aValAdj, valueB: bValAdj } = Vault.tradeSideValues(giveA, giveB);
    const result = computeTradeAnalysis(teamOf('A'), teamOf('B'), giveA, giveB, aValAdj, bValAdj);
    const fit = mySide === 'A' ? result.resA.fit : result.resB.fit;
    return fit + needBias(combo) - result.overallPct / 5;
  };

  // Real trade partners actually want (bestFit/buildBalancedOffer's whole point) —
  // but this function's own candidate-then-evaluate design predates that fix and
  // never got it: comboSearchTopN alone (no needs-first bias) supplies every
  // candidate `evaluate` gets to compare, so a genuine need-fit piece (a TE for a
  // TE-needy team, say) never even makes the shortlist when a same-dollar surplus
  // piece (e.g. a bench WR) matches the target more closely in raw terms. Mixing in
  // a needs-only search alongside the plain one fixes that without changing how
  // candidates get judged — `evaluate` (real fairness + fit) still makes the final
  // call, this just makes sure a need-fit option is on the table for it to pick.
  const otherNeeds = otherProfile.needs || [];
  const needCandidates = (pool, targetAdj, n) => {
    if (!otherNeeds.length) return [];
    const needPool = pool.filter(a => a.type === 'pick' || otherNeeds.includes((a.pos || '').toLowerCase()));
    return needPool.length ? comboSearchTopN(needPool, targetAdj, n, otherProfile).map(c => c.combo) : [];
  };

  // Real dollar gap for a candidate combo — used to decide whether Tier 1 already
  // reached a fair trade, separately from `evaluate`'s fit-weighted score (which
  // isn't on a scale comparable to VAULT_CONFIG.FAIR_PCT).
  const pctDiffFor = combo => {
    const giveA = mySide === 'A' ? combo : otherAssets;
    const giveB = mySide === 'A' ? otherAssets : combo;
    const { valueA: aValAdj, valueB: bValAdj } = Vault.tradeSideValues(giveA, giveB);
    const avg = (aValAdj + bValAdj) / 2 || 1;
    return Math.abs(aValAdj - bValAdj) / avg * 100;
  };

  // Tier 1: current selection (if any) + up to a few added pieces from the rest of
  // my roster, aimed at the remaining value gap. This is the expected, common
  // path — Balance is meant to adjust what's already on the table, not throw it
  // out for something unrelated.
  //
  // comboSearchTopN itself ranks candidates by a cheap VBA-based approximation
  // (Vault.adjustedValue), not the real two-sided KTC consolidation math
  // (Vault.tradeSideValues) `evaluate` above actually scores with — see its own
  // comment for why (recomputing the real number for all ~10,700 combos in a
  // 40-asset pool is too slow to do inline). That gap is usually harmless, but
  // it can systematically MISRANK exactly the kind of combo Balance most needs:
  // a real case that surfaced this — Cyrus Allen (a single $2,500 WR) trying to
  // match a $4,800 QB — had a genuinely near-perfect combo (Cyrus Allen + two
  // mid picks, 0.3% off) that the cheap proxy ranked far behind a worse one
  // (Cyrus Allen + a $2,000 TE, 15% off), because the proxy has no visibility
  // into the real consolidation premium a 1-for-several trade generates. A top-6
  // shortlist can miss that combo entirely before `evaluate`'s real math ever
  // gets a look at it. Widened to a much larger shortlist here specifically
  // (Balance only ever evaluates once per click, not per keystroke, so the
  // extra real-math calls are cheap in context) so the actual best combo is far
  // more likely to survive into the pool `evaluate` picks from.
  const fillerPool = myTeam.assets.filter(a => !mySel.has(a.key));
  const remainingAdj = targetAdj - myCurrent.reduce((s, a) => s + Vault.adjustedValue(a.value), 0);
  const additive = comboSearchTopN(fillerPool, remainingAdj, 20, otherProfile).map(c => [...myCurrent, ...c.combo]);
  needCandidates(fillerPool, remainingAdj, 8).forEach(c => additive.push([...myCurrent, ...c]));
  if (myCurrent.length) additive.push(myCurrent); // "add nothing" is a valid option too

  // 1-for-2 / 2-for-1 candidates, checked exhaustively with real math rather than
  // left to the proxy shortlist (which penalizes every extra piece): one piece
  // added to a single current pick against a single asset, a fresh pair against a
  // single asset, or a single piece against two. Only Fair ones are kept.
  const isFair = c => pctDiffFor(c) < VAULT_CONFIG.FAIR_PCT;
  if (otherAssets.length === 1 && myCurrent.length === 1) {
    fillerPool.forEach(a => { const c = [...myCurrent, a]; if (isFair(c)) additive.push(c); });
  } else if (otherAssets.length === 1 && !myCurrent.length) {
    const top = tradeableAssets(myTeam), target = otherAssets[0].value;
    for (let i = 0; i < top.length; i++) for (let j = i + 1; j < top.length; j++) {
      const raw = top[i].value + top[j].value;
      if (raw < target * 0.8 || raw > target * 2.2) continue;
      const c = [top[i], top[j]];
      if (isFair(c)) additive.push(c);
    }
  } else if (otherAssets.length === 2 && !myCurrent.length) {
    myTeam.assets.forEach(a => { if (isFair([a])) additive.push([a]); });
  }
  // Real cost of a bigger package: every player the receiving team would have to
  // drop to fit it under the active-roster limit (see projectedRosterCount). Same
  // weight as a GOOD_FIT_THRESHOLD-sized fit swing per forced drop, so a 3-for-1
  // only beats a 2-for-1 when it's genuinely better for them, not by default.
  const DROP_COST = VAULT_CONFIG.GOOD_FIT_THRESHOLD;
  const dropsFor = c => rosterCap ? Math.max(0, projectedRosterCount(otherTeam, otherAssets, c) - rosterCap) : 0;
  const scoreWithDrops = c => evaluate(c) - dropsFor(c) * DROP_COST;

  // Picks the best-scoring combo from a candidate list, preferring any that are
  // already Fair by value — `evaluate`'s fit bonus can otherwise favor a Lopsided
  // add over a Fair one, and a Lopsided pick here used to trip the Tier 2 rebuild
  // below even though a Fair add-on (keeping the current selection) was right there.
  const pickBest = combos => {
    const fair = combos.filter(isFair);
    let top = null, topScore = -Infinity;
    (fair.length ? fair : combos).forEach(c => { const s = scoreWithDrops(c); if (s > topScore) { topScore = s; top = c; } });
    return { combo: top, score: topScore };
  };

  // Bounded local refinement: comboSearchTopN's cheap ranking (see its comment
  // above) can leave the actual best single-piece swap out of the candidate pool
  // entirely, not just rank it low — a real case had a near-perfect combo (0.3%
  // off) the proxy never surfaced, because it undervalues "overshoot the raw
  // target with an extra cheap piece" combos that a real two-sided consolidation
  // bonus can make excellent. Tries every other roster asset in place of each
  // ADDED piece, scored with the same real `evaluate`. Two passes, not a full
  // hill-climb. Never touches a myCurrent piece (already selected before this
  // click) — without that guard, a real run swapped Cyrus Allen himself out for
  // Jordan Mason purely because it scored a little better. A swap that would
  // turn a Fair combo Lopsided is never taken.
  const myCurrentKeys = new Set(myCurrent.map(a => a.key));
  const refine = (combo, score) => {
    for (let pass = 0; pass < 2; pass++) {
      let swapped = false;
      for (let i = 0; i < combo.length; i++) {
        if (myCurrentKeys.has(combo[i].key)) continue; // protect the original selection
        for (const candidate of myTeam.assets) {
          if (combo.some(a => a.key === candidate.key)) continue; // already in this combo
          const trial = combo.map((a, idx) => idx === i ? candidate : a);
          const s = scoreWithDrops(trial);
          if (s > score && (pctDiffFor(trial) < VAULT_CONFIG.FAIR_PCT || pctDiffFor(combo) >= VAULT_CONFIG.FAIR_PCT)) { score = s; combo = trial; swapped = true; }
        }
      }
      if (!swapped) break;
    }
    return combo;
  };

  let { combo: best, score: bestFitScore } = pickBest(additive);
  if (best) best = refine(best, bestFitScore);

  // Tier 2: a fresh, whole-roster search — only when NOTHING built on the current
  // selection reaches Fair, even after refinement. Tier 1 can only ever ADD to the
  // current selection, so a fundamentally mismatched piece already on the table
  // can leave every additive combo Lopsided/Unfair no matter what gets piled on —
  // that's the real gap this closes, not a routine second opinion. Same widened
  // shortlist as Tier 1, same reason.
  if (!best || pctDiffFor(best) >= VAULT_CONFIG.FAIR_PCT) {
    const fresh = comboSearchTopN(myTeam.assets, targetAdj, 30, otherProfile).map(c => c.combo);
    fresh.push(...needCandidates(myTeam.assets, targetAdj, 10));
    const tier2 = pickBest(fresh);
    if (tier2.combo) {
      const refined = refine(tier2.combo, tier2.score);
      if (!best || pctDiffFor(refined) < pctDiffFor(best)) best = refined;
    }
  }  if (!best) return flashButtonMessage(btn, 'No alternative package found');

  // Either tier can legitimately land back on exactly what's already selected.
  const bestKeys = best.map(a => a.key).sort().join(',');
  const currentKeys = [...mySel].sort().join(',');
  if (bestKeys === currentKeys) return flashButtonMessage(btn, 'Already your best available option');

  mySel.clear();
  best.forEach(a => mySel.add(a.key));
  render('A'); render('B');
}

// Swaps a button's own label for a short message, then restores it — used for the
// "nothing to do" outcomes above so the button never just silently does nothing.
function flashButtonMessage(btn, msg) {
  if (!btn) return;
  if (btn.dataset.flashing) return; // already mid-flash, don't stack timers
  const original = btn.innerHTML;
  btn.dataset.flashing = '1';
  btn.disabled = true;
  btn.textContent = msg;
  setTimeout(() => { btn.innerHTML = original; btn.disabled = false; delete btn.dataset.flashing; }, 1800);
}

function swap(side, outKey, inKey) {
  const set = side === 'A' ? selectedA : selectedB;
  set.delete(outKey); set.add(inKey);
  render(side);
}

// More assets in a pool means more possible combinations, which almost always lets
// a 3-piece combo shave a *little* more off the diff than the best 2-piece one —
// even when that 2-piece is already well within "Fair" territory. Minimizing raw
// diff alone means combo search keeps reaching for a bigger package to chase a
// fraction of a percent, when a real trade wouldn't bother. This scores a combo by
// its %-off PLUS a flat penalty per extra asset beyond the first, so a bigger
// package only wins when it's a genuine fairness improvement, not a rounding one —
// e.g. a real case from this app: best 1-piece was 16.6% off, best 2-piece dropped
// to 0.7% (a real improvement, worth the 2nd asset), best 3-piece only reached
// 0.01% (not worth a 3rd asset for 0.66 more points of fairness).
const COMBO_SIZE_PENALTY_PCT = 3;
// Small enough that it only ever breaks a near-tie on dollar fairness, never
// overrides a real one: two combos within ~1-2 points of %-off can differ by
// dozens of VORP (a full bench piece's worth), so this nudges the search toward
// the one with more real, scarcity-adjusted production for the same price —
// exactly the "VORP factored into trades" gap this closes — without ever letting
// VORP talk the search into a worse-priced package. A 15-point dollar gap would
// need a ~100-VORP swing to flip, which doesn't happen at realistic trade sizes.
const VORP_TIEBREAK_WEIGHT = 0.15;
function comboScore(diff, len, targetAdj, vorpSum) {
  const pct = targetAdj ? diff / targetAdj * 100 : 0;
  return pct + (len - 1) * COMBO_SIZE_PENALTY_PCT - (vorpSum || 0) * VORP_TIEBREAK_WEIGHT;
}

// Sums a combo's value the same way the headline fairness verdict does: need-
// weighted (Vault.needAdjustedValue) against the RECEIVING team's profile when one
// is given, plain VBA-adjusted otherwise — every combo-search function below takes
// an optional `profile` (Vault.positionalProfile of whoever would receive this
// combo) so a suggested package can settle for genuinely less sticker value when it
// actually fills a need, or demand more when it's just piling onto a surplus,
// instead of only ever matching raw dollars. Computed ONCE by the caller and passed
// in, not recomputed here — these functions run this per combo, up to ~10,700 times
// for a 40-asset pool, and positionalProfile itself loops every team in the league.
function comboValue(combo, profile) {
  return combo.reduce((s, a) => s + (profile ? Vault.needAdjustedValue(Vault.adjustedValue(a.value), a.pos, profile) : Vault.adjustedValue(a.value)), 0);
}

// Total real production edge in a combo — picks and any player missing a
// projection contribute 0 rather than breaking the sum, same null-handling as
// everywhere else VORP shows up.
function comboVorp(combo) {
  return combo.reduce((s, a) => s + (Number.isFinite(a.vorp) ? a.vorp : 0), 0);
}

/* Package builder core: pool of assets, target already in VBA-adjusted-value space.
   All combo search happens here so gap-closer, Match, and the Finder agree with the
   same fairness math the analysis panel uses — a suggested combo should still look
   fair once VBA is applied to it, not just fair by raw KTC sum. */
function comboSearchAdj(pool, targetAdj, profile) {
  let best = null, bestScore = Infinity;
  const consider = combo => {
    const diff = Math.abs(comboValue(combo, profile) - targetAdj);
    const score = comboScore(diff, combo.length, targetAdj, comboVorp(combo));
    if (score < bestScore) { bestScore = score; best = { combo, diff }; }
  };
  pool.forEach(a => consider([a]));
  for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) consider([pool[i], pool[j]]);
  if (pool.length <= 40) for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) for (let k = j + 1; k < pool.length; k++) consider([pool[i], pool[j], pool[k]]);
  return best;
}

/* Public entry point: pool + a RAW target value (a real KTC asset/gap value) —
   returns the combo whose VBA-adjusted sum is closest to the target's adjusted
   value. `sum` is the raw KTC total (for display); `pctOff` is how far off in
   adjusted-space terms, the same basis the trade bar and headline use — need-
   weighted when `profile` is given, same as comboValue above. */
// Same enumeration as comboSearchAdj, but keeps every combo considered instead of
// only the single best, then returns up to N of them — skipping any combo that's
// mostly the same assets as one already picked (>50% overlap), so the results are
// genuinely different packages rather than "same core plus a different throw-in".
// Used by the acquire Finder so it can offer a few real options instead of picking
// one for you.
function comboSearchTopN(pool, targetAdj, n, profile) {
  const all = [];
  const consider = combo => {
    const diff = Math.abs(comboValue(combo, profile) - targetAdj);
    all.push({ combo, diff, score: comboScore(diff, combo.length, targetAdj, comboVorp(combo)) });
  };
  pool.forEach(a => consider([a]));
  for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) consider([pool[i], pool[j]]);
  if (pool.length <= 40) for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) for (let k = j + 1; k < pool.length; k++) consider([pool[i], pool[j], pool[k]]);
  all.sort((a, b) => a.score - b.score);

  const picked = [];
  for (const r of all) {
    const keys = new Set(r.combo.map(a => a.key));
    const tooSimilar = picked.some(p => {
      const pKeys = new Set(p.combo.map(a => a.key));
      const shared = [...keys].filter(k => pKeys.has(k)).length;
      return shared / Math.max(keys.size, pKeys.size) > 0.5;
    });
    if (tooSimilar) continue;
    picked.push(r);
    if (picked.length >= n) break;
  }
  return picked;
}

/* The search above (comboSearchAdj/comboSearchTopN/comboValue) scores thousands of
   candidate combos per call using per-asset VBA — cheap enough to brute-force a
   40-asset pool, but the same single-sided approximation this app's real trade
   verdict moved away from earlier (Vault.needAdjustedTradeValues): VBA has no
   visibility into how many pieces are on the OTHER side, so it can systematically
   under- or over-value a multi-piece combo relative to a single asset worth the
   same raw dollars — exactly backwards from a real "% off" reading, and visibly so
   once a combo's raw sum sits $1,000+ from the target while still reading "0% off".
   This recomputes the FINAL, DISPLAYED percentage for whichever combo the search
   already picked using the real two-sided KTC consolidation (Vault.tradeSideValues)
   plus need-weighting — the same standard the trade bar and verdict use — so the
   number shown next to a result can't contradict its own raw dollar sum. Only run
   once per result (not per candidate during the search), so it doesn't reintroduce
   the performance concern that ruled out using it for the search itself. */
function realPctOff(targetValueRaw, combo, profile) {
  const { valueA, valueB } = Vault.tradeSideValues([{ value: targetValueRaw }], combo);
  const comboNeedAdj = profile
    ? Vault.distributeAdjustedValue(combo, valueB).reduce((s, x) => s + Vault.needAdjustedValue(x.distAdjValue, x.pos, profile), 0)
    : valueB;
  const avg = (valueA + comboNeedAdj) / 2 || 1;
  return Math.abs(comboNeedAdj - valueA) / avg * 100;
}

/* The cheap per-asset search above can rank the truly closest package outside
   its shortlist — same gap Balance had. This takes whatever it picked and tries
   bounded local moves (swap one piece for any pool asset, drop one piece, add
   one piece; max 3 pieces) scored by realPctOff, the same number shown next to
   the result, plus the usual per-extra-piece penalty. A couple of passes over a
   ~40-asset pool is a few hundred real evaluations — cheap. */
function refineCombo(pool, combo, targetValueRaw, profile, lockedKey = null) {
  const score = c => realPctOff(targetValueRaw, c, profile) + (c.length - 1) * COMBO_SIZE_PENALTY_PCT;
  let best = combo, bestScore = score(combo);
  for (let pass = 0; pass < 2; pass++) {
    let improved = false;
    const trials = [];
    for (let i = 0; i < best.length; i++) {
      if (best[i].key === lockedKey) continue; // an anchor the user asked for stays put
      for (const cand of pool) if (!best.some(a => a.key === cand.key)) trials.push(best.map((a, idx) => idx === i ? cand : a));
      if (best.length > 1) trials.push(best.filter((_, idx) => idx !== i));
    }
    if (best.length < 3) for (const cand of pool) if (!best.some(a => a.key === cand.key)) trials.push([...best, cand]);
    for (const t of trials) { const s = score(t); if (s < bestScore - 1e-9) { bestScore = s; best = t; improved = true; } }
    if (!improved) break;
  }
  return best;
}

function bestCombos(pool, targetValueRaw, n, profile) {
  const targetAdj = Vault.adjustedValue(targetValueRaw);
  const seen = new Set();
  return comboSearchTopN(pool, targetAdj, n, profile).map(r => {
    const combo = refineCombo(pool, r.combo, targetValueRaw, profile);
    const key = combo.map(a => a.key).sort().join(',');
    if (seen.has(key)) return null; // two shortlist entries refined into the same package
    seen.add(key);
    const sum = combo.reduce((s, a) => s + a.value, 0);
    return { combo, sum, diff: Math.abs(comboValue(combo, profile) - targetAdj), pctOff: realPctOff(targetValueRaw, combo, profile) };
  }).filter(Boolean);
}

function bestCombo(pool, targetValueRaw, profile) {
  const targetAdj = Vault.adjustedValue(targetValueRaw);
  const best = bestFit(pool, targetAdj, targetAdj, profile);
  if (!best) return null;
  const combo = refineCombo(pool, best.combo, targetValueRaw, profile);
  const sum = combo.reduce((s, a) => s + a.value, 0);
  return { combo, sum, diff: Math.abs(comboValue(combo, profile) - targetAdj), pctOff: realPctOff(targetValueRaw, combo, profile) };
}

/* Like bestCombo, but requires the combo to include one asset matching `posFilter`
   (a position, or 'PICK' for any pick) if given — that anchor asset is picked closest
   to the target value (need-weighted against `profile` when given, same as
   comboValue), then the remaining value gap is filled from the rest of the pool. */
function anchoredCombo(pool, targetValueRaw, posFilter, profile) {
  if (!posFilter || posFilter === 'ANY') return bestCombo(pool, targetValueRaw, profile);
  const anchors = pool.filter(a => posFilter === 'PICK' ? a.type === 'pick' : a.pos === posFilter);
  if (!anchors.length) return null;
  const targetAdj = Vault.adjustedValue(targetValueRaw);
  const anchor = [...anchors].sort((a, b) =>
    comboScore(Math.abs(comboValue([a], profile) - targetAdj), 1, targetAdj, comboVorp([a]))
    - comboScore(Math.abs(comboValue([b], profile) - targetAdj), 1, targetAdj, comboVorp([b]))
  )[0];
  const remainingAdj = targetAdj - comboValue([anchor], profile);
  const fillerPool = pool.filter(a => a.key !== anchor.key);
  const filler = Math.abs(remainingAdj) > targetAdj * 0.06 ? bestFit(fillerPool, remainingAdj, targetAdj, profile) : null;
  const combo = refineCombo(pool, filler ? [anchor, ...filler.combo] : [anchor], targetValueRaw, profile, anchor.key);
  const sum = combo.reduce((s, a) => s + a.value, 0);
  const diff = Math.abs(comboValue(combo, profile) - targetAdj);
  return { combo, sum, diff, pctOff: realPctOff(targetValueRaw, combo, profile) };
}

// Searches `pool` for the closest match to `searchTargetAdj`, preferring a combo
// built from a position the RECEIVING team (profile) actually needs over one that
// piles onto an already-deep position — a piece that happens to match the dollar
// amount but adds to a surplus isn't one either side has real reason to want,
// even priced "fairly". Only falls back to the plain closest-value search
// (which can include surplus positions) when nothing at a needed position gets
// close enough to be worth proposing on its own — judged against the OVERALL
// trade's target value (`overallTargetAdj`, same as `searchTargetAdj` for a
// direct match, but the whole trade's total rather than just the remaining gap
// when this is filling in behind an anchor) so "close enough" means "wouldn't
// already read as Lopsided by itself".
function bestFit(pool, searchTargetAdj, overallTargetAdj, profile) {
  const generic = comboSearchAdj(pool, searchTargetAdj, profile);
  const needs = profile?.needs || [];
  if (!needs.length) return generic;
  const needPool = pool.filter(a => a.type === 'pick' || needs.includes((a.pos || '').toLowerCase()));
  if (!needPool.length) return generic;
  const needFit = comboSearchAdj(needPool, searchTargetAdj, profile);
  if (!needFit) return generic;
  const needFitPct = overallTargetAdj ? needFit.diff / overallTargetAdj * 100 : 0;
  return needFitPct <= VAULT_CONFIG.LOPSIDED_PCT ? needFit : generic;
}

// A real trade is closer to "my piece (plus maybe a small sweetener) for their
// best matching piece (plus maybe a small sweetener from them)" than "my one piece
// for a pile of their scraps" — bestFit alone still only ever adds MORE pieces to
// the partner's side to hit the target, which is how a single good need-fit asset
// (worth more than the core alone) gets buried under 2-3 mediocre ones instead of
// just being the return, with a small throw-in from OUR side closing the gap
// instead. Picks the partner's single BEST asset at the requested position (or, for
// ANY, their best asset at one of our own needs, falling back to their best asset
// overall) — a real partner offers their strongest chip there, not their weakest —
// then closes whatever value gap is left with a small filler from whichever side
// is short, priced by what the RECEIVING side of that filler would actually want.
// Returns null if the gap is too large for a small sweetener to bridge credibly
// (BALANCED_OFFER_MAX_STRETCH), since that anchor just isn't a realistic single
// centerpiece for this trade.
const BALANCED_OFFER_SWAP_TOLERANCE_PCT = 0.12;
const BALANCED_OFFER_MAX_STRETCH = 0.35;
function buildBalancedOffer(myAssets, partnerAssets, core, posFilter, myProfile, partnerProfile) {
  let anchorPool = partnerAssets;
  if (posFilter && posFilter !== 'ANY') {
    anchorPool = partnerAssets.filter(a => posFilter === 'PICK' ? a.type === 'pick' : a.pos === posFilter);
  } else if (myProfile.needs.length) {
    const needPool = partnerAssets.filter(a => myProfile.needs.includes((a.pos || '').toLowerCase()));
    if (needPool.length) anchorPool = needPool;
  }
  if (!anchorPool.length) return null;
  const anchor = [...anchorPool].sort((a, b) => b.value - a.value)[0];
  const coreAdj = Vault.adjustedValue(core.value);
  const anchorAdj = Vault.adjustedValue(anchor.value);
  const gapAdj = anchorAdj - coreAdj;
  const tolerance = Math.max(coreAdj, anchorAdj) * BALANCED_OFFER_SWAP_TOLERANCE_PCT;

  if (Math.abs(gapAdj) <= tolerance) {
    return { ours: [core], theirs: [anchor], pctOff: realPctOff(core.value, [anchor], myProfile) };
  }
  if (gapAdj > 0) {
    // Their chip is worth more — we sweeten our side, priced by what THEY'D
    // actually want (need-weighted against the partner, not us).
    const myPool = myAssets.filter(a => a.key !== core.key);
    const filler = bestFit(myPool, gapAdj, anchorAdj, partnerProfile);
    if (!filler || filler.diff > anchorAdj * BALANCED_OFFER_MAX_STRETCH) return null;
    const ours = refineCombo(myAssets, [core, ...filler.combo], anchor.value, partnerProfile, core.key);
    return { ours, theirs: [anchor], pctOff: realPctOff(anchor.value, ours, partnerProfile) };
  }
  // Their chip alone falls short — they sweeten with a small extra, priced by what
  // WE'D actually want, same convention as the original single-sided search.
  const partnerPool = partnerAssets.filter(a => a.key !== anchor.key);
  const filler = bestFit(partnerPool, -gapAdj, coreAdj, myProfile);
  const theirs = refineCombo(partnerAssets, filler ? [anchor, ...filler.combo] : [anchor], core.value, myProfile, anchor.key);
  return { ours: [core], theirs, pctOff: realPctOff(core.value, theirs, myProfile) };
}

// Why might `partner` realistically part with `givingAssets`? Reuses the same
// positional-surplus idea as Team Analyzer's trade-partner suggestions.
function partnerRationale(partner, givingAssets) {
  const notes = [];
  const mode = Vault.teamMode(partner);
  const posGiven = [...new Set(givingAssets.filter(a => a.type === 'player').map(a => a.pos))];
  posGiven.forEach(pos => {
    const key = pos.toLowerCase();
    if (!(key in partner)) return;
    const arr = teams.map(t => t[key]).sort((a, b) => a - b);
    const pct = arr.indexOf(partner[key]) / (arr.length - 1);
    if (pct > 0.65) notes.push(`Deep at ${pos} — top-third of the league in ${pos} value`);
  });
  if (givingAssets.some(a => a.type === 'pick') && mode === 'contend') notes.push(`Contending — likely open to moving picks for immediate help`);
  if (givingAssets.some(a => a.type === 'player' && a.age >= 29) && mode === 'rebuild') notes.push(`Rebuilding — likely open to moving aging veterans`);
  if (givingAssets.some(a => a.type === 'player' && a.age < 25) && mode === 'contend' && posGiven.length) notes.push(`Contending teams sometimes cash in unproven youth for a sure thing`);
  if (!notes.length) notes.push(`Reasonable value match`);
  return notes.slice(0, 2);
}

let finderState = null;
let acquireCombos = []; // currently displayed acquire-mode packages; proposeAcquire(i) indexes into this

// Entry point for the header "Find a Trade" button — no row hovered yet, so let the
// user pick which of their two loaded teams they are, then search ANY player or
// pick from ANY team in the league. Picking your own asset shops it to the league
// (same as the per-row "Find" button); picking someone else's asset switches to
// acquire mode — a package from your team to go get them.
function openFinderPicker() {
  if (!teams.length) return;
  finderState = { side: 'A', key: null, position: 'ANY' };
  document.getElementById('finder').classList.remove('hidden');
  document.getElementById('finderPickerRow').classList.remove('hidden');
  document.getElementById('finderTarget').textContent = 'Search a player or pick below';
  document.getElementById('finderWantBackLabel').classList.add('hidden');
  document.getElementById('finderPosChips').innerHTML = '';
  document.getElementById('finderResults').innerHTML = '';
  renderFinderAssetOptions();
}
function renderFinderAssetOptions() {
  document.getElementById('finderSideChips').innerHTML = ['A', 'B'].map(s =>
    `<button onclick="finderState.side='${s}'; renderFinderAssetOptions()" class="text-[11px] px-2.5 py-1 rounded-lg border ${finderState.side === s ? 'bg-amber-500/15 border-amber-500/40 text-zinc-300' : 'border-white/10 text-zinc-400 hover:text-white'}">${Vault.escapeHtml(teamOf(s).teamName)}</button>`
  ).join('');
  document.getElementById('finderAssetSearch').value = '';
  document.getElementById('finderAssetResults').classList.add('hidden');
}

// Flattened, league-wide asset pool (every team's players + picks) for the search box.
function allLeagueAssets() {
  return teams.flatMap(t => t.assets.map(a => ({ ...a, rosterId: t.rosterId, ownerName: t.teamName })));
}

function searchFinderAssets(q) {
  const box = document.getElementById('finderAssetResults');
  const query = q.trim().toLowerCase();
  if (!query) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const mine = teamOf(finderState.side).rosterId;
  const results = allLeagueAssets()
    .filter(a => a.name.toLowerCase().includes(query))
    .sort((a, b) => b.value - a.value)
    .slice(0, 8);
  box.innerHTML = results.length
    ? results.map(a => `
      <div onmousedown="pickFinderAsset('${a.key}', ${a.rosterId})" class="px-3 py-2 flex items-center justify-between gap-3 cursor-pointer hover:bg-amber-500/10 text-[12px]">
        <span class="truncate">${Vault.escapeHtml(a.name)} <span class="text-zinc-400">${a.rosterId === mine ? '(yours)' : '— ' + Vault.escapeHtml(a.ownerName)}</span></span>
        <span class="mono text-zinc-400 shrink-0">${Math.round(a.value).toLocaleString()}</span>
      </div>`).join('')
    : `<div class="px-3 py-2 text-[12px] text-zinc-400">No match</div>`;
  box.classList.remove('hidden');
}

function pickFinderAsset(key, rosterId) {
  document.getElementById('finderAssetSearch').value = '';
  document.getElementById('finderAssetResults').classList.add('hidden');
  const mySide = finderState.side;
  if (rosterId === teamOf(mySide).rosterId) openFinder(mySide, key);
  else openAcquireFinder(mySide, key, rosterId);
}

function openFinder(side, key) {
  finderState = { side, key, position: 'ANY' };
  renderFinder();
}

// Reverse of the shop-out finder: the picked asset belongs to someone else, so
// instead of asking who wants it, build the package it'd take from MY team to go
// get it, and stage it against that asset's real owner rather than the other
// currently-loaded side.
function openAcquireFinder(side, key, targetRosterId) {
  finderState = { side, key, position: 'ANY', mode: 'acquire', targetRosterId };
  renderAcquireFinder();
}

function renderAcquireFinder() {
  const { side, key, targetRosterId } = finderState;
  const myTeam = teamOf(side);
  const targetTeam = teams.find(t => t.rosterId === targetRosterId);
  const asset = targetTeam && targetTeam.assets.find(a => a.key === key);
  if (!asset) { closeFinder(); return; }

  // Was missing here (renderFinder and renderSimilarAcrossLeague both do this) —
  // harmless when the modal was already open from another path (e.g. the header
  // "Find a Trade" picker, which unhides it itself), but calling openAcquireFinder
  // directly from a Team B row's "Find" button — the normal path now — started
  // from #finder hidden, so the results rendered into a still-hidden panel and
  // clicking Find appeared to silently do nothing.
  document.getElementById('finder').classList.remove('hidden');
  document.getElementById('finderPickerRow').classList.add('hidden');
  document.getElementById('finderWantBackLabel').classList.add('hidden');
  document.getElementById('finderTarget').innerHTML = `${Vault.escapeHtml(asset.name)} <span class="mono text-zinc-400">${Math.round(asset.value).toLocaleString()}</span> <span class="text-zinc-400">on ${Vault.escapeHtml(targetTeam.teamName)}</span>`;
  document.getElementById('finderPosChips').innerHTML = '';

  // Up to 5 genuinely different packages, most fair to least — same "several real
  // options, not just one auto-pick" pattern as Suggested Trades and the shop-mode
  // Finder (which already shows up to 5 partners here).
  // This package flows FROM myTeam TO targetTeam, so it's searched against
  // targetTeam's needs — the package that would actually convince them, not just
  // whichever combo happens to match the sticker price.
  acquireCombos = bestCombos(myTeam.assets, asset.value, 5, Vault.positionalProfile(targetTeam, teams));
  const resultsEl = document.getElementById('finderResults');
  if (!acquireCombos.length) {
    resultsEl.innerHTML = `<div class="text-[12px] text-zinc-400 py-2">Not enough value on ${Vault.escapeHtml(myTeam.teamName)}'s roster to realistically match this.</div>`;
    return;
  }
  resultsEl.innerHTML = acquireCombos.map((combo, i) => `
    <div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/30 flex-wrap">
      <div class="min-w-0">
        <div class="text-[13px] font-medium">Package from ${Vault.escapeHtml(myTeam.teamName)}</div>
        <div class="text-[12px] text-zinc-300 mt-0.5">${combo.combo.map(a => Vault.escapeHtml(a.name)).join(' + ')} <span class="mono text-zinc-400">${Math.round(combo.sum).toLocaleString()}</span></div>
        <div class="text-[11px] text-sky-300/70 mt-1">${partnerRationale(targetTeam, combo.combo).join(' · ')}</div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="text-right">
          <div class="text-[12px] mono ${combo.pctOff < VAULT_CONFIG.FAIR_PCT ? 'text-emerald-400' : combo.pctOff < VAULT_CONFIG.LOPSIDED_PCT ? 'text-amber-400' : 'text-zinc-400'}">${capPct(combo.pctOff).toFixed(0)}% off</div>
        </div>
        <button onclick="proposeAcquire(${i})" class="text-[12px] px-3 py-1.5 rounded-lg btn-gold-solid">Propose</button>
      </div>
    </div>`).join('');
}

function proposeAcquire(i) {
  const { side, key, targetRosterId } = finderState;
  const other = otherSide(side);
  document.getElementById(`team${other}`).value = targetRosterId;
  selectedA.clear(); selectedB.clear();
  (other === 'A' ? selectedA : selectedB).add(key);

  const combo = acquireCombos[i];
  if (combo) combo.combo.forEach(a => (side === 'A' ? selectedA : selectedB).add(a.key));

  closeFinder();
  render('A'); render('B');
}

function closeFinder() {
  finderState = null;
  document.getElementById('finder').classList.add('hidden');
  document.getElementById('finderPickerRow').classList.add('hidden');
}

// League-wide value browser for a Team B row's "Match" — distinct from Find (which
// builds a specific package to acquire this exact player). Answers "who else, on
// any team, is priced like this" rather than "how do I get THIS one", useful when
// the specific player isn't gettable but the price point is what you're after.
function openSimilarAcrossLeague(side, key) {
  finderState = { side, key, mode: 'similar' };
  renderSimilarAcrossLeague();
}

function renderSimilarAcrossLeague() {
  const { side, key } = finderState;
  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  if (!asset) { closeFinder(); return; }

  document.getElementById('finder').classList.remove('hidden');
  document.getElementById('finderPickerRow').classList.add('hidden');
  document.getElementById('finderWantBackLabel').classList.add('hidden');
  document.getElementById('finderTarget').innerHTML = `${Vault.escapeHtml(asset.name)} <span class="mono text-zinc-400">${Math.round(asset.value).toLocaleString()}</span> <span class="text-zinc-400">— similar value around the league</span>`;
  document.getElementById('finderPosChips').innerHTML = '';

  const pool = teams.filter(t => t.rosterId !== team.rosterId)
    .flatMap(t => t.assets.map(a => ({ ...a, teamName: t.teamName, rosterId: t.rosterId })));
  const results = pool.filter(a => a.value > 0 && a.key !== key)
    .sort((a, b) => Math.abs(a.value - asset.value) - Math.abs(b.value - asset.value))
    .slice(0, 8);

  const resultsEl = document.getElementById('finderResults');
  if (!results.length) {
    resultsEl.innerHTML = `<div class="text-[12px] text-zinc-400 py-2">No comparable assets found elsewhere in the league.</div>`;
    return;
  }
  resultsEl.innerHTML = results.map(a => {
    const diff = a.value - asset.value;
    return `
    <div onclick="pickSimilarAsset('${a.key}',${a.rosterId})" class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/30 hover:bg-black/50 cursor-pointer flex-wrap">
      <div class="min-w-0">
        <div class="text-[13px] font-medium">${Vault.escapeHtml(a.name)} ${a.type === 'pick' ? '' : `<span class="text-[11px] text-zinc-400">${a.pos}</span>`}</div>
        <div class="text-[11px] text-zinc-400 mt-0.5">${Vault.escapeHtml(a.teamName)}</div>
      </div>
      <div class="text-right shrink-0">
        <div class="text-[13px] mono">${Math.round(a.value).toLocaleString()}</div>
        <div class="text-[11px] mono ${diff >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${diff >= 0 ? '+' : ''}${Math.round(diff).toLocaleString()}</div>
      </div>
    </div>`;
  }).join('');
}

// Picking a result switches Team B to that player's real team and drops straight
// into acquire mode for them — browsing similar value is a step toward a specific
