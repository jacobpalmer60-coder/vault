<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Calculator — The Vault</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css">
</head>
<body class="text-amber-50 antialiased">
<div class="vault-bg"></div>

<div id="vault-nav"></div>

<div class="max-w-[1400px] mx-auto p-6 lg:p-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="display text-[28px] font-semibold gold-text">Trade Calculator</h1>
      <p id="status" class="text-[13px] text-amber-200/50 mt-1">Connecting...</p>
    </div>
    <div class="flex items-center gap-2">
      <button id="finderPickerBtn" onclick="openFinderPicker()" class="hidden h-8 px-3 rounded-lg border border-sky-500/25 text-[12px] text-sky-300/80 hover:text-sky-200 hover:border-sky-500/50 hover:bg-sky-500/5 transition-colors">🔍 Find a Trade</button>
      <div class="h-8 px-3 rounded-lg bg-black/40 border border-amber-500/15 flex items-center gap-2 text-[12px] text-amber-200/50">
        <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
        Live Values
      </div>
    </div>
  </div>

  <!-- Setup checklist: pick both teams, then load rosters -->
  <div id="setup" class="min-h-[60vh] flex items-center justify-center">
    <div class="card rounded-vault-sm p-9 w-full max-w-xl fade-in">
      <h2 class="text-[20px] display gold-text mb-6 text-center">Set up a trade</h2>
      <div class="space-y-5">
        <div>
          <label class="text-[11px] text-amber-200/40 uppercase tracking-wider block mb-2">1 · Team A</label>
          <select id="teamASetup" class="w-full h-12 bg-black/40 border border-amber-500/15 rounded-xl px-4 text-[15px] outline-none focus:border-amber-500/50 focus:shadow-[0_0_0_3px_rgba(250,204,21,0.1)] transition-shadow"></select>
        </div>
        <div>
          <label class="text-[11px] text-amber-200/40 uppercase tracking-wider block mb-2">2 · Team B</label>
          <select id="teamBSetup" class="w-full h-12 bg-black/40 border border-amber-500/15 rounded-xl px-4 text-[15px] outline-none focus:border-amber-500/50 focus:shadow-[0_0_0_3px_rgba(250,204,21,0.1)] transition-shadow"></select>
        </div>
        <button id="loadRostersBtn" class="w-full btn-gold-solid h-12 text-[15px] mt-2">Load Rosters</button>
      </div>
    </div>
  </div>

  <div id="workspace" class="hidden">
  <button onclick="backToSetup()" class="mb-4 text-[12px] text-amber-200/50 hover:text-amber-200 transition-colors">← Change teams</button>

  <!-- Trade Bar -->
  <div id="tradeBar" class="hidden mb-4 p-4 rounded-2xl card">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div class="flex items-center gap-6 flex-wrap">
        <div>
          <div class="text-[11px] text-amber-200/40 uppercase tracking-wider mb-1">Team A gives</div>
          <div id="giveA" class="text-[16px] font-medium"></div>
        </div>
        <div class="text-amber-500/30">⇄</div>
        <div>
          <div class="text-[11px] text-amber-200/40 uppercase tracking-wider mb-1">Team B gives</div>
          <div id="giveB" class="text-[16px] font-medium"></div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-[11px] text-amber-200/40 uppercase tracking-wider mb-1" title="Values are adjusted for consolidation premium — a single elite asset counts for more than several mid-tier pieces summing to the same raw KTC value.">Difference <span class="text-amber-200/25">(value-adj)</span></div>
        <div id="diff" class="text-[22px] font-semibold mono"></div>
      </div>
    </div>
    <div id="gapClose" class="hidden mt-3 pt-3 border-t border-white/5"></div>
  </div>

  <!-- Trade Finder: shop one side's asset(s) against the whole league, not just the loaded opponent -->
  <div id="finder" class="hidden mb-4 p-4 rounded-2xl card">
    <div id="finderPickerRow" class="hidden flex items-center gap-3 flex-wrap mb-3 pb-3 border-b border-white/5">
      <span class="text-[11px] text-amber-200/40 uppercase tracking-wider">I am</span>
      <div id="finderSideChips" class="flex gap-1.5"></div>
      <div class="relative flex-1 min-w-[220px]">
        <input id="finderAssetSearch" type="text" autocomplete="off" placeholder="Search any player or pick, any team..."
          oninput="searchFinderAssets(this.value)" onfocus="searchFinderAssets(this.value)"
          onblur="setTimeout(() => document.getElementById('finderAssetResults').classList.add('hidden'), 150)"
          class="w-full bg-black/40 border border-amber-500/15 rounded-lg px-2.5 py-1.5 text-[13px] outline-none focus:border-amber-500/40" />
        <div id="finderAssetResults" class="hidden absolute z-20 top-full left-0 right-0 mt-1 max-h-64 overflow-y-auto rounded-lg border border-amber-500/20 bg-black scrollbar"></div>
      </div>
    </div>
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
      <div>
        <div class="text-[11px] text-amber-200/40 uppercase tracking-wider">Finding trades for</div>
        <div id="finderTarget" class="text-[16px] font-medium"></div>
      </div>
      <div class="flex items-center gap-2">
        <span id="finderWantBackLabel" class="text-[11px] text-amber-200/40 mr-1">Want back:</span>
        <div id="finderPosChips" class="flex gap-1.5"></div>
        <button onclick="closeFinder()" class="ml-2 text-[11px] px-2.5 py-1.5 rounded-lg border border-white/10 text-amber-200/50 hover:text-amber-200 hover:border-white/20">Close</button>
      </div>
    </div>
    <div id="finderResults" class="space-y-2"></div>
  </div>

  <!-- Trade-wide verdict + archetype (applies to both sides, so spans full width) -->
  <div id="analysisHeader" class="hidden mb-6">
    <h2 class="display text-[24px] gold-text mb-3">Trade Analysis</h2>
    <div id="tradeVerdict" class="card rounded-2xl p-5 mb-4"></div>
    <div id="tradeArchetype" class="card rounded-2xl p-4"></div>
  </div>

  <!-- Four-up: each roster sits next to its own analysis, so picking an asset and
       seeing its effect are side by side instead of a scroll apart. -->
  <div class="grid lg:grid-cols-[1.15fr_1fr_1fr_1.15fr] gap-4">
    <!-- Team A roster -->
    <div class="group min-w-0 lg:col-start-1 lg:row-start-1">
      <div class="mb-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 shrink-0 rounded-xl bg-gradient-to-br from-amber-400 to-yellow-600 flex items-center justify-center text-[13px] font-semibold text-black">A</div>
          <select id="teamA" class="flex-1 min-w-0 bg-transparent text-[16px] font-medium outline-none cursor-pointer hover:text-white transition-colors"></select>
        </div>
        <div class="flex items-center gap-2 mt-1.5 pl-[42px]">
          <div class="text-[12px] text-amber-200/40 mono" id="totalA"></div>
          <span id="archA" class="text-[11px] px-2 py-0.5 rounded-full border"></span>
        </div>
      </div>
      <div class="rounded-2xl card overflow-hidden">
        <div id="playersA" class="scrollbar max-h-[70vh] overflow-auto p-1"></div>
      </div>
    </div>

    <!-- Team A analysis -->
    <div id="analysisA" class="hidden min-w-0 lg:col-start-2 lg:row-start-1"></div>

    <!-- Team B analysis -->
    <div id="analysisB" class="hidden min-w-0 lg:col-start-3 lg:row-start-1"></div>

    <!-- Team B roster -->
    <div class="group min-w-0 lg:col-start-4 lg:row-start-1">
      <div class="mb-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 shrink-0 rounded-xl bg-gradient-to-br from-sky-500 to-cyan-600 flex items-center justify-center text-[13px] font-semibold text-black">B</div>
          <select id="teamB" class="flex-1 min-w-0 bg-transparent text-[16px] font-medium outline-none cursor-pointer hover:text-white transition-colors"></select>
        </div>
        <div class="flex items-center gap-2 mt-1.5 pl-[42px]">
          <div class="text-[12px] text-amber-200/40 mono" id="totalB"></div>
          <span id="archB" class="text-[11px] px-2 py-0.5 rounded-full border"></span>
        </div>
      </div>
      <div class="rounded-2xl card overflow-hidden">
        <div id="playersB" class="scrollbar max-h-[70vh] overflow-auto p-1"></div>
      </div>
    </div>

    <div id="emptyState" class="lg:col-start-2 lg:col-span-2 lg:row-start-1 text-center text-[13px] text-amber-200/30 py-8">
      Select players or picks from either side to build a trade.
    </div>
  </div>
  </div><!-- /workspace -->
</div>

<script src="vault-core.js"></script>
<script src="vault-nav.js"></script>
<script>
let teams = [], league = null, slots = [];
let selectedA = new Set();
let selectedB = new Set();

const TONE = { good: 'text-emerald-400', bad: 'text-rose-400', neutral: 'text-amber-300/80' };
const TONE_DOT = { good: 'bg-emerald-400', bad: 'bg-rose-400', neutral: 'bg-amber-400/60' };
const TIER_COLOR = { early: 'text-emerald-400', mid: 'text-amber-300', late: 'text-rose-400' };

function assetsFor(team) {
  const players = team.plist.filter(p => p.value > 0).map(p => ({ type: 'player', key: 'p_' + p.id, ...p }));
  const picks = team.picks.map(p => ({ type: 'pick', key: `k_${p.season}-${p.round}-${p.original}`, name: `${p.season} R${p.round}`, pos: 'PICK', ...p }));
  return [...players, ...picks].sort((a, b) => b.value - a.value);
}

async function init() {
  try {
    const built = await Vault.buildLeagueTeams(Vault.getLeagueId());
    league = built.league; slots = built.slots;
    teams = built.teams.map(t => ({ ...t, assets: [] }));
    teams.forEach(t => t.assets = assetsFor(t));
    teams.sort((a, b) => b.total - a.total);

    const opts = teams.map(t => `<option value="${t.rosterId}">${Vault.escapeHtml(t.teamName)}</option>`).join('');
    const selA = document.getElementById('teamA'), selB = document.getElementById('teamB');
    const setupA = document.getElementById('teamASetup'), setupB = document.getElementById('teamBSetup');
    [selA, selB, setupA, setupB].forEach(sel => sel.innerHTML = opts);
    selA.value = setupA.value = teams[0].rosterId;
    selB.value = setupB.value = teams[1]?.rosterId || teams[0].rosterId;

    selA.onchange = () => { selectedA.clear(); render('A'); };
    selB.onchange = () => { selectedB.clear(); render('B'); };

    document.getElementById('status').textContent = `${teams.length} teams • ${league.name} • ${built.isSF ? 'Superflex' : '1QB'}`;
    document.getElementById('status').className = 'text-[13px] text-emerald-400/80 mt-1';

    document.getElementById('loadRostersBtn').onclick = () => {
      selA.value = setupA.value;
      selB.value = setupB.value;
      selectedA.clear(); selectedB.clear();
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('workspace').classList.remove('hidden');
      document.getElementById('finderPickerBtn').classList.remove('hidden');
      render('A'); render('B');
    };
  } catch (e) {
    document.getElementById('status').textContent = e.message || 'Failed to load';
    document.getElementById('status').className = 'text-[13px] text-rose-400 mt-1';
    console.error(e);
  }
}

function backToSetup() {
  document.getElementById('workspace').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('finderPickerBtn').classList.add('hidden');
  closeFinder();
}

function teamOf(side) { return teams.find(t => t.rosterId == document.getElementById(`team${side}`).value); }
function otherSide(side) { return side === 'A' ? 'B' : 'A'; }

function assetRow(side, a, isSelected, extra) {
  const sub = a.type === 'pick' ? `<span class="text-[11px] font-mono ${TIER_COLOR[a.tier] || ''}">${a.tier || ''}</span>` : `<span class="text-[11px] text-amber-200/40">${a.pos}</span><span class="text-[11px] text-amber-200/30">${a.team || ''}</span>`;
  return `
    <div class="group/item ${extra || ''}">
      <div onclick="toggle('${side}','${a.key}')" class="flex items-center gap-3 px-3 py-2.5 mx-1 my-1 rounded-xl cursor-pointer transition-all ${isSelected ? 'bg-amber-500/10 ring-1 ring-amber-500/30' : 'hover:bg-white/[0.03]'}">
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2">
            <span class="text-[14px] truncate ${isSelected ? 'text-white' : 'text-amber-50/90 group-hover/item:text-white'}">${Vault.escapeHtml(a.name)}</span>
            ${sub}
          </div>
        </div>
        <div class="text-right">
          <div class="text-[13px] mono font-medium ${isSelected ? 'text-white' : 'text-amber-200/60'}">${Math.round(a.value).toLocaleString()}</div>
        </div>
        <div class="hidden group-hover/item:flex gap-1.5 shrink-0">
          <button onclick="event.stopPropagation(); matchTarget('${side}','${a.key}')" title="Build a package from the other side to match this" class="text-[11px] px-2 py-1 rounded-lg border border-amber-500/20 text-amber-300/70 hover:text-amber-200 hover:border-amber-500/40">Match</button>
          <button onclick="event.stopPropagation(); openFinder('${side}','${a.key}')" title="Shop this against every team in the league" class="text-[11px] px-2 py-1 rounded-lg border border-sky-500/20 text-sky-300/70 hover:text-sky-200 hover:border-sky-500/40">Find</button>
        </div>
        <div class="w-4 h-4 rounded-md border-2 flex items-center justify-center transition-all shrink-0 ${isSelected ? 'bg-amber-400 border-amber-400' : 'border-amber-500/20 group-hover/item:border-amber-500/40'}">
          ${isSelected ? '<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 6l2 2 4-4" stroke="black" stroke-width="2" stroke-linecap="round"/></svg>' : ''}
        </div>
      </div>
      ${isSelected ? similarRow(side, a) : ''}
    </div>`;
}

function similarRow(side, a) {
  const team = teamOf(side);
  const selected = side === 'A' ? selectedA : selectedB;
  const alts = team.assets.filter(x => x.key !== a.key && !selected.has(x.key)).sort((x, y) => Math.abs(x.value - a.value) - Math.abs(y.value - a.value)).slice(0, 3);
  if (!alts.length) return '';
  return `<div class="mx-1 mb-2 px-3 py-2 rounded-lg bg-black/30 flex items-center gap-2 flex-wrap text-[11px]">
    <span class="text-amber-200/40 uppercase tracking-wider">Similar value</span>
    ${alts.map(x => `<button onclick="event.stopPropagation(); swap('${side}','${a.key}','${x.key}')" class="px-2 py-1 rounded-lg border border-white/10 hover:border-amber-500/40 hover:text-amber-200 text-amber-100/70">${Vault.escapeHtml(x.name)} <span class="mono text-amber-200/40">${Math.round(x.value).toLocaleString()}</span></button>`).join('')}
  </div>`;
}

function render(side) {
  const team = teamOf(side);
  const selected = side === 'A' ? selectedA : selectedB;
  const container = document.getElementById(`players${side}`);
  document.getElementById(`total${side}`).textContent = `${team.assets.length} assets • ${Math.round(team.total).toLocaleString()}`;
  const archEl = document.getElementById(`arch${side}`);
  archEl.textContent = team.arch;
  archEl.className = `text-[11px] px-2 py-0.5 rounded-full border inline-block mt-1 ${team.archCls.replace(/from-\S+|to-\S+/g, '').trim()}`;

  container.innerHTML = team.assets.map(a => assetRow(side, a, selected.has(a.key))).join('');
  updateTrade();
}

function toggle(side, key) {
  const set = side === 'A' ? selectedA : selectedB;
  set.has(key) ? set.delete(key) : set.add(key);
  render(side);
}

function swap(side, outKey, inKey) {
  const set = side === 'A' ? selectedA : selectedB;
  set.delete(outKey); set.add(inKey);
  render(side);
}

/* Package builder core: pool of assets, target already in VBA-adjusted-value space.
   All combo search happens here so gap-closer, Match, and the Finder agree with the
   same fairness math the analysis panel uses — a suggested combo should still look
   fair once VBA is applied to it, not just fair by raw KTC sum. */
function comboSearchAdj(pool, targetAdj) {
  let best = null;
  const consider = combo => {
    const sumAdj = combo.reduce((s, a) => s + Vault.adjustedValue(a.value), 0);
    const diff = Math.abs(sumAdj - targetAdj);
    if (!best || diff < best.diff || (diff === best.diff && combo.length < best.combo.length)) best = { combo, diff };
  };
  pool.forEach(a => consider([a]));
  for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) consider([pool[i], pool[j]]);
  if (pool.length <= 40) for (let i = 0; i < pool.length; i++) for (let j = i + 1; j < pool.length; j++) for (let k = j + 1; k < pool.length; k++) consider([pool[i], pool[j], pool[k]]);
  return best;
}

/* Public entry point: pool + a RAW target value (a real KTC asset/gap value) —
   returns the combo whose VBA-adjusted sum is closest to the target's adjusted
   value. `sum` is the raw KTC total (for display); `pctOff` is how far off in
   adjusted-space terms, the same basis the trade bar and headline use. */
function bestCombo(pool, targetValueRaw) {
  const targetAdj = Vault.adjustedValue(targetValueRaw);
  const best = comboSearchAdj(pool, targetAdj);
  if (!best) return null;
  const sum = best.combo.reduce((s, a) => s + a.value, 0);
  return { combo: best.combo, sum, diff: best.diff, pctOff: targetAdj ? best.diff / targetAdj * 100 : 0 };
}

/* Like bestCombo, but requires the combo to include one asset matching `posFilter`
   (a position, or 'PICK' for any pick) if given — that anchor asset is picked closest
   to the target value (in adjusted space), then the remaining adjusted-value gap is
   filled from the rest of the pool. */
function anchoredCombo(pool, targetValueRaw, posFilter) {
  if (!posFilter || posFilter === 'ANY') return bestCombo(pool, targetValueRaw);
  const anchors = pool.filter(a => posFilter === 'PICK' ? a.type === 'pick' : a.pos === posFilter);
  if (!anchors.length) return null;
  const targetAdj = Vault.adjustedValue(targetValueRaw);
  const anchor = [...anchors].sort((a, b) => Math.abs(Vault.adjustedValue(a.value) - targetAdj) - Math.abs(Vault.adjustedValue(b.value) - targetAdj))[0];
  const anchorAdj = Vault.adjustedValue(anchor.value);
  const remainingAdj = targetAdj - anchorAdj;
  const fillerPool = pool.filter(a => a.key !== anchor.key);
  const filler = Math.abs(remainingAdj) > targetAdj * 0.06 ? comboSearchAdj(fillerPool, remainingAdj) : null;
  const combo = filler ? [anchor, ...filler.combo] : [anchor];
  const sum = combo.reduce((s, a) => s + a.value, 0);
  const diff = Math.abs(combo.reduce((s, a) => s + Vault.adjustedValue(a.value), 0) - targetAdj);
  return { combo, sum, diff, pctOff: targetAdj ? diff / targetAdj * 100 : 0 };
}

// Why might `partner` realistically part with `givingAssets`? Reuses the same
// positional-surplus idea as Team Analyzer's trade-partner suggestions.
function partnerRationale(partner, givingAssets) {
  const notes = [];
  const mode = teamMode(partner);
  const posGiven = [...new Set(givingAssets.filter(a => a.type === 'player').map(a => a.pos))];
  posGiven.forEach(pos => {
    const key = pos.toLowerCase();
    if (!(key in partner)) return;
    const arr = teams.map(t => t[key]).sort((a, b) => a - b);
    const pct = arr.indexOf(partner[key]) / (arr.length - 1);
    if (pct > 0.65) notes.push(`Deep at ${pos} — top-third of the league in ${pos} value`);
  });
  if (givingAssets.some(a => a.type === 'pick') && mode === 'contend') notes.push(`Contending — likely open to moving picks for immediate help`);
  if (givingAssets.some(a => a.type === 'player' && a.age >= 29) && mode === 'rebuild') notes.push(`Rebuilding — likely open to moving aging veterans`);
  if (givingAssets.some(a => a.type === 'player' && a.age < 25) && mode === 'contend' && posGiven.length) notes.push(`Contending teams sometimes cash in unproven youth for a sure thing`);
  if (!notes.length) notes.push(`Reasonable value match`);
  return notes.slice(0, 2);
}

let finderState = null;

// Entry point for the header "Find a Trade" button — no row hovered yet, so let the
// user pick which of their two loaded teams they are, then search ANY player or
// pick from ANY team in the league. Picking your own asset shops it to the league
// (same as the per-row "Find" button); picking someone else's asset switches to
// acquire mode — a package from your team to go get them.
function openFinderPicker() {
  if (!teams.length) return;
  finderState = { side: 'A', key: null, position: 'ANY' };
  document.getElementById('finder').classList.remove('hidden');
  document.getElementById('finderPickerRow').classList.remove('hidden');
  document.getElementById('finderTarget').textContent = 'Search a player or pick below';
  document.getElementById('finderWantBackLabel').classList.add('hidden');
  document.getElementById('finderPosChips').innerHTML = '';
  document.getElementById('finderResults').innerHTML = '';
  renderFinderAssetOptions();
}
function renderFinderAssetOptions() {
  document.getElementById('finderSideChips').innerHTML = ['A', 'B'].map(s =>
    `<button onclick="finderState.side='${s}'; renderFinderAssetOptions()" class="text-[11px] px-2.5 py-1 rounded-lg border ${finderState.side === s ? 'bg-amber-500/15 border-amber-500/40 text-amber-200' : 'border-white/10 text-amber-200/50 hover:text-amber-200'}">${Vault.escapeHtml(teamOf(s).teamName)}</button>`
  ).join('');
  document.getElementById('finderAssetSearch').value = '';
  document.getElementById('finderAssetResults').classList.add('hidden');
}

// Flattened, league-wide asset pool (every team's players + picks) for the search box.
function allLeagueAssets() {
  return teams.flatMap(t => t.assets.map(a => ({ ...a, rosterId: t.rosterId, ownerName: t.teamName })));
}

function searchFinderAssets(q) {
  const box = document.getElementById('finderAssetResults');
  const query = q.trim().toLowerCase();
  if (!query) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const mine = teamOf(finderState.side).rosterId;
  const results = allLeagueAssets()
    .filter(a => a.name.toLowerCase().includes(query))
    .sort((a, b) => b.value - a.value)
    .slice(0, 8);
  box.innerHTML = results.length
    ? results.map(a => `
      <div onmousedown="pickFinderAsset('${a.key}', ${a.rosterId})" class="px-3 py-2 flex items-center justify-between gap-3 cursor-pointer hover:bg-amber-500/10 text-[12px]">
        <span class="truncate">${Vault.escapeHtml(a.name)} <span class="text-amber-200/40">${a.rosterId === mine ? '(yours)' : '— ' + Vault.escapeHtml(a.ownerName)}</span></span>
        <span class="mono text-amber-200/50 shrink-0">${Math.round(a.value).toLocaleString()}</span>
      </div>`).join('')
    : `<div class="px-3 py-2 text-[12px] text-amber-200/40">No match</div>`;
  box.classList.remove('hidden');
}

function pickFinderAsset(key, rosterId) {
  document.getElementById('finderAssetSearch').value = '';
  document.getElementById('finderAssetResults').classList.add('hidden');
  const mySide = finderState.side;
  if (rosterId === teamOf(mySide).rosterId) openFinder(mySide, key);
  else openAcquireFinder(mySide, key, rosterId);
}

function openFinder(side, key) {
  finderState = { side, key, position: 'ANY' };
  renderFinder();
}

// Reverse of the shop-out finder: the picked asset belongs to someone else, so
// instead of asking who wants it, build the package it'd take from MY team to go
// get it, and stage it against that asset's real owner rather than the other
// currently-loaded side.
function openAcquireFinder(side, key, targetRosterId) {
  finderState = { side, key, position: 'ANY', mode: 'acquire', targetRosterId };
  renderAcquireFinder();
}

function renderAcquireFinder() {
  const { side, key, targetRosterId } = finderState;
  const myTeam = teamOf(side);
  const targetTeam = teams.find(t => t.rosterId === targetRosterId);
  const asset = targetTeam && targetTeam.assets.find(a => a.key === key);
  if (!asset) { closeFinder(); return; }

  document.getElementById('finderPickerRow').classList.add('hidden');
  document.getElementById('finderWantBackLabel').classList.add('hidden');
  document.getElementById('finderTarget').innerHTML = `${Vault.escapeHtml(asset.name)} <span class="mono text-amber-200/40">${Math.round(asset.value).toLocaleString()}</span> <span class="text-amber-200/40">on ${Vault.escapeHtml(targetTeam.teamName)}</span>`;
  document.getElementById('finderPosChips').innerHTML = '';

  const combo = bestCombo(myTeam.assets, asset.value);
  const resultsEl = document.getElementById('finderResults');
  if (!combo) {
    resultsEl.innerHTML = `<div class="text-[12px] text-amber-200/40 py-2">Not enough value on ${Vault.escapeHtml(myTeam.teamName)}'s roster to realistically match this.</div>`;
    return;
  }
  resultsEl.innerHTML = `
    <div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/30 flex-wrap">
      <div class="min-w-0">
        <div class="text-[13px] font-medium">Package from ${Vault.escapeHtml(myTeam.teamName)}</div>
        <div class="text-[12px] text-amber-100/70 mt-0.5">${combo.combo.map(a => Vault.escapeHtml(a.name)).join(' + ')} <span class="mono text-amber-200/40">${Math.round(combo.sum).toLocaleString()}</span></div>
        <div class="text-[11px] text-sky-300/70 mt-1">${partnerRationale(targetTeam, combo.combo).join(' · ')}</div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="text-right">
          <div class="text-[12px] mono ${combo.pctOff < 6 ? 'text-emerald-400' : combo.pctOff < 15 ? 'text-amber-400' : 'text-amber-200/50'}">${combo.pctOff.toFixed(0)}% off</div>
        </div>
        <button onclick="proposeAcquire()" class="text-[12px] px-3 py-1.5 rounded-lg btn-gold-solid">Propose</button>
      </div>
    </div>`;
}

function proposeAcquire() {
  const { side, key, targetRosterId } = finderState;
  const other = otherSide(side);
  document.getElementById(`team${other}`).value = targetRosterId;
  selectedA.clear(); selectedB.clear();
  (other === 'A' ? selectedA : selectedB).add(key);

  const myTeam = teamOf(side);
  const targetTeam = teamOf(other);
  const asset = targetTeam.assets.find(a => a.key === key);
  const combo = bestCombo(myTeam.assets, asset.value);
  if (combo) combo.combo.forEach(a => (side === 'A' ? selectedA : selectedB).add(a.key));

  closeFinder();
  render('A'); render('B');
}

function closeFinder() {
  finderState = null;
  document.getElementById('finder').classList.add('hidden');
  document.getElementById('finderPickerRow').classList.add('hidden');
}

function renderFinder() {
  if (!finderState) return;
  const { side, key, position } = finderState;
  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  if (!asset) { closeFinder(); return; }

  const box = document.getElementById('finder');
  box.classList.remove('hidden');
  document.getElementById('finderPickerRow').classList.add('hidden');
  document.getElementById('finderWantBackLabel').classList.remove('hidden');
  document.getElementById('finderTarget').innerHTML = `${Vault.escapeHtml(asset.name)} <span class="mono text-amber-200/40">${Math.round(asset.value).toLocaleString()}</span> <span class="text-amber-200/40">from ${Vault.escapeHtml(team.teamName)}</span>`;

  const positions = ['ANY', 'QB', 'RB', 'WR', 'TE', 'PICK'];
  document.getElementById('finderPosChips').innerHTML = positions.map(p =>
    `<button onclick="finderState.position='${p}'; renderFinder()" class="text-[11px] px-2.5 py-1 rounded-lg border ${position === p ? 'bg-amber-500/15 border-amber-500/40 text-amber-200' : 'border-white/10 text-amber-200/50 hover:text-amber-200'}">${p}</button>`
  ).join('');

  const partners = teams.filter(t => t.rosterId !== team.rosterId);
  const results = partners.map(partner => {
    const combo = anchoredCombo(partner.assets, asset.value, position);
    if (!combo) return null;
    return { partner, combo, pctOff: combo.pctOff, rationale: partnerRationale(partner, combo.combo) };
  }).filter(Boolean).sort((a, b) => a.pctOff - b.pctOff).slice(0, 5);

  const resultsEl = document.getElementById('finderResults');
  if (!results.length) {
    resultsEl.innerHTML = `<div class="text-[12px] text-amber-200/40 py-2">No team has a ${position} package close to this value.</div>`;
    return;
  }
  resultsEl.innerHTML = results.map(r => `
    <div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/30 flex-wrap">
      <div class="min-w-0">
        <div class="text-[13px] font-medium">${Vault.escapeHtml(r.partner.teamName)} <span class="text-[11px] text-amber-200/40">(${r.partner.arch})</span></div>
        <div class="text-[12px] text-amber-100/70 mt-0.5">${r.combo.combo.map(a => Vault.escapeHtml(a.name)).join(' + ')} <span class="mono text-amber-200/40">${Math.round(r.combo.sum).toLocaleString()}</span></div>
        <div class="text-[11px] text-sky-300/70 mt-1">${r.rationale.join(' · ')}</div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="text-right">
          <div class="text-[12px] mono ${r.pctOff < 6 ? 'text-emerald-400' : r.pctOff < 15 ? 'text-amber-400' : 'text-amber-200/50'}">${r.pctOff.toFixed(0)}% off</div>
        </div>
        <button onclick="proposeFromFinder('${r.partner.rosterId}')" class="text-[12px] px-3 py-1.5 rounded-lg btn-gold-solid">Propose</button>
      </div>
    </div>`).join('');
}

function proposeFromFinder(partnerId) {
  const { side, key } = finderState;
  const other = otherSide(side);
  document.getElementById(`team${other}`).value = partnerId;
  selectedA.clear(); selectedB.clear();
  (side === 'A' ? selectedA : selectedB).add(key);

  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  const partner = teamOf(other);
  const combo = anchoredCombo(partner.assets, asset.value, finderState.position);
  if (combo) combo.combo.forEach(a => (other === 'A' ? selectedA : selectedB).add(a.key));

  closeFinder();
  render('A'); render('B');
}

// Target-matcher: select `key` on `side`, then auto-build a matching package from the other side
function matchTarget(side, key) {
  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  if (!asset) return;
  const selSide = side === 'A' ? selectedA : selectedB;
  selSide.add(key);

  const other = otherSide(side);
  const otherTeam = teamOf(other);
  const otherSel = other === 'A' ? selectedA : selectedB;
  const pool = otherTeam.assets.filter(a => !otherSel.has(a.key));
  const combo = bestCombo(pool, asset.value);
  if (combo) combo.combo.forEach(a => otherSel.add(a.key));

  render('A'); render('B');
}

function fmtSigned(n) { return (n >= 0 ? '+' : '') + Math.round(n).toLocaleString(); }

function updateTrade() {
  const teamA = teamOf('A'), teamB = teamOf('B');
  const aAssets = [...selectedA].map(k => teamA.assets.find(x => x.key === k)).filter(Boolean);
  const bAssets = [...selectedB].map(k => teamB.assets.find(x => x.key === k)).filter(Boolean);
  const aVal = aAssets.reduce((s, a) => s + a.value, 0);
  const bVal = bAssets.reduce((s, a) => s + a.value, 0);
  // Fairness is judged in VBA-adjusted space throughout (see Vault.adjustedValue) —
  // raw sums above are for the line-item display only.
  const aValAdj = aAssets.reduce((s, a) => s + Vault.adjustedValue(a.value), 0);
  const bValAdj = bAssets.reduce((s, a) => s + Vault.adjustedValue(a.value), 0);

  const bar = document.getElementById('tradeBar');
  const empty = document.getElementById('emptyState');
  const header = document.getElementById('analysisHeader');

  if (!aAssets.length && !bAssets.length) {
    bar.classList.add('hidden');
    header.classList.add('hidden');
    document.getElementById('analysisA').classList.add('hidden');
    document.getElementById('analysisB').classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  bar.classList.remove('hidden');

  document.getElementById('giveA').innerHTML = aAssets.length
    ? aAssets.map(a => `<span class="inline-flex items-center gap-1.5 mr-3"><span>${Vault.escapeHtml(a.name)}</span><span class="text-amber-200/40 text-[13px] mono">${Math.round(a.value).toLocaleString()}</span></span>`).join('')
    : '<span class="text-amber-200/30">Nothing selected</span>';
  document.getElementById('giveB').innerHTML = bAssets.length
    ? bAssets.map(a => `<span class="inline-flex items-center gap-1.5 mr-3"><span>${Vault.escapeHtml(a.name)}</span><span class="text-amber-200/40 text-[13px] mono">${Math.round(a.value).toLocaleString()}</span></span>`).join('')
    : '<span class="text-amber-200/30">Nothing selected</span>';

  const diffAdj = Math.abs(aValAdj - bValAdj);
  const avgSideAdj = (aValAdj + bValAdj) / 2 || 1;
  const pctDiff = diffAdj / avgSideAdj * 100;
  const diffEl = document.getElementById('diff');
  diffEl.textContent = Math.round(diffAdj).toLocaleString();
  diffEl.className = 'text-[22px] font-semibold mono ' + (pctDiff < 6 ? 'text-emerald-400' : pctDiff < 15 ? 'text-amber-400' : 'text-amber-200/50');

  // Gap-closer suggestion
  const gapBox = document.getElementById('gapClose');
  if (pctDiff > 8 && (aAssets.length || bAssets.length)) {
    const behindSide = aValAdj < bValAdj ? 'A' : 'B';
    const behindTeam = teamOf(behindSide);
    const behindSel = behindSide === 'A' ? selectedA : selectedB;
    const neededAdj = Math.abs(aValAdj - bValAdj);
    const pool = behindTeam.assets.filter(a => !behindSel.has(a.key));
    const best = comboSearchAdj(pool, neededAdj);
    const combo = best ? { combo: best.combo, sum: best.combo.reduce((s, a) => s + a.value, 0) } : null;
    if (combo) {
      gapBox.classList.remove('hidden');
      gapBox.innerHTML = `<div class="text-[11px] text-amber-200/40 uppercase tracking-wider mb-2">Team ${behindSide} is behind by ${Math.round(neededAdj).toLocaleString()} (value-adjusted) — close the gap</div>
        <div class="flex flex-wrap gap-2">${combo.combo.map(a => `<button onclick="toggle('${behindSide}','${a.key}')" class="px-2.5 py-1.5 rounded-lg border border-amber-500/20 hover:border-amber-500/50 hover:text-amber-200 text-[12px] text-amber-100/80">+ ${Vault.escapeHtml(a.name)} <span class="mono text-amber-200/40">${Math.round(a.value).toLocaleString()}</span></button>`).join('')}</div>`;
    } else gapBox.classList.add('hidden');
  } else gapBox.classList.add('hidden');

  renderAnalysis(teamA, teamB, aAssets, bAssets, aValAdj, bValAdj);
}

function teamMode(t) {
  if (t.ppgP >= 60) return 'contend';
  if (t.valP <= 40 && t.ppgP <= 40) return 'rebuild';
  return 'flexible';
}
const MODE_LABEL = { contend: 'Contending', rebuild: 'Rebuilding', flexible: 'Flexible timeline' };

function analyzeSide(before, after) {
  const mode = teamMode(before);
  const dAge = after.age - before.age;
  const dPicks = after.picksValue - before.picksValue;
  const dOpt = after.opt - before.opt;
  const dValue = after.total - before.total;
  const dArchScore = after.archScore - before.archScore;
  const notes = [];
  let fit = 0;

  if (mode === 'rebuild') {
    if (dAge > 0.4) { notes.push({ tone: 'bad', text: `Gets ${dAge.toFixed(1)} yrs older while rebuilding — wrong direction for your timeline.` }); fit -= 2; }
    else if (dAge < -0.4) { notes.push({ tone: 'good', text: `Gets ${Math.abs(dAge).toFixed(1)} yrs younger — on-plan for a rebuild.` }); fit += 1; }
    if (dPicks < -1500) { notes.push({ tone: 'bad', text: `Trades away ${Math.round(Math.abs(dPicks)).toLocaleString()} in draft capital — contradicts a rebuild.` }); fit -= 2; }
    else if (dPicks > 1500) { notes.push({ tone: 'good', text: `Adds ${Math.round(dPicks).toLocaleString()} in draft capital — on-plan for a rebuild.` }); fit += 2; }
    if (dOpt > 5) notes.push({ tone: 'neutral', text: `Raises optimal PPG by ${dOpt.toFixed(1)}, but current-season points aren't the priority right now.` });
  } else if (mode === 'contend') {
    if (dAge > 1.5) notes.push({ tone: 'neutral', text: `Adds ${dAge.toFixed(1)} yrs of age — tolerable for a win-now roster, but watch the cliff.` });
    else if (dAge < -0.4) { notes.push({ tone: 'good', text: `Gets younger without giving up contention.` }); fit += 1; }
    if (dPicks < -1500) { notes.push({ tone: 'good', text: `Spends ${Math.round(Math.abs(dPicks)).toLocaleString()} in future picks to win now — the right move for a contender if those picks weren't needed.` }); fit += 1; }
    else if (dPicks > 1500) notes.push({ tone: 'neutral', text: `Banks ${Math.round(dPicks).toLocaleString()} in picks — fine, but a contender should usually prioritize immediate roster strength.` });
    if (dOpt > 3) { notes.push({ tone: 'good', text: `Raises optimal lineup PPG by ${dOpt.toFixed(1)} — a real scoring upgrade right now.` }); fit += 2; }
    else if (dOpt < -3) { notes.push({ tone: 'bad', text: `Drops optimal PPG by ${Math.abs(dOpt).toFixed(1)} — hurts scoring while you're trying to win.` }); fit -= 2; }
  } else {
    if (dOpt > 3) { notes.push({ tone: 'good', text: `Raises optimal lineup PPG by ${dOpt.toFixed(1)}.` }); fit += 1; }
    else if (dOpt < -3) { notes.push({ tone: 'bad', text: `Drops optimal lineup PPG by ${Math.abs(dOpt).toFixed(1)}.` }); fit -= 1; }
    if (Math.abs(dPicks) > 1500) notes.push({ tone: 'neutral', text: `${dPicks > 0 ? 'Adds' : 'Spends'} ${Math.round(Math.abs(dPicks)).toLocaleString()} in draft capital.` });
    if (Math.abs(dAge) > 0.5) notes.push({ tone: 'neutral', text: `${dAge > 0 ? 'Gets older' : 'Gets younger'} by ${Math.abs(dAge).toFixed(1)} yrs.` });
  }

  notes.push({ tone: dArchScore > 5 ? 'good' : dArchScore < -5 ? 'bad' : 'neutral', text: `Archetype: ${before.arch} → ${after.arch}`, isArchetype: true });

  return { mode, dAge, dPicks, dOpt, dValue, dArchScore, fit, notes };
}

function headline(dValue, avgSide, fit) {
  const pct = avgSide ? dValue / avgSide * 100 : 0;
  const fair = Math.abs(pct) < 6;
  if (pct <= -40) return { tone: 'bad', text: `Well below value (${pct.toFixed(0)}%)${fit >= 2 ? ' — good timeline fit, but not enough to cover a discount this big' : ''}` };
  if (fair && fit >= 2) return { tone: 'good', text: 'Fair value, strong fit — good trade' };
  if (fair && fit <= -2) return { tone: 'bad', text: 'Fair by value, bad fit for your timeline' };
  if (fair) return { tone: 'neutral', text: 'Fair value, neutral fit' };
  if (pct >= 6 && fit >= 0) return { tone: 'good', text: `Ahead on value (+${pct.toFixed(0)}%) and fits your timeline` };
  if (pct >= 6) return { tone: 'neutral', text: `Ahead on value (+${pct.toFixed(0)}%), but questionable fit` };
  if (fit >= 2) return { tone: 'neutral', text: `Behind on value (${pct.toFixed(0)}%), but strong timeline fit` };
  return { tone: 'bad', text: `Behind on value (${pct.toFixed(0)}%) and a poor fit` };
}

// Checks whether the specific assets moving into/out of a team's roster address or
// worsen a real positional imbalance — using the team's PRE-trade percentile profile
// against the full league (`teams`), not the post-trade pool, since the question is
// "were they already deep/thin here" rather than a moving target. A value-matched
// trade shouldn't read as good if it just piles more value onto a surplus position.
function positionalFitNotes(team, allTeams, incoming, outgoing) {
  const { needs, surpluses } = Vault.positionalProfile(team, allTeams);
  const posValue = (list, pos) => list.filter(a => a.pos === pos).reduce((s, a) => s + a.value, 0);
  const notes = [];
  let posFit = 0;

  ['QB', 'RB', 'WR', 'TE'].forEach(POS => {
    const k = POS.toLowerCase();
    const inVal = posValue(incoming, POS);
    const outVal = posValue(outgoing, POS);
    if (inVal > 0) {
      if (surpluses.includes(k)) { posFit -= 2; notes.push({ tone: 'bad', text: `Adds ${Math.round(inVal).toLocaleString()} more ${POS} value to a room that's already deep — doesn't address a real need.` }); }
      else if (needs.includes(k)) { posFit += 2; notes.push({ tone: 'good', text: `Adds ${Math.round(inVal).toLocaleString()} at ${POS}, a genuine roster need.` }); }
    }
    if (outVal > 0) {
      if (surpluses.includes(k)) { posFit += 1; notes.push({ tone: 'good', text: `Deals from ${POS} surplus — value that was sitting on the bench anyway.` }); }
      else if (needs.includes(k)) { posFit -= 1; notes.push({ tone: 'bad', text: `Gives up ${POS} value at a position you're already thin.` }); }
    }
  });
  return { posFit, notes };
}

// Compares pre- and post-trade contention windows so a trade that opens, widens,
// narrows, or closes a team's window gets credit/blame beyond the raw value swing.
function windowShiftNote(befWin, aftWin) {
  if (!befWin.hasWindow && aftWin.hasWindow) return { fit: 2, note: { tone: 'good', text: `Opens a contention window (${aftWin.windowStart}-${aftWin.windowEnd}) that didn't exist before.` } };
  if (befWin.hasWindow && !aftWin.hasWindow) return { fit: -2, note: { tone: 'bad', text: `Closes what was a ${befWin.windowStart}-${befWin.windowEnd} contention window.` } };
  if (befWin.hasWindow && aftWin.hasWindow) {
    const widened = (aftWin.windowEnd - aftWin.windowStart) - (befWin.windowEnd - befWin.windowStart);
    if (widened > 0) return { fit: 1, note: { tone: 'good', text: `Widens the contention window (${befWin.windowStart}-${befWin.windowEnd} → ${aftWin.windowStart}-${aftWin.windowEnd}).` } };
    if (widened < 0) return { fit: -1, note: { tone: 'bad', text: `Narrows the contention window (${befWin.windowStart}-${befWin.windowEnd} → ${aftWin.windowStart}-${aftWin.windowEnd}).` } };
  }
  return { fit: 0, note: null };
}

// Synthesizes value fairness + timeline/production fit + positional need + window
// shift (all already folded into each side's `fit` score and headline) into one
// top-level grade for the trade as a whole — the "now that's a good trade" call.
function overallVerdict(resA, resB, headA, headB) {
  const scoreA = resA.fit + (headA.tone === 'good' ? 1 : headA.tone === 'bad' ? -1 : 0);
  const scoreB = resB.fit + (headB.tone === 'good' ? 1 : headB.tone === 'bad' ? -1 : 0);
  const good = s => s >= 3, bad = s => s <= -2;

  if (good(scoreA) && good(scoreB)) return { tone: 'good', label: 'Now That’s a Good Trade', text: 'Both sides come out ahead on value, timeline, and roster fit — a genuine win-win.' };
  if (bad(scoreA) && bad(scoreB)) return { tone: 'bad', label: 'Bad Trade for Both Sides', text: 'Neither team actually improves here — value, timeline, and roster need all point the wrong way for both.' };
  if (good(scoreA) && bad(scoreB)) return { tone: 'bad', label: 'Lopsided — Favors Team A', text: 'Team A checks the boxes on value, timeline, and need; Team B is giving up more than it gets back.' };
  if (good(scoreB) && bad(scoreA)) return { tone: 'bad', label: 'Lopsided — Favors Team B', text: 'Team B checks the boxes on value, timeline, and need; Team A is giving up more than it gets back.' };
  if (good(scoreA) || good(scoreB)) return { tone: 'neutral', label: 'Solid for One Side, Fine for the Other', text: 'One team clearly benefits; the other isn’t hurt, just doesn’t gain as much on value, timeline, or need.' };
  return { tone: 'neutral', label: 'Fair, But Unremarkable', text: 'Roughly even on value and fit for both sides — not a bad trade, just not a standout one either.' };
}

// Labels the trade itself — not either team's fit, but what kind of transaction this is.
function classifyTrade(resA, resB, aAssets, bAssets) {
  const aSellsProd = resA.dOpt < -3 && resA.dPicks > 500;
  const bSellsProd = resB.dOpt < -3 && resB.dPicks > 500;
  const aBuysProd = resA.dOpt > 3 && resA.dPicks < -500;
  const bBuysProd = resB.dOpt > 3 && resB.dPicks < -500;

  let label, desc;
  if (resA.mode === 'rebuild' && resB.mode === 'contend' && aSellsProd && bBuysProd) {
    label = 'Rebuild-for-Contender Swap';
    desc = `Team A cashes in current production for draft capital while Team B spends picks to win now — a textbook timeline-matched trade.`;
  } else if (resB.mode === 'rebuild' && resA.mode === 'contend' && bSellsProd && aBuysProd) {
    label = 'Rebuild-for-Contender Swap';
    desc = `Team B cashes in current production for draft capital while Team A spends picks to win now — a textbook timeline-matched trade.`;
  } else if (resA.mode === 'rebuild' && aBuysProd) {
    label = 'Off-Plan Buy — Team A';
    desc = `Team A is rebuilding but is buying current production at the cost of picks or youth — worth double-checking this actually fits the plan.`;
  } else if (resB.mode === 'rebuild' && bBuysProd) {
    label = 'Off-Plan Buy — Team B';
    desc = `Team B is rebuilding but is buying current production at the cost of picks or youth — worth double-checking this actually fits the plan.`;
  } else if (resA.mode === 'contend' && resB.mode === 'contend') {
    label = 'Win-Now Swap';
    desc = `Both teams are contending — this reads as two playoff teams addressing complementary roster needs, not a timeline shift.`;
  } else if (resA.mode === 'rebuild' && resB.mode === 'rebuild') {
    label = 'Rebuild Shuffle';
    desc = `Both teams are rebuilding — this is about sorting picks and youth to each side's preference, not changing either team's outlook.`;
  } else {
    label = 'Value Trade';
    desc = `No clear timeline mismatch between the two sides — this reads as a roster-fit trade rather than a buy or a sell.`;
  }

  if (aAssets.length >= bAssets.length + 2) desc += ` Team A is also consolidating — ${aAssets.length} pieces down to ${bAssets.length} bigger ones from Team B.`;
  else if (bAssets.length >= aAssets.length + 2) desc += ` Team B is also consolidating — ${bAssets.length} pieces down to ${aAssets.length} bigger ones from Team A.`;

  return { label, desc };
}

function renderAnalysis(teamA, teamB, aAssets, bAssets, aValAdj, bValAdj) {
  const header = document.getElementById('analysisHeader');
  if (!aAssets.length && !bAssets.length) {
    header.classList.add('hidden');
    document.getElementById('analysisA').classList.add('hidden');
    document.getElementById('analysisB').classList.add('hidden');
    return;
  }
  header.classList.remove('hidden');
  document.getElementById('analysisA').classList.remove('hidden');
  document.getElementById('analysisB').classList.remove('hidden');

  const giveA = aAssets.map(a => ({ type: a.type, id: a.id, value: a.value, pos: a.pos, age: a.age, name: a.name, ppg: a.ppg, season: a.season, round: a.round, original: a.original, tier: a.tier }));
  const giveB = bAssets.map(a => ({ type: a.type, id: a.id, value: a.value, pos: a.pos, age: a.age, name: a.name, ppg: a.ppg, season: a.season, round: a.round, original: a.original, tier: a.tier }));

  const { before, after, pool } = Vault.simulateTrade(teams, slots, teamA.rosterId, teamB.rosterId, giveA, giveB);
  const avgSideAdj = (aValAdj + bValAdj) / 2 || 1;
  // Value delta in VBA-adjusted terms — same basis as the trade bar, not raw KTC sum.
  const dValueAdjA = bValAdj - aValAdj;
  const dValueAdjB = aValAdj - bValAdj;

  const resA = analyzeSide(before.A, after.A);
  const resB = analyzeSide(before.B, after.B);
  const trade = classifyTrade(resA, resB, aAssets, bAssets);
  document.getElementById('tradeArchetype').innerHTML = `
    <div class="text-[11px] text-amber-200/40 uppercase tracking-wider mb-1">Trade Archetype</div>
    <div class="text-[16px] font-medium gold-text mb-1">${trade.label}</div>
    <div class="text-[13px] text-amber-100/70">${trade.desc}</div>`;

  const heads = {};
  [['A', before.A, after.A, resA, dValueAdjA, bAssets, aAssets], ['B', before.B, after.B, resB, dValueAdjB, aAssets, bAssets]].forEach(([side, bef, aft, res, dValueAdj, incoming, outgoing]) => {
    // Positional need/surplus fit for the specific assets moving this direction —
    // judged against the team's roster BEFORE the trade, not the shifting post-trade pool.
    const posResult = positionalFitNotes(bef, teams, incoming, outgoing);
    res.fit += posResult.posFit;

    const befWin = Vault.contentionWindow(bef, teams);
    const win = Vault.contentionWindow(aft, pool);
    const shift = windowShiftNote(befWin, win);
    res.fit += shift.fit;

    res.notes = [...posResult.notes, ...(shift.note ? [shift.note] : []), ...res.notes];

    const head = headline(dValueAdj, avgSideAdj, res.fit);
    heads[side] = head;
    document.getElementById(`analysis${side}`).innerHTML = `
      <div class="card rounded-vault-sm p-4 min-w-0">
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="min-w-0">
            <div class="text-[11px] text-amber-200/40 uppercase tracking-wider truncate">Team ${side} · ${Vault.escapeHtml(bef.teamName)}</div>
            <div class="text-[11px] mt-0.5 ${TONE.neutral}">${MODE_LABEL[res.mode]}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-[13px] font-mono ${dValueAdj >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fmtSigned(dValueAdj)}</div>
            <div class="text-[11px] text-amber-200/40">value Δ (adj)</div>
          </div>
        </div>
        <div class="flex items-center gap-2 mb-4">
          <span class="size-2 rounded-full shrink-0 ${TONE_DOT[head.tone]}"></span>
          <span class="text-[14px] font-medium ${TONE[head.tone]}">${head.text}</span>
        </div>
        <div class="space-y-2 mb-4">
          ${res.notes.map(n => `<div class="flex gap-2 text-[12px] ${n.isArchetype ? 'pt-2 border-t border-white/5 mt-2' : ''}"><span class="mt-1 size-1.5 rounded-full shrink-0 ${TONE_DOT[n.tone]}"></span><span class="${TONE[n.tone]}">${n.text}</span></div>`).join('')}
        </div>
        <div class="grid grid-cols-3 gap-1 text-center pt-3 border-t border-white/5">
          <div><div class="text-[14px] font-mono">${aft.age.toFixed(1)}</div><div class="text-[11px] text-amber-200/40">Age</div></div>
          <div><div class="text-[14px] font-mono">${aft.opt.toFixed(1)}</div><div class="text-[11px] text-amber-200/40">Opt PPG</div></div>
          <div><div class="text-[14px] font-mono">${win.hasWindow ? win.windowStart + '-' + win.windowEnd : 'None'}</div><div class="text-[11px] text-amber-200/40">Window</div></div>
        </div>
      </div>`;
  });

  const verdict = overallVerdict(resA, resB, heads.A, heads.B);
  document.getElementById('tradeVerdict').innerHTML = `
    <div class="flex items-center gap-2 mb-1.5">
      <span class="size-2.5 rounded-full ${TONE_DOT[verdict.tone]}"></span>
      <div class="text-[19px] font-semibold ${TONE[verdict.tone]}">${verdict.label}</div>
    </div>
    <div class="text-[13px] text-amber-100/70">${verdict.text}</div>`;
}

init();
</script>
</body>
</html>
