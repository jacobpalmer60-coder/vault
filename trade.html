// target, not a dead end.
function pickSimilarAsset(key, rosterId) {
  document.getElementById('teamB').value = rosterId;
  document.getElementById('teamB').dispatchEvent(new Event('change'));
  openAcquireFinder('A', key, rosterId);
}

function renderFinder() {
  if (!finderState) return;
  const { side, key, position } = finderState;
  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  if (!asset) { closeFinder(); return; }

  const box = document.getElementById('finder');
  box.classList.remove('hidden');
  document.getElementById('finderPickerRow').classList.add('hidden');
  document.getElementById('finderWantBackLabel').classList.remove('hidden');
  document.getElementById('finderTarget').innerHTML = `${Vault.escapeHtml(asset.name)} <span class="mono text-zinc-400">${Math.round(asset.value).toLocaleString()}</span> <span class="text-zinc-400">from ${Vault.escapeHtml(team.teamName)}</span>`;

  const positions = ['ANY', 'QB', 'RB', 'WR', 'TE', 'PICK'];
  document.getElementById('finderPosChips').innerHTML = positions.map(p =>
    `<button onclick="finderState.position='${p}'; renderFinder()" class="text-[11px] px-2.5 py-1 rounded-lg border ${position === p ? 'bg-amber-500/15 border-amber-500/40 text-zinc-300' : 'border-white/10 text-zinc-400 hover:text-white'}">${p}</button>`
  ).join('');

  const partners = teams.filter(t => t.rosterId !== team.rosterId);
  // Every partner's return would flow to `team` (whoever's shopping `asset` out),
  // so the anchor's need-fit is judged against `team`'s own needs, computed once
  // for every partner. buildBalancedOffer can still ask `team` to sweeten its own
  // side (see its own comment) — that's judged against each partner's needs
  // instead, computed per-partner below.
  const teamProfile = Vault.positionalProfile(team, teams);
  const results = partners.map(partner => {
    const partnerProfile = Vault.positionalProfile(partner, teams);
    const offer = buildBalancedOffer(team.assets, partner.assets, asset, position, teamProfile, partnerProfile);
    if (!offer) return null;
    return { partner, offer, pctOff: offer.pctOff, rationale: partnerRationale(partner, offer.theirs) };
  }).filter(Boolean).sort((a, b) => a.pctOff - b.pctOff).slice(0, 5);

  const resultsEl = document.getElementById('finderResults');
  if (!results.length) {
    resultsEl.innerHTML = `<div class="text-[12px] text-zinc-400 py-2">No team has a ${position} package close to this value.</div>`;
    return;
  }
  resultsEl.innerHTML = results.map(r => {
    const sum = r.offer.theirs.reduce((s, a) => s + a.value, 0);
    const extraOurs = r.offer.ours.filter(a => a.key !== key);
    return `
    <div class="flex items-center justify-between gap-4 p-3 rounded-xl bg-black/30 flex-wrap">
      <div class="min-w-0">
        <div class="text-[13px] font-medium">${Vault.escapeHtml(r.partner.teamName)} <span class="text-[11px] text-zinc-400">(${r.partner.arch})</span></div>
        <div class="text-[12px] text-zinc-300 mt-0.5">${r.offer.theirs.map(a => Vault.escapeHtml(a.name)).join(' + ')} <span class="mono text-zinc-400">${Math.round(sum).toLocaleString()}</span></div>
        ${extraOurs.length ? `<div class="text-[11px] text-amber-300/70 mt-1">You'd also send: ${extraOurs.map(a => Vault.escapeHtml(a.name)).join(' + ')}</div>` : ''}
        <div class="text-[11px] text-sky-300/70 mt-1">${r.rationale.join(' · ')}</div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="text-right">
          <div class="text-[12px] mono ${r.pctOff < VAULT_CONFIG.FAIR_PCT ? 'text-emerald-400' : r.pctOff < VAULT_CONFIG.LOPSIDED_PCT ? 'text-amber-400' : 'text-zinc-400'}">${capPct(r.pctOff).toFixed(0)}% off</div>
        </div>
        <button onclick="proposeFromFinder('${r.partner.rosterId}')" class="text-[12px] px-3 py-1.5 rounded-lg btn-gold-solid">Propose</button>
      </div>
    </div>`;
  }).join('');
}

function proposeFromFinder(partnerId) {
  const { side, key } = finderState;
  const other = otherSide(side);
  document.getElementById(`team${other}`).value = partnerId;
  selectedA.clear(); selectedB.clear();
  (side === 'A' ? selectedA : selectedB).add(key);

  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  const partner = teamOf(other);
  const offer = buildBalancedOffer(team.assets, partner.assets, asset, finderState.position, Vault.positionalProfile(team, teams), Vault.positionalProfile(partner, teams));
  if (offer) {
    offer.theirs.forEach(a => (other === 'A' ? selectedA : selectedB).add(a.key));
    offer.ours.forEach(a => (side === 'A' ? selectedA : selectedB).add(a.key));
  }

  closeFinder();
  render('A'); render('B');
}

// Target-matcher: select `key` on `side`, then auto-build a matching package from the other side
function matchTarget(side, key) {
  const team = teamOf(side);
  const asset = team.assets.find(a => a.key === key);
  if (!asset) return;
  const selSide = side === 'A' ? selectedA : selectedB;
  selSide.add(key);

  const other = otherSide(side);
  const otherTeam = teamOf(other);
  const otherSel = other === 'A' ? selectedA : selectedB;
  const preExistingOtherKeys = new Set(otherSel);
  const pool = otherTeam.assets.filter(a => !otherSel.has(a.key));
  // This package flows FROM otherTeam TO `team`, so it's searched against team's needs.
  const combo = bestCombo(pool, asset.value, Vault.positionalProfile(team, teams));
  if (combo) {
    let picked = combo.combo;
    // Local refinement pass — bestCombo (via bestFit/comboSearchAdj) ranks
    // candidates with the same cheap VBA-based proxy comboSearchTopN uses (see
    // balanceSide's own comment for the full reasoning), which can leave the
    // actual best combo out of consideration entirely, not just rank it low: a
    // real case (Ja'Marr Chase anchored against Puka Nacua + a 2027 1st) came
    // back 17% off from this function alone, when a same-pool swap gets it to
    // 1%. Real two-sided pctDiff (Vault.tradeSideValues), not the cheap proxy,
    // scores every swap here — cheap enough to brute-force since it skips the
    // full fit analysis balanceSide's own refinement needs. Never touches
    // whatever was already selected on the other side before this call.
    const evalOtherCombo = testCombo => {
      const otherKeys = new Set([...preExistingOtherKeys, ...testCombo.map(a => a.key)]);
      const aKeys = otherSel === selectedA ? otherKeys : selectedA;
      const bKeys = otherSel === selectedB ? otherKeys : selectedB;
      const aAssets = [...aKeys].map(k => teamOf('A').assets.find(x => x.key === k)).filter(Boolean);
      const bAssets = [...bKeys].map(k => teamOf('B').assets.find(x => x.key === k)).filter(Boolean);
      const { valueA, valueB } = Vault.tradeSideValues(aAssets, bAssets);
      const avg = (valueA + valueB) / 2 || 1;
      return Math.abs(valueA - valueB) / avg * 100;
    };
    for (let pass = 0; pass < 2; pass++) {
      let swapped = false;
      const currentPct = evalOtherCombo(picked);
      let bestPct = currentPct;
      for (let i = 0; i < picked.length; i++) {
        for (const candidate of pool) {
          if (picked.some(a => a.key === candidate.key)) continue; // already in this combo
          const trial = picked.map((a, idx) => idx === i ? candidate : a);
          const pct = evalOtherCombo(trial);
          if (pct < bestPct) { bestPct = pct; picked = trial; swapped = true; }
        }
      }
      if (!swapped) break;
    }
    picked.forEach(a => otherSel.add(a.key));
  }

  render('A'); render('B');
}

function fmtSigned(n) { return (n >= 0 ? '+' : '') + Math.round(n).toLocaleString(); }

function fairnessBucket(pct, fitA, fitB) {
  return Vault.fairnessBucket(pct, fitA, fitB);
}

// Great/Good each get their own hue (violet/blue) rather than shades of Fair's
// green — each is a genuinely different claim ("fair value AND strong fit", not
// "extra-fair"), and a color family switch reads that distinction faster than a
// brightness step would. `muted` selects the softer set used for small labels,
// vs. the fuller-strength set for the big number.
function bucketColor(bucket, muted) {
  if (bucket === 'Great') return muted ? 'text-violet-400' : 'text-violet-300';
  if (bucket === 'Good') return muted ? 'text-sky-400' : 'text-sky-300';
  if (bucket === 'Fair') return muted ? 'text-emerald-400/70' : 'text-emerald-400';
  if (bucket === 'Lopsided') return muted ? 'text-amber-400/70' : 'text-amber-400';
  return 'text-zinc-400';
}

// The two-sided verdict's own tone (overallVerdict/historyVerdict's return, NOT
// a per-side head.tone) turns out to line up exactly with the value+fit bucket:
// tone 'good' requires BOTH sides' headline to read 'good', which — since a
// side's headline can only be 'good' when it's even-or-ahead on value AND its
// own fit clears the threshold, and one side being "ahead" forces the other
// "behind" (dValueAdjA = -dValueAdjB) — is only possible when both sides are
// exactly even (pctDiff < FAIR_PCT) and both clear the fit bar: precisely
// Vault.fairnessBucket's Great condition. So tone 'good' ⟺ bucket 'Great',
// always, for this two-sided verdict. Tone 'neutral' isn't as clean — it covers
// both a genuine Good bucket (one side's fit clears the bar, the other doesn't)
// AND a real "Fair, No Real Winner" (neither side's fit clears it), which the
// plain three-tone system can't tell apart — hence checking bucket explicitly
// rather than trying to derive it from tone alone.
//
// Also used for the offeredBy-reframed acceptance verdict, whose tone comes
// from one side's own headline (heads[receivingSide].tone) instead — there
// tone 'good' does NOT imply bucket 'Great' (only that THIS side did well), but
// the bucket check here still can't misfire from that: Great forces both sides'
// headline tone to 'good' (proven above), so a Great trade always paints violet
// here too; a Good trade only paints blue when this side's own tone lands on
// the neutral fallback, otherwise it correctly defers to plain accept/decline
// coloring. A per-side head.tone used elsewhere (analysis card, notes list)
// stays on the plain TONE/TONE_DOT maps — only these three helpers are bucket-
// aware, where 'good' still just means "this side benefited," not "the whole
// trade is Great."
function verdictColor(tone, bucket) {
  if (bucket === 'Great') return 'text-violet-300';
  if (bucket === 'Good' && tone === 'neutral') return 'text-sky-400';
  return TONE[tone];
}
function verdictDot(tone, bucket) {
  if (bucket === 'Great') return 'bg-violet-400';
  if (bucket === 'Good' && tone === 'neutral') return 'bg-sky-400';
  return TONE_DOT[tone];
}
function verdictBanner(tone, bucket) {
  if (bucket === 'Great') return 'bg-violet-500/[0.06] border-violet-500/25';
  if (bucket === 'Good' && tone === 'neutral') return 'bg-sky-500/[0.06] border-sky-500/25';
  return TONE_BANNER[tone];
}

// "% off" is a ratio against the average (or target) side value, not a bounded
// percentage — it can mathematically clear 100 when one side gives up next to
// nothing (the other side's whole value lands on top of a near-zero average).
// Real trades never approach that; a one-sided "gift" does, and displaying
// "200% off" there reads as a bug to anyone used to percentages topping out at
// 100, not as "yes, this is about as lopsided as it gets." Display-only clamp —
// bucket comparisons (Fair/Lopsided/Unfair) still use the real, uncapped
// number, which is well below this ceiling for any of them anyway.
// Floored, not rounded: the Fair/Lopsided/Unfair cutoffs are whole numbers, so a
// 13.96%-off trade (Fair) must never display as "14%" (the Lopsided cutoff).
function capPct(pct) { return Math.sign(pct) * Math.floor(Math.min(100, Math.abs(pct))); }

// Fairness bar lives in Vault.fairnessBarHtml (vault-core.js) — shared with
// Trade Grades, plus a `mini` variant for the per-factor breakdown rows.
const fairnessBarHtml = (signedPct, bandPct) => Vault.fairnessBarHtml(signedPct, bandPct);

// Renders the ± confidence band under a fairness verdict (see
// Vault.tradeConfidenceBand) — silent when nothing's selected or nothing here has
// enough price history to say anything (bandPct rounds to 0), a plain "±Xpp" when
// the low/high edges still read as the same bucket as the point estimate, and a
// fuller callout when they don't — that's the case where showing only the point
// estimate would genuinely mislead, not just add noise.
function confidenceBandHtml(aAssets, bAssets, aValAdj, bValAdj, pctDiff, bandPct, fitA, fitB) {
  if (!aAssets.length && !bAssets.length) return '';
  if (bandPct == null) ({ bandPct } = Vault.tradeConfidenceBand(aAssets, bAssets, aValAdj, bValAdj));
  if (!bandPct || bandPct < 1) return '';
  const lo = Math.max(0, pctDiff - bandPct), hi = pctDiff + bandPct;
  const bucketLo = fairnessBucket(lo, fitA, fitB), bucketHi = fairnessBucket(hi, fitA, fitB);
  if (bucketLo === bucketHi) return `±${bandPct.toFixed(0)}pp based on recent price swings in the less-established pieces here`;
  return `±${bandPct.toFixed(0)}pp — could read anywhere from ${bucketLo} to ${bucketHi} once the less-established pieces here (rookies, far-future picks) shake out`;
}

function updateTrade() {
  syncTradeUrl();
  const teamA = teamOf('A'), teamB = teamOf('B');
  // Unconditional (unlike the trade bar/analysis below) — who's offering is
  // meaningful the moment two teams are picked, before any assets are even
  // selected, not just once there's a trade to analyze.
  renderOfferedByToggle(teamA, teamB);
  const aAssets = [...selectedA].map(k => teamA.assets.find(x => x.key === k)).filter(Boolean);
  const bAssets = [...selectedB].map(k => teamB.assets.find(x => x.key === k)).filter(Boolean);
  const aVal = aAssets.reduce((s, a) => s + a.value, 0);
  const bVal = bAssets.reduce((s, a) => s + a.value, 0);
  // Fairness is judged with KTC's own consolidation adjustment applied (see
  // Vault.tradeSideValues/consolidationAdjustment) — raw sums above are for the
  // line-item display only.
  const { valueA: aValAdj, valueB: bValAdj } = Vault.tradeSideValues(aAssets, bAssets);

  const bar = document.getElementById('tradeBar');
  const empty = document.getElementById('emptyState');
  const header = document.getElementById('analysisHeader');

  if (!aAssets.length && !bAssets.length) {
    bar.classList.add('hidden');
    header.classList.add('hidden');
    document.getElementById('analysisA').classList.add('hidden');
    document.getElementById('analysisB').classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  bar.classList.remove('hidden');

  const giveChip = (side, a) => `<button onclick="toggle('${side}','${a.key}')" title="Remove from trade" class="group/give inline-flex items-center gap-1.5 mr-3 mb-1 hover:text-rose-300 transition-colors">
      <span class="group-hover/give:line-through">${Vault.escapeHtml(a.name)}</span>
      <span class="text-zinc-400 text-[13px] mono group-hover/give:text-rose-300/60">${Math.round(a.value).toLocaleString()}</span>
      <span class="text-rose-400/0 group-hover/give:text-rose-400/70 text-[12px] transition-colors">✕</span>
    </button>`;
  document.getElementById('giveA').innerHTML = aAssets.length
    ? aAssets.map(a => giveChip('A', a)).join('')
    : '<span class="text-zinc-400">Nothing selected</span>';
  document.getElementById('giveB').innerHTML = bAssets.length
    ? bAssets.map(a => giveChip('B', a)).join('')
    : '<span class="text-zinc-400">Nothing selected</span>';

  const diffAdj = Math.abs(aValAdj - bValAdj);
  // Computed once here and reused by renderAnalysis below instead of recomputing —
  // this already runs positionalFitNotes/archetypeFitNotes/simulateTrade, real work
  // that shouldn't happen twice on every keystroke. Also what gives the top bar's
  // badge access to fit (resA.fit/resB.fit), needed for the Great/Good tiers below.
  const analysis = computeTradeAnalysis(teamA, teamB, aAssets, bAssets, aValAdj, bValAdj);
  const { pctDiff, pctDiffNeed, bandPct: diffBandPct, bucket, fairness, overallPct } = analysis;
  const diffEl = document.getElementById('diff');
  diffEl.textContent = Math.round(diffAdj).toLocaleString();
  diffEl.className = 'text-[22px] font-semibold mono ' + bucketColor(bucket, false);
  // Fairness label spells out the same Fair/Lopsided/Unfair thresholds the color
  // already encodes, since a raw dollar diff alone doesn't tell you what counts as
  // fair. Great/Good are gated on value FIRST (bucket can only read Great/Good if
  // pctDiff already cleared Fair) — see Vault.fairnessBucket.
  const diffLabelEl = document.getElementById('diffLabel');
  // When roster fit/timeline pushed the overall read further than KTC value
  // alone, show both numbers so the gap to KTC is never hidden.
  diffLabelEl.textContent = fairness.fitMovedIt
    ? `${bucket} · ${capPct(overallPct).toFixed(0)}% off · KTC ${capPct(pctDiff).toFixed(0)}%`
    : `${bucket} · ${capPct(pctDiff).toFixed(0)}% off`;
  diffLabelEl.title = `Overall: ${VAULT_CONFIG.FAIRNESS_WEIGHTS.value}% KTC value, ${VAULT_CONFIG.FAIRNESS_WEIGHTS.roster}% roster fit, ${VAULT_CONFIG.FAIRNESS_WEIGHTS.timeline}% timeline — but never closer to even than KTC value alone (${capPct(pctDiff).toFixed(0)}% off). Great means Fair AND a strong fit for both sides; Good means Fair and a strong fit for one side.`;
  diffLabelEl.className = 'text-[11px] mt-0.5 ' + bucketColor(bucket, true);
  document.getElementById('diffBar').innerHTML = (aAssets.length || bAssets.length) ? fairnessBarHtml(fairness.overallSigned, diffBandPct) : '';
  document.getElementById('diffConfidence').innerHTML = confidenceBandHtml(aAssets, bAssets, aValAdj, bValAdj, overallPct, diffBandPct, analysis.resA.fit, analysis.resB.fit);

  // Gap-closer suggestion
  const gapBox = document.getElementById('gapClose');
  if (pctDiff > VAULT_CONFIG.FAIR_PCT && (aAssets.length || bAssets.length)) {
    const behindSide = aValAdj < bValAdj ? 'A' : 'B';
    const behindTeam = teamOf(behindSide);
    const behindSel = behindSide === 'A' ? selectedA : selectedB;
    const neededAdj = Math.abs(aValAdj - bValAdj);
    const pool = behindTeam.assets.filter(a => !behindSel.has(a.key));
    // This addition flows TO the other (currently shortchanged) side, so search for
    // whatever would actually help them, not just whatever hits the raw dollar gap.
    const best = comboSearchAdj(pool, neededAdj, Vault.positionalProfile(teamOf(otherSide(behindSide)), teams));
    const combo = best ? { combo: best.combo, sum: best.combo.reduce((s, a) => s + a.value, 0) } : null;
    if (combo) {
      gapBox.classList.remove('hidden');
      gapBox.innerHTML = `<div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-2">Team ${behindSide} is behind by ${Math.round(neededAdj).toLocaleString()} (value-adjusted) — close the gap</div>
        <div class="flex flex-wrap gap-2">${combo.combo.map(a => `<button onclick="toggle('${behindSide}','${a.key}')" class="px-2.5 py-1.5 rounded-lg border border-white/10 hover:border-amber-500/50 hover:text-white text-[12px] text-zinc-300">+ ${Vault.escapeHtml(a.name)} <span class="mono text-zinc-400">${Math.round(a.value).toLocaleString()}</span></button>`).join('')}</div>`;
    } else gapBox.classList.add('hidden');
  } else gapBox.classList.add('hidden');

  renderAnalysis(teamA, teamB, aAssets, bAssets, aValAdj, bValAdj, analysis);
}

// teamMode/MODE_LABEL now live in Vault (vault-core.js) — shared with Trade Grades.

function analyzeSide(before, after) {
  const mode = Vault.teamMode(before);
  const dAge = after.age - before.age;
  const dPicks = after.picksValue - before.picksValue;
  const dOpt = after.opt - before.opt;
  const dVorp = after.vorpTotal - before.vorpTotal;
  const dValue = after.total - before.total;
  const dArchScore = after.archScore - before.archScore;
  const notes = [];
  let fit = 0;

  if (mode === 'rebuild') {
    if (dAge > 0.4) { notes.push({ tone: 'bad', text: `Gets ${dAge.toFixed(1)} yrs older while rebuilding — wrong direction for your timeline.` }); fit -= 2; }
    else if (dAge < -0.4) { notes.push({ tone: 'good', text: `Gets ${Math.abs(dAge).toFixed(1)} yrs younger — on-plan for a rebuild.` }); fit += 1; }
    if (dPicks < -1500) { notes.push({ tone: 'bad', text: `Trades away ${Math.round(Math.abs(dPicks)).toLocaleString()} in draft capital — contradicts a rebuild.` }); fit -= 2; }
    else if (dPicks > 1500) { notes.push({ tone: 'good', text: `Adds ${Math.round(dPicks).toLocaleString()} in draft capital — on-plan for a rebuild.` }); fit += 2; }
  } else if (mode === 'contend') {
    if (dAge > 1.5) notes.push({ tone: 'neutral', text: `Adds ${dAge.toFixed(1)} yrs of age — tolerable for a win-now roster, but watch the cliff.` });
    else if (dAge < -0.4) { notes.push({ tone: 'good', text: `Gets younger without giving up contention.` }); fit += 1; }
    if (dPicks < -1500) { notes.push({ tone: 'good', text: `Spends ${Math.round(Math.abs(dPicks)).toLocaleString()} in future picks to win now — the right move for a contender if those picks weren't needed.` }); fit += 1; }
    else if (dPicks > 1500) notes.push({ tone: 'neutral', text: `Banks ${Math.round(dPicks).toLocaleString()} in picks — fine, but a contender should usually prioritize immediate roster strength.` });
  } else {
    if (Math.abs(dPicks) > 1500) notes.push({ tone: 'neutral', text: `${dPicks > 0 ? 'Adds' : 'Spends'} ${Math.round(Math.abs(dPicks)).toLocaleString()} in draft capital.` });
    if (Math.abs(dAge) > 0.5) notes.push({ tone: 'neutral', text: `${dAge > 0 ? 'Gets older' : 'Gets younger'} by ${Math.abs(dAge).toFixed(1)} yrs.` });
  }
  const optNote = Vault.optShiftNote(mode, dOpt);
  if (optNote) { notes.push({ tone: optNote.tone, text: optNote.text }); fit += optNote.fit; }
  const vorpNote = Vault.vorpShiftNote(mode, dVorp);
  if (vorpNote) { notes.push({ tone: vorpNote.tone, text: vorpNote.text }); fit += vorpNote.fit; }

  notes.push({ tone: dArchScore > 5 ? 'good' : dArchScore < -5 ? 'bad' : 'neutral', text: `Archetype: ${before.arch} → ${after.arch}`, isArchetype: true });

  return { mode, dAge, dPicks, dOpt, dVorp, dValue, dArchScore, fit, notes };
}

// dValue/avgSide are the same raw consolidation-adjusted swing that gates the
// trade bar's Fair/Lopsided/Unfair badge above (Vault.fairnessBucket) — value
// alone never disagrees between the two. What's different here is that `fit`
// blends INTO this side's own tone/text (a side can read "bad fit" even at
// even value, or "good trade" even a bit behind on sticker value), where the
// small badge keeps the two separate: fit can only ever promote an already-Fair
// trade to Good/Great, never touch Lopsided/Unfair. Every string below says
// "sticker value", never bare "value" or "Fair" on its own, so this per-side fit
// narrative can't read as contradicting the badge above it.
function headline(dValue, avgSide, fit) {
  const pct = avgSide ? dValue / avgSide * 100 : 0;
  const dpct = capPct(pct); // display only — bucket checks below use the real pct
  const even = Math.abs(pct) < VAULT_CONFIG.FAIR_PCT;
  const goodFit = VAULT_CONFIG.GOOD_FIT_THRESHOLD;
  if (pct <= -40) return { tone: 'bad', text: `Well below sticker value (${dpct.toFixed(0)}%)${fit >= goodFit ? ' — good timeline fit, but not enough to cover a discount this big' : ''}` };
  if (even && fit >= goodFit) return { tone: 'good', text: 'Even on sticker value, strong fit — good trade' };
  if (even && fit <= -goodFit) return { tone: 'bad', text: 'Even on sticker value, bad fit for your timeline' };
  if (even) return { tone: 'neutral', text: 'Even on sticker value, neutral fit' };
  if (pct >= VAULT_CONFIG.FAIR_PCT && fit >= 0) return { tone: 'good', text: `Ahead on sticker value (+${dpct.toFixed(0)}%) and fits your timeline` };
  if (pct >= VAULT_CONFIG.FAIR_PCT) return { tone: 'neutral', text: `Ahead on sticker value (+${dpct.toFixed(0)}%), but questionable fit` };
  if (fit >= goodFit) return { tone: 'neutral', text: `Behind on sticker value (${dpct.toFixed(0)}%), but strong timeline fit` };
  return { tone: 'bad', text: `Behind on sticker value (${dpct.toFixed(0)}%) and a poor fit` };
}

// Positional need/surplus fit lives in Vault.positionalFitNotes (vault-core.js) now —
// shared with Trade Grades, which needs the identical reasoning for completed trades.

// Compares pre- and post-trade contention windows so a trade that opens, widens,
// narrows, or closes a team's window gets credit/blame beyond the raw value swing.
function windowShiftNote(befWin, aftWin) {
  if (!befWin.hasWindow && aftWin.hasWindow) return { fit: 2, note: { tone: 'good', text: `Opens a contention window (${aftWin.windowStart}-${aftWin.windowEnd}) that didn't exist before.` } };
  if (befWin.hasWindow && !aftWin.hasWindow) return { fit: -2, note: { tone: 'bad', text: `Closes what was a ${befWin.windowStart}-${befWin.windowEnd} contention window.` } };
  if (befWin.hasWindow && aftWin.hasWindow) {
    const widened = (aftWin.windowEnd - aftWin.windowStart) - (befWin.windowEnd - befWin.windowStart);
    if (widened > 0) return { fit: 1, note: { tone: 'good', text: `Widens the contention window (${befWin.windowStart}-${befWin.windowEnd} → ${aftWin.windowStart}-${aftWin.windowEnd}).` } };
    if (widened < 0) return { fit: -1, note: { tone: 'bad', text: `Narrows the contention window (${befWin.windowStart}-${befWin.windowEnd} → ${aftWin.windowStart}-${aftWin.windowEnd}).` } };
  }
  return { fit: 0, note: null };
}

// Synthesizes value fairness + timeline/production fit + positional need + window
// shift into one top-level grade — gated on the actual value gap FIRST (pctDiff here
// is the same raw, KTC-checkable number the Fair/Lopsided/Unfair badge on the
// trade bar uses; passing a need-adjusted one would silently reintroduce the
// contradiction this was built to prevent: previously fit alone drove the verdict,
// so a 29%-off trade could still read as "Fair, No Real Winner" if timeline/
// positional fit happened to cancel out).
// Fit only decides the sub-label once value itself is close enough to call fair.
// `text` is built from Vault.tradeHighlight — a concrete "Team A gave up X, but
// added RB depth, while Team B got younger" recap — rather than a canned phrase per
// branch, so every trade's supporting line names its own specific storyline instead
// of one of a handful of generic templates. `label`/`tone` still come from the
// good/bad fit-score branches below, since that categorical read is still useful.
// Classifies fit from the SAME tone already shown on each side's own card (heads.A/
// B.tone, from headline() above) rather than re-deriving good/bad from resA.fit/
// resB.fit with different cutoffs — that used to let a side headline() had already
// called "a poor fit" (red) slip through here as merely not-good-not-bad, landing
// the whole trade in "Solid for One Side, Fine for the Other" even though one side
// was being told, in red, not to make it.
// pctDiff is the OVERALL % off (Vault.blendedFairness) and `favored` follows its
// direction, so a trade fit pushed into Lopsided names the team the blend leans to.
function overallVerdict(toneA, toneB, resA, resB, pctDiff, dValueAdjA, teamAName, teamBName, avgSideAdj, posResultA, posResultB, favored = dValueAdjA >= 0 ? 'A' : 'B') {
  const themeA = Vault.sideTheme(posResultA, resA.dAge, resA.dPicks, resA.mode);
  const themeB = Vault.sideTheme(posResultB, resB.dAge, resB.dPicks, resB.mode);
  const text = Vault.tradeHighlight(teamAName, teamBName, dValueAdjA, avgSideAdj, themeA, themeB);

  if (pctDiff >= VAULT_CONFIG.LOPSIDED_PCT) {
    return { tone: 'bad', label: `Unfair — Favors Team ${favored}`, text };
  }
  if (pctDiff >= VAULT_CONFIG.FAIR_PCT) {
    // A fit-based label can misfire here too, not just past LOPSIDED_PCT — a
    // side that's meaningfully ahead on value with slightly negative fit reads
    // 'neutral' from headline(), same as a side that's meaningfully behind but
    // still fills a real need, and that (neutral, neutral) combo falls through
    // the cascade below to "Fair, No Real Winner" even though the trade is
    // genuinely Lopsided by value — the same badge-vs-label contradiction
    // Vault.historyVerdict had. Gated explicitly rather than trusting the
    // tone cascade to never reach a fit-based label out here.
    return { tone: 'bad', label: `Lopsided — Favors Team ${favored}`, text };
  }

  // Below the Fair cutoff, fit decides the sub-label — the Fair/Lopsided/Unfair
  // badge next to this already communicates the price gap, this speaks to fit.
  if (toneA === 'good' && toneB === 'good') return { tone: 'good', label: 'Now That’s a Good Trade', text };
  if (toneA === 'bad' && toneB === 'bad') return { tone: 'bad', label: 'Bad Trade for Both Sides', text };
  if (toneA === 'good' && toneB === 'bad') return { tone: 'neutral', label: 'Solid for Team A', text };
  if (toneB === 'good' && toneA === 'bad') return { tone: 'neutral', label: 'Solid for Team B', text };
  // One side reads as a genuinely poor fit and the OTHER isn't good either (just
  // neutral) — distinct from the "fine for the other" case below, and from a full
  // "bad for both": naming which side it's bad for instead of burying it.
  if (toneA === 'bad') return { tone: 'bad', label: `Bad Fit for ${teamAName}`, text };
  if (toneB === 'bad') return { tone: 'bad', label: `Bad Fit for ${teamBName}`, text };
  if (toneA === 'good' || toneB === 'good') return { tone: 'neutral', label: 'Solid for One Side, Fine for the Other', text };
  return { tone: 'neutral', label: 'Fair, No Real Winner', text };
}

/* When someone's identified as the one OFFERING this trade, the neutral "who came
   out ahead" verdict above stops being the useful question — the offering team
   already chose to propose whatever they're giving up, so grading it as unfair TO
   THEM isn't telling anyone anything actionable. The only real decision left is
   the recipient's: should they take it? This reuses heads[receivingSide] — the
   exact same value+fit read already shown on that team's own analysis card, not a
   new number — so the reframed banner can't say something the rest of the page
   doesn't already back up. Doesn't touch pctDiff, the Fair/Lopsided/Unfair
   badge, or the confidence band at all — those stay the same objective, calibrated
   read regardless of who's offering; only the top verdict banner's framing changes. */
function acceptanceVerdict(side, heads, teamA, teamB) {
  const receivingSide = side === 'A' ? 'B' : 'A';
  const offeringTeam = side === 'A' ? teamA : teamB;
  const receivingTeam = side === 'A' ? teamB : teamA;
  const head = heads[receivingSide];
  const LABEL = { good: 'Worth Accepting', neutral: 'Borderline — Worth a Counter', bad: 'Decline This' };
  return {
    tone: head.tone,
    label: LABEL[head.tone] || LABEL.neutral,
    text: `${Vault.escapeHtml(offeringTeam.teamName)} is offering this to ${Vault.escapeHtml(receivingTeam.teamName)}. ${head.text}`
  };
}

// How many ACTIVE (non-taxi, non-IR) roster spots a team would occupy after this
// trade, against rosterCap. Picks don't count — they don't occupy a roster spot
// until drafted. An outgoing player only frees an active spot if they weren't
// already stashed on taxi/IR (trading away a taxi rookie doesn't help you fit a
// newly-acquired veteran); an incoming player always needs a real active spot,
// since a trade can't assume the other team's taxi/IR eligibility carries over.
// A consolidation trade can be fine on value and fit and still force a drop the
// rest of the app has no other way to surface.
function projectedRosterCount(team, outgoing, incoming) {
  const isStashed = a => team.taxiIds?.has(a.id) || team.reserveIds?.has(a.id);
  const outActive = outgoing.filter(a => a.type === 'player' && !isStashed(a)).length;
  const inPlayers = incoming.filter(a => a.type === 'player').length;
  const currentActive = team.plist.length - (team.taxiIds?.size || 0) - (team.reserveIds?.size || 0);
  return currentActive - outActive + inPlayers;
}

// Labels the trade itself — not either team's fit, but what kind of transaction this is.
function classifyTrade(resA, resB, aAssets, bAssets, teamA, teamB) {
  const aSellsProd = resA.dOpt < -3 && resA.dPicks > 500;
  const bSellsProd = resB.dOpt < -3 && resB.dPicks > 500;
  const aBuysProd = resA.dOpt > 3 && resA.dPicks < -500;
  const bBuysProd = resB.dOpt > 3 && resB.dPicks < -500;

  let label, desc;
  if (resA.mode === 'rebuild' && resB.mode === 'contend' && aSellsProd && bBuysProd) {
    label = 'Rebuild-for-Contender Swap';
    desc = `Team A cashes in current production for draft capital while Team B spends picks to win now — a textbook timeline-matched trade.`;
  } else if (resB.mode === 'rebuild' && resA.mode === 'contend' && bSellsProd && aBuysProd) {
    label = 'Rebuild-for-Contender Swap';
    desc = `Team B cashes in current production for draft capital while Team A spends picks to win now — a textbook timeline-matched trade.`;
  } else if (resA.mode === 'rebuild' && aBuysProd) {
    label = 'Off-Plan Buy — Team A';
    desc = `Team A is rebuilding but is buying current production at the cost of picks or youth — worth double-checking this actually fits the plan.`;
  } else if (resB.mode === 'rebuild' && bBuysProd) {
    label = 'Off-Plan Buy — Team B';
    desc = `Team B is rebuilding but is buying current production at the cost of picks or youth — worth double-checking this actually fits the plan.`;
  } else if (resA.mode === 'contend' && resB.mode === 'contend') {
    label = 'Win-Now Swap';
    desc = `Both teams are contending — this reads as two playoff teams addressing complementary roster needs, not a timeline shift.`;
  } else if (resA.mode === 'rebuild' && resB.mode === 'rebuild') {
    label = 'Rebuild Shuffle';
    desc = `Both teams are rebuilding — this is about sorting picks and youth to each side's preference, not changing either team's outlook.`;
  } else {
    label = 'Value Trade';
    desc = `No clear timeline mismatch between the two sides — this reads as a roster-fit trade rather than a buy or a sell.`;
  }

  if (aAssets.length >= bAssets.length + 2) desc += ` Team A is also consolidating — ${aAssets.length} pieces down to ${bAssets.length} bigger ones from Team B.`;
  else if (bAssets.length >= aAssets.length + 2) desc += ` Team B is also consolidating — ${bAssets.length} pieces down to ${aAssets.length} bigger ones from Team A.`;

  if (rosterCap) {
    const newA = projectedRosterCount(teamA, aAssets, bAssets);
    const newB = projectedRosterCount(teamB, bAssets, aAssets);
    if (newA > rosterCap) desc += ` This leaves Team A needing ${newA}/${rosterCap} active roster spots — they'll need to drop ${newA - rosterCap} (taxi/IR don't count unless the incoming piece actually qualifies).`;
    if (newB > rosterCap) desc += ` This leaves Team B needing ${newB}/${rosterCap} active roster spots — they'll need to drop ${newB - rosterCap} (taxi/IR don't count unless the incoming piece actually qualifies).`;
  }

  return { label, desc };
}

// Pure computation, no DOM access — shared by renderAnalysis (draws the result) and
// suggestTrade (scores many candidate trades to find good ones without drawing
// anything). Takes the two teams and what each side gives, returns everything
// needed to either render or just rank a candidate.
function computeTradeAnalysis(teamA, teamB, aAssets, bAssets, aValAdj, bValAdj) {
  const giveA = aAssets.map(a => ({ type: a.type, id: a.id, value: a.value, pos: a.pos, age: a.age, name: a.name, ppg: a.ppg, vorp: a.vorp, season: a.season, round: a.round, original: a.original, tier: a.tier }));
  const giveB = bAssets.map(a => ({ type: a.type, id: a.id, value: a.value, pos: a.pos, age: a.age, name: a.name, ppg: a.ppg, vorp: a.vorp, season: a.season, round: a.round, original: a.original, tier: a.tier }));

  const { before, after, pool } = Vault.simulateTrade(teams, slots, teamA.rosterId, teamB.rosterId, giveA, giveB);
  const avgSideAdj = (aValAdj + bValAdj) / 2 || 1;
  // Value delta with KTC's consolidation adjustment applied (Vault.tradeSideValues)
  // — same basis as the trade bar, not a plain per-asset sum.
  const dValueAdjA = bValAdj - aValAdj;
  const dValueAdjB = aValAdj - bValAdj;

  // Fair/Lopsided/Unfair is gated on raw sticker value (Vault.tradeSideValues,
  // KTC's own consolidation math) alone — the one number a manager can check
  // against KTC's own calculator. What each pile is actually worth to the team
  // RECEIVING it (Vault.needAdjustedTradeValues) is kept as pctDiffNeed, an
  // informational "here's how need-weighting reads it instead" detail, never the
  // number that decides the verdict, color, or sort order — see the note above
  // Vault.needAdjustedTradeValue for why.
  const { aValAdjNeed, bValAdjNeed } = Vault.needAdjustedTradeValues(teamA, teamB, teams, aAssets, bAssets);
  const avgSideAdjNeed = (aValAdjNeed + bValAdjNeed) / 2 || 1;
  const pctDiffNeed = avgSideAdjNeed ? Math.abs(aValAdjNeed - bValAdjNeed) / avgSideAdjNeed * 100 : 0;
  const pctDiff = avgSideAdj ? Math.abs(aValAdj - bValAdj) / avgSideAdj * 100 : 0;
  const signedPctDiff = Math.sign((aValAdj - bValAdj) || 1) * pctDiff;
  const { bandPct } = Vault.tradeConfidenceBand(aAssets, bAssets, aValAdj, bValAdj);

  const resA = analyzeSide(before.A, after.A);
  const resB = analyzeSide(before.B, after.B);
  const trade = classifyTrade(resA, resB, aAssets, bAssets, teamA, teamB);

  const heads = {}, wins = {}, posResults = {}, rosterFit = {}, timelineFit = {};
  [['A', before.A, after.A, resA, dValueAdjA, bAssets, aAssets], ['B', before.B, after.B, resB, dValueAdjB, aAssets, bAssets]].forEach(([side, bef, aft, res, dValueAdj, incoming, outgoing]) => {
    // analyzeSide's fit so far = age/picks-vs-mode (timeline) + lineup PPG/VORP
    // shift (roster) — split back apart here for Vault.blendedFairness.
    const lineupFit = (Vault.optShiftNote(res.mode, res.dOpt)?.fit || 0) + (Vault.vorpShiftNote(res.mode, res.dVorp)?.fit || 0);
    const ageAndPicksFit = res.fit - lineupFit;

    // Positional need/surplus fit for the specific assets moving this direction —
    // what's incoming is judged against the roster BEFORE the trade (does it fill a
    // real hole), what's outgoing is judged against the roster AFTER (does losing it
    // leave one) — see Vault.positionalFitNotes for why those need to be different
    // snapshots, not the same one twice.
    const posResult = Vault.positionalFitNotes(bef, teams, aft, pool, incoming, outgoing, res.mode);
    res.fit += posResult.posFit;
    posResults[side] = posResult;

    const archResult = Vault.archetypeFitNotes(bef, incoming, outgoing);
    res.fit += archResult.archFit;

    const befWin = Vault.contentionWindow(bef, teams);
    const win = Vault.contentionWindow(aft, pool);
    const shift = windowShiftNote(befWin, win);
    res.fit += shift.fit;
    rosterFit[side] = posResult.posFit + lineupFit;
    timelineFit[side] = ageAndPicksFit + archResult.archFit + shift.fit;

    // Scanning only `outgoing` (not incoming too) is deliberate: each moving asset
    // is outgoing for exactly one side, so this surfaces once per asset, attributed
    // to whoever's giving it up, instead of the same fact appearing on both cards.
    const riskNotes = Vault.valueRiskNotes(outgoing);

    res.notes = [...Vault.mergeAssetNotes(archResult.notes, posResult.notes), ...riskNotes, ...(shift.note ? [shift.note] : []), ...res.notes];
    heads[side] = headline(dValueAdj, avgSideAdj, res.fit);
    wins[side] = win;
  });

  // Overall fairness = KTC value blended with roster fit and timeline, but never
  // closer to even than value alone (see Vault.blendedFairness). overallPct is
  // what gates the badge, verdict, and bar from here on; pctDiff stays the raw
  // KTC number for the "KTC says X%" readouts.
  const fairness = Vault.blendedFairness(signedPctDiff, rosterFit.A, rosterFit.B, timelineFit.A, timelineFit.B);
  const overallPct = fairness.overallPct;
  const favored = fairness.overallSigned > 0 ? 'B' : 'A';
  const verdict = overallVerdict(heads.A.tone, heads.B.tone, resA, resB, overallPct, dValueAdjA, teamA.teamName, teamB.teamName, avgSideAdj, posResults.A, posResults.B, favored);
  const bucket = Vault.fairnessBucket(overallPct, resA.fit, resB.fit);

  return { before, after, pool, resA, resB, trade, heads, wins, dValueAdjA, dValueAdjB, pctDiff, pctDiffNeed, signedPctDiff, bandPct, fairness, overallPct, verdict, bucket };
}

function toggleOfferedBy(side) {
  offeredBy = offeredBy === side ? null : side;
  render('A'); render('B');
}

function renderOfferedByToggle(teamA, teamB) {
  const chip = (side, team) => `<button onclick="toggleOfferedBy('${side}')" class="text-[14px] font-medium px-4 py-2.5 rounded-xl border-2 transition-colors ${offeredBy === side ? 'btn-gold-solid border-transparent' : 'border-white/15 text-zinc-300 hover:text-white hover:border-amber-500/40 hover:bg-amber-500/5'}">${Vault.escapeHtml(team.teamName)} offering</button>`;
  document.getElementById('offeredByToggle').innerHTML = chip('A', teamA) + chip('B', teamB);
}

function renderAnalysis(teamA, teamB, aAssets, bAssets, aValAdj, bValAdj, analysis) {
  const header = document.getElementById('analysisHeader');
  if (!aAssets.length && !bAssets.length) {
    header.classList.add('hidden');
    document.getElementById('analysisA').classList.add('hidden');
    document.getElementById('analysisB').classList.add('hidden');
    return;
  }
  header.classList.remove('hidden');
  document.getElementById('analysisA').classList.remove('hidden');
  document.getElementById('analysisB').classList.remove('hidden');

  const { before, after, resA, resB, trade, heads, wins, dValueAdjA, dValueAdjB, pctDiff, pctDiffNeed, bandPct, fairness, overallPct, verdict, bucket } = analysis;
  const displayVerdict = offeredBy ? acceptanceVerdict(offeredBy, heads, teamA, teamB) : verdict;

  document.getElementById('tradeArchetype').innerHTML = `
    <div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-1.5">Trade Archetype</div>
    <div class="flex items-center gap-2 mb-1.5">
      <svg class="size-4 shrink-0 text-amber-400/80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5-5 18-3-8z"/></svg>
      <div class="text-[18px] font-semibold gold-text">${trade.label}</div>
    </div>
    <div class="text-[13px] text-zinc-300 leading-relaxed">${trade.desc}</div>`;

  // One button, not one per side — it always rebuilds whichever side is currently
  // UNDERPAYING this trade (the higher dValueAdj, i.e. gave up less real value),
  // so the user never has to guess which of two buttons to click. Sweetening the
  // cheaper side's offer, not cheapening the pricier side's ask, matches how a
  // real trade negotiation actually closes a gap — and it's what Balance's own
  // Tier 1 (see balanceSide) is built to do well: ADD to what's already selected
  // rather than replace it, which only works when the side being adjusted is the
  // one that needs to give MORE, not less. Lives above the trade itself (next to
  // Reset in the Trade Bar), not buried in either side's analysis card, since it
  // acts on the trade you're building — gated on the OVERALL verdict rather than
  // either side's own tone, since a side can read "good" simply for getting the
  // better end of a lopsided deal.
  const sweetenSide = dValueAdjA >= dValueAdjB ? 'A' : 'B';
  const sweetenTeamName = sweetenSide === 'A' ? teamA.teamName : teamB.teamName;
  document.getElementById('balanceBtn').innerHTML = verdict.tone !== 'good'
    ? `<button onclick="balanceSide('${sweetenSide}', this)" title="Keep Team ${sweetenSide === 'A' ? 'B' : 'A'}'s side exactly as selected, and add to ${Vault.escapeHtml(sweetenTeamName)}'s side to close the gap" class="shrink-0 text-[11px] px-3 py-1.5 rounded-lg border border-emerald-500/25 text-emerald-300/80 hover:text-emerald-200 hover:border-emerald-500/50 hover:bg-emerald-500/5 transition-colors inline-flex items-center gap-1.5"><svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l-3 6a4 4 0 0 0 6 0zM19 8l-3 6a4 4 0 0 0 6 0zM5 8h14M9 3h6"/></svg>Balance ${Vault.escapeHtml(sweetenTeamName)}</button>`
    : '';

  [['A', before.A, after.A, resA, dValueAdjA], ['B', before.B, after.B, resB, dValueAdjB]].forEach(([side, bef, aft, res, dValueAdj]) => {
    const head = heads[side];
    const win = wins[side];

    document.getElementById(`analysis${side}`).innerHTML = `
      <div class="card rounded-vault-sm p-4 min-w-0">
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="min-w-0">
            <div class="text-[11px] text-zinc-400 uppercase tracking-wider truncate">Team ${side} · ${Vault.escapeHtml(bef.teamName)}</div>
            <div class="text-[11px] mt-0.5 ${TONE.neutral}">${Vault.MODE_LABEL[res.mode]}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-[13px] font-mono ${dValueAdj >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${fmtSigned(dValueAdj)}</div>
            <div class="text-[11px] text-zinc-400">value Δ (adj)</div>
          </div>
        </div>
        <div class="flex items-start gap-2 mb-4">
          <span class="size-2 rounded-full shrink-0 mt-1.5 ${TONE_DOT[head.tone]}"></span>
          <p class="text-[13px] ${TONE[head.tone]} leading-relaxed"><span class="font-medium">${head.text}.</span> <span class="font-normal">${Vault.buildSynopsis('', res.notes)}</span></p>
        </div>
        ${res.notes.length ? `<details class="group mb-4">
          <summary class="flex items-center gap-1.5 cursor-pointer select-none list-none text-[11px] text-zinc-400 hover:text-zinc-300 transition-colors [&::-webkit-details-marker]:hidden">
            <svg class="size-3 shrink-0 transition-transform group-open:rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            <span>Full breakdown (${res.notes.length})</span>
          </summary>
          <div class="space-y-2 mt-3">
            ${res.notes.map(n => `<div class="flex gap-2 text-[12px] ${n.isArchetype ? 'pt-2 border-t border-white/5 mt-2' : ''}"><span class="mt-1 size-1.5 rounded-full shrink-0 ${TONE_DOT[n.tone]}"></span><span class="${TONE[n.tone]}">${n.text}</span></div>`).join('')}
          </div>
        </details>` : ''}
        <div class="grid grid-cols-4 gap-1 text-center pt-3 border-t border-white/5">
          <div><div class="text-[14px] font-mono">${aft.age.toFixed(1)}</div><div class="text-[11px] text-zinc-400">Age</div></div>
          <div><div class="text-[14px] font-mono">${aft.opt.toFixed(1)}<span class="text-[11px] ml-1 ${res.dOpt > 0.05 ? 'text-emerald-400' : res.dOpt < -0.05 ? 'text-rose-400' : 'text-zinc-400'}">${Math.abs(res.dOpt) > 0.05 ? (res.dOpt > 0 ? '+' : '') + res.dOpt.toFixed(1) : ''}</span></div><div class="text-[11px] text-zinc-400">Opt PPG</div></div>
          <div><div class="text-[14px] font-mono" title="Optimal lineup's total VORP — real, scarcity-adjusted edge over readily-available replacements, not just raw points">${aft.vorpTotal.toFixed(1)}<span class="text-[11px] ml-1 ${res.dVorp > 0.05 ? 'text-emerald-400' : res.dVorp < -0.05 ? 'text-rose-400' : 'text-zinc-400'}">${Math.abs(res.dVorp) > 0.05 ? (res.dVorp > 0 ? '+' : '') + res.dVorp.toFixed(1) : ''}</span></div><div class="text-[11px] text-zinc-400">VORP</div></div>
          <div><div class="text-[14px] font-mono">${win.hasWindow ? win.windowStart + '-' + win.windowEnd : 'None'}</div><div class="text-[11px] text-zinc-400">Window</div></div>
        </div>
      </div>`;
  });

  const verdictEl = document.getElementById('tradeVerdict');
  verdictEl.className = `card rounded-2xl p-6 mb-4 border ${verdictBanner(displayVerdict.tone, bucket)}`;
  const confidenceText = confidenceBandHtml(aAssets, bAssets, aValAdj, bValAdj, overallPct, bandPct, resA.fit, resB.fit);
  // Only worth a callout when it'd actually change how a manager reads the number —
  // otherwise it's noise repeating the badge above in slightly different words.
  const needNote = Math.abs(pctDiffNeed - pctDiff) >= 2
    ? `<span title="Weighted by both teams' roster needs instead of raw sticker value" class="cursor-help">reads as ${capPct(pctDiffNeed).toFixed(0)}% off by need</span>` : '';
  verdictEl.innerHTML = `
    <div class="flex items-center gap-3 mb-2">
      <span class="size-3.5 rounded-full shrink-0 ${verdictDot(displayVerdict.tone, bucket)}"></span>
      <div class="text-[28px] font-semibold leading-tight ${verdictColor(displayVerdict.tone, bucket)}">${displayVerdict.label}</div>
    </div>
    <div class="text-[17px] font-medium leading-snug ${verdictColor(displayVerdict.tone, bucket)}">${displayVerdict.text}</div>
    <div class="max-w-md mt-3">
      <div class="flex items-center justify-between text-[11px] text-zinc-400 mb-1">
        <span>Overall</span>
        <span>${fairness.fitMovedIt ? `${capPct(overallPct).toFixed(0)}% off overall · KTC alone ${capPct(pctDiff).toFixed(0)}%` : `${capPct(pctDiff).toFixed(0)}% off`}</span>
      </div>
      ${fairnessBarHtml(fairness.overallSigned, bandPct)}
      <div class="mt-2.5">${Vault.fairnessBreakdownHtml(fairness, teamA.teamName, teamB.teamName)}</div>
    </div>
    <div class="text-[11px] text-zinc-400 mt-1.5">${[confidenceText, needNote, `<a href="${Vault.linkTo('how_we_grade.html')}" class="text-amber-300/80 hover:text-amber-200">How is this graded?</a>`].filter(Boolean).join(' · ')}</div>`;
}

init();
</script>
