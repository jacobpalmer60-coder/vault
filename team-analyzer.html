<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Team Analyzer — The Vault</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css">
</head>
<body class="text-zinc-100 antialiased">
<div class="vault-bg"></div>

<div id="vault-nav"></div>

<main class="max-w-[1400px] mx-auto px-6 py-8 fade-in">
  <div class="mb-6">
    <h1 class="display text-[28px] gold-text">Team Analyzer</h1>
    <p class="text-[11px] uppercase tracking-widest text-zinc-400 mt-1">14 Archetypes • Real Values</p>
  </div>

  <div class="card rounded-vault-sm p-5 mb-6">
    <div class="flex flex-col md:flex-row gap-3 md:items-end">
      <div class="flex-1">
        <label class="text-[12px] text-zinc-400">Sleeper League ID</label>
        <div class="mt-1.5 flex gap-2">
          <input id="leagueId" class="w-full bg-black/60 border border-white/10 rounded-xl px-3.5 py-2.5 text-[14px] outline-none focus:border-amber-400 focus:shadow-[0_0_0_3px_rgba(250,204,21,0.1)] transition-shadow" placeholder="1313454100225990656"/>
          <button id="loadBtn" class="btn-gold-solid px-4 py-2.5 text-[14px]">Load</button>
        </div>
      </div>
      <select id="teamSelect" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-[14px] min-w-[220px] hidden"></select>
    </div>
    <div id="status" class="mt-3 text-[12px] text-amber-300/70 hidden"></div>
  </div>

  <section id="singleCard" class="mb-10"></section>

  <section>
    <h2 class="display text-[24px] gold-text mb-3">League Summary</h2>
    <div class="card rounded-vault-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-[13px]">
          <thead class="bg-black/60 border-b border-white/5 sticky top-0">
            <tr class="text-[11px] uppercase tracking-widest text-zinc-400">
              <th class="text-left px-4 py-3">#</th>
              <th class="text-left px-4 py-3">Team</th>
              <th class="text-left px-4 py-3">Archetype</th>
              <th class="text-right px-3 py-3">Total</th>
              <th class="text-right px-3 py-3">Opt PPG</th>
              <th class="text-right px-3 py-3">Age</th>
              <th class="text-right px-3 py-3">Picks</th>
            </tr>
          </thead>
          <tbody id="summary" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="vault-core.js"></script>
<script src="vault-nav.js"></script>
<script>
const $ = s => document.querySelector(s);

// Promoted to Vault.tradePartnerSuggestions so the Trade Calculator can surface the
// same suggestions while a trade is actually being built.
function getTradePartners(t, all) { return Vault.tradePartnerSuggestions(t, all, 2); }

// Mirrors app.html's Best Lineup panel — short display labels for roster_positions
// slot codes, and the fixed skill-first order to list them in. Purely cosmetic; the
// actual greedy fill already ran in Vault.optimalLineupDetail (via buildLeagueTeams).
const SLOT_LABEL = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', FLEX: 'FLEX', WRRB_FLEX: 'W/R', REC_FLEX: 'W/T', SUPER_FLEX: 'SFLX', K: 'K', DEF: 'DEF' };
const SLOT_ORDER = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'WRRB_FLEX', 'REC_FLEX', 'SUPER_FLEX', 'K', 'DEF'];

function bestLineupPanel(t) {
  const rows = [...t.lineup].sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
  const lines = rows.map(s => `<div class="flex justify-between text-[12px]">
    <span class="text-zinc-500 w-9 shrink-0">${SLOT_LABEL[s.slot] || s.slot}</span>
    <span class="truncate flex-1 mr-2">${Vault.escapeHtml(s.name) || '—'}</span>
    <span class="font-mono text-zinc-500">${s.name ? s.ppg.toFixed(1) : '—'}</span>
  </div>`).join('');
  return `<div><div class="text-[11px] uppercase tracking-widest text-amber-300/60 mb-2">Best Lineup</div><div class="space-y-1.5">${lines || '<div class="text-zinc-600">—</div>'}</div></div>`;
}

async function loadLeague(id) {
  $('#status').classList.remove('hidden'); $('#status').textContent = 'Loading league…';
  try {
    const { isSF, teams: built } = await Vault.buildLeagueTeams(id);
    window._allTeams = built;

    const sel = $('#teamSelect'); sel.innerHTML = built.map(t => `<option value="${t.rosterId}">${Vault.escapeHtml(t.teamName)} ${Vault.escapeHtml(t.username)}</option>`).join(''); sel.classList.remove('hidden');
    const saved = localStorage.getItem('vault_username');
    const found = built.find(t => t.username.toLowerCase() === String(saved || '').toLowerCase());
    sel.value = String(found ? found.rosterId : built[0].rosterId);
    sel.onchange = () => renderSingle(built.find(t => String(t.rosterId) === sel.value));

    renderSingle(found || built[0]);
    renderSummary(built);
    $('#status').textContent = `Loaded ${built.length} teams • ${isSF ? 'Superflex' : '1QB'}`;
  } catch (e) {
    console.error(e);
    $('#status').textContent = e.message;
  }
}

function renderSingle(t) {
  if (!t) return;
  const all = window._allTeams || [];
  const leagueAvg = {
    qb: all.reduce((s, x) => s + x.qb, 0) / all.length,
    rb: all.reduce((s, x) => s + x.rb, 0) / all.length,
    wr: all.reduce((s, x) => s + x.wr, 0) / all.length,
    te: all.reduce((s, x) => s + x.te, 0) / all.length,
    picks: all.reduce((s, x) => s + x.picksValue, 0) / all.length,
    age: all.reduce((s, x) => s + x.age, 0) / all.length,
  };
  const flaws = Vault.fatalFlaws(t, leagueAvg);
  const partners = getTradePartners(t, all);
  const win = Vault.contentionWindow(t, all);

  const bars = [
    { l: 'Total Value', v: Math.round(t.total), c: 'from-amber-500 to-yellow-500' },
    { l: 'Opt PPG', v: t.opt.toFixed(1), c: 'from-emerald-500 to-teal-500' },
    { l: 'Age', v: t.age.toFixed(1), c: 'from-zinc-500 to-zinc-400' },
    { l: 'Picks Value', v: Math.round(t.picksValue), c: 'from-sky-500 to-cyan-500' },
  ];
  $('#singleCard').innerHTML = `
  <div class="card rounded-vault p-6 fade-in">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="display text-[24px] gold-text">${Vault.escapeHtml(t.teamName)}</h2>
        <p class="text-[12px] text-zinc-400">${Vault.escapeHtml(t.username)} • Rank #${t.rank} • Peak: ${win.peakYear}</p>
      </div>
      <span title="${Vault.escapeHtml(Vault.ARCHETYPE_INFO[t.arch]?.desc || '')}" class="px-3 py-1.5 rounded-full text-[12px] border bg-gradient-to-r ${t.archCls}">${t.arch}</span>
    </div>
    <div class="grid md:grid-cols-4 gap-4 mt-6">
      ${bars.map(b => `<div class="stat-tile"><div class="stat-label">${b.l}</div><div class="stat-value">${b.v}</div></div>`).join('')}
    </div>

    <div class="grid lg:grid-cols-3 gap-4 mt-6">
      <div class="bg-black/40 rounded-2xl p-4 border border-orange-500/20">
        <div class="text-[11px] uppercase tracking-widest text-orange-300/70 mb-2">Flaws</div>
        <div class="space-y-1.5 text-[12px]">${flaws.length ? flaws.map(f => `<div class="flex gap-2"><span class="text-orange-400">•</span><span>${f}</span></div>`).join('') : '<div class="text-zinc-500">Nothing notable</div>'}</div>
      </div>
      <div class="bg-black/40 rounded-2xl p-4 border border-emerald-500/20">
        <div class="text-[11px] uppercase tracking-widest text-emerald-300/70 mb-2">Best Trade Partners</div>
        <div class="space-y-3">${partners.map(p => `
          <div>
            <div class="flex justify-between items-center">
              <div><div class="text-[13px]">${Vault.escapeHtml(p.teamName)}</div><div class="text-[11px] text-zinc-500">${p.arch}</div></div>
              <div class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 shrink-0">${Math.min(10, p.fit)}/10 fit</div>
            </div>
            <div class="mt-1.5 space-y-0.5">${p.reasons.map(r => `<div class="flex gap-1.5 text-[11px] text-zinc-400"><span class="text-emerald-500/60">•</span><span>${r}</span></div>`).join('')}</div>
          </div>`).join('')}</div>
      </div>
      <div class="bg-black/40 rounded-2xl p-4 border border-white/10">
        <div class="text-[11px] uppercase tracking-widest text-amber-300/70 mb-2">Contention Window (5yr)</div>
        <div class="flex items-end gap-1.5 h-[70px]">${win.proj.map((v, i) => `<div class="flex-1 flex flex-col items-center"><div class="w-full bg-gradient-to-t from-amber-500/40 to-amber-300 rounded-t" style="height:${Math.max(8, v / win.peak * 100)}%" title="${win.startYear + i}: ${v.toLocaleString()} value, ${win.projPPG[i].toFixed(1)} PPG"></div></div>`).join('')}</div>
        <div class="flex justify-between text-[11px] mt-1 text-zinc-500">${win.proj.map((v, i) => `<span>${win.startYear + i}</span>`).join('')}</div>
        <div class="mt-2 h-2 w-full bg-zinc-800 rounded-full overflow-hidden flex">${win.proj.map((v, i) => `<div class="h-full ${win.inWindow[i] ? 'bg-amber-400' : 'bg-zinc-700'}" style="width:${100 / win.proj.length}%"></div>`).join('')}</div>
        <div class="text-center text-[11px] mt-1.5 text-amber-300">${win.hasWindow ? (win.windowEnd - win.windowStart + 1) + 'yr window' : 'No window'} • Peak ${Math.round(win.peak).toLocaleString()} in ${win.peakYear}</div>
        <div class="mt-3 pt-2 border-t border-zinc-800 text-[11px] text-zinc-500 space-y-1">
          <div class="flex items-center gap-1.5"><span class="w-3 h-1.5 bg-amber-400 rounded"></span> In window (value ≥88% peak + PPG ≥ playoff line)</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-1.5 bg-zinc-700 rounded"></span> Outside window</div>
          <div>Playoff line: ${win.playoffLine.toFixed(1)} PPG (top ${win.playoffSpots})</div>
        </div>
      </div>
    </div>

    <div class="grid lg:grid-cols-6 gap-6 mt-8">
      ${bestLineupPanel(t)}
      ${['QB', 'RB', 'WR', 'TE'].map(pos => { const ps = t.plist.filter(p => p.pos === pos).sort((a, b) => b.value - a.value).slice(0, 6); return `<div><div class="text-[11px] uppercase tracking-widest text-amber-300/60 mb-2">${pos}</div><div class="space-y-1.5">${ps.map(p => `<div class="flex justify-between text-[12px]"><span class="truncate mr-2">${Vault.escapeHtml(p.name) || '—'}</span><span class="font-mono text-zinc-500">${Math.round(p.value)}</span></div>`).join('') || '<div class="text-zinc-600">—</div>'}</div></div>`; }).join('')}
      <div><div class="text-[11px] uppercase tracking-widest text-amber-300/60 mb-2">2027-29 Picks</div><div class="space-y-1.5 text-[12px]">${t.picks.map(p => `<div class="flex justify-between"><span>${p.season} R${p.round}</span><span class="font-mono">${Math.round(p.value)}</span></div>`).join('') || '<div class="text-zinc-600">—</div>'}</div></div>
    </div>
  </div>`;
}

function renderSummary(teams) {
  $('#summary').innerHTML = teams.map(t => `
    <tr class="hover:bg-amber-500/5 cursor-pointer" onclick="document.getElementById('teamSelect').value='${t.rosterId}';document.getElementById('teamSelect').dispatchEvent(new Event('change'))">
      <td class="px-4 py-3 text-amber-300/70">${t.rank}</td>
      <td class="px-4 py-3"><div class="font-medium">${Vault.escapeHtml(t.teamName)}</div><div class="text-[11px] text-zinc-500">${Vault.escapeHtml(t.username)}</div></td>
      <td class="px-4 py-3"><span title="${Vault.escapeHtml(Vault.ARCHETYPE_INFO[t.arch]?.desc || '')}" class="px-2.5 py-1 rounded-full text-[11px] border bg-gradient-to-r ${t.archCls}">${t.arch}</span></td>
      <td class="px-3 py-3 text-right font-mono">${Math.round(t.total).toLocaleString()}</td>
      <td class="px-3 py-3 text-right font-mono text-emerald-300/80">${t.opt.toFixed(1)}</td>
      <td class="px-3 py-3 text-right font-mono">${t.age.toFixed(1)}</td>
      <td class="px-3 py-3 text-right font-mono">${Math.round(t.picksValue).toLocaleString()}</td>
    </tr>
  `).join('');
}

document.getElementById('loadBtn').onclick = () => {
  const id = document.getElementById('leagueId').value.trim();
  if (id) { Vault.setLeagueId(id); loadLeague(id); }
};
window.addEventListener('DOMContentLoaded', () => {
  const id = Vault.getLeagueId();
  document.getElementById('leagueId').value = id;
  loadLeague(id);
});
</script>
</body>
</html>
