      <div class="flex items-center gap-3 flex-wrap"><h1 class="display font-semibold gold-text flex items-center">Team Analyzer<span class="term-i" data-term="page_analyzer" tabindex="0" role="note">?</span></h1></div>

<script>
const $ = s => document.querySelector(s);

// Promoted to Vault.tradePartnerSuggestions so the Trade Calculator can surface the
// same suggestions while a trade is actually being built.
function getTradePartners(t, all) { return Vault.tradePartnerSuggestions(t, all, 2); }

// This season (season-report.js): loads alongside the team values and fills
// in below the team card once Sleeper's weekly data is in.
let season = null;
function renderSeason(rosterId) {
  Vault.renderSeasonReport($('#seasonCard'), season, rosterId, {
    myId: (Vault.myTeam(window._allTeams || []) || {}).rosterId,
    onPickTeam: id => { const sel = $('#teamSelect'); sel.value = String(id); sel.onchange(); $('#singleCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  renderGlance();
}

/* ---------- Tabs ----------
   Overview, Roster, This season, Contend or rebuild: one at a time, in the address
   (#roster…) so a link opens on it, and remembered in this browser. */
const TEAM_TABS = [['overview', 'Overview'], ['roster', 'Roster'], ['season', 'This season'], ['future', 'Contend or rebuild?']];
function showTab(key) {
  if (!TEAM_TABS.some(([k]) => k === key)) key = 'overview';
  document.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('hidden', el.dataset.tab !== key));
  $('#singleCard').classList.toggle('tiles-off', key !== 'overview');
  $('#teamTabs').innerHTML = TEAM_TABS.map(([k, label]) => `<button role="tab" aria-selected="${k === key}" onclick="showTab('${k}')" class="whitespace-nowrap text-[13px] px-3 sm:px-3.5 py-2 rounded-lg border transition-colors ${k === key ? 'bg-white/[0.08] border-white/25 text-white' : 'border-white/10 text-zinc-300 hover:text-white hover:border-white/20'}">${label}</button>`).join('');
  try { localStorage.setItem('vault_team_tab', key); } catch {}
  const u = new URL(location.href); u.hash = key === 'overview' ? '' : key; history.replaceState(null, '', u);
}
window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
const pctText = v => (v > 0 && v < 1 ? '<1' : v > 99 && v < 100 ? '>99' : Math.round(v)) + '%';

// Overview's first card: one line from This season and one from Contend or rebuild?,
// each filled in when its section has the numbers.
let shownTeam = null, suggestion = null;
function renderGlance() {
  const box = $('#glance');
  if (!box || !shownTeam) return;
  const st = season && !season.error && !season.empty && season.teams ? season.teams.find(x => x.rosterId === shownTeam.rosterId) : null;
  const row = (label, body, tab, link) => `<div class="grid sm:grid-cols-[130px_minmax(0,1fr)_auto] gap-x-4 gap-y-1 py-3 border-t border-white/5 first:border-t-0 items-baseline">
      <div class="text-[11px] uppercase tracking-widest text-zinc-400">${label}</div>
      <div class="text-[14px] text-zinc-200 leading-relaxed">${body}</div>
      <button onclick="showTab('${tab}')" class="text-left sm:text-right text-[12px] text-zinc-300 hover:text-white underline underline-offset-2 decoration-white/20 whitespace-nowrap">${link}</button>
    </div>`;
  box.innerHTML = row('This season', st ? Vault.escapeHtml(st.verdict) : season ? '<span class="text-zinc-400">No games played yet.</span>' : '<span class="text-zinc-400">Loading this season…</span>', 'season', 'Luck, injuries, lineup calls')
    + row('Which way', suggestion ? `<span class="font-semibold text-amber-200">${suggestion.label}</span> <span class="text-zinc-400">is suggested.</span> ${Vault.escapeHtml(suggestion.why)}` : '<span class="text-zinc-400">Working out the four paths…</span>', 'future', 'All four paths');
}

async function loadLeague(id) {
  $('#status').textContent = 'Loading league…';
  renderSeason(null);
  Vault.seasonReport(id).then(r => { season = r; }).catch(e => { console.error(e); season = { error: e.message }; })
    .then(() => { renderSeason(+$('#teamSelect').value || null); Timeline.setSeason(season); });
  try {
    const { isSF, league, slots, remainingWeeks, teams: built } = await Vault.buildLeagueTeams(id);
    window._allTeams = built; window._slots = slots; window._weeksLeft = remainingWeeks || []; window._playoffStart = league.settings?.playoff_week_start || 15; window._league = league;
    // Contend or rebuild? (timeline.js): the four paths, under This season.
    Timeline.init({ league, slots, teams: built, remainingWeeks });

    const sel = $('#teamSelect'); sel.innerHTML = built.map(t => `<option value="${t.rosterId}">${Vault.escapeHtml(t.teamName)}${t.username ? ` (${Vault.escapeHtml(t.username)})` : ''}</option>`).join(''); sel.classList.remove('hidden');
    // A link can name the team (League Overview's "Open in Team Analyzer");
    // otherwise it opens on yours.
    const asked = new URLSearchParams(location.search).get('team');
    const start = built.find(t => String(t.rosterId) === asked) || Vault.myTeam(built) || built[0];
    sel.value = String(start.rosterId);
    sel.onchange = () => {
      renderSingle(built.find(t => String(t.rosterId) === sel.value));
      // Keep the address on the team shown, so it can be shared or reloaded.
      const u = new URL(location.href); u.searchParams.set('team', sel.value); history.replaceState(null, '', u);
    };

    renderSingle(start);
    $('#status').textContent = `${built.length} teams • ${isSF ? 'Superflex' : '1QB'}`;
    return true;
  } catch (e) {
    console.error(e);
    $('#status').textContent = Vault.loadError(e);
    return false;
  }
}

// Real per-team standing (Vault.heatColor, normalized to this league's own
// observed min-max for the stat — same approach League Overview's microBar
// uses) instead of a decorative fixed rainbow that looked identical on every
// tile no matter where the team actually stood. Also surfaces the team's real
// rank among all teams, since a raw number like "158,661" alone doesn't say
// whether that's 1st or 8th. `higherIsBetter` null keeps a stat neutral (grey,
// no rank-implies-good/bad) — used for Age, which mirrors League Overview never
// coloring Age either, since younger/older isn't a low=bad/high=good scale.
function statTile(label, val, display, all, key, rosterId, higherIsBetter, title) {
  const finite = Number.isFinite(val);
  const vals = all.map(x => x[key]).filter(Number.isFinite);
  const min = vals.length ? Math.min(...vals) : 0, max = vals.length ? Math.max(...vals) : 0;
  const t = finite && max > min ? (val - min) / (max - min) : 0.5;
  const color = !finite || higherIsBetter == null ? 'rgba(236,236,239,0.12)' : `rgba(236,236,239,${(0.12 + 0.5 * (higherIsBetter ? t : 1 - t)).toFixed(2)})`;
  const ranked = all.filter(x => Number.isFinite(x[key])).sort((a, b) => higherIsBetter === false ? a[key] - b[key] : b[key] - a[key]);
  const rankIdx = finite ? ranked.findIndex(x => x.rosterId === rosterId) : -1;
  const rankText = rankIdx >= 0 ? `#${rankIdx + 1}/${ranked.length}` : '—';
  return `<div class="stat-tile relative overflow-hidden max-sm:!px-2.5 max-sm:!py-2" ${title ? `title="${Vault.escapeHtml(title)}"` : ''}>
    <div class="absolute top-0 inset-x-0 h-[3px]" style="background:${color}"></div>
    <div class="flex max-sm:flex-col sm:items-center justify-between gap-x-2 mt-1">
      <div class="stat-label">${label}</div>
      <div class="text-[11px] mono text-zinc-400">${rankText}</div>
    </div>
    <div class="stat-value">${display}</div>
  </div>`;
}

function renderSingle(t) {
  if (!t) return;
  shownTeam = t; suggestion = null;
  if (season) renderSeason(t.rosterId);
  const all = window._allTeams || [];
  Timeline.render($('#timelineCard'), t, { extraHtml: windowChart(t, all) + leagueMap(t, all) });
  // The suggested path for the Overview line, after the page has painted (a few season simulations).
  setTimeout(() => { if (shownTeam !== t) return; suggestion = Timeline.suggestFor(t); renderGlance(); }, 0);
  const leagueAvg = {
    qb: all.reduce((s, x) => s + x.qb, 0) / all.length,
    rb: all.reduce((s, x) => s + x.rb, 0) / all.length,
    wr: all.reduce((s, x) => s + x.wr, 0) / all.length,
    te: all.reduce((s, x) => s + x.te, 0) / all.length,
    picks: all.reduce((s, x) => s + x.picksValue, 0) / all.length,
    age: all.reduce((s, x) => s + x.age, 0) / all.length,
  };
  const flaws = Vault.fatalFlaws(t, leagueAvg, all);
  const partners = getTradePartners(t, all);
  const isMine = Vault.myTeam(all) === t; // your own team: each partner links to Trade Coach's trades with them

  const statTiles = [
    statTile(Vault.term('overall', 'Overall'), t.overall, Math.round(t.overall).toLocaleString(), all, 'overall', t.rosterId, true),
    statTile(Vault.term('players', 'Players'), t.total, Math.round(t.total).toLocaleString(), all, 'total', t.rosterId, true),
    statTile(Vault.term('lineupPpg', 'Lineup PPG'), t.opt, t.opt.toFixed(1), all, 'opt', t.rosterId, true),
    statTile(Vault.term('vorpTeam', 'VORP'), t.vorpTotal, Number.isFinite(t.vorpTotal) ? Vault.num1(t.vorpTotal) : '—', all, 'vorpTotal', t.rosterId, true),
    statTile(Vault.term('age', 'Age'), t.age, t.age.toFixed(1), all, 'age', t.rosterId, null),
    statTile(Vault.term('picks', 'Picks<span class="max-sm:hidden"> Value</span>'), t.picksValue, Math.round(t.picksValue).toLocaleString(), all, 'picksValue', t.rosterId, true),
  ].join('');
  $('#singleCard').innerHTML = `
  <div class="card rounded-vault p-4 sm:p-6 fade-in">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h2 class="display text-[22px] sm:text-[24px] leading-tight gold-text">${Vault.escapeHtml(t.teamName)}</h2>
        <p class="text-[12px] text-zinc-400">${[t.username ? '@' + Vault.escapeHtml(t.username) : '', `#${t.rank} of ${all.length} in value`, t.record ? `${t.record.wins}-${t.record.losses}${t.record.ties ? '-' + t.record.ties : ''}` : '', Number.isFinite(t.playoffPct) ? `${pctText(t.playoffPct)} playoff odds` : ''].filter(Boolean).join(' · ')}</p>
      </div>
      <span title="${Vault.escapeHtml(Vault.ARCHETYPE_INFO[t.arch]?.desc || '')}" class="shrink-0 px-3 py-1.5 rounded-full text-[12px] border bg-gradient-to-r ${t.archCls}">${t.arch}</span>
    </div>
    <div class="[.tiles-off_&]:max-sm:hidden grid grid-cols-3 md:grid-cols-6 gap-2 sm:gap-4 mt-3 sm:mt-6">
      ${statTiles}
    </div>
  </div>`;

  // Overview: the glance, flaws and trade partners.
  const partnerSub = p => [p.record ? `${p.record.wins}-${p.record.losses}${p.record.ties ? '-' + p.record.ties : ''}` : '', Number.isFinite(p.playoffPct) ? `${pctText(p.playoffPct)} playoff odds` : '', p.arch].filter(Boolean).join(' · ');
  $('#overviewCard').innerHTML = `
    <div class="card rounded-vault p-5 mb-4"><div id="glance"></div></div>
    <div class="grid lg:grid-cols-2 gap-4 items-start">
      <div class="card rounded-vault p-5">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-2">Weak spots</div>
        <div class="space-y-1.5 text-[13px] text-zinc-200">${flaws.length ? flaws.map(f => `<div class="flex gap-2"><span class="text-orange-400">•</span><span>${f}</span></div>`).join('') : '<div class="text-zinc-400">Nothing notable</div>'}</div>
      </div>
      <div class="card rounded-vault p-5">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-2">Best trade partners</div>
        <div class="space-y-4">${partners.map(p => `
          <div>
            <div class="flex justify-between items-start gap-3">
              <div class="min-w-0"><div class="text-[14px] text-zinc-100">${Vault.escapeHtml(p.teamName)}</div><div class="text-[12px] text-zinc-400">${Vault.escapeHtml(partnerSub(p))}</div></div>
              <div class="text-[12px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 shrink-0" title="How well the two rosters and timelines complement each other">${p.fit >= 6 ? 'Strong fit' : p.fit >= 3 ? 'Good fit' : p.fit >= 1 ? 'Some fit' : 'Weak fit'}</div>
            </div>
            <div class="mt-1.5 space-y-0.5">${[...partnerLines(t, p), ...p.reasons].slice(0, 3).map(r => `<div class="flex gap-1.5 text-[13px] text-zinc-300"><span class="text-emerald-400/80">•</span><span>${Vault.escapeHtml(r)}</span></div>`).join('')}</div>
            ${isMine ? `<a href="${Vault.linkTo('trade.html')}&coach=team&with=${p.rosterId}" class="inline-block mt-1.5 text-[12px] text-zinc-200 hover:text-white underline underline-offset-2 decoration-white/20">Start a trade with them</a>` : ''}
          </div>`).join('')}</div>
      </div>
    </div>
    `;
  $('#seasonExtras').innerHTML = whatIfCard(t) + scheduleCard(t, all);
  $('#futureExtras').innerHTML = picksGrid(t, all);
  wireWhatIf(t, all);
  renderGlance();
  $('#rosterCard').innerHTML = `<div class="flex justify-end gap-2 mb-2"><button type="button" id="printTeam" class="text-[12px] px-3 py-1.5 rounded-lg border border-white/10 text-zinc-300 hover:text-white hover:border-white/20">Print report</button><button type="button" id="copyRoster" class="text-[12px] px-3 py-1.5 rounded-lg border border-white/10 text-zinc-300 hover:text-white hover:border-white/20">Copy as CSV</button></div>${Vault.teamRosterPanel(t, all)}`;
  $('#printTeam').onclick = () => printReport(t, all);
  $('#copyRoster').onclick = async e => {
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const players = [...t.plist].sort((a, b) => b.value - a.value).map(p => [p.name, p.pos, p.nfl, p.age ? p.age.toFixed(1) : '', Math.round(p.value), p.ppg ? p.ppg.toFixed(1) : '']);
    const picks = [...t.picks].sort((a, b) => b.value - a.value).map(p => [Vault.pickName(p), 'Pick', '', '', Math.round(p.value), '']);
    const csv = [['Name', 'Pos', 'Team', 'Age', 'Value', 'Proj. PPG'], ...players, ...picks].map(r => r.map(cell).join(',')).join('\n');
    try { await navigator.clipboard.writeText(csv); e.target.textContent = 'Copied'; } catch { window.prompt('Copy this:', csv); }
  };
}

// What a trade with this partner could look like, in names (2026-10-23, user: "what they
// have that you need, what you have that they'd want"): their players who'd start for
// this team, by points a week added to its best lineup; and what they'd want back:
// picks if they're building for later, else this team's bench players who'd start for them.
const ORD = r => r + ({ 1: 'st', 2: 'nd', 3: 'rd' }[r] || 'th');
function partnerLines(t, p) {
  const slots = window._slots, lines = [];
  if (!slots) return lines;
  const gain = (team, x) => Vault.seasonLineupDetail([...team.plist, x], slots).total - team.opt;
  const best = (from, to) => from.plist.filter(x => x.value > 0 && x.ppg > 0).sort((a, b) => b.ppg - a.ppg).slice(0, 25)
    .map(x => ({ x, g: gain(to, x) })).filter(c => c.g >= 1).sort((a, b) => b.g - a.g).slice(0, 2);
  const pts = c => `${c.x.name} (+${c.g.toFixed(1)} pts a week)`;
  const theirs = best(p, t);
  if (theirs.length) lines.push(`Would start for ${t.teamName}: ${theirs.map(pts).join(', ')}`);
  if (Vault.teamMode(p) === 'rebuild') {
    const picks = [...(t.picks || [])].filter(k => k.value > 0).sort((a, b) => b.value - a.value).slice(0, 2);
    if (picks.length) lines.push(`Picks ${p.teamName} would want: ${t.teamName}'s ${picks.map(k => `${k.season} ${ORD(k.round)}`).join(' and ')}`);
  } else {
    const starting = new Set((t.lineup || []).map(x => x.id));
    const mine = best({ ...t, plist: t.plist.filter(x => !starting.has(x.id)) }, p);
    if (mine.length) lines.push(`Would start for ${p.teamName}: ${mine.map(pts).join(', ')}`);
  }
  return lines;
}

/* Contend or rebuild, league-wide (moved here from League Overview 2026-10-27, user: it
   "makes league overview cluttered"): each team by its projected lineup this season
   against its total dynasty value, lines at the league averages, this team in gold.
   Labels placed so they don't collide (this team first; right, left, above, below, then the
   corners and further out with a line back to its dot). Every team gets one (user,
   2026-11-05: a bare dot means nothing): with no free spot one may sit over a corner caption,
   and in a real pile-up over another label. */
function leagueMap(t, all) {
  if (all.length < 2) return '';
  const narrow = window.innerWidth < 640, W = narrow ? 360 : 760, H = narrow ? 340 : 360, L = narrow ? 56 : 64, R = 16, T = 20, B = 46;
  const kFmt = v => (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v)));
  const xs = all.map(x => x.opt), ys = all.map(x => x.overall);
  const pad = (lo, hi) => { const d = (hi - lo) || 1; return [lo - d * 0.08, hi + d * 0.08]; };
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length, mx = X(avg(xs)), my = Y(avg(ys));
  const ticks = (lo, hi, n) => [...Array(n)].map((_, i) => lo + (hi - lo) * (i + 0.5) / n);
  const xt = ticks(x0, x1, narrow ? 3 : 4).map(v => `<text x="${X(v)}" y="${H - B + 18}" text-anchor="middle" class="fill-zinc-500" font-size="11">${v.toFixed(0)}</text>`).join('');
  const yt = ticks(y0, y1, 4).map(v => `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="fill-zinc-500" font-size="11">${kFmt(v)}</text>`).join('');
  const quad = (x, y, anchor, text) => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="fill-zinc-500" font-size="11" letter-spacing="0.08em">${text}</text>`;
  const pts = all.map(x => ({ t: x, cx: X(x.opt), cy: Y(x.overall), me: x.rosterId === t.rosterId, short: x.teamName.length > (narrow ? 11 : 18) ? x.teamName.slice(0, narrow ? 10 : 17) + '…' : x.teamName }));
  const cap = (x, y, anchor, text) => { const w = text.length * 8.5; return anchor === 'end' ? { x0: x - w, x1: x, y0: y - 11, y1: y + 2, cap: 1 } : { x0: x, x1: x + w, y0: y - 11, y1: y + 2, cap: 1 }; };
  const boxes = [...pts.map(p => ({ x0: p.cx - 8, x1: p.cx + 8, y0: p.cy - 8, y1: p.cy + 8 })),
    cap(W - R - 4, T + 12, 'end', narrow ? 'NOW + LATER' : 'STRONG NOW AND LATER'), cap(W - R - 4, H - B - 8, 'end', 'WIN NOW'), cap(L + 6, T + 12, 'start', 'BUILT FOR LATER'), cap(L + 6, H - B - 8, 'start', 'REBUILD')];
  const hits = (b, list) => list.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
  const labels = new Map();
  [...pts].sort((a, b) => b.me - a.me).forEach(p => {
    const w = p.short.length * 6.6, h = 14, mid = Math.max(L, Math.min(W - R - w, p.cx - w / 2));
    const right = [p.cx + 11, 'start', p.cx + 11, p.cx + 11 + w], left = [p.cx - 11, 'end', p.cx - 11 - w, p.cx - 11], over = [mid, 'start', mid, mid + w];
    const at = ([x, anchor, lx0, lx1], y, far = false) => [x, y, anchor, lx0, lx1, far];
    const spots = [at(right, p.cy + 4), at(left, p.cy + 4), at(over, p.cy - 12), at(over, p.cy + 21), at(right, p.cy - 8), at(right, p.cy + 16), at(left, p.cy - 8), at(left, p.cy + 16),
      at(over, p.cy - 28, true), at(over, p.cy + 37, true), at(left, p.cy - 24, true), at(left, p.cy + 32, true), at(right, p.cy - 24, true), at(right, p.cy + 32, true)];
    const fits = ([, y, , lx0, lx1]) => lx0 >= L && lx1 <= W - R && y - h + 2 >= 0 && y + 4 <= H - B + 4;
    const box = ([, y, , lx0, lx1]) => ({ x0: lx0 - 3, x1: lx1 + 3, y0: y - h + 2, y1: y + 4 });
    const free = list => spots.find(s => fits(s) && !hits(box(s), list));
    const spot = free(p.me ? boxes.filter(o => !o.cap) : boxes) || free(boxes.filter(o => !o.cap)) || spots.find(fits) || spots[0];
    boxes.push(box(spot));
    labels.set(p, { x: spot[0], y: spot[1], anchor: spot[2], line: spot[5] ? [(spot[3] + spot[4]) / 2, spot[1] < p.cy ? spot[1] + 3 : spot[1] - 11] : null });
  });
  const link = x => `${Vault.linkTo('team-analyzer.html')}&team=${x.rosterId}${location.hash}`;
  const dots = [...pts].sort((a, b) => a.me - b.me).map(p => {
    const x = p.t, lab = labels.get(p);
    const tip = `${x.teamName}: ${x.opt.toFixed(1)} projected lineup points a week, ${Math.round(x.overall).toLocaleString()} dynasty value`;
    return `<a href="${link(x)}" aria-label="${Vault.escapeHtml(x.teamName)}"><g class="cursor-pointer"><title>${Vault.escapeHtml(tip)}</title>
      ${lab.line ? `<line x1="${p.cx}" y1="${p.cy}" x2="${lab.line[0]}" y2="${lab.line[1]}" stroke="currentColor" class="text-white/20"></line>` : ''}
      <circle cx="${p.cx}" cy="${p.cy}" r="${p.me ? 8 : 6.5}" class="${p.me ? 'fill-amber-400' : 'fill-zinc-300'}" stroke="#14161b" stroke-width="2"></circle>
      <text x="${lab.x}" y="${lab.y}" text-anchor="${lab.anchor}" font-size="12" class="${p.me ? 'fill-amber-200' : 'fill-zinc-400'}">${Vault.escapeHtml(p.short)}</text></g></a>`;
  }).join('');
  return `<div class="mt-3 rounded-2xl bg-black/30 border border-white/5 p-4">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400">Where every team stands</div>
        <div class="text-[12px] text-zinc-400">Projected lineup for the rest of the season against dynasty value. Lines are the league average. Click a team to open it.</div>
      </div>
      <div class="overflow-x-auto"><svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Every team: lineup strength against dynasty value">
        <line x1="${mx}" y1="${T}" x2="${mx}" y2="${H - B}" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4 4"></line>
        <line x1="${L}" y1="${my}" x2="${W - R}" y2="${my}" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4 4"></line>
        <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="rgba(255,255,255,0.15)"></line>
        ${quad(W - R - 4, T + 12, 'end', narrow ? 'NOW + LATER' : 'STRONG NOW AND LATER')}${quad(W - R - 4, H - B - 8, 'end', 'WIN NOW')}${quad(L + 6, T + 12, 'start', 'BUILT FOR LATER')}${quad(L + 6, H - B - 8, 'start', 'REBUILD')}
        ${xt}${yt}
        <text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" class="fill-zinc-400" font-size="12">${narrow ? 'Projected points a week →' : 'Projected lineup points a week, rest of season →'}</text>
        <text transform="translate(${narrow ? 11 : 14} ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" class="fill-zinc-400" font-size="12">Dynasty value →</text>
        ${dots}
      </svg></div>
    </div>`;
}

/* What if a starter's out the rest of the way? The same season simulation as the odds, on the same
   random games, with this team's lineup rebuilt week by week without him (user's list, 2026-11-05). */
function whatIfCard(t) {
  if (!(window._weeksLeft || []).length) return '';
  const opts = t.lineup.filter(p => p.id).sort((a, b) => (b.ppg || 0) - (a.ppg || 0)).map(p => `<option value="${Vault.escapeHtml(p.id)}">${Vault.escapeHtml(p.name)}</option>`).join('');
  return `<div class="card rounded-vault p-5 mt-4">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1"><div class="text-[11px] uppercase tracking-widest text-zinc-400">What if he's out?${Vault.info('whatIf')}</div>
        <select id="whatIfPick" aria-label="Starter" class="bg-black/40 border border-white/10 rounded-lg px-2 py-1.5 text-[13px] text-zinc-200 max-w-[210px]"><option value="">Pick a starter…</option>${opts}</select></div>
      <div id="whatIfOut" class="text-[13px] text-zinc-400">See your odds without a starter for the rest of the season.</div>
    </div>`;
}
function wireWhatIf(t, all) {
  const sel = $('#whatIfPick');
  if (!sel) return;
  sel.onchange = () => {
    const box = $('#whatIfOut');
    if (!sel.value) return;
    const after = Vault.seasonLineupDetail(t.plist.filter(p => String(p.id) !== sel.value), window._slots), who = t.plist.find(p => String(p.id) === sel.value);
    const byWeek = new Map([...(after.byWeek || new Map())].map(([w, v]) => [w, v - (t.optByWeek?.get(w) ?? v)]));
    const opts = { trials: 4000, seed: 20260929 };
    const base = Vault.simulateSeason(all, window._league, window._weeksLeft, opts).get(t.rosterId);
    const out = Vault.simulateSeason(all, window._league, window._weeksLeft, { ...opts, strengthDelta: new Map([[t.rosterId, { flat: 0, avg: after.total - t.opt, byWeek }]]) }).get(t.rosterId);
    const line = (label, a, b) => `<div><div class="num text-[22px] text-zinc-100">${pctText(a)} to ${pctText(b)}</div><div class="text-[12px] text-zinc-400">${label}</div></div>`;
    box.innerHTML = `<div class="grid grid-cols-3 gap-3 mt-2">${line('playoff odds', base.playoffPct, out.playoffPct)}${line('title odds', base.championshipPct, out.championshipPct)}<div><div class="num text-[22px] text-orange-300">${(t.opt - after.total).toFixed(1)}</div><div class="text-[12px] text-zinc-400">points a week lost</div></div></div>
      <div class="text-[12px] text-zinc-500 mt-2">Without ${Vault.escapeHtml(who?.name || 'him')}, your bench fills in each week.</div>`;
  };
}

/* A one-page report to print or save as a PDF (user's list, 2026-11-05). Its own plain black-on-white
   sheet, shown only when printing, so the dark page doesn't have to print well. */
function printReport(t, all) {
  const box = document.getElementById('printReport') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'printReport' }));
  const e = Vault.escapeHtml, p = t.projected, rank = key => [...all].sort((a, b) => b[key] - a[key]).indexOf(t) + 1;
  const players = [...t.plist].sort((a, b) => b.value - a.value), years = [...new Set(t.picks.map(x => +x.season))].sort();
  box.innerHTML = `<h1>${e(t.teamName)}</h1><p>${t.record ? `${t.record.wins}-${t.record.losses}${t.record.ties ? `-${t.record.ties}` : ''} · ` : ''}${Vault.MODE_LABEL[Vault.teamMode(t)]} · The Vault, ${new Date().toLocaleDateString()}</p>
    <table class="pr-stats"><tr><td><b>#${rank('overall')}</b> of ${all.length}<br>Team value</td><td><b>${t.opt.toFixed(1)}</b><br>Lineup PPG</td><td><b>${p ? pctText(p.playoffPct) : '—'}</b><br>Playoff odds</td><td><b>${p ? pctText(p.championshipPct) : '—'}</b><br>Title odds</td></tr></table>
    <div class="pr-cols"><div><h2>Players</h2><table>${players.slice(0, 24).map(a => `<tr><td>${e(a.name)}</td><td>${e(a.pos)}</td><td class="n">${Math.round(a.value).toLocaleString()}</td></tr>`).join('')}</table></div>
    <div><h2>Picks</h2>${years.map(y => `<p><b>${y}:</b> ${t.picks.filter(x => +x.season === y).map(x => e(Vault.pickName(x))).join(', ')}</p>`).join('')}</div></div>`;
  print();
}

/* What's left this season (user's list, 2026-11-05): each game's opponent at that week's projected
   lineup, the same numbers the odds play out, and how strong this team's lineup is in the playoff
   weeks. Green is an easier opponent than the league's average that week, orange a harder one. */
function scheduleCard(t, all) {
  // A stand-in schedule (none from Sleeper until after the draft) plays out the odds, but its opponents aren't real.
  const weeks = (window._weeksLeft || []).filter(w => w.week < window._playoffStart && !w.guessed);
  const at = (x, w) => (x.optByWeek?.has(w) ? x.optByWeek.get(w) : x.opt);
  const gamesOf = x => weeks.flatMap(w => {
    const pair = w.pairs.find(p => p.includes(x.rosterId)), opp = pair && all.find(y => y.rosterId === pair.find(id => id !== x.rosterId));
    return opp ? [{ week: w.week, opp, pts: at(opp, w.week), avg: all.reduce((s, y) => s + at(y, w.week), 0) / all.length }] : [];
  });
  const games = gamesOf(t);
  const avg = l => l.reduce((s, v) => s + v, 0) / l.length;
  const hardness = all.map(x => ({ x, v: gamesOf(x).map(g => g.pts) })).filter(r => r.v.length).map(r => ({ x: r.x, v: avg(r.v) })).sort((a, b) => b.v - a.v);
  const po = x => { const w = [...(x.optByWeek?.keys() || [])].filter(k => k >= window._playoffStart); return w.length ? avg(w.map(k => x.optByWeek.get(k))) : null; };
  const poRank = all.map(x => ({ x, v: po(x) })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  if (!games.length && !poRank.length) return '';
  const rankOf = (list, x) => list.findIndex(r => r.x === x) + 1;
  const stat = (v, label, sub) => `<div><div class="num text-[22px] text-zinc-100">${v}</div><div class="text-[12px] text-zinc-300">${label}</div><div class="text-[12px] text-zinc-500">${sub}</div></div>`;
  const chip = g => { const d = g.pts - g.avg, tone = Math.abs(d) < 4 ? 'text-zinc-300' : d > 0 ? 'text-orange-300' : 'text-emerald-300';
    return `<div class="rounded-lg bg-black/25 border border-white/5 px-2.5 py-1.5 min-w-0"><div class="text-[11px] text-zinc-500">Week ${g.week}</div><div class="text-[12px] text-zinc-200 truncate">${Vault.teamLink(g.opp)}</div><div class="mono text-[12px] ${tone}">${g.pts.toFixed(1)}</div></div>`; };
  const tp = po(t);
  return `<div class="card rounded-vault p-5 mt-4">
      <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-3">Schedule left${Vault.info('scheduleLeft')}</div>
      <div class="grid grid-cols-2 gap-4 mb-3">
        ${games.length ? stat(`#${rankOf(hardness, t)} of ${hardness.length}`, 'hardest schedule left', `opponents average ${avg(games.map(g => g.pts)).toFixed(1)} a week`) : ''}
        ${tp != null ? stat(`#${rankOf(poRank, t)} of ${poRank.length}`, 'lineup in the playoff weeks', `${tp.toFixed(1)} a week from week ${window._playoffStart}`) : ''}
      </div>
      ${games.length ? `<div class="grid gap-2 overflow-x-auto scrollbar-none" style="grid-template-columns:repeat(${games.length},minmax(96px,1fr))">${games.map(chip).join('')}</div>` : ''}
    </div>`;
}

/* Picks by year for every team, so you can see who's loaded in which draft (user's list,
   2026-11-05). Shade is the year's KTC value in picks, the small line its 1sts. */
function picksGrid(t, all) {
  const years = [...new Set(all.flatMap(x => (x.picks || []).map(p => +p.season)))].sort((a, b) => a - b);
  if (!years.length) return '';
  const inYear = (x, y) => (x.picks || []).filter(p => +p.season === y);
  const worth = l => l.reduce((s, p) => s + (p.value || 0), 0);
  const top = Math.max(...all.flatMap(x => years.map(y => worth(inYear(x, y)))), 1);
  const cell = (x, y) => { const l = inYear(x, y), v = worth(l), firsts = l.filter(p => p.round === 1).length;
    return `<td class="py-1 px-0.5"><div class="rounded-md px-1 py-1 text-center" style="background:rgba(56,189,248,${(0.04 + 0.34 * v / top).toFixed(2)})" title="${l.length} pick${l.length === 1 ? '' : 's'} in ${y}: ${Vault.escapeHtml(l.map(p => Vault.pickName(p)).join(', ') || 'none')}"><div class="mono text-[12px] text-zinc-100">${v ? (v / 1000).toFixed(1) + 'k' : '—'}</div><div class="text-[10px] text-zinc-400">${firsts ? `${firsts} 1st${firsts === 1 ? '' : 's'}` : '&nbsp;'}</div></div></td>`; };
  const rows = [...all].sort((a, b) => b.picksValue - a.picksValue).map(x => `<tr class="${x === t ? 'text-amber-200' : 'text-zinc-300'}"><td class="py-1 pr-2 text-[12px] max-w-[110px] sm:max-w-[200px] truncate">${Vault.teamLink(x)}</td>${years.map(y => cell(x, y)).join('')}</tr>`).join('');
  return `<div class="card rounded-vault p-5 mt-4">
      <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-3">Picks by year${Vault.info('picksByYear')}</div>
      <div class="overflow-x-auto"><table class="w-full table-fixed text-left"><thead><tr class="text-[11px] text-zinc-500"><th class="font-normal pb-1 w-[34%]">Team</th>${years.map(y => `<th class="font-normal pb-1 text-center">${y}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}

// The five-year contention window, under Contend or rebuild?'s tiles: projected
// value each season, and which seasons are in the window.
function windowChart(t, all) {
  const win = Vault.contentionWindow(t, all);
  return `<div class="mt-3 rounded-2xl bg-black/30 border border-white/5 p-4">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400">Contention window, next ${win.years} seasons${Vault.info('window5')}</div>
        <div class="text-[12px] text-zinc-400">${win.hasWindow ? `${t.windowYears} of ${win.years} seasons in the window` : 'No season in the window'} · peak value in ${win.peakYear}</div>
      </div>
      <div class="flex items-end gap-2 h-[64px]">${win.proj.map((v, i) => `<div class="flex-1 h-full flex flex-col justify-end"><div class="w-full rounded-t ${win.inWindow[i] ? 'bg-emerald-400/70' : 'bg-zinc-600/60'}" style="height:${Math.max(8, v / win.peak * 100)}%" title="${win.startYear + i}: ${Math.round(v).toLocaleString()} projected value, ${win.projPPG[i].toFixed(1)} projected PPG"></div></div>`).join('')}</div>
      <div class="flex gap-2 text-[12px] mt-1 text-zinc-400">${win.proj.map((v, i) => `<span class="flex-1 text-center">${win.startYear + i}</span>`).join('')}</div>
      <div class="text-[11px] text-zinc-500 mt-2">Green: in the window (${win.seasonOdds != null ? `this season, playoff odds of 50% or more; later, ` : ''}projected value within 88% of its peak and projected points above the playoff line, ${win.playoffLine.toFixed(1)} a week for the top ${win.playoffSpots}). <span class="[@media(hover:none)]:hidden">Hover a bar for its numbers.</span></div>
    </div>`;
}


showTab(location.hash.slice(1) || (() => { try { return localStorage.getItem('vault_team_tab'); } catch { return null; } })() || 'overview');
window.addEventListener('DOMContentLoaded', () => loadLeague(Vault.getLeagueId()));
</script>
