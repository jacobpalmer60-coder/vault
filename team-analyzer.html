<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="brand/vault-dial-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="brand/vault-dial-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/vault-dial-180.png">
<title>Team Analyzer — The Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css?v=3aeabd20">
<link rel="stylesheet" href="tailwind.css?v=a6740d1d">
</head>
<body class="text-zinc-100 antialiased">
<div class="vault-bg"></div>

<div id="vault-nav"></div>

<main class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8 lg:py-10 fade-in" data-league-required>
  <!-- League is picked once, in the nav's Switch League. The full league table
       lives on League Overview; this page is one team at a time. -->
  <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-3">
    <div>
      <h1 class="display text-[28px] font-semibold gold-text">Team Analyzer</h1>
      <div id="status" class="text-[13px] text-zinc-400 mt-1">Loading league…</div>
      <p class="text-[13px] text-zinc-400 mt-2 max-w-[620px]">One team in depth: where it ranks, how this season is really going, its roster, and which way to take it. Pick any team on the right.</p>
    </div>
    <select id="teamSelect" data-search="Type a team…" aria-label="Team" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-[14px] min-w-[240px] hidden"></select>
  </div>

  <!-- The team's header stays above the tabs; one section at a time below (2026-10-23). -->
  <section id="singleCard" class="mb-4"></section>
  <div id="teamTabs" role="tablist" aria-label="Team sections" class="flex flex-wrap gap-1.5 mb-4 scroll-mt-4"></div>
  <section data-tab="overview" role="tabpanel" id="overviewCard" class="mb-10"></section>
  <section data-tab="roster" role="tabpanel" id="rosterCard" class="hidden card rounded-vault p-6 mb-10"></section>
  <section data-tab="season" role="tabpanel" id="seasonCard" class="hidden card rounded-vault p-6 mb-10"></section>
  <section data-tab="future" role="tabpanel" id="timelineCard" class="hidden card rounded-vault p-6 mb-10"></section>
</main>

<script src="vault-core.js?v=3163f84e"></script>
<script src="vault-nav.js?v=786ac780"></script>
<script src="season-report.js?v=837c7cb0"></script>
<script src="market-data.js?v=07632230"></script>
<script src="timeline.js?v=e398b38a"></script>
<script>
const $ = s => document.querySelector(s);

// Promoted to Vault.tradePartnerSuggestions so the Trade Calculator can surface the
// same suggestions while a trade is actually being built.
function getTradePartners(t, all) { return Vault.tradePartnerSuggestions(t, all, 2); }

// This season (season-report.js): loads alongside the team values and fills
// in below the team card once Sleeper's weekly data is in.
let season = null;
function renderSeason(rosterId) {
  Vault.renderSeasonReport($('#seasonCard'), season, rosterId, {
    myId: (Vault.myTeam(window._allTeams || []) || {}).rosterId,
    onPickTeam: id => { const sel = $('#teamSelect'); sel.value = String(id); sel.onchange(); $('#singleCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  renderGlance();
}

/* ---------- Tabs ----------
   Overview, Roster, This season, Contend or rebuild: one at a time, in the address
   (#roster…) so a link opens on it, and remembered in this browser. */
const TEAM_TABS = [['overview', 'Overview'], ['roster', 'Roster'], ['season', 'This season'], ['future', 'Contend or rebuild?']];
function showTab(key) {
  if (!TEAM_TABS.some(([k]) => k === key)) key = 'overview';
  document.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('hidden', el.dataset.tab !== key));
  $('#teamTabs').innerHTML = TEAM_TABS.map(([k, label]) => `<button role="tab" aria-selected="${k === key}" onclick="showTab('${k}')" class="whitespace-nowrap text-[13px] px-3 sm:px-3.5 py-2 rounded-lg border transition-colors ${k === key ? 'bg-white/[0.08] border-white/25 text-white' : 'border-white/10 text-zinc-300 hover:text-white hover:border-white/20'}">${label}</button>`).join('');
  try { localStorage.setItem('vault_team_tab', key); } catch {}
  const u = new URL(location.href); u.hash = key === 'overview' ? '' : key; history.replaceState(null, '', u);
}
window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
const pctText = v => (v > 0 && v < 1 ? '<1' : v > 99 && v < 100 ? '>99' : Math.round(v)) + '%';

// Overview's first card: one line from This season and one from Contend or rebuild?,
// each filled in when its section has the numbers.
let shownTeam = null, suggestion = null;
function renderGlance() {
  const box = $('#glance');
  if (!box || !shownTeam) return;
  const st = season && !season.error && !season.empty && season.teams ? season.teams.find(x => x.rosterId === shownTeam.rosterId) : null;
  const row = (label, body, tab, link) => `<div class="grid sm:grid-cols-[130px_minmax(0,1fr)_auto] gap-x-4 gap-y-1 py-3 border-t border-white/5 first:border-t-0 items-baseline">
      <div class="text-[11px] uppercase tracking-widest text-zinc-400">${label}</div>
      <div class="text-[14px] text-zinc-200 leading-relaxed">${body}</div>
      <button onclick="showTab('${tab}')" class="text-left sm:text-right text-[12px] text-zinc-300 hover:text-white underline underline-offset-2 decoration-white/20 whitespace-nowrap">${link}</button>
    </div>`;
  box.innerHTML = row('This season', st ? Vault.escapeHtml(st.verdict) : season ? '<span class="text-zinc-400">No games played yet.</span>' : '<span class="text-zinc-400">Loading this season…</span>', 'season', 'Luck, injuries, lineup calls')
    + row('Which way', suggestion ? `<span class="font-semibold text-amber-200">${suggestion.label}</span> <span class="text-zinc-400">is suggested.</span> ${Vault.escapeHtml(suggestion.why)}` : '<span class="text-zinc-400">Working out the four paths…</span>', 'future', 'All four paths');
}

async function loadLeague(id) {
  $('#status').textContent = 'Loading league…';
  renderSeason(null);
  Vault.seasonReport(id).then(r => { season = r; }).catch(e => { console.error(e); season = { error: e.message }; })
    .then(() => { renderSeason(+$('#teamSelect').value || null); Timeline.setSeason(season); });
  try {
    const { isSF, league, slots, remainingWeeks, teams: built } = await Vault.buildLeagueTeams(id);
    window._allTeams = built; window._slots = slots;
    // Contend or rebuild? (timeline.js): the four paths, under This season.
    Timeline.init({ league, slots, teams: built, remainingWeeks });

    const sel = $('#teamSelect'); sel.innerHTML = built.map(t => `<option value="${t.rosterId}">${Vault.escapeHtml(t.teamName)}${t.username ? ` (${Vault.escapeHtml(t.username)})` : ''}</option>`).join(''); sel.classList.remove('hidden');
    // A link can name the team (League Overview's "Open in Team Analyzer");
    // otherwise it opens on yours.
    const asked = new URLSearchParams(location.search).get('team');
    const start = built.find(t => String(t.rosterId) === asked) || Vault.myTeam(built) || built[0];
    sel.value = String(start.rosterId);
    sel.onchange = () => {
      renderSingle(built.find(t => String(t.rosterId) === sel.value));
      // Keep the address on the team shown, so it can be shared or reloaded.
      const u = new URL(location.href); u.searchParams.set('team', sel.value); history.replaceState(null, '', u);
    };

    renderSingle(start);
    $('#status').textContent = `${built.length} teams • ${isSF ? 'Superflex' : '1QB'}`;
    return true;
  } catch (e) {
    console.error(e);
    $('#status').textContent = e.message;
    return false;
  }
}

// Real per-team standing (Vault.heatColor, normalized to this league's own
// observed min-max for the stat — same approach League Overview's microBar
// uses) instead of a decorative fixed rainbow that looked identical on every
// tile no matter where the team actually stood. Also surfaces the team's real
// rank among all teams, since a raw number like "158,661" alone doesn't say
// whether that's 1st or 8th. `higherIsBetter` null keeps a stat neutral (grey,
// no rank-implies-good/bad) — used for Age, which mirrors League Overview never
// coloring Age either, since younger/older isn't a low=bad/high=good scale.
function statTile(label, val, display, all, key, rosterId, higherIsBetter, title) {
  const finite = Number.isFinite(val);
  const vals = all.map(x => x[key]).filter(Number.isFinite);
  const min = vals.length ? Math.min(...vals) : 0, max = vals.length ? Math.max(...vals) : 0;
  const t = finite && max > min ? (val - min) / (max - min) : 0.5;
  const color = !finite || higherIsBetter == null ? 'rgba(236,236,239,0.12)' : `rgba(236,236,239,${(0.12 + 0.5 * (higherIsBetter ? t : 1 - t)).toFixed(2)})`;
  const ranked = all.filter(x => Number.isFinite(x[key])).sort((a, b) => higherIsBetter === false ? a[key] - b[key] : b[key] - a[key]);
  const rankIdx = finite ? ranked.findIndex(x => x.rosterId === rosterId) : -1;
  const rankText = rankIdx >= 0 ? `#${rankIdx + 1}/${ranked.length}` : '—';
  return `<div class="stat-tile relative overflow-hidden" ${title ? `title="${Vault.escapeHtml(title)}"` : ''}>
    <div class="absolute top-0 inset-x-0 h-[3px]" style="background:${color}"></div>
    <div class="flex items-center justify-between mt-1">
      <div class="stat-label">${label}</div>
      <div class="text-[11px] mono text-zinc-400">${rankText}</div>
    </div>
    <div class="stat-value">${display}</div>
  </div>`;
}

function renderSingle(t) {
  if (!t) return;
  shownTeam = t; suggestion = null;
  if (season) renderSeason(t.rosterId);
  const all = window._allTeams || [];
  Timeline.render($('#timelineCard'), t, { extraHtml: windowChart(t, all) });
  // The suggested path for the Overview line, after the page has painted (a few season simulations).
  setTimeout(() => { if (shownTeam !== t) return; suggestion = Timeline.suggestFor(t); renderGlance(); }, 0);
  const leagueAvg = {
    qb: all.reduce((s, x) => s + x.qb, 0) / all.length,
    rb: all.reduce((s, x) => s + x.rb, 0) / all.length,
    wr: all.reduce((s, x) => s + x.wr, 0) / all.length,
    te: all.reduce((s, x) => s + x.te, 0) / all.length,
    picks: all.reduce((s, x) => s + x.picksValue, 0) / all.length,
    age: all.reduce((s, x) => s + x.age, 0) / all.length,
  };
  const flaws = Vault.fatalFlaws(t, leagueAvg, all);
  const partners = getTradePartners(t, all);
  const isMine = Vault.myTeam(all) === t; // your own team: each partner links to Trade Coach's trades with them

  const statTiles = [
    statTile('Overall', t.overall, Math.round(t.overall).toLocaleString(), all, 'overall', t.rosterId, true),
    statTile('Players', t.total, Math.round(t.total).toLocaleString(), all, 'total', t.rosterId, true),
    statTile('Lineup PPG', t.opt, t.opt.toFixed(1), all, 'opt', t.rosterId, true),
    statTile('VORP', t.vorpTotal, Number.isFinite(t.vorpTotal) ? Vault.num1(t.vorpTotal) : '—', all, 'vorpTotal', t.rosterId, true, "Optimal lineup's total Value Over Replacement Player — real, scarcity-adjusted edge over readily-available replacements, not just raw scoring rate. Comparable across positions, unlike Opt PPG."),
    statTile('Age', t.age, t.age.toFixed(1), all, 'age', t.rosterId, null),
    statTile('Picks Value', t.picksValue, Math.round(t.picksValue).toLocaleString(), all, 'picksValue', t.rosterId, true),
  ].join('');
  $('#singleCard').innerHTML = `
  <div class="card rounded-vault p-6 fade-in">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="display text-[24px] gold-text">${Vault.escapeHtml(t.teamName)}</h2>
        <p class="text-[12px] text-zinc-400">${[t.username ? '@' + Vault.escapeHtml(t.username) : '', `#${t.rank} of ${all.length} in value`, t.record ? `${t.record.wins}-${t.record.losses}${t.record.ties ? '-' + t.record.ties : ''}` : '', Number.isFinite(t.playoffPct) ? `${pctText(t.playoffPct)} playoff odds` : ''].filter(Boolean).join(' · ')}</p>
      </div>
      <span title="${Vault.escapeHtml(Vault.ARCHETYPE_INFO[t.arch]?.desc || '')}" class="shrink-0 px-3 py-1.5 rounded-full text-[12px] border bg-gradient-to-r ${t.archCls}">${t.arch}</span>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 sm:gap-4 mt-6">
      ${statTiles}
    </div>
  </div>`;

  // Overview: the glance, flaws and trade partners.
  const partnerSub = p => [p.record ? `${p.record.wins}-${p.record.losses}${p.record.ties ? '-' + p.record.ties : ''}` : '', Number.isFinite(p.playoffPct) ? `${pctText(p.playoffPct)} playoff odds` : '', p.arch].filter(Boolean).join(' · ');
  $('#overviewCard').innerHTML = `
    <div class="card rounded-vault p-5 mb-4"><div id="glance"></div></div>
    <div class="grid lg:grid-cols-2 gap-4">
      <div class="card rounded-vault p-5">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-2">Weak spots</div>
        <div class="space-y-1.5 text-[13px] text-zinc-200">${flaws.length ? flaws.map(f => `<div class="flex gap-2"><span class="text-orange-400">•</span><span>${f}</span></div>`).join('') : '<div class="text-zinc-400">Nothing notable</div>'}</div>
      </div>
      <div class="card rounded-vault p-5">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-2">Best trade partners</div>
        <div class="space-y-4">${partners.map(p => `
          <div>
            <div class="flex justify-between items-start gap-3">
              <div class="min-w-0"><div class="text-[14px] text-zinc-100">${Vault.escapeHtml(p.teamName)}</div><div class="text-[12px] text-zinc-400">${Vault.escapeHtml(partnerSub(p))}</div></div>
              <div class="text-[12px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 shrink-0" title="How well the two rosters and timelines complement each other">${p.fit >= 6 ? 'Strong fit' : p.fit >= 3 ? 'Good fit' : p.fit >= 1 ? 'Some fit' : 'Weak fit'}</div>
            </div>
            <div class="mt-1.5 space-y-0.5">${[...partnerLines(t, p), ...p.reasons].slice(0, 3).map(r => `<div class="flex gap-1.5 text-[13px] text-zinc-300"><span class="text-emerald-400/80">•</span><span>${Vault.escapeHtml(r)}</span></div>`).join('')}</div>
            ${isMine ? `<a href="${Vault.linkTo('trade.html')}&coach=team&with=${p.rosterId}" class="inline-block mt-1.5 text-[12px] text-zinc-200 hover:text-white underline underline-offset-2 decoration-white/20">Find trades with them</a>` : ''}
          </div>`).join('')}</div>
      </div>
    </div>`;
  renderGlance();
  $('#rosterCard').innerHTML = Vault.teamRosterPanel(t, all);
}

// What a trade with this partner could look like, in names (2026-10-23, user: "what they
// have that you need, what you have that they'd want"): their players who'd start for
// this team, by points a week added to its best lineup; and what they'd want back:
// picks if they're building for later, else this team's bench players who'd start for them.
const ORD = r => r + ({ 1: 'st', 2: 'nd', 3: 'rd' }[r] || 'th');
function partnerLines(t, p) {
  const slots = window._slots, lines = [];
  if (!slots) return lines;
  const gain = (team, x) => Vault.seasonLineupDetail([...team.plist, x], slots).total - team.opt;
  const best = (from, to) => from.plist.filter(x => x.value > 0 && x.ppg > 0).sort((a, b) => b.ppg - a.ppg).slice(0, 25)
    .map(x => ({ x, g: gain(to, x) })).filter(c => c.g >= 1).sort((a, b) => b.g - a.g).slice(0, 2);
  const pts = c => `${c.x.name} (+${c.g.toFixed(1)} pts a week)`;
  const theirs = best(p, t);
  if (theirs.length) lines.push(`Would start for ${t.teamName}: ${theirs.map(pts).join(', ')}`);
  if (Vault.teamMode(p) === 'rebuild') {
    const picks = [...(t.picks || [])].filter(k => k.value > 0).sort((a, b) => b.value - a.value).slice(0, 2);
    if (picks.length) lines.push(`Picks ${p.teamName} would want: ${t.teamName}'s ${picks.map(k => `${k.season} ${ORD(k.round)}`).join(' and ')}`);
  } else {
    const starting = new Set((t.lineup || []).map(x => x.id));
    const mine = best({ ...t, plist: t.plist.filter(x => !starting.has(x.id)) }, p);
    if (mine.length) lines.push(`Would start for ${p.teamName}: ${mine.map(pts).join(', ')}`);
  }
  return lines;
}

// The five-year contention window, under Contend or rebuild?'s tiles: projected
// value each season, and which seasons are in the window.
function windowChart(t, all) {
  const win = Vault.contentionWindow(t, all);
  return `<div class="mt-3 rounded-2xl bg-black/30 border border-white/5 p-4">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-2">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400">Contention window, next ${win.years} seasons</div>
        <div class="text-[12px] text-zinc-400">${win.hasWindow ? `${t.windowYears} of ${win.years} seasons in the window` : 'No season in the window'} · peak value in ${win.peakYear}</div>
      </div>
      <div class="flex items-end gap-2 h-[64px]">${win.proj.map((v, i) => `<div class="flex-1 h-full flex flex-col justify-end"><div class="w-full rounded-t ${win.inWindow[i] ? 'bg-emerald-400/70' : 'bg-zinc-600/60'}" style="height:${Math.max(8, v / win.peak * 100)}%" title="${win.startYear + i}: ${Math.round(v).toLocaleString()} projected value, ${win.projPPG[i].toFixed(1)} projected PPG"></div></div>`).join('')}</div>
      <div class="flex gap-2 text-[12px] mt-1 text-zinc-400">${win.proj.map((v, i) => `<span class="flex-1 text-center">${win.startYear + i}</span>`).join('')}</div>
      <div class="text-[11px] text-zinc-500 mt-2">Green: in the window (${win.seasonOdds != null ? `this season, playoff odds of 50% or more; later, ` : ''}projected value within 88% of its peak and projected points above the playoff line, ${win.playoffLine.toFixed(1)} a week for the top ${win.playoffSpots}). Hover a bar for its numbers.</div>
    </div>`;
}


showTab(location.hash.slice(1) || (() => { try { return localStorage.getItem('vault_team_tab'); } catch { return null; } })() || 'overview');
window.addEventListener('DOMContentLoaded', () => loadLeague(Vault.getLeagueId()));
</script>
</body>
</html>
