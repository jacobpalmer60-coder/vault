<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Team Analyzer — The Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css">
<link rel="stylesheet" href="tailwind.css">
</head>
<body class="text-zinc-100 antialiased">
<div class="vault-bg"></div>

<div id="vault-nav"></div>

<main class="max-w-[1400px] mx-auto px-6 py-10 fade-in">
  <!-- League is picked once, in the nav's Switch League. The full league table
       lives on League Overview; this page is one team at a time. -->
  <div class="mb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-3">
    <div>
      <h1 class="display text-[28px] gold-text">Team Analyzer</h1>
      <div id="status" class="text-[12px] text-amber-300/70 mt-1">Loading league…</div>
    </div>
    <select id="teamSelect" aria-label="Team" class="bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-[14px] min-w-[240px] hidden"></select>
  </div>

  <section id="singleCard" class="mb-10"></section>
</main>

<script src="vault-core.js"></script>
<script src="vault-nav.js"></script>
<script>
const $ = s => document.querySelector(s);

// Promoted to Vault.tradePartnerSuggestions so the Trade Calculator can surface the
// same suggestions while a trade is actually being built.
function getTradePartners(t, all) { return Vault.tradePartnerSuggestions(t, all, 2); }

// Mirrors app.html's Best Lineup panel — short display labels for roster_positions
// slot codes, and the fixed skill-first order to list them in. Purely cosmetic; the
// actual greedy fill already ran in Vault.optimalLineupDetail (via buildLeagueTeams).
const SLOT_LABEL = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', FLEX: 'FLEX', WRRB_FLEX: 'W/R', REC_FLEX: 'W/T', SUPER_FLEX: 'SFLX', K: 'K', DEF: 'DEF' };
const SLOT_ORDER = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'WRRB_FLEX', 'REC_FLEX', 'SUPER_FLEX', 'K', 'DEF'];

// Same colored position system as the rest of the site (vault.css's
// .pos-badge-*) — colored by the player's REAL position, not the roster slot
// label shown as the badge's text, since a FLEX/SFLX slot can hold any of
// several positions and "FLEX" alone doesn't say which one is actually starting.
const POS_BADGE = pos => `pos-badge-${['QB', 'RB', 'WR', 'TE'].includes(pos) ? pos : 'default'}`;
function bestLineupPanel(t) {
  const rows = [...t.lineup].sort((a, b) => SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot));
  const lines = rows.map(s => `<div class="flex justify-between text-[12px]">
    <span class="inline-flex items-center justify-center w-9 shrink-0 px-1 py-px rounded text-[9px] font-semibold border uppercase ${POS_BADGE(s.pos || '')}">${SLOT_LABEL[s.slot] || s.slot}</span>
    <span class="truncate flex-1 mr-2">${Vault.escapeHtml(s.name) || '—'}</span>
    <span class="font-mono text-zinc-400">${s.name ? s.ppg.toFixed(1) : '—'}</span>
  </div>`).join('');
  return `<div><div class="text-[11px] uppercase tracking-widest text-amber-300/60 mb-2">Best Lineup</div><div class="space-y-1.5">${lines || '<div class="text-zinc-400">—</div>'}</div></div>`;
}

async function loadLeague(id) {
  $('#status').textContent = 'Loading league…';
  try {
    const { isSF, teams: built } = await Vault.buildLeagueTeams(id);
    window._allTeams = built;

    const sel = $('#teamSelect'); sel.innerHTML = built.map(t => `<option value="${t.rosterId}">${Vault.escapeHtml(t.teamName)}${t.username ? ` (${Vault.escapeHtml(t.username)})` : ''}</option>`).join(''); sel.classList.remove('hidden');
    const saved = localStorage.getItem('vault_username');
    const found = built.find(t => t.username.toLowerCase() === String(saved || '').toLowerCase());
    sel.value = String(found ? found.rosterId : built[0].rosterId);
    sel.onchange = () => renderSingle(built.find(t => String(t.rosterId) === sel.value));

    renderSingle(found || built[0]);
    $('#status').textContent = `${built.length} teams • ${isSF ? 'Superflex' : '1QB'}`;
    return true;
  } catch (e) {
    console.error(e);
    $('#status').textContent = e.message;
    return false;
  }
}

// Real per-team standing (Vault.heatColor, normalized to this league's own
// observed min-max for the stat — same approach League Overview's microBar
// uses) instead of a decorative fixed rainbow that looked identical on every
// tile no matter where the team actually stood. Also surfaces the team's real
// rank among all teams, since a raw number like "158,661" alone doesn't say
// whether that's 1st or 8th. `higherIsBetter` null keeps a stat neutral (grey,
// no rank-implies-good/bad) — used for Age, which mirrors League Overview never
// coloring Age either, since younger/older isn't a low=bad/high=good scale.
function statTile(label, val, display, all, key, rosterId, higherIsBetter, title) {
  const finite = Number.isFinite(val);
  const vals = all.map(x => x[key]).filter(Number.isFinite);
  const min = vals.length ? Math.min(...vals) : 0, max = vals.length ? Math.max(...vals) : 0;
  const t = finite && max > min ? (val - min) / (max - min) : 0.5;
  const color = !finite ? 'rgb(63,63,70)' : higherIsBetter == null ? 'rgb(113,113,122)' : Vault.heatColor(higherIsBetter ? t : 1 - t);
  const ranked = all.filter(x => Number.isFinite(x[key])).sort((a, b) => higherIsBetter === false ? a[key] - b[key] : b[key] - a[key]);
  const rankIdx = finite ? ranked.findIndex(x => x.rosterId === rosterId) : -1;
  const rankText = rankIdx >= 0 ? `#${rankIdx + 1}/${ranked.length}` : '—';
  return `<div class="stat-tile relative overflow-hidden" ${title ? `title="${Vault.escapeHtml(title)}"` : ''}>
    <div class="absolute top-0 inset-x-0 h-[3px]" style="background:${color}"></div>
    <div class="flex items-center justify-between mt-1">
      <div class="stat-label">${label}</div>
      <div class="text-[10px] mono text-zinc-400">${rankText}</div>
    </div>
    <div class="stat-value">${display}</div>
  </div>`;
}

function renderSingle(t) {
  if (!t) return;
  const all = window._allTeams || [];
  const leagueAvg = {
    qb: all.reduce((s, x) => s + x.qb, 0) / all.length,
    rb: all.reduce((s, x) => s + x.rb, 0) / all.length,
    wr: all.reduce((s, x) => s + x.wr, 0) / all.length,
    te: all.reduce((s, x) => s + x.te, 0) / all.length,
    picks: all.reduce((s, x) => s + x.picksValue, 0) / all.length,
    age: all.reduce((s, x) => s + x.age, 0) / all.length,
  };
  const flaws = Vault.fatalFlaws(t, leagueAvg, all);
  const partners = getTradePartners(t, all);
  const win = Vault.contentionWindow(t, all);

  const statTiles = [
    statTile('Overall', t.overall, Math.round(t.overall).toLocaleString(), all, 'overall', t.rosterId, true),
    statTile('Players', t.total, Math.round(t.total).toLocaleString(), all, 'total', t.rosterId, true),
    statTile('Opt PPG', t.opt, t.opt.toFixed(1), all, 'opt', t.rosterId, true),
    statTile('VORP', t.vorpTotal, Number.isFinite(t.vorpTotal) ? t.vorpTotal.toFixed(1) : '—', all, 'vorpTotal', t.rosterId, true, "Optimal lineup's total Value Over Replacement Player — real, scarcity-adjusted edge over readily-available replacements, not just raw scoring rate. Comparable across positions, unlike Opt PPG."),
    statTile('Age', t.age, t.age.toFixed(1), all, 'age', t.rosterId, null),
    statTile('Picks Value', t.picksValue, Math.round(t.picksValue).toLocaleString(), all, 'picksValue', t.rosterId, true),
  ].join('');
  $('#singleCard').innerHTML = `
  <div class="card rounded-vault p-6 fade-in">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="display text-[24px] gold-text">${Vault.escapeHtml(t.teamName)}</h2>
        <p class="text-[12px] text-zinc-400">${[t.username ? '@' + Vault.escapeHtml(t.username) : '', `Rank #${t.rank}`, `Peak: ${win.peakYear}`].filter(Boolean).join(' • ')}</p>
      </div>
      <div class="text-right">
        <span title="${Vault.escapeHtml(Vault.ARCHETYPE_INFO[t.arch]?.desc || '')}" class="px-3 py-1.5 rounded-full text-[12px] border bg-gradient-to-r ${t.archCls}">${t.arch}</span>
        <div class="text-[11px] text-zinc-400 mt-1">${Vault.PICK_TIER_LABEL[t.pickTier]} • ${t.windowYears}yr window</div>
      </div>
    </div>
    <div class="grid md:grid-cols-6 gap-4 mt-6">
      ${statTiles}
    </div>

    <div class="grid lg:grid-cols-3 gap-4 mt-6">
      <div class="bg-black/40 rounded-2xl p-4 border border-orange-500/20">
        <div class="text-[11px] uppercase tracking-widest text-orange-300/70 mb-2">Flaws</div>
        <div class="space-y-1.5 text-[12px]">${flaws.length ? flaws.map(f => `<div class="flex gap-2"><span class="text-orange-400">•</span><span>${f}</span></div>`).join('') : '<div class="text-zinc-400">Nothing notable</div>'}</div>
      </div>
      <div class="bg-black/40 rounded-2xl p-4 border border-emerald-500/20">
        <div class="text-[11px] uppercase tracking-widest text-emerald-300/70 mb-2">Best Trade Partners</div>
        <div class="space-y-3">${partners.map(p => `
          <div>
            <div class="flex justify-between items-center">
              <div><div class="text-[13px]">${Vault.escapeHtml(p.teamName)}</div><div class="text-[11px] text-zinc-400">${p.arch}</div></div>
              <div class="text-[11px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 shrink-0">${Math.min(10, p.fit)}/10 fit</div>
            </div>
            <div class="mt-1.5 space-y-0.5">${p.reasons.map(r => `<div class="flex gap-1.5 text-[11px] text-zinc-400"><span class="text-emerald-500/60">•</span><span>${r}</span></div>`).join('')}</div>
          </div>`).join('')}</div>
      </div>
      <div class="bg-black/40 rounded-2xl p-4 border border-white/10">
        <div class="text-[11px] uppercase tracking-widest text-amber-300/70 mb-2">Contention Window (5yr)</div>
        <div class="flex items-end gap-1.5 h-[70px]">${win.proj.map((v, i) => `<div class="flex-1 flex flex-col items-center"><div class="w-full bg-gradient-to-t from-amber-500/40 to-amber-300 rounded-t" style="height:${Math.max(8, v / win.peak * 100)}%" title="${win.startYear + i}: ${v.toLocaleString()} value, ${win.projPPG[i].toFixed(1)} PPG"></div></div>`).join('')}</div>
        <div class="flex justify-between text-[11px] mt-1 text-zinc-400">${win.proj.map((v, i) => `<span>${win.startYear + i}</span>`).join('')}</div>
        <div class="mt-2 h-2 w-full bg-zinc-800 rounded-full overflow-hidden flex">${win.proj.map((v, i) => `<div class="h-full ${win.inWindow[i] ? 'bg-amber-400' : 'bg-zinc-700'}" style="width:${100 / win.proj.length}%"></div>`).join('')}</div>
        <div class="text-center text-[11px] mt-1.5 text-amber-300">${win.hasWindow ? t.windowYears + ' of ' + win.years + ' years in window' : 'No window'} • Peak ${Math.round(win.peak).toLocaleString()} in ${win.peakYear}</div>
        ${win.seasonOdds != null ? `<div class="text-center text-[11px] mt-0.5 text-zinc-400">${win.startYear}: ${win.seasonOdds.toFixed(0)}% playoff odds${t.record ? ` at ${t.record.wins}-${t.record.losses}${t.record.ties ? '-' + t.record.ties : ''}` : ''}</div>` : ''}
        <div class="mt-3 pt-2 border-t border-zinc-800 text-[11px] text-zinc-400 space-y-1">
          <div class="flex items-center gap-1.5"><span class="w-3 h-1.5 bg-amber-400 rounded"></span> In window (${win.seasonOdds != null ? `${win.startYear}: playoff odds ≥ 50%; later years: ` : ''}value ≥88% peak + PPG ≥ playoff line)</div>
          <div class="flex items-center gap-1.5"><span class="w-3 h-1.5 bg-zinc-700 rounded"></span> Outside window</div>
          <div>Playoff line: ${win.playoffLine.toFixed(1)} PPG (top ${win.playoffSpots})</div>
        </div>
      </div>
    </div>

    <div class="grid lg:grid-cols-6 gap-6 mt-8">
      ${bestLineupPanel(t)}
      ${['QB', 'RB', 'WR', 'TE'].map(pos => { const ps = t.plist.filter(p => p.pos === pos).sort((a, b) => b.value - a.value).slice(0, 6); return `<div><div class="text-[11px] uppercase tracking-widest text-amber-300/60 mb-2">${pos}</div><div class="space-y-1.5">${ps.map(p => `<div class="flex justify-between text-[12px]"><span class="truncate mr-2">${Vault.escapeHtml(p.name) || '—'}</span><span class="font-mono text-zinc-400">${Math.round(p.value)}</span></div>`).join('') || '<div class="text-zinc-400">—</div>'}</div></div>`; }).join('')}
      <div><div class="text-[11px] uppercase tracking-widest text-amber-300/60 mb-2">2027-29 Picks</div><div class="space-y-1.5 text-[12px]">${t.picks.map(p => `<div class="flex justify-between"><span>${p.season} R${p.round}</span><span class="font-mono">${Math.round(p.value)}</span></div>`).join('') || '<div class="text-zinc-400">—</div>'}</div></div>
    </div>
  </div>`;
}

window.addEventListener('DOMContentLoaded', () => loadLeague(Vault.getLeagueId()));
</script>
</body>
</html>
