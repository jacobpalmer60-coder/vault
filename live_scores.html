<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Scores — The Vault</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css">
</head>
<body class="text-zinc-100 antialiased">
<div class="vault-bg"></div>

<div id="vault-nav"></div>

<div class="max-w-[1500px] mx-auto p-6 lg:p-10">
  <div class="flex items-center justify-between flex-wrap gap-3 mb-1">
    <h1 class="display text-[28px] font-semibold gold-text">Live Scores</h1>
    <div class="flex items-center gap-2">
      <button id="weekPrev" class="size-8 rounded-lg border border-white/10 text-zinc-400 hover:text-white hover:border-white/20 transition-colors">‹</button>
      <div id="weekLabel" class="text-[13px] text-zinc-300 mono px-2 min-w-[64px] text-center">Week —</div>
      <button id="weekNext" class="size-8 rounded-lg border border-white/10 text-zinc-400 hover:text-white hover:border-white/20 transition-colors">›</button>
    </div>
  </div>
  <p id="status" class="text-[13px] text-zinc-400 mb-6">Loading…</p>

  <!-- My Matchups now spans the full width across the top — a wide grid that packs
       as many matchup cards per row as fit, wrapping only when it has to, instead
       of being squeezed into a narrow sidebar column. -->
  <div class="mb-6">
    <div class="text-[11px] uppercase tracking-widest text-zinc-400 mb-3">My Matchups</div>
    <div id="grid" class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(240px,1fr))]"></div>
    <div id="empty" class="hidden text-center text-[13px] text-zinc-400 py-16"></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-[220px_1fr] gap-5 items-start">
    <!-- Weekly Leaders: top scorers by position among YOUR league's own rostered
         players this week — not NFL-wide, since that's not what a manager here is
         actually trying to decide anything from. Every number already comes from
         Sleeper's own per-roster points, which Sleeper computes using this
         league's real scoring_settings, so this is auto-scored to your format
         (PPR/TE premium/Superflex/whatever it is) with nothing to configure. -->
    <aside class="card rounded-vault-sm p-4 lg:sticky lg:top-4">
      <div class="flex items-center justify-between mb-1">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400">Weekly Leaders</div>
        <span class="text-[9px] px-1.5 py-0.5 rounded border border-white/10 text-zinc-400" title="Every number here is already scored to this league's own real settings (PPR, TE premium, Superflex, etc.) — Sleeper computes it that way, nothing here re-derives or guesses at format.">AUTO</span>
      </div>
      <div id="leadersCount" class="flex gap-1.5 mb-3"></div>
      <div id="leadersPanel"></div>
    </aside>

    <!-- Live play-by-play: always visible, not hidden behind expanding a matchup —
         every real play from every in-progress NFL game that mentions one of this
         league's own rostered players, most recent first. -->
    <main class="card rounded-vault-sm p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="text-[11px] uppercase tracking-widest text-zinc-400">Live Feed</div>
        <span class="inline-flex items-center gap-1.5 text-[10px] text-zinc-400"><span class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Live</span>
      </div>
      <div id="feedPanel" class="max-h-[70vh] overflow-y-auto scrollbar pr-1"></div>
    </main>
  </div>
</div>

<script src="vault-core.js"></script>
<script src="vault-nav.js"></script>
<script>
const SLOT_LABEL = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', FLEX: 'FLEX', WRRB_FLEX: 'W/R', REC_FLEX: 'W/T', SUPER_FLEX: 'SFLX', K: 'K', DEF: 'DEF' };
const REFRESH_MS = 30000;

let league = null, users = null, rosters = null, playersDb = null, slots = [];
let week = null, currentWeek = null, nflState = null;
let expanded = new Set();
let refreshTimer = null;
let lastUpdated = null;
let projPpgMap = new Map(); // pid -> projected PPG, this league's real scoring

/* ---------- Win probability (an estimate, not real game state) ----------
   Sleeper's matchups endpoint gives live points but never says whether a given
   player's real game has actually finished, so there's no way to know exactly how
   much "remaining variance" is left for any one player. This models it anyway,
   honestly labeled as an estimate: each starter's live score is a hard FLOOR
   (points only go up during a game), topped up with a random "remaining output"
   that shrinks as the real NFL week (Thursday kickoff through Tuesday) progresses
   and as a player's live points already cover more of their own projection. */
const SIM_TRIALS = 3000;
const REMAINING_SIGMA = 5.5; // a starter's typical remaining-output spread, in points

function weekProgress() {
  if (!nflState?.season_start_date || !week) return 0.5;
  // Anchored at noon UTC specifically so this can't drift a day depending on the
  // viewer's own timezone (a date-only string like "2026-09-09" parses as UTC
  // midnight, and .setDate()/local-midnight arithmetic on that can shift the
  // whole window by several hours — enough to wrongly read "week over" mid-Sunday
  // with Monday Night Football still ahead, which is exactly what happened here).
  // Window is the full week-to-week cycle (7 days), not a guessed Thu-to-Tue
  // sub-span — a real NFL week doesn't reliably end early just because most games
  // are done; Sunday/Monday-night games (and Tuesday international games) still
  // count.
  const weekStart = new Date(nflState.season_start_date + 'T12:00:00Z');
  weekStart.setUTCDate(weekStart.getUTCDate() + (week - 1) * 7);
  const weekEnd = new Date(weekStart);
  weekEnd.setUTCDate(weekEnd.getUTCDate() + 7);
  const now = Date.now();
  if (now <= weekStart.getTime()) return 0;
  if (now >= weekEnd.getTime()) return 1;
  return (now - weekStart.getTime()) / (weekEnd.getTime() - weekStart.getTime());
}

function gaussianRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// True once a player has zero chance of adding anything beyond their current live
// points — either their real team has no game this week (a bye), or that specific
// game has already finished. Empty teamGameState (before the first real fetch
// lands) never counts as either, so nothing gets wrongly zeroed out too early.
function noMoreUpside(pid) {
  if (!teamGameState.size) return false;
  const state = teamGameState.get(normTeam(playersDb[pid]?.team));
  return state == null || state === 'post';
}

// How much of a still-active player's remaining projected upside to credit right
// now. weekProgress() measures how far through the CALENDAR week we are, not how
// far through THIS player's own game — fine as a proxy for someone whose game is
// actually in progress, but wrong for a player whose game hasn't started yet
// (state 'pre'): they have 0% of their own game in the books, so docking their
// upside for "it's already Sunday night" wrongly punishes anyone on a Monday
// night team. Those players get full credit for their remaining projection
// instead, undecayed.
function upsideMultiplier(pid, progress) {
  const state = teamGameState.get(normTeam(playersDb[pid]?.team));
  return state === 'pre' ? 1 : (1 - progress);
}

function simulateFinal(starters, startersPoints, progress) {
  let total = 0;
  (starters || []).forEach((pid, i) => {
    if (!pid || pid === '0') return;
    const live = startersPoints?.[i] ?? 0;
    if (noMoreUpside(pid)) { total += live; return; }
    const proj = projPpgMap.get(pid) || 0;
    const mult = upsideMultiplier(pid, progress);
    const remainingExpected = Math.max(0, proj - live) * mult;
    const noise = gaussianRandom() * REMAINING_SIGMA * mult;
    total += live + Math.max(0, remainingExpected + noise);
  });
  return total;
}

// A deterministic companion to the win-probability simulation above (no random
// noise, since a projected TOTAL doesn't need a spread of outcomes the way a win%
// does — it would just make the number jitter between polls for no real reason).
// Originally a plain max(live, projection) — whichever was higher — but checking
// this against Sleeper's own real "projected" number for a live matchup showed
// that badly overshoots: it credited every underperforming starter with their
// FULL season-average upside regardless of how far into the real week we already
// are, so a player whose actual game was long over but who'd had a quiet day
// still got bumped all the way up to their normal output. Two real fixes, both
// verified against Sleeper's own numbers for actual live matchups: noMoreUpside()
// correctly zeroes out anyone whose specific game has already ended (closes the
// gap exactly — Sleeper shows projected === live, to the decimal, for a team once
// every starter's real game is over, which weekProgress alone can't know), and
// upsideMultiplier() on top of that gives anyone still mid-game the weekProgress
// decay (closed a ~28-point overshoot on a still-live matchup down to about half
// a point) while giving anyone whose game hasn't started yet (e.g. a Monday
// night starter, checked on Sunday night) their full remaining projection
// instead of wrongly docking it for how far the calendar week has gotten.
function projectedFinal(m) {
  const progress = weekProgress();
  let total = 0;
  (m.starters || []).forEach((pid, i) => {
    if (!pid || pid === '0') return;
    const live = m.starters_points?.[i] ?? 0;
    if (noMoreUpside(pid)) { total += live; return; }
    const proj = projPpgMap.get(pid) || 0;
    total += live + Math.max(0, proj - live) * upsideMultiplier(pid, progress);
  });
  return total;
}

// Once the real scoring window is effectively over, there's no meaningful
// variance left to simulate — just compare the (now final) live totals directly
// rather than let simulation noise report anything other than ~100%/0%.
function winProbability(aMatchup, bMatchup) {
  const progress = weekProgress();
  if (progress >= 0.999) {
    const aFinal = aMatchup.points || 0, bFinal = bMatchup.points || 0;
    if (aFinal === bFinal) return 50;
    return aFinal > bFinal ? 100 : 0;
  }
  let aWins = 0;
  for (let i = 0; i < SIM_TRIALS; i++) {
    const aFinal = simulateFinal(aMatchup.starters, aMatchup.starters_points, progress);
    const bFinal = simulateFinal(bMatchup.starters, bMatchup.starters_points, progress);
    if (aFinal > bFinal) aWins++; else if (aFinal === bFinal) aWins += 0.5;
  }
  return aWins / SIM_TRIALS * 100;
}

/* ---------- Live play-by-play feed ----------
   Sleeper has no play-by-play of its own — only ESPN's public (undocumented, but
   free and keyless) scoreboard/summary endpoints carry real play text. Best-effort
   by design: matching "which of MY players is this play about" means pattern-
   matching play text like " J.Taylor rushed up the middle..." against each
   roster's players (first-initial + last name, cross-checked against that
   player's real NFL team so common surnames don't false-match), not a clean
   structured field ESPN hands us. A play that doesn't match anything simply
   doesn't show up — this never tries to compute a point value per play, since
   reconstructing that from raw stats through this league's own scoring settings
   per play would be far more fragile than it's worth. */
const ESPN_TEAM_ALIAS = { WSH: 'WAS', JAC: 'JAX', LA: 'LAR' }; // known Sleeper/ESPN abbreviation mismatches
let espnGames = new Map(); // gameId -> { teams: [abbr,abbr], plays: [{text, teamAbbr}] }
let lastEspnFetch = 0;

function normTeam(abbr) { return ESPN_TEAM_ALIAS[abbr] || abbr; }

// "J.Taylor" style pattern for a player — ESPN's play text convention.
function playPattern(p) {
  if (!p?.first_name || !p?.last_name) return null;
  return `${p.first_name[0]}.${p.last_name}`;
}

// Every team's real game STATE this week ('pre'/'in'/'post'), from the same
// scoreboard fetch below (every scheduled game, not just the in-progress
// subset) — a team missing entirely is this week's bye. This is what actually
// closes the gap a single league-wide weekProgress can't: two teams can be at
// wildly different real points in their OWN schedule (one team's whole lineup
// already in early-window games that are over, another's still got a Monday
// night player) even though the LEAGUE-wide week is at the same overall
// progress for both — verified against Sleeper's own real projections, which
// show projected === live (exactly, to the decimal) for a team once every
// one of its starters' games has actually ended, something weekProgress alone
// has no way to know. Starts empty until the first real fetch lands, so
// nothing gets wrongly treated as "on bye" or "done" before that.
let teamGameState = new Map();
let teamsPlayingThisWeek = new Set();

async function fetchEspnLive() {
  try {
    const sb = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard').then(r => r.json());
    teamGameState = new Map((sb.events || []).flatMap(e =>
      (e.competitions?.[0]?.competitors || []).map(c => [normTeam(c.team?.abbreviation), e.status?.type?.state || 'pre'])));
    teamsPlayingThisWeek = new Set(teamGameState.keys());
    const inProgress = (sb.events || []).filter(e => e.status?.type?.state === 'in');
    await Promise.all(inProgress.map(async ev => {
      const teams = (ev.competitions?.[0]?.competitors || []).map(c => normTeam(c.team?.abbreviation));
      try {
        const sum = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${ev.id}`).then(r => r.json());
        const drives = [...(sum.drives?.previous || [])];
        if (sum.drives?.current) drives.push(sum.drives.current);
        // ESPN's own drives.previous/drives.current occasionally repeat the same
        // play across that boundary (seen live in an OT game) — de-duped by exact
        // text, keeping first-seen order, before anything downstream ever sees it.
        const seen = new Set();
        const plays = [];
        drives.forEach(d => {
          const teamAbbr = normTeam(d.team?.abbreviation);
          (d.plays || []).forEach(p => {
            if (!p.text) return;
            const text = p.text.trim();
            if (seen.has(text)) return;
            seen.add(text);
            plays.push({ text, teamAbbr });
          });
        });
        espnGames.set(ev.id, { teams, plays: plays.slice(-15) });
      } catch { /* one game's summary failing shouldn't drop the rest */ }
    }));
    // Drop games no longer in progress so a finished game's plays stop being
    // rescanned every cycle once nothing new can appear in it.
    const liveIds = new Set(inProgress.map(e => e.id));
    [...espnGames.keys()].forEach(id => { if (!liveIds.has(id)) espnGames.delete(id); });
    lastEspnFetch = Date.now();
  } catch (e) { console.error('ESPN live fetch failed', e); }
}

// Every play from every currently-live game, most recent last (drive order).
function allLivePlays() {
  return [...espnGames.values()].flatMap(g => g.plays);
}

// Every rostered player across the WHOLE league this week, tagged with which
// fantasy team holds them — the shared candidate list behind both the Weekly
// Leaders panel and the live play-by-play feed. Every point value already came
// straight from Sleeper's own players_points, which Sleeper computed using this
// league's real scoring_settings, so nothing here re-derives or guesses at format.
function allRosteredCandidates(rosterMap, userMap) {
  const list = [];
  lastMatchups.forEach(m => {
    const teamName = teamNameFor(m.roster_id, rosterMap, userMap);
    Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
      const p = playersDb[pid];
      if (!p) return;
      list.push({ pid, pts: pts || 0, pos: p.position, name: `${p.first_name} ${p.last_name}`, team: normTeam(p.team), teamName, pattern: playPattern(p) });
    });
  });
  return list;
}

let leadersCount = 5;
function setLeadersCount(n) {
  leadersCount = n;
  render();
}

function renderLeadersCountToggle() {
  document.getElementById('leadersCount').innerHTML = [5, 10, 20].map(n => `
    <button onclick="setLeadersCount(${n})" class="text-[10px] px-2 py-1 rounded-lg border transition-colors ${leadersCount === n ? 'bg-amber-500/15 border-amber-500/40 text-amber-200' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">Top ${n}</button>
  `).join('');
}

function renderWeeklyLeaders(rosterMap, userMap) {
  renderLeadersCountToggle();
  const candidates = allRosteredCandidates(rosterMap, userMap);
  const positions = ['QB', 'RB', 'WR', 'TE'];
  const sections = positions.map(pos => {
    const top = candidates.filter(c => c.pos === pos).sort((a, b) => b.pts - a.pts).slice(0, leadersCount);
    if (!top.length) return '';
    return `
      <div class="mb-4 last:mb-0">
        <div class="text-[10px] uppercase tracking-widest text-amber-300/50 mb-1.5">${pos}</div>
        <div class="space-y-1">
          ${top.map((c, i) => `<div class="flex items-center gap-2 text-[12px]">
            <span class="text-zinc-400 w-5 shrink-0">${i + 1}</span>
            <span class="text-zinc-200 truncate flex-1 min-w-0" title="${Vault.escapeHtml(c.teamName)}">${Vault.escapeHtml(c.name)}</span>
            <span class="mono text-zinc-400 shrink-0">${c.pts.toFixed(1)}</span>
          </div>`).join('')}
        </div>
      </div>`;
  }).join('');
  document.getElementById('leadersPanel').innerHTML = sections || '<div class="text-zinc-400 text-[12px] py-4 text-center">No scoring yet this week.</div>';
}

// Global feed — every live play mentioning ANY of this league's rostered players,
// not just whichever matchup happens to be expanded. Checked against each
// player's real NFL team so a common surname can't false-match a different
// player of the same name on another team.
//
// Each play line also gets that PLAYER's own fantasy point change since the last
// poll (playerPointDeltas), not a point value reconstructed from the play text
// itself — ESPN's play text has no fantasy-scoring info in it, and re-deriving
// one from raw stats through this league's own scoring settings per play would
// be exactly the fragile guesswork this feed has always avoided (see
// allRosteredCandidates). Sleeper's players_points is the same real, already-
// correctly-scored number every other panel on this page trusts. A player can
// rack up several plays inside one 30s poll window with only ONE combined point
// change to show for it, so the delta badge only appears on their MOST RECENT
// play line (first in this reversed, newest-first list) — repeating the same
// total on every older line for the same player would just be noise.
// Best-effort play-type tag from ESPN's own play text — no structured "play type"
// field exists in this feed (see the file-level comment on ESPN_TEAM_ALIAS), just
// keyword matching against the same text already shown below it. Order matters:
// checked most-specific-first so a touchdown-scoring extra point still reads as
// TD before XP, etc.
const PLAY_TAG = {
  TD: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
  XP: 'bg-sky-500/15 text-sky-300 border-sky-500/30',
  FG: 'bg-sky-500/15 text-sky-300 border-sky-500/30',
  INT: 'bg-rose-500/15 text-rose-300 border-rose-500/30',
  FUM: 'bg-rose-500/15 text-rose-300 border-rose-500/30',
  SACK: 'bg-rose-500/15 text-rose-300 border-rose-500/30',
  FLAG: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
  INC: 'bg-white/5 text-zinc-400 border-white/10',
  PLAY: 'bg-white/5 text-zinc-400 border-white/10'
};
function classifyPlay(text) {
  const t = text.toUpperCase();
  let label = 'PLAY';
  if (t.includes('TOUCHDOWN')) label = 'TD';
  else if (t.includes('INTERCEPTED')) label = 'INT';
  else if (t.includes('FUMBLE')) label = 'FUM';
  else if (t.includes('SACKED')) label = 'SACK';
  else if (t.includes('PENALTY')) label = 'FLAG';
  else if (t.includes('FIELD GOAL')) label = 'FG';
  else if (t.includes('EXTRA POINT')) label = 'XP';
  else if (t.includes('INCOMPLETE')) label = 'INC';
  return { label, cls: PLAY_TAG[label] };
}

// Point value + running total per play, closest we can get to a real per-play
// stat feed from ESPN text + Sleeper's own players_points. The running TOTAL is
// always accurate (it's just this player's current score, no timing involved),
// but the "+X.X" point CHANGE is inherently best-effort: Sleeper's official
// scoring can lag ESPN's play text by a play or two while stats get confirmed,
// so the change shows up attributed to whichever of this player's plays is
// still their most recent once Sleeper actually catches up — not always the
// literal play that caused it, the same honest limitation this feed's own
// text-matching already has (see allRosteredCandidates).
//
// One card per PLAY, not per matched player — a single pass play routinely
// involves two of your rostered players at once (the QB throwing it and the
// receiver catching it), and showing the identical play text twice back to
// back was just noise. Grouped by the play's own text, which is already
// guaranteed unique per real play (fetchEspnLive de-dupes on exact text before
// this ever sees it), so grouping on it can't accidentally merge two different
// plays that happen to read the same.
function renderLiveFeed(rosterMap, userMap) {
  const candidates = allRosteredCandidates(rosterMap, userMap).filter(c => c.pattern);
  const playMap = new Map(); // play text -> { text, players: [{pid, name, teamName}] }
  allLivePlays().forEach(play => {
    candidates.forEach(c => {
      if (play.teamAbbr !== c.team || !play.text.includes(c.pattern)) return;
      if (!playMap.has(play.text)) playMap.set(play.text, { text: play.text, players: [] });
      const entry = playMap.get(play.text);
      if (!entry.players.some(pl => pl.pid === c.pid)) entry.players.push({ pid: c.pid, name: c.name, teamName: c.teamName });
    });
  });
  const recent = [...playMap.values()].slice(-25).reverse();
  const panel = document.getElementById('feedPanel');
  if (!recent.length) {
    panel.innerHTML = `<div class="text-zinc-400 text-[12px] py-10 text-center">${espnGames.size ? 'No plays yet involving your rostered players.' : 'No games in progress right now.'}</div>`;
    return;
  }
  const shown = new Set();
  panel.innerHTML = recent.map(p => {
    const tag = classifyPlay(p.text);
    const playerRows = p.players.map(pl => {
      const delta = playerPointDeltas.get(pl.pid) || 0;
      const showDelta = !shown.has(pl.pid) && Math.abs(delta) >= 0.05;
      if (showDelta) shown.add(pl.pid);
      const total = knownPlayerPoints.get(pl.pid);
      return `
      <div class="flex items-center justify-between gap-2 py-0.5">
        <div class="min-w-0">
          <span class="text-[12px] font-medium text-zinc-100 truncate">${Vault.escapeHtml(pl.name)}</span>
        </div>
        <div class="text-right shrink-0 leading-tight">
          <div class="flex items-center justify-end gap-2">
            <span class="text-[15px] font-bold text-white truncate max-w-[140px]" title="${Vault.escapeHtml(pl.teamName)}">${Vault.escapeHtml(pl.teamName)}</span>
            ${showDelta ? `<span class="text-[22px] font-mono font-extrabold ${delta > 0 ? 'text-emerald-400' : 'text-rose-400'}" title="Point change since the last update, attributed to this player's most recent play — Sleeper's scoring can trail ESPN's play text by a play or two">${delta > 0 ? '+' : ''}${delta.toFixed(1)}</span>` : ''}
          </div>
          ${total != null ? `<div class="text-[15px] font-mono font-bold text-amber-300">${total.toFixed(1)} <span class="text-[9px] font-sans font-medium uppercase tracking-wide text-amber-300/60">pts</span></div>` : ''}
        </div>
      </div>`;
    }).join('');
    return `
    <div class="py-2 border-b border-white/5 last:border-0">
      <div class="mb-1"><span class="text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded border shrink-0 ${tag.cls}">${tag.label}</span></div>
      ${playerRows}
      <div class="text-[11px] text-zinc-400 leading-snug mt-1">${Vault.escapeHtml(p.text)}</div>
    </div>`;
  }).join('');
}

function teamNameFor(rosterId, rosterMap, userMap) {
  const r = rosterMap.get(rosterId);
  if (!r) return `Roster ${rosterId}`;
  const u = userMap.get(r.owner_id);
  return u?.metadata?.team_name || u?.display_name || `Roster ${rosterId}`;
}

// slotLabel is only passed for a starter row (fixed lineup-slot order); a bench
// player has no slot, just their real position, so the two rows read differently
// on purpose (STARTER slot vs POS) rather than forcing one shared column.
// Same colored position system as the rest of the site (vault.css's
// .pos-badge-*) — colored by the player's REAL position, not the roster slot
// label shown as the badge's text, since a FLEX/SFLX slot can hold any of
// several positions and "FLEX" alone doesn't say which one you're looking at.
const POS_BADGE = pos => `pos-badge-${['QB', 'RB', 'WR', 'TE'].includes(pos) ? pos : 'default'}`;
function playerLine(pid, pts, slotLabel) {
  const p = playersDb[pid] || {};
  const name = pid && pid !== '0' ? (`${p.first_name || ''} ${p.last_name || ''}`.trim() || `Player ${pid}`) : 'Empty';
  const leftLabel = slotLabel || p.position || '';
  const isStarter = !!slotLabel;
  return `<div class="flex items-center justify-between text-[12px] py-1">
    <div class="flex items-center gap-2 min-w-0">
      <span class="inline-flex items-center justify-center w-9 shrink-0 px-1 py-px rounded text-[9px] font-semibold border uppercase ${POS_BADGE(p.position || '')} ${isStarter ? '' : 'opacity-50'}">${leftLabel}</span>
      <span class="truncate ${isStarter ? 'text-zinc-200' : 'text-zinc-400'}">${Vault.escapeHtml(name)}</span>
    </div>
    <span class="mono ${isStarter ? 'text-zinc-200' : 'text-zinc-400'} shrink-0">${pts.toFixed(1)}</span>
  </div>`;
}

function rosterBreakdown(m) {
  if (!m) return '<div class="text-zinc-400 text-[12px] py-2">No lineup data yet.</div>';
  const startersHtml = (m.starters || []).map((pid, i) => {
    const slot = SLOT_LABEL[slots[i]] || slots[i] || '';
    const pts = m.starters_points?.[i] ?? 0;
    return playerLine(pid, pts, slot);
  }).join('');
  const starterSet = new Set(m.starters || []);
  const bench = Object.keys(m.players_points || {}).filter(pid => !starterSet.has(pid));
  const benchHtml = bench.length
    ? bench.map(pid => playerLine(pid, m.players_points[pid] || 0, null)).join('')
    : '<div class="text-zinc-400 text-[11px] py-1">Empty bench</div>';
  return `
    <div class="pt-3 mt-3 border-t border-white/5">
      <div class="text-[10px] uppercase tracking-widest text-amber-300/50 mb-1">Starters</div>
      ${startersHtml}
      <div class="text-[10px] uppercase tracking-widest text-zinc-400 mt-3 mb-1">Bench</div>
      ${benchHtml}
    </div>`;
}

function toggleExpand(key) {
  if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
  render();
}

// Per-roster point change since the LAST poll (not since kickoff) — the whole
// point is "what just happened," so it's diffed against whatever score this
// roster had the previous time fetchWeek ran, not the week's starting total.
// Empty on the very first load of a week (nothing to compare against yet) and
// cleared on every week switch, since diffing week 4's fresh score against
// week 3's final would produce a meaningless jump.
let knownScores = new Map(); // rosterId -> score as of the last poll
let scoreDeltas = new Map(); // rosterId -> last computed change
function updateScoreDeltas() {
  const next = new Map();
  lastMatchups.forEach(m => {
    const curr = m.points || 0;
    const prev = knownScores.has(m.roster_id) ? knownScores.get(m.roster_id) : curr;
    next.set(m.roster_id, curr - prev);
    knownScores.set(m.roster_id, curr);
  });
  scoreDeltas = next;
}

// Same idea, per PLAYER instead of per team — this is what lets the Live Feed
// show a player's own point change next to their play (see renderLiveFeed).
// Reuses Sleeper's own players_points off every roster's matchup row, the same
// real, already-correctly-scored number the rest of this page trusts.
let knownPlayerPoints = new Map(); // pid -> points as of the last poll
let playerPointDeltas = new Map(); // pid -> last computed change
function updatePlayerPointDeltas() {
  const next = new Map();
  lastMatchups.forEach(m => {
    Object.entries(m.players_points || {}).forEach(([pid, pts]) => {
      const curr = pts || 0;
      const prev = knownPlayerPoints.has(pid) ? knownPlayerPoints.get(pid) : curr;
      next.set(pid, curr - prev);
      knownPlayerPoints.set(pid, curr);
    });
  });
  playerPointDeltas = next;
}

// Groups this week's per-roster rows (Sleeper's raw matchups response, one row
// per roster) into head-to-head pairs by matchup_id — two rosters sharing an id
// are opponents. A roster with no partner (an odd team count, or a bye built into
// the schedule) renders as its own "bye week" card instead of being dropped.
let lastMatchups = [];
function buildPairs() {
  const byMatchup = new Map();
  lastMatchups.forEach(m => {
    if (!byMatchup.has(m.matchup_id)) byMatchup.set(m.matchup_id, []);
    byMatchup.get(m.matchup_id).push(m);
  });
  const pairs = [];
  byMatchup.forEach((ms, matchupId) => {
    if (matchupId == null) { ms.forEach(m => pairs.push({ key: `bye-${m.roster_id}`, a: { rosterId: m.roster_id, m }, b: null })); return; }
    const [m1, m2] = ms;
    pairs.push({ key: `m-${matchupId}`, a: { rosterId: m1.roster_id, m: m1 }, b: m2 ? { rosterId: m2.roster_id, m: m2 } : null });
  });
  // Highest combined score first — the closest, highest-scoring games are usually
  // the ones actually worth looking at first on game day.
  pairs.sort((x, y) => {
    const xTot = (x.a.m.points || 0) + (x.b ? (x.b.m.points || 0) : 0);
    const yTot = (y.a.m.points || 0) + (y.b ? (y.b.m.points || 0) : 0);
    return yTot - xTot;
  });
  return pairs;
}

function render() {
  const rosterMap = new Map(rosters.map(r => [r.roster_id, r]));
  const userMap = new Map(users.map(u => [u.user_id, u]));
  const pairs = buildPairs();

  renderWeeklyLeaders(rosterMap, userMap);
  renderLiveFeed(rosterMap, userMap);

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!pairs.length) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    empty.textContent = 'No matchups found for this week.';
    return;
  }
  empty.classList.add('hidden');
  grid.innerHTML = pairs.map(p => matchupCard(p.key, p.a, p.b, rosterMap, userMap)).join('');
}

// Season record going into this week — Sleeper tracks wins/losses/ties directly
// on the roster once a week's matchups finalize, so this is the real standings
// record (not derived from anything computed here), same as what Sleeper's own
// matchups view shows next to each team name.
function recordFor(rosterId, rosterMap) {
  const rs = rosterMap.get(rosterId)?.settings || {};
  const wins = rs.wins || 0, losses = rs.losses || 0, ties = rs.ties || 0;
  return ties > 0 ? `${wins}-${losses}-${ties}` : `${wins}-${losses}`;
}

function matchupCard(key, a, b, rosterMap, userMap) {
  const aScore = a?.m.points || 0, bScore = b ? (b.m.points || 0) : 0;
  const total = aScore + bScore;
  const aPct = total > 0 ? Math.max(4, Math.min(96, aScore / total * 100)) : 50;
  const aLeads = b ? aScore > bScore : false, bLeads = b ? bScore > aScore : false;
  const isExpanded = expanded.has(key);
  // Clamped display-side, never at the raw simulated value — this is a modeled
  // estimate, not certainty, so it should never claim a literal, unbeatable 100%
  // even when the simulation itself came back essentially there.
  const aWinPct = b ? Math.max(1, Math.min(99, winProbability(a.m, b.m))) : null;

  // Change since the LAST poll (see updateScoreDeltas), not since kickoff — a
  // big, bold, colored callout so a fresh bump from a just-scored play is
  // impossible to miss next to the total it fed into. Small enough deltas are
  // treated as no real change (float noise, not a stat update).
  const side = (rosterId, score, leads, letter, color, name, proj, record) => {
    const delta = scoreDeltas.get(rosterId) || 0;
    const showDelta = Math.abs(delta) >= 0.05;
    return `
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 mb-1">
        <div class="size-6 rounded-lg ${color} flex items-center justify-center text-[11px] font-semibold text-black shrink-0">${letter}</div>
        <div class="text-[13px] font-medium truncate ${leads ? 'text-white' : 'text-zinc-400'}">${Vault.escapeHtml(name)}</div>
        <span class="text-[10px] mono text-zinc-400 shrink-0" title="Record going into this week">${record}</span>
      </div>
      <div class="flex items-baseline gap-2 flex-wrap">
        <div class="text-[26px] font-mono font-semibold ${leads ? 'text-emerald-400' : 'text-zinc-200'}">${score.toFixed(1)}</div>
        ${showDelta ? `<div class="text-[18px] font-mono font-extrabold ${delta > 0 ? 'text-emerald-400' : 'text-rose-400'}" title="Change since the last update">${delta > 0 ? '+' : ''}${delta.toFixed(1)}</div>` : ''}
      </div>
      ${proj != null ? `<div class="text-[11px] text-zinc-400" title="Live points plus each remaining starter's projected upside, scaled down as their real game finishes">Proj <span class="mono text-zinc-400">${proj.toFixed(1)}</span></div>` : ''}
    </div>`;
  };

  const aName = teamNameFor(a?.rosterId, rosterMap, userMap);
  const bName = b ? teamNameFor(b.rosterId, rosterMap, userMap) : null;
  const aProj = a ? projectedFinal(a.m) : null;
  const bProj = b ? projectedFinal(b.m) : null;
  const aRecord = a ? recordFor(a.rosterId, rosterMap) : null;
  const bRecord = b ? recordFor(b.rosterId, rosterMap) : null;

  return `
    <div class="card rounded-vault-sm p-4 ${b ? 'cursor-pointer card-hover' : ''}" ${b ? `onclick="toggleExpand('${key}')"` : ''}>
      <div class="flex items-center gap-4">
        ${side(a?.rosterId, aScore, aLeads, 'A', 'bg-gradient-to-br from-amber-400 to-yellow-600', aName, aProj, aRecord)}
        ${b ? `<div class="text-zinc-400 text-[11px] uppercase tracking-widest shrink-0">vs</div>${side(b.rosterId, bScore, bLeads, 'B', 'bg-gradient-to-br from-sky-500 to-cyan-600', bName, bProj, bRecord)}` : `<div class="text-[12px] text-zinc-400 shrink-0 px-2">Bye week</div>`}
      </div>
      ${b ? `<div class="mt-3 h-1.5 rounded-full bg-white/[0.06] overflow-hidden flex" title="Share of combined live points">
        <div class="h-full bg-emerald-400/70" style="width:${aPct}%"></div>
        <div class="h-full bg-sky-400/70" style="width:${100 - aPct}%"></div>
      </div>` : ''}
      ${b ? `<div class="flex items-center justify-between text-[10px] text-zinc-400 mt-2" title="Estimated from live points + a modeled remaining-output variance — not real game-clock state, since that isn't available from this data source">
        <span>Win% <span class="mono ${aWinPct >= 50 ? 'text-emerald-400/90' : 'text-zinc-400'}">${aWinPct.toFixed(0)}%</span></span>
        <span class="uppercase tracking-widest">Estimate</span>
        <span><span class="mono ${aWinPct < 50 ? 'text-sky-400/90' : 'text-zinc-400'}">${(100 - aWinPct).toFixed(0)}%</span> Win%</span>
      </div>
      <div class="h-1 rounded-full bg-white/[0.06] overflow-hidden flex mt-1">
        <div class="h-full bg-emerald-400/40" style="width:${Math.max(2, Math.min(98, aWinPct))}%"></div>
        <div class="h-full bg-sky-400/40" style="width:${Math.max(2, Math.min(98, 100 - aWinPct))}%"></div>
      </div>` : ''}
      ${isExpanded && b ? `
        <div class="grid sm:grid-cols-2 gap-4">
          <div>${rosterBreakdown(a?.m)}</div>
          <div>${rosterBreakdown(b?.m)}</div>
        </div>` : ''}
    </div>`;
}

function updateStatus() {
  const status = document.getElementById('status');
  const secs = lastUpdated ? Math.round((Date.now() - lastUpdated) / 1000) : null;
  const liveNote = week === currentWeek ? `<span class="inline-flex items-center gap-1.5"><span class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Auto-refreshing every 30s</span>` : `<span class="text-zinc-400">Not the current week — scores are final</span>`;
  status.innerHTML = `${league?.name || ''} • ${liveNote}${secs != null ? ` • updated ${secs}s ago` : ''}`;
}

async function fetchWeek(w) {
  const matchups = await fetch(`https://api.sleeper.app/v1/league/${Vault.getLeagueId()}/matchups/${w}`).then(r => r.json());
  lastMatchups = matchups || [];
  lastUpdated = Date.now();
  updateScoreDeltas();
  updatePlayerPointDeltas();
  render();
  updateStatus();
  // Live plays only mean anything for the week actually being played right now —
  // fired after the score render, not blocking it, since a few ESPN summary
  // fetches take noticeably longer than the one small Sleeper matchups call.
  if (w === currentWeek) fetchEspnLive().then(render);
}

function setWeek(w) {
  week = Math.max(1, Math.min(18, w));
  document.getElementById('weekLabel').textContent = `Week ${week}`;
  expanded.clear();
  // A different week's scores have nothing to do with the previous one's — without
  // this, switching weeks would diff the new week's fresh total against whatever
  // score this roster had when you last looked at the old week, showing a huge,
  // meaningless "change."
  knownScores.clear();
  scoreDeltas.clear();
  knownPlayerPoints.clear();
  playerPointDeltas.clear();
  fetchWeek(week);
}

function startPolling() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && week === currentWeek) fetchWeek(week);
    else if (document.visibilityState === 'visible') updateStatus();
  }, REFRESH_MS);
  setInterval(updateStatus, 1000);
}

async function init() {
  const status = document.getElementById('status');
  try {
    const leagueId = Vault.getLeagueId();
    const [core, state, projData] = await Promise.all([
      Vault.fetchSleeperCore(leagueId),
      fetch('https://api.sleeper.app/v1/state/nfl').then(r => r.json()),
      Vault.fetchProjections()
    ]);
    league = core.league; users = core.users; rosters = core.rosters; playersDb = core.players;
    slots = (league.roster_positions || []).filter(s => !['BN', 'IR', 'TAXI'].includes(s));
    nflState = state;
    currentWeek = state.week || 1;
    projPpgMap = Vault.buildProjectedPpgMapById(projData, league.scoring_settings);
    setWeek(currentWeek);
    startPolling();
  } catch (e) {
    console.error(e);
    status.textContent = e.message || 'Failed to load';
    status.className = 'text-[13px] text-rose-400 mb-6';
  }
}

document.getElementById('weekPrev').onclick = () => setWeek(week - 1);
document.getElementById('weekNext').onclick = () => setWeek(week + 1);

// Polling only acts while the tab is visible (see startPolling) — cheap on network,
// but it means a backgrounded tab shows whatever it last had until the NEXT
// scheduled tick happens to land while visible again, which could be nearly a
// full REFRESH_MS after you actually look back at it. Catching up immediately on
// the visible transition instead means matchups, scores, and the feed are never
// more than a moment stale just because the tab sat in the background for a while.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && week === currentWeek) fetchWeek(week);
});

init();
</script>
</body>
</html>
