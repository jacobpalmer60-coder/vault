<script>
/* Hand-written, manager-facing notes — not the commit log, which is full of
   internal detail and daily data refreshes. Add an entry here with every
   change people will notice. kind: new | improved | fixed | changed | removed. */
const NOTES = [
  { date: '2026-09-30', items: [
    { kind: 'new', page: 'Trade Database', text: 'The market at a glance: charts of every real trade in your league\'s QB format (about 17,000 Superflex trades this week), priced with the Trade Calculator\'s own math. The typical real trade is about 22% off on KTC value, and only about 31% grade Fair. Charts: how far off real trades are (Fair / Lopsided / Unfair, with your league\'s trades marked under it); by trade shape (1-for-1 trades run about 13% off, 1-for-2 about 35%, and the side getting fewer pieces pays about 30% over KTC); how rarely stars go 1-for-1 (about 1% of trades with an 8,000+ player); by position of the best piece; and your league next to the market (your league\'s typical trade is closer to even than the market\'s).' },
    { kind: 'fixed', page: 'Trade Database', text: 'Matching trades to your league no longer requires the exact same number of starters, which threw out most trades for a small difference (e.g. 10 vs 11 starters). A 10-team Superflex, 1 PPR, TE+ league now matches about 970 trades instead of about 170.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Real trades: under the grade, a line shows what real managers paid for the trade\'s main player over the last few days in KTC\'s trade database, in your league\'s format ("29 Superflex trades in the last 5 days had Amon-Ra St. Brown as the main piece… usually paid 12% under to 13% over KTC. Here you pay 12% under: less than most pay"). It compares trades shaped like yours when there are enough, since a 1-for-1 and a 3-for-1 price differently. Open it to see every trade as a dot with yours marked, and the three real trades most like yours. The grade itself doesn\'t use these.' },
    { kind: 'new', page: 'Trade Calculator', text: 'You could ask for more: when they\'d say yes with room to spare (usually when you\'re overpaying), Will they take it? names the one change that gets you more while they\'d still say yes and it stays Fair, e.g. "Offer your 2027 R2 instead of Nico Collins", with an Ask for it button.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Lineups after the trade: a new section shows both teams\' starting lineups once the trade goes through, marks who comes over in the trade (New) and who moves up from the bench (Starts), and for every starter, who steps in when he\'s out and how many points that costs ("If out: Rashee Rice steps in, −3.3 (was −0.1)"). It\'s the depth number, player by player.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Add any player: type any player or pick in your league in the search box at the top of Trade Builder. Your own goes on your side; anyone else\'s goes on theirs and makes their team the trade partner.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Stars rarely move one-for-one, and Will they take it? now knows it. In KTC\'s trade database only about 1 in 100 trades with an 8,000+ player was 1-for-1 (about 1 in 20 at 6,000 to 8,000, vs half of trades under 4,000), so asking for a star straight up counts against the trade, and the suggested change is usually the second piece. None of your league\'s real trades were star 1-for-1s, so it changes nothing there.' },
    { kind: 'improved', page: 'Everywhere', text: 'Search boxes put the best matches first: names that start with what you type, then a word in the name ("amon" finds Amon-Ra St. Brown before Rhamondre Stevenson).' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Will they take it? is now calibrated on real trades. Tested against your league\'s own completed trades (both managers said yes to each), the old read said one side would refuse every single one. Now a manager is expected to accept being up to about 12% behind on KTC value (the typical real dynasty trade), adjusted by their own trading history in your league; getting the best player in a deal for more pieces counts in their favor (real managers pay a premium to consolidate); and a trade that grades badly for them counts against it instead of being an automatic no. On your league\'s real trades it now gets 26 of 34 managers right (was 17), and clearly bad asks still read Unlikely. Trade Coach and negotiations use the same read, so they now find deals that tilt your way and still get accepted. The grade itself is unchanged.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Depth no longer counts players on injured reserve as bench cover, since they can\'t play. Taxi players still count, since they can be promoted.' },
    { kind: 'changed', page: 'Everywhere', text: 'Depth now uses real history: starters are counted as out about 3.5 weeks a season (bye included), which is what fantasy starters actually missed from 2018 to 2025, nearly the same at every position. It still counts extra as insurance, since about 1 in 6 starters misses 6+ games.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Picks now say which one they are ("2027 R1 (mid)") in the trade, Trade Coach and negotiation replies. Best trades no longer suggests swapping two picks worth the same, and puts pick-for-pick trades last.' },
  ]},
  { date: '2026-09-29', items: [
    { kind: 'changed', page: 'Everywhere', text: 'The grade and Trade Coach now follow the same depth rule: a trade that costs a team more depth than it adds to its lineup can\'t count as a strong fit for that team (so it can\'t be Great because of them), and the coach never suggests it. The depth note says so when it applies. Verdicts that are solid for only one team now name it ("Solid for Super bo or bust, Fine for Skat Happens Chase Love").' },
    { kind: 'new', page: 'Everywhere', text: 'Depth now counts. For every trade, the site checks what your lineup loses when each starter misses a game (a bye plus injuries, about 4 games a season), refilling from your bench with your league\'s real lineup (3 WR and 3 flex, superflex, and so on). A trade that leaves you thinner is marked down, with depth counting double next to the healthy-lineup gain; you\'ll see a note like "Thinner depth: bye and injury weeks would cost the lineup about 1.9 more points a week." Rebuilding teams count it less. The This season odds include it, and Trade Coach no longer suggests trades that cost you more depth than they add to your lineup (e.g. selling your third QB in superflex).' },
    { kind: 'new', page: 'Trade Calculator', text: 'Will they take it? Every trade now shows, right next to the grade, whether the other manager would likely accept: Likely yes, Probably yes, Probably not, or Unlikely, with the main reason. When it\'s a no, it names the smallest change that would get it done ("They\'d do it if you add Trey McBride") and a Make that change button. It\'s the same read the Offer button gives, so the two always agree.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'A calmer trade card: it now leads with the grade, whether they\'d take it, and what it does to this season. The KTC and adjusted values and the even-it-up suggestion are under Details.' },
    { kind: 'improved', page: 'Everywhere', text: 'The last "Team A" and "Team B" labels are gone: trade type descriptions on the Trade Calculator and the side headers on Trade Grades use the teams\' names. How We Grade now explains how a trade\'s effect on this season\'s odds is worked out.' },
    { kind: 'fixed', page: 'Everywhere', text: 'New visitors who open a page without having picked a league now land on the home page to choose theirs, instead of seeing someone else\'s league. League search on the home page also looks ahead a season, so next year\'s leagues show up as soon as they exist.' },
    { kind: 'removed', page: 'Trade Calculator', text: 'The FantasyPros experts view is gone (Buy-low / Sell-high tags, the Experts bar and row, and the Experts line on Trade Grades). One clear grade you can check against KTC is easier to act on than two that can disagree. The This season odds stay.' },
    { kind: 'new', page: 'Trade Calculator', text: 'An Experts bar: right under the grade\'s fairness bar (same width, same center) sits a slim bar for the FantasyPros experts\' read of the same trade, with a line saying who they favor and by how much. It also appears, with Trade Grades, as its own row in the fairness breakdown, set apart from the three parts of the grade since it isn\'t one of them.' },
    { kind: 'new', page: 'Trade Grades', text: 'Each trade now has an Experts line next to At the trade and Today: the same trade priced by the FantasyPros dynasty experts\' rankings today, on the same Fair / Lopsided / Unfair scale.' },
    { kind: 'new', page: 'Trade Grades', text: 'This season\'s trades show what they are doing for each team right now: playoff and title odds with the trade against the same team with it undone (e.g. "Playoffs 65% vs 61% without, +4"), and the points per week it adds or costs. Trades that changed neither starting lineup say so. Skipped when a player involved has since moved on.' },
    { kind: 'new', page: 'Trade Calculator', text: 'This season: every trade now shows what it does to each team\'s playoff and title odds (e.g. "Title 40% → 32%"), how many points a week its best lineup gains or loses, and who moves into or out of the starting lineup. It runs the same season simulation as League Overview, before and after the trade on identical simulated games, so the change comes from the trade itself.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Experts vs market, with FantasyPros: players the FantasyPros dynasty experts rank well above where the trade market (KTC) has them get a Buy-low tag, and the reverse get Sell-high, on your rosters and in the trade. The value table has a new Experts row: the same trade priced by the experts\' rankings, on KTC\'s scale, with a note when the experts see a trade the other way. The grade itself still uses KTC. Updated daily; superflex leagues use the experts\' superflex rankings.' },
    { kind: 'improved', page: 'League Overview', text: 'Opening a team now has an "Open in Team Analyzer" link that goes straight to that team\'s flaws, best trade partners, and contention window, with no need to pick the team again.' },
    { kind: 'improved', page: 'Team Analyzer', text: 'The lineup, players-by-position, and picks section matches League Overview exactly: every player at each position (with a count, so depth shows), each pick\'s value and early/mid/late tier, which team a pick came from, and the best lineup\'s PPG and VORP. The picks heading follows the league\'s real pick years. The page also remembers which team you are viewing in its address, so you can share or reload it.' },
    { kind: 'fixed', page: 'Everywhere', text: 'The page tabs could vanish for a few minutes right after an update, if your browser still had the old styles saved. They now always show, and every update loads cleanly on its own: pages always pick up matching styles and scripts, with nothing to refresh.' },
    { kind: 'improved', page: 'Everywhere', text: 'The page tabs are grouped: League (Overview, Team Analyzer), Players (Rankings, Compare), and Trades (Calculator, Grades, Database, Managers). On phones, the sideways-scrolling tab row is now one All pages menu.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'A cleaner trade card: what you give and what you get sit side by side with position tags and values, the grade is big and says who it favors ("Unfair, 65% off, in Molon Labe\'s favor"), the even-it-up suggestion names the team, and every action (who is offering, balance, offer, share, reset) is in one row at the bottom.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach results are easier to scan: each card lists what you give and get on separate lines with positions and values, and opens with a quieter "Open in builder" button.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Verdicts name the teams instead of "Team A" and "Team B", and ones about roster fit now say so ("Better fit for Molon Labe" instead of "Solid for Team B"), so they never seem to argue with the value grade above them. Trade Grades verdicts name the teams the same way.' },
    { kind: 'removed', page: 'Trade Grades', text: 'The League Trade Summary table is gone from Trade Grades. It repeated the League at a glance table on Managers, which is now the one place for each manager\'s trade record. That table picked up the summary\'s Timeline/Need Fit column (as Fit), so nothing was lost.' },
    { kind: 'improved', page: 'Home', text: 'Faster start: coming back shows your last league with a one-click Open league button, your Sleeper username is filled in, and pressing Enter submits. After you pick a league, one Open league button takes you in (every tool is in the tabs at the top) instead of a second menu of pages.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach gets to the trades faster: on the first step, Find trades is the main button, and the must-include, leave-out, and position steps are an optional "Add rules" detour.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Negotiate is no longer a Trade Coach trade type, since it needs a trade already built. Build or load a trade, then use the Offer button in the trade bar, same as before.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Picking your team on the Trade Calculator\'s "Which team is yours?" screen now remembers it everywhere, so other pages mark it and nothing asks again.' },
    { kind: 'improved', page: 'Everywhere', text: 'Every place you pick a team or player is now a box you can type in: the team menus on the Trade Calculator and Team Analyzer, the Your team menu at the top, and every Trade Coach picker (shop, down-tier, trade with a team, and the must-include and leave-out lists). Start typing and the list narrows; arrow keys and Enter pick, Escape backs out. In the Their side lists you can also type a team name to see that team\'s players.' },
    { kind: 'improved', page: 'Everywhere', text: 'The site works better with a keyboard: sortable table headers, expandable team rows, player rows, and the players in the Trade Builder can all be reached with Tab and used with Enter or Space. A Skip to content link appears when you press Tab, and loading messages are announced to screen readers.' },
    { kind: 'improved', page: 'Everywhere', text: 'Easier to read and tap: dim text brightened, small links and buttons given bigger tap areas, search boxes and menus labelled for screen readers, and the player card on Player Rankings keeps your place when you close it.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On phones, the Match, Shop, and Get buttons on each player now show (they only appeared on mouse hover before), and the ✕ to remove a piece from the trade is always visible.' },
  ]},
  { date: '2026-09-28', items: [
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach is set up one step at a time instead of all at once: 1. the type of trade (and its player, team, or position), 2. what every trade must include, 3. what to leave out, 4. position rules, then the trades. Every step after the first can be skipped, or jump straight to the trades with Find trades now. Above the trades, each choice you made is a button that takes you back to change it.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach can now down-tier a player: pick one of your players and see trades where you get back a lesser player plus extra pieces, so you gain total value, that the other manager would likely take. Choose Any position or Same position.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach has position requirements on both sides. "Must include a" makes every suggestion send at least one of the positions (or a pick) you choose, and "Must get a" makes it bring one back.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'In Trade Coach, the player, team, or position you pick now sits right under the options, above Your side and Their side, so it is the first thing you see.' },
  ]},
  { date: '2026-09-27', items: [
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach has a new option, Trade with a team: pick any team and see the trades their manager would likely take, best for you first. It starts on the trade partner you already have in the builder, and follows your Your side and Their side rules.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'The Trade Calculator now opens on four choices instead of everything at once: Trade Coach, Shop a player, Get a player, and Trade Builder. Pick one and only that tool shows. A tab at the top switches between Trade Coach and Trade Builder, and "All tools" takes you back. Loading a trade from Trade Coach shows it in the builder right below. Shared trade links still open straight into the builder.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Rosters no longer run down the page as one long list. Each team is split into QB, RB, WR, TE, Picks and All sections that stay closed until you click one. Each section shows how many assets it holds, their total value, and how many you have selected in it.' },
    { kind: 'improved', page: 'Managers', text: 'League at a glance on Managers and the League Trade Summary on Trade Grades both have W-L Then and W-L Now columns: how many trades each manager came out ahead or behind on, at the prices on the day and at current prices. Click any column header in either table to sort by it.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'A cleaner layout: the two rosters sit side by side right under the trade bar, so you can build a trade without scrolling. "Who\'s offering" is a small toggle in the trade bar, the explanation of the numbers opens from "About these numbers", the full verdict sits below the rosters with the trade type in an expandable row, and each team\'s breakdown is in one "How it changes each team" section you open when you want it.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach is now a button at the top of the calculator instead of a panel that\'s always open, so the calculator comes first. Open it for trade options; "Offer to [team]" on a trade still opens it straight into the negotiation.' },
    { kind: 'new', page: 'Managers', text: 'Click a manager\'s name (in the table or on their card) to see only their trades on Trade Grades. A "Show all trades" button clears it.' },
    { kind: 'new', page: 'Trade Grades', text: 'Every trade shows its grade twice: at the trade (prices that day) and today (the same trade at today\'s prices), each with its % off and who it favors. Ten of this league\'s trades now grade differently than they did on the day.' },
    { kind: 'new', page: 'Managers', text: 'Each manager\'s Fair · Lopsided · Unfair counts show then and now, and their best and worst moves show how the grade changed since (for example Lopsided → Unfair).' },
    { kind: 'fixed', page: 'Everywhere', text: 'Grades use one color everywhere: Great purple, Good blue, Fair green, Lopsided amber, Unfair red, matching the fairness bar. Before, a Good trade could show green, an Unfair one grey, and a Fair verdict red on Trade Grades. On the Trade Calculator, an accept/decline recommendation keeps its own color and now shows the trade\'s grade as a colored badge next to it.' }
  ]},
  { date: '2026-09-26', items: [
    { kind: 'changed', page: 'Trade Calculator', text: 'Fix a position and Go all-in never pay a premium (Lopsided) to send away one of your starters. A premium is only suggested when it\'s paid with bench players and picks.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Fix a position could call a sidegrade an upgrade, like Ja\'Marr Chase for Amon-Ra St. Brown. A trade now counts as an upgrade when your lineup gets better and the best player in the deal comes to you, so you consolidate up instead of swapping stars. Go all-in instead needs at least 3 points a week, since it spends future value on points.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Loading one of the trade options folds the list away so the trade is right there, with a "Show options again" button to bring it back.' },
    { kind: 'changed', page: 'Trade Grades', text: 'The League Trade Summary\'s W-L now counts trades ahead or behind at today\'s values, matching Net Now and the Managers ranking.' },
    { kind: 'improved', page: 'League Overview', text: 'Projected records and playoff and title odds now factor in the points each team has actually scored this season, not just its best projected lineup. Real scoring counts more as the season goes on: a third after 2 weeks, half after 4, two thirds after 8. Teams outscoring their projection (Allen\'s Creamy Surprise, 179 a week vs 158 projected) move up; teams scoring well under it move down.' },
    { kind: 'changed', page: 'Managers', text: 'Managers are ranked by Net Now (what their trades are worth at today\'s values) instead of Net Then (what they looked like on the day). A manager whose deals looked bad at the time but have aged well, like buying a player before the price rose, now ranks higher. Each card leads with Net Now, shows Net Then and how much the trades have gained since, a W-L record both ways, best and worst moves judged by today\'s value, and the manager\'s trading style.' },
    { kind: 'improved', page: 'Managers', text: 'Sort the League at a glance table by Net Then, Net Now, Trades, or Manager: click a column header (click again to flip it). Managers with no trades stay at the bottom.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The "Which team is yours?" box no longer flashes up while the page loads when the site already knows your team. It opens straight onto your team.' },
    { kind: 'improved', page: 'League Overview', text: 'The standings table fits on the page without scrolling sideways. Each position\'s value now shows in the Position split (like "QB 22.1k"), record and projected record share a column, as do playoff and title odds, and on smaller screens the less important columns (position split and archetype, then age, Opt PPG, VORP, and window) tuck away instead of pushing the table off the page.' },
    { kind: 'fixed', page: 'League Overview', text: 'Value Over Time jumped for every team on 9/22 (and on the rookie draft, 5/2). KTC first priced 2029 picks on 9/22, and before that the history counted them as zero; the 2026 picks weren\'t counted before the rookie draft at all. Past days now value a pick at its first known KTC price (or the nearest year KTC prices), and count each year\'s picks until they\'re drafted, so the lines only move when values really do. Trade Grades prices past trades with the same rule.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Chart hover boxes (League Overview, Player Rankings, Compare Players) no longer get cut off near the right edge: they stay on one line and flip to the other side of your cursor.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Switching "Your team" at the top now reopens the calculator on your new team, even with a trade link in the address bar, and switching your team in the calculator refreshes its trade options.' },
    { kind: 'fixed', page: 'Compare Players', text: 'Hovering near the right side of the value chart cut the values box off. It now stays on one line and flips to the left of your cursor when it would run off the edge.' },
    { kind: 'improved', page: 'Compare Players', text: 'Stats are split into tabs by category (Fantasy production, Consistency, Usage, Efficiency, Touchdowns, and so on), so only the one you\'re looking at is on screen instead of one long table. Your last tab is remembered. The row with the player names also stays pinned under the header while you scroll the Stats and Head to head tables.' },
    { kind: 'new', page: 'Trade Calculator', text: 'The trade bar shows two sets of numbers: KTC value (what you give, what you get, and the net, matching KeepTradeCut\'s calculator including its adjustment for the best player in the deal) and Adjusted (the same trade after positional need, lineup fit, and timeline, blended the same way as the grade). The adjusted net always matches the grade\'s % off.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The Trade Calculator starts from your team. Pick it once (or it opens straight on it when the site knows your team), and your trade options appear right on the page: Best trades, Shop a player, Get a player, Fix a position, Rebuild, Go all-in, and Negotiate. Loading a trade only ever fills in the partner, so your side never gets switched out. Pick a partner yourself from the menu, or from the suggested partners in that column.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Best trades: the fairest trades across the league for your team that the other manager would likely accept. Shop a player: the best offer from every team for one of your players or picks. On any roster row, Shop and Get jump straight to those.' },
    { kind: 'removed', page: 'Trade Calculator', text: 'The separate Suggest a Trade, Find a Trade, and Trade Coach buttons. Everything they did now lives in the trade options on the page.' },
    { kind: 'improved', page: 'Everywhere', text: 'A cleaner, easier-to-read look across the whole site. One typeface (Inter) for text and numbers, with numbers that line up in columns; no text smaller than 11px, and every grey readable against the background; gold kept for primary buttons and the page you\'re on, green and red only for good and bad; one card style; a simpler header and logo; and a visible outline when you move around with the keyboard.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'The fairness bars now share one center: Overall, KTC value, Roster fit, and Timeline are the same width and line up exactly. Each team\'s full name labels its end of the bars (no more cut-off names), and each row\'s number points to the side it favors. Same on Trade Grades.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On the team cards under Trade Analysis, the Opt PPG and VORP changes no longer run into each other, and long team names wrap instead of being cut off.' },
    { kind: 'fixed', page: 'Trade Grades', text: 'Each trade\'s verdict line wraps instead of being cut off.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Each team column in the calculator has a Timeline dropdown (Auto, Contending, Rebuilding), so it works outside Trade Coach too. Use it on your team, or on the other team if you know they\'ve changed direction. Every grade on the page follows it.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Your timeline: tell the site whether you\'re contending or rebuilding instead of it guessing from your roster (Auto, Contending, or Rebuilding), and the Trade Analysis uses it too. Go all-in and Rebuild set it for you, so a rebuilding team that decides to go for it now isn\'t graded as wasting picks its rebuild needed. Saved in your browser.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach and Negotiate: a manager\'s willingness to deal dropped when a trade fit YOUR plan well, because their read compared both teams\' fit. Managers now judge a deal on KTC value plus their own lineup and timeline only.' }
  ]},
  { date: '2026-09-25', items: [
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach\'s Get a player shows more offers: up to 8, with up to two built around each of your players. When a manager would take your offer but you\'d be overpaying, the coach has them add a smaller piece (a pick or depth player) to make it Fair, which turns overpays into real alternatives. Lopsided offers only fill in when there are fewer than three Fair ones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach: Your side and Their side rules. Pick players or picks every trade must include, ones you won\'t trade, and whole positions or picks to leave out, and the same for what comes back: players you must get, ones you don\'t want, and positions or picks you won\'t take. Every suggestion follows them. On Rebuild, picking players under Sell these shops only those players, with offers from several teams.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach could say a manager "Would accept" while listing reasons they wouldn\'t, and could disagree with the Trade Analysis verdict below it. Managers now judge an offer from their own side (value plus what it does to their lineup and timeline), never accept what the Trade Analysis says they should decline, and each response splits into what they like and what gives them pause, with which side wins.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach lists no longer come back empty when nobody would sell at a Fair price. They show the cheapest deals the other manager would take, clearly flagged as Lopsided against you, and never Unfair.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach\'s "Get a player" could only show the player already in your trade. It now has a proper picker: every player in the league by value, searchable by name or team, with position filters.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach: one button, one panel with five options. Negotiate a trade: the other manager answers in their own words ("I don\'t think the difference between Chase and Puka is worth my 1st"), and you can ask for something else instead: more value, a QB, RB, WR, or TE, youth, points now, picks, or players from one NFL team. Get a player, Fix a position, Rebuild, and Go all-in each list trades to choose from, best for you first, every one a trade the other manager would likely accept. Load any of them into the calculator in one click.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Negotiation coach: after every response, the site recommends your next move and explains why. Send it as is, accept their counter, counter back with the one change that gets you closer to even that they\'d still take, shop the same player to whichever team in the league would give you the most for them, or walk away. Every option is one click, and shopping opens a new negotiation with that team.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Negotiate: hit "Offer to [team]" and see how that manager would likely respond — accept, or decline with their reasons (value, needs, rebuild or contend timeline, roster spots, and their real trading style), what on your roster they\'d rather have, and a specific counter. Accept it, or edit it and counter back, round after round. It\'s a prediction, not the real manager — send real offers in Sleeper.' },
    { kind: 'new', page: 'Compare Players', text: 'Compare up to four players side by side: value over time on one chart (presets or your own date range), value and projection ranks, recent price moves, projected points and VORP in your scoring, and 70+ fantasy stats for a career, a season, or just the games you tap on (with a game-by-game log), per game or in totals. Stats cover fantasy production, consistency (top-12 and starter weeks, floor, ceiling), usage (snap share, target and carry share, red zone work), efficiency, big plays, touchdowns, and ball security — pick which ones show — and each is ranked against everyone at the position over the same games, shaded green to red. With two players on different teams in your league, one click opens the trade. Also reachable from any player card on Player Rankings.' },
    { kind: 'improved', page: 'Everywhere', text: 'The top bar now has two rows: your team, How We Grade, Patch Notes, and Switch League up top, and every page tab in a row underneath. On phones the tab row opens on the page you\'re on and the bar scrolls away instead of staying pinned.' },
    { kind: 'fixed', page: 'Home', text: 'The sign-in page no longer scrolls sideways on phones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Share a trade: the Share button next to Reset copies a link (or opens your phone\'s share sheet). Whoever opens it sees the same teams, pieces, and verdict.' },
    { kind: 'new', page: 'Everywhere', text: 'Pick your team from the "Your team" menu at the top. The Trade Calculator and Team Analyzer open on it, and League Overview and Managers mark it with a You tag. If you sign in with your Sleeper username on the home page, it\'s picked for you.' },
    { kind: 'new', page: 'How We Grade', text: 'A new page explaining exactly how every grade is worked out: where the numbers come from, the Fair / Lopsided / Unfair cutoffs, the value + roster fit + timeline blend, VORP, playoff odds, and manager styles.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On phones, the page no longer scrolls sideways once a trade is loaded.' },
    { kind: 'new', page: 'Managers', text: 'League at a glance: a table at the top with each manager\'s trading style (consolidator, depth builder, youth & picks buyer, win-now buyer, or value trader) and a one-line description of how their trades have gone.' },
    { kind: 'new', page: 'Trade Grades', text: 'Every player and pick now shows its KTC value on the day of the trade and today, with the change, plus a then-vs-now total for each side.' },
    { kind: 'new', page: 'Trade Grades', text: 'League Trade Summary has Net Then and Net Now columns: each manager\'s trade results at trade-day prices and at today\'s.' },
    { kind: 'fixed', page: 'League Overview', text: 'Projected records and playoff odds were skipping the week in progress from Thursday night until it went final. Every team now projects the full season.' },
    { kind: 'improved', page: 'Everywhere', text: 'Pages load much faster: each one used to download about 9 MB of data before showing anything, and now it\'s about 1 MB. A big difference on a phone.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The fairness bars could show up a few seconds after everything else. The site\'s styling is now built ahead of time instead of in your browser, so they appear right away.' }
  ]},
  { date: '2026-09-24', items: [
    { kind: 'changed', page: 'Trade Calculator', text: 'The fairness grade now weighs KTC value (70%) with roster fit (15%) and timeline (15%). Three small bars under the main one show each piece. Fit can only make a grade worse than KTC alone, never better, so a deal that\'s lopsided on KTC never reads as fair.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Suggested Trades and Balance now look for 1-for-2 and 2-for-1 deals. Cards show the trade\'s shape and warn when someone would have to drop a player to fit it.' },
    { kind: 'changed', page: 'Trade Grades', text: 'Past trades are graded at KTC prices from the day they happened, not today\'s. A deal that was fair when it was made no longer reads as unfair because a player broke out later.' },
    { kind: 'fixed', page: 'Player Rankings', text: 'VORP was undervaluing QBs in superflex: RB and TE replacement level was set near 3 points per game. It now fills every lineup in the league properly (replacement is about 10 PPG for RB, WR, and TE).' },
    { kind: 'fixed', page: 'Team Analyzer', text: 'A team with strong playoff odds no longer shows "No window", and Flaws now lists the same positional needs as the Trade Calculator and trade-partner cards.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Manager names showed as a bare "@". They now show each manager\'s Sleeper name.' },

    { kind: 'fixed', page: 'Trade Calculator', text: 'Balance could throw out the piece you\'d already picked. It now always keeps your selection and adds to it when that gets the trade to fair.' },
    { kind: 'removed', page: 'Live Scores', text: 'The Live Scores page has been retired.' }

  { date: '2026-09-22', items: [
    { kind: 'new', page: 'Trade Calculator', text: 'Five fairness tiers: Great, Good, Fair, Lopsided, and Unfair. Great and Good are fair trades that also fit one or both teams well, shown as violet and blue bands inside the green on the fairness bar.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Fair / Lopsided / Unfair is decided by KTC value, the number anyone can check on KeepTradeCut. Roster need is still shown, but it can\'t make a lopsided trade look fair.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Warns when a trade would push a team over its active roster limit (taxi and IR spots don\'t count unless the incoming player qualifies).' },

  ]},

    { kind: 'improved', page: 'Everywhere', text: 'Colored position badges on every roster, lineup, and trade list.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Suggest a Trade pushes pick-for-pick swaps to the back instead of leading with them.' }
  ]},
  { date: '2026-09-19', items: [

    { kind: 'improved', page: 'League Overview', text: 'Column bars use a red-to-green scale based on where each team actually ranks.' }
  ]}
];

const KIND = {
  new: ['New', 'bg-emerald-500/10 text-emerald-300 border-emerald-500/25'],
  improved: ['Improved', 'bg-sky-500/10 text-sky-300 border-sky-500/25'],
  fixed: ['Fixed', 'bg-amber-500/10 text-amber-300 border-amber-500/25'],
  changed: ['Changed', 'bg-violet-500/10 text-violet-300 border-violet-500/25'],
  removed: ['Removed', 'bg-white/5 text-zinc-400 border-white/10']
};

// "New since your last visit" is per-browser only — a convenience, not state
// anyone else needs. Storage can be blocked (private windows), so every access
// is guarded and the page renders the same without it.
const SEEN_KEY = 'vault_patch_notes_seen';
let lastSeen = null;
try { lastSeen = localStorage.getItem(SEEN_KEY); } catch {}
try { localStorage.setItem(SEEN_KEY, NOTES[0].date); } catch {}

let pageFilter = 'All';
const pages = ['All', ...new Set(NOTES.flatMap(d => d.items.map(i => i.page)))];

function fmtDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  document.getElementById('filters').innerHTML = pages.map(p =>
    `<button onclick="setPage('${p}')" class="text-[12px] px-2.5 py-1 rounded-lg border transition-colors ${pageFilter === p ? 'bg-amber-500/15 border-amber-500/40 text-amber-200' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${p}</button>`
  ).join('');

  const days = NOTES.map(d => ({ ...d, items: d.items.filter(i => pageFilter === 'All' || i.page === pageFilter) })).filter(d => d.items.length);
  document.getElementById('notes').innerHTML = days.map(d => {
    const fresh = lastSeen && d.date > lastSeen;
    return `<section class="card rounded-vault-sm p-5">
      <div class="flex items-center gap-2 mb-3">
        <h2 class="text-[14px] font-semibold text-zinc-100">${fmtDate(d.date)}</h2>
        ${fresh ? '<span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-400 text-black font-semibold">New since your last visit</span>' : ''}
      </div>
      <ul class="space-y-2.5">
        ${d.items.map(i => `<li class="flex gap-3 items-start">
          <span class="shrink-0 w-[74px] text-center text-[11px] px-1.5 py-0.5 rounded border ${KIND[i.kind][1]}">${KIND[i.kind][0]}</span>
          <div class="text-[13px] leading-relaxed text-zinc-300"><span class="text-zinc-100 font-medium">${i.page}</span> · ${i.text}</div>
        </li>`).join('')}
      </ul>
    </section>`;
  }).join('');

  const total = NOTES.reduce((s, d) => s + d.items.length, 0);
  document.getElementById('status').textContent = `${total} changes · last updated ${fmtDate(NOTES[0].date)}`;
}

function setPage(p) { pageFilter = p; render(); }
render();
</script>
</body>
</html>
