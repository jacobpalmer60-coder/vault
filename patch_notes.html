    { kind: 'changed', page: 'Trade Coach', text: 'Trade Coach now looks for trades close to even instead of the most it could squeeze out. It used to keep the deal most in your favor that it guessed the other manager would still take, so down-tiering Ja\'Marr Chase came back 20 to 25% your way on every card (and a stretch at market prices). Every list now puts Fair trades first, closest to even (aiming about 4% your way): the same Chase search now returns packages within about 4% on trade value and 0 to 9% at market prices, all inside what managers usually pay.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Removed the Will they take it? box from the trade card. It ran a separate guess at the other manager\'s answer that could disagree with the acceptable read right above it. The acceptable line (what managers actually pay for these players) is now the one read on that question; Offer still plays out the negotiation, and Trade Coach cards drop their would likely say yes line.' },
    { kind: 'fixed', page: 'Trade Calculator', text: '"To even it up, you could add…" now actually evens it up. It was sizing the piece on plain KTC value, but trade value counts an added piece for less, so in a sweep of 27 lopsided trades none reached Fair after adding the suggestion; now it checks the trade each piece really makes and says where it lands ("that makes it Fair, 6% off on trade value").' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Price ranges come from every trade a player headlined, not just trades shaped like this one. A star\'s 1-for-1s are a skewed slice (stars rarely move straight up, and the few that do are mostly discounts), which made Chris Olave for Puka Nacua read Acceptable at 16% off; it now reads A stretch, and the Market box and the acceptable line quote the same range.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Wording cleanup from a full sweep of the calculator: team cards give the real number ("12% ahead on trade value") instead of "Even on sticker value"; "net trade value" instead of "value Δ (adj)"; the Adjusted row only shows when need, fit or timeline move it; the Market box speaks from the paying team\'s side ("TURBONUTZ pays 12% over KTC: more than most pay for him"); "The grade uses trade value"; the confidence note shows once; "Scrooge McDucks\' favor"; no more "−0.0".' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'An offer 5% or more in your favor with a neutral fit now reads Worth Accepting instead of Borderline, Worth a Counter. "You could ask for more" says "You could give less" when the idea is to send less, and "it becomes Fair" when the trade isn\'t Fair yet. A Fair trade that fits neither team reads "Fair Value, Poor Fit for Both" instead of "Bad Trade for Both Sides".' },
    { kind: 'improved', page: 'Trade Coach', text: 'Each suggested trade shows the acceptable read (Acceptable, A stretch, Rarely accepted), and "would likely / probably say yes" now matches the calculator\'s Will they take it? for the same trade.' },
    { kind: 'new', page: 'Trade Grades', text: 'The Overall bar now marks the acceptable range: bright white markers where the trade fits what managers usually pay for these players, faint ones for the outer range. They lean toward the side the market prices higher. The colors (Fair, Lopsided, Unfair) are unchanged, so you can see at a glance when a trade is Lopsided but still inside what managers accept. Same on the Trade Calculator.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Fair and acceptable are now two different reads. Managers accept unfair trades all the time, and that doesn\'t make them fair. The grade (Fair, Lopsided, Unfair) still says how even a trade is on value; a new line under it checks it against what managers actually pay. Every player and pick has a range of prices, low to high, from the last 45 days of completed Sleeper trades: Acceptable if the trade fits inside the usual range of every piece, A stretch if only inside the outer range, Rarely accepted if not even that, naming the piece and its range ("Jameson Williams usually goes for 8% under to 6% over KTC value, rarely more than 13% over"). Also on every Trade Grades card.' },
    { kind: 'changed', page: 'Everywhere', text: 'Grades now use trade value instead of KTC\'s consolidation adjustment. Same KTC player and pick values; what changed is how a side\'s pieces add up: the best piece counts in full and each extra piece for less (less still in cheaper trades), the way 1.5 million real Sleeper dynasty trades show managers actually price them. On KTC\'s adjustment only 30% of those real trades graded Fair and the team getting fewer, better pieces looked like it overpaid by about 27% (KTC\'s bonus fades whenever the best piece coming back is close to the star). On trade value, 66% grade Fair and the lean is about 1%. Applies to the Trade Calculator, Trade Coach, Trade Grades, Managers and the Trade Database. How We Grade has the full evidence.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Under the grade, three numbers side by side: what your team pays on trade value (the grade), on KTC\'s calculator (KeepTradeCut\'s own math, so you can still check it there), and at market prices. The value table shows both too, with each one\'s consolidation premium. Example: George Pickens and a 2027 1st for Nico Collins is 62% off on KTC\'s calculator (Unfair) but 20% on trade value (Lopsided), closer to what real trades like it look like.' },
    { kind: 'new', page: 'Trade Calculator', text: 'When one team gets fewer pieces, a line says how teams in the same spot did a year later, from 118,000 real trades: e.g. "Teams that got a 5,000-7,000 piece by sending 1.4-1.7x its KTC value came out ahead a year later 43% of the time." Consolidating into 7,000+ players held up best; paying 2.2 times the value or more rarely did (14%).' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Will they take it? no longer adds a big extra pull (+20) for the team getting the best piece: that existed to make up for KTC\'s adjustment under-crediting consolidation, which trade value now does on its own (it\'s +5).' },
    { kind: 'changed', page: 'Player Market', text: 'Market prices are measured on trade value too, so a star usually traded for two pieces isn\'t read as "over" just for being one piece; market prices and the calculator\'s market figure now agree with the grade. The position chart and the Trade Database\'s 2-for-1 premium still compare with KTC\'s own adjustment, since they\'re about KTC.' },
    { kind: 'changed', page: 'Player Market', text: 'Over and under now compare a player with similar players (same position, KTC value within about 15%), not with his own KTC value. KTC squeezes its low end, so nearly every player under 2,000 went for more than KTC (about 20% over at the median): 77 of them read "over" and 7 "under", which said nothing about the players themselves. Against similar players they split 50 over and 32 under. The market price is still what he actually goes for, and At market prices and Trade Coach\'s edges still use it. Shown on player cards, Player Market (lookup, All players\' "vs similar" column, Your market), the Market column on Player Rankings and Compare.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Trade Coach\'s Sell high and Buy low pick and describe players against similar players ("Cam Skattebo sells for 13% more than similar players"), so they no longer fill up with fringe players who all go for more than KTC.' },
    { kind: 'changed', page: 'Player Market', text: 'Rising & cooling ranks moves by how big they are for players at that value, since cheap players\' prices swing far more month to month; starters with real moves now make the lists. Your market\'s "This week" reads "from 31% under to 34% over KTC" instead of "+65 pts".' },
    { kind: 'fixed', page: 'Player Market', text: 'Rookie drafts listed veterans: the 2026 class showed Josh Allen, Jaxon Smith-Njigba, Drake Maye and Brock Bowers near the top, and most of every class\'s top 96 weren\'t that year\'s rookies. A few short drafts that aren\'t rookie drafts (small startups, veteran and dispersal drafts) were being counted, and the veterans taken early in them sorted to the top. Now only drafts that are mostly that class\'s rookies count, only that class\'s rookies are listed, and a rookie needs to be taken in at least 0.5% of the class\'s drafts. "What each pick bought" is cleaned the same way.' },
    { kind: 'fixed', page: 'Player Market', text: 'Market prices had quietly narrowed to about a week of trades. The site keeps up to 30,000 recent Sleeper trades, and with the collector now finding about 4,000 Superflex trades a day, keeping the newest 30,000 only reached back to September 30. They\'re now spread evenly over the last 45 days instead (an equal share per day, none from the days KTC\'s own feed already covers), so prices and "usually paid" ranges come from a steadier, multi-week sample. Applies everywhere market prices show: player cards, Player Market, the calculator\'s market line, Trade Coach and the Trade Database charts.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Opening a redraft or keeper league, or a league ID that doesn\'t exist, showed a one-line note above empty tables. League Overview, Team Analyzer, the Trade Calculator, Trade Grades and Managers now show one clear card ("Not a dynasty league" or "League not found") with a Switch league button, and the start page no longer offers to reopen a league that won\'t work.' },
    { kind: 'fixed', page: 'Managers', text: 'Who pays up reads "40% over" and "21% under" (over or under market price) instead of +40% and −21%.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Negative numbers use a real minus sign everywhere (Rankings trend, League Overview changes, Trade Grades value, Opt PPG and VORP changes, Compare VORP, the Player Market chart), and a change that rounds to zero shows no sign at all.' },
  ]},
  { date: '2026-10-04', items: [
    { kind: 'changed', page: 'Everywhere', text: 'Projected points per game now come from Sleeper\'s projections for the rest of the season instead of the whole season, so a player who takes over a starting job or loses his role moves Opt PPG right away rather than being averaged with projections for weeks already played.' },
    { kind: 'changed', page: 'League Overview', text: 'Projected records, playoff odds and title odds now play each week at that week\'s lineup: who\'s available (byes, injuries, return dates) and each player\'s matchup that week. A team missing its RB1 until week 8 is weaker in those weeks only, and title odds use the playoff weeks\' lineups. A trade\'s This season odds (Trade Calculator, Trade Grades) move each week by that week\'s lineup change.' },
    { kind: 'changed', page: 'Data status', text: 'Projections refresh every 3 hours instead of once a night, so injury news and depth chart changes reach lineups, records and odds within hours. Injury labels still update nightly with Sleeper\'s player list.' },
    { kind: 'changed', page: 'League Overview', text: 'A team\'s Best lineup now says it\'s the average per week over the weeks left ("Avg per week, wks 4-17"), and a starter who misses some of those weeks shows how many he starts ("Starts 12 of 14 wks"), so the total adding up to less than the players\' PPG makes sense. Injured players are tagged in the lineup and the position lists ("Out for season", "Back wk 8", "IR"). Same on Team Analyzer.' },
    { kind: 'fixed', page: 'Managers', text: 'The line over the table said The Gambler "has traded best" while the table ranked Skat Happens Chase Love first. They were measured differently: the line used market prices, the table today\'s KTC values. It now names both: who\'s furthest ahead at today\'s KTC values (what the table is ranked by) and who\'s furthest ahead and behind at market prices.' },
    { kind: 'fixed', page: 'Managers', text: 'Fit was a total across every trade, so a busy trader showed a big number without the "usually fit" note, while a one-trade manager got it. Fit is now the average per trade, the same number the note is based on.' },
    { kind: 'fixed', page: 'Managers', text: 'Descriptions no longer contradict the columns. "Aged poorly" isn\'t used for a team still well ahead ("still ahead today, by less"). Coming out ahead while losing most deals says so ("though they won only 7 of 16: the wins were bigger"). When market prices tell a different story than KTC, the description adds it ("At market prices, about even"). One-trade managers read "the deal" and "the trade fit", not "usually".' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Links that open a Trade Coach option (like "Find trades with them") lost the option when you hadn\'t picked your team yet. After you pick it, the option opens.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Trade Coach cards tag injured pieces ("Jonah Coleman RB, Out, back week 7 (ankle)"), and This season shows 0.0 instead of −0.0 for no change.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The grade\'s roster fit and timeline now follow the same week-by-week lineups. Trading Rome Odunze and Jonah Coleman for Jaxson Dart read "Good, 10% in Skat Happens Chase Love\'s favor", partly because Dart still counted as adding a starter and as a win-now piece. It\'s Fair, 7% now: a player projected to miss most of the weeks left adds no lineup points and gets no win-now credit in the timeline. This also applies in Trade Coach and in Trade Grades\' This season.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The Roster fit and Timeline bars (with Overall and KTC value) moved up under the grade, so you see what moved the verdict without scrolling past both rosters.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Injured players counted as healthy starters: Jaxson Dart, out for the season after knee surgery, showed as adding 1.1 points a week to whoever traded for him, over Kyler Murray. This season\'s lineups are now built week by week for every week left, playoffs included, from the players Sleeper projects to play that week. Byes count for real, and so do injuries: Dart adds nothing this season, and A.J. Brown counts from week 8, when he\'s projected back. The calculator tags these players ("Out for the season (knee)", "Out, back week 8 (ankle)") and says how many weeks a new starter would start ("A.J. Brown, 9 of 14 weeks"). Applies everywhere the lineup is used: League Overview, Team Analyzer, This season odds and Trade Coach. KTC values are unchanged.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Roster cuts ignored open IR slots. Trading Rome Odunze and Jonah Coleman (on IR) for Jaxson Dart said The Gambler would have to cut 2 players, but Coleman can go straight into one of their open IR slots, so it\'s 1. When the count is higher because a player being sent away is already on IR or taxi, the reason now says so.' },
  ]},
  { date: '2026-10-03', items: [
    { kind: 'fixed', page: 'Data status', text: 'The trade collector had stalled since October 2: each run stopped after a set number of calls rather than a set time, and with Sleeper answering about 430 calls a minute that took longer than the hour GitHub allows, so runs were cut off before saving. It now stops at 48 minutes on the clock, leaving time to save and price every run.' },
    { kind: 'new', page: 'Player Market', text: 'A KTC value filter on All players, Highs & lows and Rising & cooling: Any value, Under 2,000, 2,000+, 4,000+, 5,000+, 6,000+, 8,000+, or type any minimum (say 4,500). One setting covers all three tabs and is remembered for next time. Highs & lows\' "By position" line also reads "QB 4% over" instead of "+4%".' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach called every suggestion "Fair" unless it leaned against you, so a deal 52% in your favor (Trey McBride for Caleb Williams and Kenneth Walker) was labeled Fair. Cards now give the real grade, like "Unfair, in Skat Happens Chase Love\'s favor".' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The market line in negotiations shows both prices ("At market prices Molon Labe pays 23% over, against 37% over on KTC value") instead of the confusing "17% over, better for them than on KTC", and picks are "its" KTC value, not "his".' },
    { kind: 'fixed', page: 'Player Market', text: 'Rookie drafts: with six rookie classes collected, the season buttons ran off the side of a phone screen; they wrap now.' },
  ]},
  { date: '2026-10-02', items: [
    { kind: 'improved', page: 'Everywhere', text: 'The Vault has its real logo: the gold vault door and "THE VAULT" wordmark on the start page, the vault door in the header, and as the icon on browser tabs and phone home screens. League Overview\'s footer no longer credits FantasyPros, which the site stopped using.' },
  ]},
  { date: '2026-10-01', items: [
    { kind: 'improved', page: 'Player Market', text: 'Market values past the 25% cap now say so: "25%+ over" and a market price like "2,075+" instead of a flat 25%, on the player card, Player Rankings, Compare and Player Market. The cap stays in the trade math so one noisy read can\'t swing a trade, but sorting uses the real read (Carson Wentz\'s 108% over ranks above a 26%), and hovering the Rankings cell shows the full figure. These are mostly players under 2,000, where a few hundred points is a big percentage.' },
    { kind: 'improved', page: 'Compare Players', text: 'The value chart is readable again: each day\'s trade dots are now off by default (a "Show each day\'s trades" button brings them back), so the scale fits the KTC lines and the dotted market-price lines instead of stretching to 0–20,000. Player cards lead with the KTC value in big numbers and the market price under it ("market 8,325 · 7% under"), stacking under the name on phones, and Head to head adds Market price and Market vs KTC rows.' },
    { kind: 'new', page: 'Player Rankings', text: 'A Market column: what managers pay for each player in completed trades against his KTC value ("13% over", "7% under"), the same number as his player card. Sort it to find who sells over or under KTC.' },
    { kind: 'improved', page: 'Everywhere', text: 'The new look reaches the rest of the site: the player card leads with a player\'s market price ("7,642 · 13% over KTC value"), Trade Database premiums read as prices ("paid 12% over") with a one-line intro, Managers\' "Who pays up" marks overpaying in orange, and the last gold used for anything but The Vault itself (selected chips on Compare, hover and focus outlines, Rankings\' row highlight) is now neutral.' },
    { kind: 'improved', page: 'Player Market', text: 'Market numbers read as prices: "13% over KTC", "Rome Odunze 18% under", "Paid 108% over KTC value" instead of +/− percentages. A player\'s lookup leads with his KTC value and market price in big numbers, and the intro is one line with a How it works link.' },
    { kind: 'improved', page: 'Team Analyzer', text: 'Calmer colors (stat tiles marked by rank in one tone, the contention window in green instead of gold), and the five-year value bars in the contention window draw again; they had been collapsing to nothing.' },
    { kind: 'improved', page: 'League Overview', text: 'Team values and ranks in the new condensed numbers, and "What the numbers mean" plus the archetype guide folded into one section that stays closed until you open it (the "What do these numbers mean?" link opens it). Title odds no longer use the brand gold.' },
    { kind: 'improved', page: 'Trade Grades', text: 'Each trade leads with what the first team paid, three ways in a row: "Skat Happens Chase Love paid 21% under KTC value then · 25% under KTC value today · 7% under market price", each with its grade (Lopsided, Fair) underneath. The fairness bars and the ± note moved into "How it\'s graded, and the full breakdown", and the page intro is one line.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Negotiating names the teams and says numbers as prices: "Round 1 · Skat Happens Chase Love\'s offer", "What gives Walker Touchdown stRanger pause: On KTC value, Walker Touchdown stRanger pays 5% over", "At market prices Walker Touchdown stRanger pays 31% over", and next steps like "Walker Touchdown stRanger would likely still take it. Skat Happens Chase Love pays 46% under KTC value."' },
    { kind: 'improved', page: 'Trade Calculator', text: 'The trade builder leads with the verdict the same way Trade Coach does: the grade ("Fair") in big type, then "Skat Happens Chase Love pays 5% under KTC value · 31% under market price". Every side and number is labeled by team ("Walker Touchdown stRanger sends", "Here Walker Touchdown stRanger pays 5% over KTC") instead of "you" and "they", and the market note shrinks to one line naming the players that move it.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach cards, redesigned: each trade now leads with the price, naming the team: "Skat Happens Chase Love pays 5% under KTC value · 31% under market price" (under means getting more than you send; over means overpaying), then the pieces as one tight list, one line on why (e.g. "Rome Odunze trades about 18% below his KTC value"), and "Walker Touchdown stRanger would likely say yes". The paragraph above the list is now one line with a How this works link.' },
    { kind: 'improved', page: 'Everywhere', text: 'New look, first steps: page titles and big numbers use a condensed stat-sheet typeface, and Lopsided is orange everywhere (grades, the fairness bar, Trade Database charts, Trade Coach), so gold only means The Vault.' },
    { kind: 'improved', page: 'Everywhere', text: 'Pages line up: the header and every page now share the same edges (wide pages like League Overview, Rankings, the Trade Calculator and Managers at one width, card pages like Player Market and Trade Grades at another), with even margins on phones. The start page lists what\'s inside as a clean list instead of three boxes, and says where the data comes from: KeepTradeCut values and Sleeper league data, with The Vault an independent fan project not affiliated with either.' },
    { kind: 'improved', page: 'Everywhere', text: 'A cleaner, calmer look: a real logo (a vault dial) in the header and on browser tabs, gold kept for the one main button on a page and the page you\'re on (selected filters and toggles are now plain white), League Overview\'s little bars in one quiet tone instead of red-to-green, and Player Rankings\' two big "players / format" boxes folded into one line.' },
    { kind: 'new', page: 'Player Rankings', text: 'How often a player changes hands: the player card and the Player Market lookup now say how many completed trades he was part of in the last 30 days, next to the 10 players at his position closest to his value (e.g. Drake Maye 379 vs 194 for QBs near him: changes hands often). Stars usually change hands less than the players just below them, because their owners rarely sell.' },
    { kind: 'improved', page: 'How We Grade', text: 'Two checks on the new trade data, written up: the Fair / Lopsided / Unfair cutoffs hold up on about 137,000 Sleeper trades (the Fair line matches; if anything the Unfair line is generous), and paying above KTC for a player does not predict KTC raising his value later, so the market is what you can get now, not a forecast.' },
    { kind: 'improved', page: 'Trade Calculator', text: '"Will they take it?" now counts the market: when a deal is better or worse for the other manager at what players actually go for in completed trades than at KTC, half that difference moves their willingness (up to 8 points), and their answer names the player who made the difference (e.g. "Jonathan Taylor trades about 13% above his KTC value"). This was off until it could be tested properly; on about 136,000 completed Sleeper trades, each priced on its own day using only the market before it, completed trades sit closer to even at market prices (typical gap 24.9% to 22.8% in Superflex), and the market version called more of them right. Trade Coach uses the same answers.' },
    { kind: 'fixed', page: 'How We Grade', text: 'The negotiating section said managers never accept a deal the Trade Analysis reads as bad for them; since September 30 that counts against the deal but isn\'t an automatic no. It now says so, and explains the market factor.' },
    { kind: 'improved', page: 'Player Market', text: 'Tabs instead of one long scroll: under Your market, buttons for Look up a player, All players, Rising & cooling, Highs & lows, By position and Rookie drafts show one section at a time. The open tab is in the page address (so a link can open it) and remembered for next time, and clicking any player charts him in Look up.' },
    { kind: 'improved', page: 'Data status', text: 'The trade collector now waits a minute and tries again once when Sleeper has a server hiccup (like a 502), instead of ending the whole run; it still stops right away if Sleeper ever says it\'s getting too many requests. Each run\'s bar notes any retries.' },
    { kind: 'improved', page: 'Everywhere', text: 'Easier to find your way around: the start page says what\'s inside (League, Players, Trades) and where to find your username or league ID; League Overview and Team Analyzer open with a line on what they show; League Overview links straight to "What the numbers mean" (formerly Legend, now in plain words); Trade Grades explains its three reads (At the trade, Today, At market); and Managers explains its Market and Fit columns.' },
    { kind: 'improved', page: 'Team Analyzer', text: 'Best trade partners now say Strong, Good, Some or Weak fit instead of a "x/10" score that wasn\'t really out of 10, and on your own team each partner has a "Find trades with them" link that opens Trade Coach on that team.' },
    { kind: 'improved', page: 'How We Grade', text: 'A new "The market" section covers market value, the trades behind it, Your market, Sell high and Buy low, Who pays up and Rookie drafts (those notes used to sit under Playoff odds), and the Trade Coach list now covers every option, including Sell high, Buy low, Trade with a team and Down-tier.' },
    { kind: 'new', page: 'Player Market', text: 'The trades behind it: under a player\'s (or pick\'s) market chart, the completed trades his market value comes from, newest first. Each shows the date, the league format, what the team getting him got and sent with KTC values, and what they paid vs KTC. His market value is the median of these, so you can check it yourself. The most extreme tenth at each end (lopsided or partly recorded trades) are faded as outliers, since a median barely moves for them.' },
    { kind: 'improved', page: 'Player Market', text: 'Rookie drafts, "What each pick bought": each pick slot (1st early, mid, late, and so on) now shows what KTC said the pick was worth on draft day next to the KTC value of the players actually taken there, and the difference, plus a one-line verdict on the 1sts. Starts with the 2026 class (KTC\'s pick history has no 2024 or 2025 picks) and fills in as rookie drafts are collected.' },
    { kind: 'fixed', page: 'Data status', text: 'The trade collector\'s pricing step had been failing since its first hour (a git step ran before the bot\'s name was set), so new Sleeper trades were saved but not priced into the market. Fixed; the next run prices everything collected so far.' },
    { kind: 'improved', page: 'Player Market', text: 'The "Your market" card (your players and picks that sell above or below KTC, this week\'s movers, and the Sell high / Buy low buttons) moved from League Overview to the top of the Player Market page, so League Overview stays about your league. Clicking a name now charts it right there.' },
    { kind: 'improved', page: 'Everywhere', text: 'Phone fixes for the new market pages: the Player Market\'s all-players table shows KTC under each name and folds "vs KTC" under the market value; Managers\' "Who pays up" fits a phone without sideways scrolling; Trade Database\'s "By position" and "Year by year" tables use short headers on phones; Compare\'s chart keeps long last names (Smith-Njigba) inside the chart; and the player card\'s charts are drawn for a phone\'s width so their numbers stay readable.' },
    { kind: 'improved', page: 'Everywhere', text: 'Faster market charts as the trade history grows: the day-by-day market points now cover the last 400 days, and older trades are kept month by month in a separate small file. The player card, Player Market and Compare merge the two, so the full history still shows (older months as one dot each).' },
    { kind: 'fixed', page: 'Data status', text: 'Cancelled collection runs (replaced by a newer one) no longer count as the last run; they show gray in the run strip.' },
    { kind: 'new', page: 'Player Market', text: 'Rookie drafts: where each rookie actually went in Sleeper dynasty rookie drafts in your QB format (his typical pick shown as in a 12-team draft, e.g. "1.04", with his earliest and latest), and what each pick slot bought: the KTC value on draft day of the players taken in each round\'s first, middle and last third (2026: an early 1st bought a median 5,728, a late 1st 3,580). One rookie class at a time; it fills in as more leagues are collected.' },
    { kind: 'new', page: 'Managers', text: 'Who pays up: a table of what each manager has paid over market (or gotten as a bargain) in your league\'s trades, by the position of the best piece they got (e.g. Salt Factory +23% for RBs). Trade Coach\'s Sell high now goes to the managers who pay up for a player\'s position first, and the card says so ("Salt Factory has paid about 23% over market for RBs in your league").' },
    { kind: 'improved', page: 'Player Market', text: 'Market trend lines: through the day-by-day dots, a line for the 30-day median of what managers paid (once there are 5+ trades in the window), on the player card, the Player Market lookup and Compare Players (dotted, in each player\'s color), so you can see whether the market is warming or cooling on him at a glance.' },
    { kind: 'new', page: 'Trade Grades', text: 'At market: each past trade now has a third grade under At the trade and Today, the same trade with every piece priced at what it actually goes for in completed trades (roster fit and timeline as in Today), so you can see which deals look better or worse once the market is counted.' },
    { kind: 'new', page: 'League Overview', text: 'This week on the Your market card: which of your players and picks moved most in what managers pay against KTC (the last 7 days against the 30 before), e.g. "Nico Collins ▲ +6 pts". It shows once there are enough completed trades to call it a move (3+ this week, 5+ before).' },
    { kind: 'new', page: 'Compare Players', text: 'The value chart now shows what managers paid: an open dot in each player\'s color for every day he headlined a completed trade, next to his KTC line. Hover for both numbers.' },
    { kind: 'improved', page: 'Data status', text: 'The Sleeper trade collection now runs around the clock: each run starts the next one when it finishes, instead of waiting on GitHub\'s hourly schedule (which stays as a backup).' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Sell high and Buy low are now two separate Trade Coach options, each with its own list of up to ten deals: Sell high shops your pieces that sell over KTC for more than their KTC value; Buy low finds pieces on other teams that sell under KTC and offers that get them for less than their KTC value. League Overview\'s Your market card has a button for each.' },
    { kind: 'new', page: 'League Overview', text: 'Your market: a card at the top of League Overview shows your players and picks that sell for clearly more than KTC in completed trades (sells high) and clearly less (sells low), e.g. "Jonathan Taylor +25%". Each opens its chart on the Player Market page, and Find sell-high trades opens Trade Coach straight to Sell high, buy low with the results already found.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Sell high, buy low now always shows both kinds: up to five deals selling your market highs and five buying other teams\' market lows, so the buy-low side isn\'t crowded out.' },
    { kind: 'improved', page: 'Everywhere', text: 'Faster pages: the Trade Calculator, Trade Database, Player Market and Player Rankings now load KTC\'s trade feed for your league\'s format only, in a compact file (about 150 KB to download for Superflex instead of about 380 KB), so they open and draw noticeably faster, especially on phones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Sell high, buy low: a new Trade Coach option. It shops your players and picks that sell for more than KTC in completed trades (8%+) for more than their KTC value, and finds other teams\' pieces that sell for less (8%+ under) you can get for less than theirs, keeping only deals their manager would likely take, most ahead for you first. Each card says why ("Sell high: Jonathan Taylor sells for 25% over KTC in completed trades. Buy low: 2027 R1 sells for 14% under KTC.").' },
    { kind: 'new', page: 'Managers', text: 'Who trades well at market prices: League at a glance has W-L Market and Net Market, every manager\'s trades again at what players actually go for (today\'s KTC values times each piece\'s market value from completed trades), plus a line naming who has traded best and who has given up the most. A manager who keeps getting pieces the market pays up for comes out ahead here even when KTC calls the trades even.' },
    { kind: 'new', page: 'Data status', text: 'A Data status page (top bar, next to Patch Notes) shows everything the site runs on: whether the daily update and the hourly trade crawl succeeded and when, how many players, picks and values are loaded and how fresh they are, KTC\'s trade feed, how many completed trades have been collected and priced in each format, how the crawl is going (leagues seen, still queued, new trades per run, trades per season), and how big the saved trade files are.' },
    { kind: 'new', page: 'Player Market', text: 'Draft picks are on the Player Market page: a Picks filter in the table and in Market highs & lows, a pick line in the position trends, and a chart for any pick in the lookup. Picks are tracked by year and round (e.g. 2027 1st), since Sleeper trades don\'t say early, mid or late and KTC\'s feed stores every pick as mid, so a pick\'s KTC value is that year\'s mid pick in the round. Early read: firsts go for less than KTC (2027 1st −14%), late-round picks for more (fourths about +25%). At market prices and Trade Coach now price picks at market too.' },
    { kind: 'new', page: 'Player Market', text: 'A new Player Market page (Players menu): look up any player to see his KTC value over time with a dot for every day he headlined a completed trade; how each position trades against KTC, month by month; who is rising and cooling (the last 30 days against the 30 before); Market highs & lows (moved here from the Trade Database); and every player ranked by market value, sortable, with his KTC rank beside it ("#6 ▲13 Jonathan Taylor, KTC 6,749, market 8,436, +25%").' },
    { kind: 'changed', page: 'Everywhere', text: 'Market value now counts every completed trade a player headlined, not just like-for-like ones. Like-for-like trades read every star low (a star\'s partner can only be worth less), while across all trades each value level comes out about even with KTC. Getting a star for more pieces is already in KTC\'s consolidation bonus: beyond it, buyers paid only about 6% more. The player card, the Player Market page and At market prices all use this one number.' },
    { kind: 'new', page: 'Trade Calculator', text: 'At market prices: under the grade, a line shows the trade with every player priced at what he goes for in completed trades, next to KTC, and which player makes the difference ("It\'s about 29% in your favor, vs about 12% on KTC value alone: Amon-Ra St. Brown trades about 16% above his KTC value"). The grade still uses KTC.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach\'s Best trades now looks for market edges: among trades the other manager would take that are Fair on KTC, the ones that are better for you at market prices come first (you send players who go for less than KTC says, or get ones who go for more), and each card says why.' },
    { kind: 'new', page: 'Trade Database', text: 'Market highs & lows: players managers are paying more (or less) for than others at the same position and KTC value, from like-for-like trades (each side sent the same number of pieces) in leagues like yours. A chance to sell high or buy low, with position filters and a line on how each position trades against KTC as a whole (tight ends, for example, go for less than KTC\'s TE-premium prices). Comparing with peers keeps stars and cheap players from skewing the lists: a star\'s trade partner can only be worth less, and a cheap player\'s tends to be worth more.' },
    { kind: 'new', page: 'Player Rankings', text: 'The Value Over Time chart now shows market points next to the KTC line: every day the player was the main piece in a completed trade, what managers paid for him that day (bigger dots for more trades). Hover for both numbers.' },
    { kind: 'changed', page: 'Everywhere', text: 'Wording: "real trades" is now "completed trades", and the calculator\'s Real trades line is now The market, so nothing suggests the site\'s own grades are made up.' },
    { kind: 'new', page: 'Player Rankings', text: 'Market value on every player card: what managers actually pay for him, next to his KTC value. It comes from completed trades where he was the main piece (KTC\'s feed plus the Sleeper trades The Vault collects), from leagues as much like yours as there are enough of, e.g. "8,501, +7% vs KTC (7,957). Teams getting him paid 7% more than KTC says, usually 7,707 to 9,794." It uses like-for-like trades (same number of pieces each way) when there are enough, and says how he compares with players at his position and value. Players without enough trades yet say so, and fill in as more are collected.' },
    { kind: 'changed', page: 'Trade Database', text: 'The market charts now use trades from leagues as much like yours as possible: your exact settings (team count, Superflex or 1QB, PPR, TE premium) once there are enough of them, stepping down to any team count, then your QB format and TE premium, then your QB format alone. The heading names the match it used ("leagues like yours (Superflex, 1 PPR, TE+)") and says when it had to go broader. It always follows whichever league is loaded, so another league gets its own match.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The market steps down the same way for each player, needing at least 10 trades before it narrows to leagues closer to yours, and says which leagues it compared ("10 trades from leagues like yours (Superflex, TE+)").' },
    { kind: 'changed', page: 'Trade Database', text: 'The market charts now keep growing on their own: alongside KTC\'s last few days, they pool completed trades from Sleeper dynasty leagues from the ~90 days before (each priced at KTC values from its own day), so samples get bigger as the collection grows. The two never overlap, so no trade counts twice. The heading says how many came from each.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The market line under the grade uses the same pool: KTC\'s last few days plus the Sleeper trades before them, so lesser players get real comparisons too.' },
    { kind: 'new', page: 'Trade Database', text: 'Year by year: Over time now has a table of each year\'s trades (typical % off, the Fair / Lopsided / Unfair split, how many were 1-for-1, and what 2-for-1 consolidators paid), each year summarized whole.' },
    { kind: 'improved', page: 'Trade Database', text: 'Your league vs the market now shows your league\'s real Great and Good grades too. The market can\'t have them (they need both teams\' rosters at the time of the trade), so the two are compared on Fair or better.' },
    { kind: 'new', page: 'Trade Database', text: 'Over time: the Trade Database is now building a long history of completed dynasty trades from Sleeper leagues (going back to 2021), each priced at the KTC values from the day it happened, in your league\'s exact format (Superflex or 1QB and its TE premium). Once enough months fill in, it charts the typical trade\'s % off and the share graded Fair, month by month. Until then it shows how many trades it has collected. Before September 2023 only player-for-player trades can be priced, since pick prices start then.' },
  ]},
  { date: '2026-09-30', items: [
    { kind: 'new', page: 'Trade Database', text: 'The market at a glance: charts of every real trade in your league\'s QB format (about 17,000 Superflex trades this week), priced with the Trade Calculator\'s own math. The typical real trade is about 22% off on KTC value, and only about 31% grade Fair. Charts: how far off completed trades are (Fair / Lopsided / Unfair, with your league\'s trades marked under it); by trade shape (1-for-1 trades run about 13% off, 1-for-2 about 35%, and the side getting fewer pieces pays about 30% over KTC); how rarely stars go 1-for-1 (about 1% of trades with an 8,000+ player); by position of the best piece; and your league next to the market (your league\'s typical trade is closer to even than the market\'s).' },
    { kind: 'fixed', page: 'Trade Database', text: 'Matching trades to your league no longer requires the exact same number of starters, which threw out most trades for a small difference (e.g. 10 vs 11 starters). A 10-team Superflex, 1 PPR, TE+ league now matches about 970 trades instead of about 170.' },
    { kind: 'new', page: 'Trade Calculator', text: 'The market: under the grade, a line shows what managers paid for the trade\'s main player over the last few days in KTC\'s trade database, in your league\'s format ("29 Superflex trades in the last 5 days had Amon-Ra St. Brown as the main piece… usually paid 12% under to 13% over KTC. Here you pay 12% under: less than most pay"). It compares trades shaped like yours when there are enough, since a 1-for-1 and a 3-for-1 price differently. Open it to see every trade as a dot with yours marked, and the three completed trades most like yours. The grade itself doesn\'t use these.' },
    { kind: 'new', page: 'Trade Calculator', text: 'You could ask for more: when they\'d say yes with room to spare (usually when you\'re overpaying), Will they take it? names the one change that gets you more while they\'d still say yes and it stays Fair, e.g. "Offer your 2027 R2 instead of Nico Collins", with an Ask for it button.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Lineups after the trade: a new section shows both teams\' starting lineups once the trade goes through, marks who comes over in the trade (New) and who moves up from the bench (Starts), and for every starter, who steps in when he\'s out and how many points that costs ("If out: Rashee Rice steps in, −3.3 (was −0.1)"). It\'s the depth number, player by player.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Add any player: type any player or pick in your league in the search box at the top of Trade Builder. Your own goes on your side; anyone else\'s goes on theirs and makes their team the trade partner.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Stars rarely move one-for-one, and Will they take it? now knows it. In KTC\'s trade database only about 1 in 100 trades with an 8,000+ player was 1-for-1 (about 1 in 20 at 6,000 to 8,000, vs half of trades under 4,000), so asking for a star straight up counts against the trade, and the suggested change is usually the second piece. None of your league\'s completed trades were star 1-for-1s, so it changes nothing there.' },
    { kind: 'improved', page: 'Everywhere', text: 'Search boxes put the best matches first: names that start with what you type, then a word in the name ("amon" finds Amon-Ra St. Brown before Rhamondre Stevenson).' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Will they take it? is now calibrated on completed trades. Tested against your league\'s own completed trades (both managers said yes to each), the old read said one side would refuse every single one. Now a manager is expected to accept being up to about 12% behind on KTC value (the typical real dynasty trade), adjusted by their own trading history in your league; getting the best player in a deal for more pieces counts in their favor (managers pay a premium to consolidate); and a trade that grades badly for them counts against it instead of being an automatic no. On your league\'s completed trades it now gets 26 of 34 managers right (was 17), and clearly bad asks still read Unlikely. Trade Coach and negotiations use the same read, so they now find deals that tilt your way and still get accepted. The grade itself is unchanged.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Depth no longer counts players on injured reserve as bench cover, since they can\'t play. Taxi players still count, since they can be promoted.' },
    { kind: 'changed', page: 'Everywhere', text: 'Depth now uses real history: starters are counted as out about 3.5 weeks a season (bye included), which is what fantasy starters actually missed from 2018 to 2025, nearly the same at every position. It still counts extra as insurance, since about 1 in 6 starters misses 6+ games.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Picks now say which one they are ("2027 R1 (mid)") in the trade, Trade Coach and negotiation replies. Best trades no longer suggests swapping two picks worth the same, and puts pick-for-pick trades last.' },
  ]},
  { date: '2026-09-29', items: [
    { kind: 'changed', page: 'Everywhere', text: 'The grade and Trade Coach now follow the same depth rule: a trade that costs a team more depth than it adds to its lineup can\'t count as a strong fit for that team (so it can\'t be Great because of them), and the coach never suggests it. The depth note says so when it applies. Verdicts that are solid for only one team now name it ("Solid for Super bo or bust, Fine for Skat Happens Chase Love").' },
    { kind: 'new', page: 'Everywhere', text: 'Depth now counts. For every trade, the site checks what your lineup loses when each starter misses a game (a bye plus injuries, about 4 games a season), refilling from your bench with your league\'s real lineup (3 WR and 3 flex, superflex, and so on). A trade that leaves you thinner is marked down, with depth counting double next to the healthy-lineup gain; you\'ll see a note like "Thinner depth: bye and injury weeks would cost the lineup about 1.9 more points a week." Rebuilding teams count it less. The This season odds include it, and Trade Coach no longer suggests trades that cost you more depth than they add to your lineup (e.g. selling your third QB in superflex).' },
    { kind: 'new', page: 'Trade Calculator', text: 'Will they take it? Every trade now shows, right next to the grade, whether the other manager would likely accept: Likely yes, Probably yes, Probably not, or Unlikely, with the main reason. When it\'s a no, it names the smallest change that would get it done ("They\'d do it if you add Trey McBride") and a Make that change button. It\'s the same read the Offer button gives, so the two always agree.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'A calmer trade card: it now leads with the grade, whether they\'d take it, and what it does to this season. The KTC and adjusted values and the even-it-up suggestion are under Details.' },
    { kind: 'improved', page: 'Everywhere', text: 'The last "Team A" and "Team B" labels are gone: trade type descriptions on the Trade Calculator and the side headers on Trade Grades use the teams\' names. How We Grade now explains how a trade\'s effect on this season\'s odds is worked out.' },
    { kind: 'fixed', page: 'Everywhere', text: 'New visitors who open a page without having picked a league now land on the home page to choose theirs, instead of seeing someone else\'s league. League search on the home page also looks ahead a season, so next year\'s leagues show up as soon as they exist.' },
    { kind: 'removed', page: 'Trade Calculator', text: 'The FantasyPros experts view is gone (Buy-low / Sell-high tags, the Experts bar and row, and the Experts line on Trade Grades). One clear grade you can check against KTC is easier to act on than two that can disagree. The This season odds stay.' },
    { kind: 'new', page: 'Trade Calculator', text: 'An Experts bar: right under the grade\'s fairness bar (same width, same center) sits a slim bar for the FantasyPros experts\' read of the same trade, with a line saying who they favor and by how much. It also appears, with Trade Grades, as its own row in the fairness breakdown, set apart from the three parts of the grade since it isn\'t one of them.' },
    { kind: 'new', page: 'Trade Grades', text: 'Each trade now has an Experts line next to At the trade and Today: the same trade priced by the FantasyPros dynasty experts\' rankings today, on the same Fair / Lopsided / Unfair scale.' },
    { kind: 'new', page: 'Trade Grades', text: 'This season\'s trades show what they are doing for each team right now: playoff and title odds with the trade against the same team with it undone (e.g. "Playoffs 65% vs 61% without, +4"), and the points per week it adds or costs. Trades that changed neither starting lineup say so. Skipped when a player involved has since moved on.' },
    { kind: 'new', page: 'Trade Calculator', text: 'This season: every trade now shows what it does to each team\'s playoff and title odds (e.g. "Title 40% → 32%"), how many points a week its best lineup gains or loses, and who moves into or out of the starting lineup. It runs the same season simulation as League Overview, before and after the trade on identical simulated games, so the change comes from the trade itself.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Experts vs market, with FantasyPros: players the FantasyPros dynasty experts rank well above where the trade market (KTC) has them get a Buy-low tag, and the reverse get Sell-high, on your rosters and in the trade. The value table has a new Experts row: the same trade priced by the experts\' rankings, on KTC\'s scale, with a note when the experts see a trade the other way. The grade itself still uses KTC. Updated daily; superflex leagues use the experts\' superflex rankings.' },
    { kind: 'improved', page: 'League Overview', text: 'Opening a team now has an "Open in Team Analyzer" link that goes straight to that team\'s flaws, best trade partners, and contention window, with no need to pick the team again.' },
    { kind: 'improved', page: 'Team Analyzer', text: 'The lineup, players-by-position, and picks section matches League Overview exactly: every player at each position (with a count, so depth shows), each pick\'s value and early/mid/late tier, which team a pick came from, and the best lineup\'s PPG and VORP. The picks heading follows the league\'s real pick years. The page also remembers which team you are viewing in its address, so you can share or reload it.' },
    { kind: 'fixed', page: 'Everywhere', text: 'The page tabs could vanish for a few minutes right after an update, if your browser still had the old styles saved. They now always show, and every update loads cleanly on its own: pages always pick up matching styles and scripts, with nothing to refresh.' },
    { kind: 'improved', page: 'Everywhere', text: 'The page tabs are grouped: League (Overview, Team Analyzer), Players (Rankings, Compare), and Trades (Calculator, Grades, Database, Managers). On phones, the sideways-scrolling tab row is now one All pages menu.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'A cleaner trade card: what you give and what you get sit side by side with position tags and values, the grade is big and says who it favors ("Unfair, 65% off, in Molon Labe\'s favor"), the even-it-up suggestion names the team, and every action (who is offering, balance, offer, share, reset) is in one row at the bottom.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach results are easier to scan: each card lists what you give and get on separate lines with positions and values, and opens with a quieter "Open in builder" button.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Verdicts name the teams instead of "Team A" and "Team B", and ones about roster fit now say so ("Better fit for Molon Labe" instead of "Solid for Team B"), so they never seem to argue with the value grade above them. Trade Grades verdicts name the teams the same way.' },
    { kind: 'removed', page: 'Trade Grades', text: 'The League Trade Summary table is gone from Trade Grades. It repeated the League at a glance table on Managers, which is now the one place for each manager\'s trade record. That table picked up the summary\'s Timeline/Need Fit column (as Fit), so nothing was lost.' },
    { kind: 'improved', page: 'Home', text: 'Faster start: coming back shows your last league with a one-click Open league button, your Sleeper username is filled in, and pressing Enter submits. After you pick a league, one Open league button takes you in (every tool is in the tabs at the top) instead of a second menu of pages.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach gets to the trades faster: on the first step, Find trades is the main button, and the must-include, leave-out, and position steps are an optional "Add rules" detour.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Negotiate is no longer a Trade Coach trade type, since it needs a trade already built. Build or load a trade, then use the Offer button in the trade bar, same as before.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Picking your team on the Trade Calculator\'s "Which team is yours?" screen now remembers it everywhere, so other pages mark it and nothing asks again.' },
    { kind: 'improved', page: 'Everywhere', text: 'Every place you pick a team or player is now a box you can type in: the team menus on the Trade Calculator and Team Analyzer, the Your team menu at the top, and every Trade Coach picker (shop, down-tier, trade with a team, and the must-include and leave-out lists). Start typing and the list narrows; arrow keys and Enter pick, Escape backs out. In the Their side lists you can also type a team name to see that team\'s players.' },
    { kind: 'improved', page: 'Everywhere', text: 'The site works better with a keyboard: sortable table headers, expandable team rows, player rows, and the players in the Trade Builder can all be reached with Tab and used with Enter or Space. A Skip to content link appears when you press Tab, and loading messages are announced to screen readers.' },
    { kind: 'improved', page: 'Everywhere', text: 'Easier to read and tap: dim text brightened, small links and buttons given bigger tap areas, search boxes and menus labelled for screen readers, and the player card on Player Rankings keeps your place when you close it.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On phones, the Match, Shop, and Get buttons on each player now show (they only appeared on mouse hover before), and the ✕ to remove a piece from the trade is always visible.' },
  ]},
  { date: '2026-09-28', items: [
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach is set up one step at a time instead of all at once: 1. the type of trade (and its player, team, or position), 2. what every trade must include, 3. what to leave out, 4. position rules, then the trades. Every step after the first can be skipped, or jump straight to the trades with Find trades now. Above the trades, each choice you made is a button that takes you back to change it.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach can now down-tier a player: pick one of your players and see trades where you get back a lesser player plus extra pieces, so you gain total value, that the other manager would likely take. Choose Any position or Same position.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach has position requirements on both sides. "Must include a" makes every suggestion send at least one of the positions (or a pick) you choose, and "Must get a" makes it bring one back.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'In Trade Coach, the player, team, or position you pick now sits right under the options, above Your side and Their side, so it is the first thing you see.' },
  ]},
  { date: '2026-09-27', items: [
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach has a new option, Trade with a team: pick any team and see the trades their manager would likely take, best for you first. It starts on the trade partner you already have in the builder, and follows your Your side and Their side rules.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'The Trade Calculator now opens on four choices instead of everything at once: Trade Coach, Shop a player, Get a player, and Trade Builder. Pick one and only that tool shows. A tab at the top switches between Trade Coach and Trade Builder, and "All tools" takes you back. Loading a trade from Trade Coach shows it in the builder right below. Shared trade links still open straight into the builder.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Rosters no longer run down the page as one long list. Each team is split into QB, RB, WR, TE, Picks and All sections that stay closed until you click one. Each section shows how many assets it holds, their total value, and how many you have selected in it.' },
    { kind: 'improved', page: 'Managers', text: 'League at a glance on Managers and the League Trade Summary on Trade Grades both have W-L Then and W-L Now columns: how many trades each manager came out ahead or behind on, at the prices on the day and at current prices. Click any column header in either table to sort by it.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'A cleaner layout: the two rosters sit side by side right under the trade bar, so you can build a trade without scrolling. "Who\'s offering" is a small toggle in the trade bar, the explanation of the numbers opens from "About these numbers", the full verdict sits below the rosters with the trade type in an expandable row, and each team\'s breakdown is in one "How it changes each team" section you open when you want it.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach is now a button at the top of the calculator instead of a panel that\'s always open, so the calculator comes first. Open it for trade options; "Offer to [team]" on a trade still opens it straight into the negotiation.' },
    { kind: 'new', page: 'Managers', text: 'Click a manager\'s name (in the table or on their card) to see only their trades on Trade Grades. A "Show all trades" button clears it.' },
    { kind: 'new', page: 'Trade Grades', text: 'Every trade shows its grade twice: at the trade (prices that day) and today (the same trade at today\'s prices), each with its % off and who it favors. Ten of this league\'s trades now grade differently than they did on the day.' },
    { kind: 'new', page: 'Managers', text: 'Each manager\'s Fair · Lopsided · Unfair counts show then and now, and their best and worst moves show how the grade changed since (for example Lopsided → Unfair).' },
    { kind: 'fixed', page: 'Everywhere', text: 'Grades use one color everywhere: Great purple, Good blue, Fair green, Lopsided amber, Unfair red, matching the fairness bar. Before, a Good trade could show green, an Unfair one grey, and a Fair verdict red on Trade Grades. On the Trade Calculator, an accept/decline recommendation keeps its own color and now shows the trade\'s grade as a colored badge next to it.' }
  ]},
  { date: '2026-09-26', items: [
    { kind: 'changed', page: 'Trade Calculator', text: 'Fix a position and Go all-in never pay a premium (Lopsided) to send away one of your starters. A premium is only suggested when it\'s paid with bench players and picks.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Fix a position could call a sidegrade an upgrade, like Ja\'Marr Chase for Amon-Ra St. Brown. A trade now counts as an upgrade when your lineup gets better and the best player in the deal comes to you, so you consolidate up instead of swapping stars. Go all-in instead needs at least 3 points a week, since it spends future value on points.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Loading one of the trade options folds the list away so the trade is right there, with a "Show options again" button to bring it back.' },
    { kind: 'changed', page: 'Trade Grades', text: 'The League Trade Summary\'s W-L now counts trades ahead or behind at today\'s values, matching Net Now and the Managers ranking.' },
    { kind: 'improved', page: 'League Overview', text: 'Projected records and playoff and title odds now factor in the points each team has actually scored this season, not just its best projected lineup. Real scoring counts more as the season goes on: a third after 2 weeks, half after 4, two thirds after 8. Teams outscoring their projection (Allen\'s Creamy Surprise, 179 a week vs 158 projected) move up; teams scoring well under it move down.' },
    { kind: 'changed', page: 'Managers', text: 'Managers are ranked by Net Now (what their trades are worth at today\'s values) instead of Net Then (what they looked like on the day). A manager whose deals looked bad at the time but have aged well, like buying a player before the price rose, now ranks higher. Each card leads with Net Now, shows Net Then and how much the trades have gained since, a W-L record both ways, best and worst moves judged by today\'s value, and the manager\'s trading style.' },
    { kind: 'improved', page: 'Managers', text: 'Sort the League at a glance table by Net Then, Net Now, Trades, or Manager: click a column header (click again to flip it). Managers with no trades stay at the bottom.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The "Which team is yours?" box no longer flashes up while the page loads when the site already knows your team. It opens straight onto your team.' },
    { kind: 'improved', page: 'League Overview', text: 'The standings table fits on the page without scrolling sideways. Each position\'s value now shows in the Position split (like "QB 22.1k"), record and projected record share a column, as do playoff and title odds, and on smaller screens the less important columns (position split and archetype, then age, Opt PPG, VORP, and window) tuck away instead of pushing the table off the page.' },
    { kind: 'fixed', page: 'League Overview', text: 'Value Over Time jumped for every team on 9/22 (and on the rookie draft, 5/2). KTC first priced 2029 picks on 9/22, and before that the history counted them as zero; the 2026 picks weren\'t counted before the rookie draft at all. Past days now value a pick at its first known KTC price (or the nearest year KTC prices), and count each year\'s picks until they\'re drafted, so the lines only move when values really do. Trade Grades prices past trades with the same rule.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Chart hover boxes (League Overview, Player Rankings, Compare Players) no longer get cut off near the right edge: they stay on one line and flip to the other side of your cursor.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Switching "Your team" at the top now reopens the calculator on your new team, even with a trade link in the address bar, and switching your team in the calculator refreshes its trade options.' },
    { kind: 'fixed', page: 'Compare Players', text: 'Hovering near the right side of the value chart cut the values box off. It now stays on one line and flips to the left of your cursor when it would run off the edge.' },
    { kind: 'improved', page: 'Compare Players', text: 'Stats are split into tabs by category (Fantasy production, Consistency, Usage, Efficiency, Touchdowns, and so on), so only the one you\'re looking at is on screen instead of one long table. Your last tab is remembered. The row with the player names also stays pinned under the header while you scroll the Stats and Head to head tables.' },
    { kind: 'new', page: 'Trade Calculator', text: 'The trade bar shows two sets of numbers: KTC value (what you give, what you get, and the net, matching KeepTradeCut\'s calculator including its adjustment for the best player in the deal) and Adjusted (the same trade after positional need, lineup fit, and timeline, blended the same way as the grade). The adjusted net always matches the grade\'s % off.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The Trade Calculator starts from your team. Pick it once (or it opens straight on it when the site knows your team), and your trade options appear right on the page: Best trades, Shop a player, Get a player, Fix a position, Rebuild, Go all-in, and Negotiate. Loading a trade only ever fills in the partner, so your side never gets switched out. Pick a partner yourself from the menu, or from the suggested partners in that column.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Best trades: the fairest trades across the league for your team that the other manager would likely accept. Shop a player: the best offer from every team for one of your players or picks. On any roster row, Shop and Get jump straight to those.' },
    { kind: 'removed', page: 'Trade Calculator', text: 'The separate Suggest a Trade, Find a Trade, and Trade Coach buttons. Everything they did now lives in the trade options on the page.' },
    { kind: 'improved', page: 'Everywhere', text: 'A cleaner, easier-to-read look across the whole site. One typeface (Inter) for text and numbers, with numbers that line up in columns; no text smaller than 11px, and every grey readable against the background; gold kept for primary buttons and the page you\'re on, green and red only for good and bad; one card style; a simpler header and logo; and a visible outline when you move around with the keyboard.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'The fairness bars now share one center: Overall, KTC value, Roster fit, and Timeline are the same width and line up exactly. Each team\'s full name labels its end of the bars (no more cut-off names), and each row\'s number points to the side it favors. Same on Trade Grades.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On the team cards under Trade Analysis, the Opt PPG and VORP changes no longer run into each other, and long team names wrap instead of being cut off.' },
    { kind: 'fixed', page: 'Trade Grades', text: 'Each trade\'s verdict line wraps instead of being cut off.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Each team column in the calculator has a Timeline dropdown (Auto, Contending, Rebuilding), so it works outside Trade Coach too. Use it on your team, or on the other team if you know they\'ve changed direction. Every grade on the page follows it.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Your timeline: tell the site whether you\'re contending or rebuilding instead of it guessing from your roster (Auto, Contending, or Rebuilding), and the Trade Analysis uses it too. Go all-in and Rebuild set it for you, so a rebuilding team that decides to go for it now isn\'t graded as wasting picks its rebuild needed. Saved in your browser.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach and Negotiate: a manager\'s willingness to deal dropped when a trade fit YOUR plan well, because their read compared both teams\' fit. Managers now judge a deal on KTC value plus their own lineup and timeline only.' }
  ]},
  { date: '2026-09-25', items: [
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach\'s Get a player shows more offers: up to 8, with up to two built around each of your players. When a manager would take your offer but you\'d be overpaying, the coach has them add a smaller piece (a pick or depth player) to make it Fair, which turns overpays into real alternatives. Lopsided offers only fill in when there are fewer than three Fair ones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach: Your side and Their side rules. Pick players or picks every trade must include, ones you won\'t trade, and whole positions or picks to leave out, and the same for what comes back: players you must get, ones you don\'t want, and positions or picks you won\'t take. Every suggestion follows them. On Rebuild, picking players under Sell these shops only those players, with offers from several teams.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach could say a manager "Would accept" while listing reasons they wouldn\'t, and could disagree with the Trade Analysis verdict below it. Managers now judge an offer from their own side (value plus what it does to their lineup and timeline), never accept what the Trade Analysis says they should decline, and each response splits into what they like and what gives them pause, with which side wins.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach lists no longer come back empty when nobody would sell at a Fair price. They show the cheapest deals the other manager would take, clearly flagged as Lopsided against you, and never Unfair.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach\'s "Get a player" could only show the player already in your trade. It now has a proper picker: every player in the league by value, searchable by name or team, with position filters.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach: one button, one panel with five options. Negotiate a trade: the other manager answers in their own words ("I don\'t think the difference between Chase and Puka is worth my 1st"), and you can ask for something else instead: more value, a QB, RB, WR, or TE, youth, points now, picks, or players from one NFL team. Get a player, Fix a position, Rebuild, and Go all-in each list trades to choose from, best for you first, every one a trade the other manager would likely accept. Load any of them into the calculator in one click.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Negotiation coach: after every response, the site recommends your next move and explains why. Send it as is, accept their counter, counter back with the one change that gets you closer to even that they\'d still take, shop the same player to whichever team in the league would give you the most for them, or walk away. Every option is one click, and shopping opens a new negotiation with that team.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Negotiate: hit "Offer to [team]" and see how that manager would likely respond — accept, or decline with their reasons (value, needs, rebuild or contend timeline, roster spots, and their real trading style), what on your roster they\'d rather have, and a specific counter. Accept it, or edit it and counter back, round after round. It\'s a prediction, not the real manager — send real offers in Sleeper.' },
    { kind: 'new', page: 'Compare Players', text: 'Compare up to four players side by side: value over time on one chart (presets or your own date range), value and projection ranks, recent price moves, projected points and VORP in your scoring, and 70+ fantasy stats for a career, a season, or just the games you tap on (with a game-by-game log), per game or in totals. Stats cover fantasy production, consistency (top-12 and starter weeks, floor, ceiling), usage (snap share, target and carry share, red zone work), efficiency, big plays, touchdowns, and ball security — pick which ones show — and each is ranked against everyone at the position over the same games, shaded green to red. With two players on different teams in your league, one click opens the trade. Also reachable from any player card on Player Rankings.' },
    { kind: 'improved', page: 'Everywhere', text: 'The top bar now has two rows: your team, How We Grade, Patch Notes, and Switch League up top, and every page tab in a row underneath. On phones the tab row opens on the page you\'re on and the bar scrolls away instead of staying pinned.' },
    { kind: 'fixed', page: 'Home', text: 'The sign-in page no longer scrolls sideways on phones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Share a trade: the Share button next to Reset copies a link (or opens your phone\'s share sheet). Whoever opens it sees the same teams, pieces, and verdict.' },
    { kind: 'new', page: 'Everywhere', text: 'Pick your team from the "Your team" menu at the top. The Trade Calculator and Team Analyzer open on it, and League Overview and Managers mark it with a You tag. If you sign in with your Sleeper username on the home page, it\'s picked for you.' },
    { kind: 'new', page: 'How We Grade', text: 'A new page explaining exactly how every grade is worked out: where the numbers come from, the Fair / Lopsided / Unfair cutoffs, the value + roster fit + timeline blend, VORP, playoff odds, and manager styles.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On phones, the page no longer scrolls sideways once a trade is loaded.' },
    { kind: 'new', page: 'Managers', text: 'League at a glance: a table at the top with each manager\'s trading style (consolidator, depth builder, youth & picks buyer, win-now buyer, or value trader) and a one-line description of how their trades have gone.' },
    { kind: 'new', page: 'Trade Grades', text: 'Every player and pick now shows its KTC value on the day of the trade and today, with the change, plus a then-vs-now total for each side.' },
    { kind: 'new', page: 'Trade Grades', text: 'League Trade Summary has Net Then and Net Now columns: each manager\'s trade results at trade-day prices and at today\'s.' },
    { kind: 'fixed', page: 'League Overview', text: 'Projected records and playoff odds were skipping the week in progress from Thursday night until it went final. Every team now projects the full season.' },
    { kind: 'improved', page: 'Everywhere', text: 'Pages load much faster: each one used to download about 9 MB of data before showing anything, and now it\'s about 1 MB. A big difference on a phone.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The fairness bars could show up a few seconds after everything else. The site\'s styling is now built ahead of time instead of in your browser, so they appear right away.' }
  ]},
  { date: '2026-09-24', items: [
    { kind: 'changed', page: 'Trade Calculator', text: 'The fairness grade now weighs KTC value (70%) with roster fit (15%) and timeline (15%). Three small bars under the main one show each piece. Fit can only make a grade worse than KTC alone, never better, so a deal that\'s lopsided on KTC never reads as fair.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Suggested Trades and Balance now look for 1-for-2 and 2-for-1 deals. Cards show the trade\'s shape and warn when someone would have to drop a player to fit it.' },
    { kind: 'changed', page: 'Trade Grades', text: 'Past trades are graded at KTC prices from the day they happened, not today\'s. A deal that was fair when it was made no longer reads as unfair because a player broke out later.' },
    { kind: 'fixed', page: 'Player Rankings', text: 'VORP was undervaluing QBs in superflex: RB and TE replacement level was set near 3 points per game. It now fills every lineup in the league properly (replacement is about 10 PPG for RB, WR, and TE).' },

    { kind: 'changed', page: 'Trade Calculator', text: 'Fair / Lopsided / Unfair is decided by KTC value, the number anyone can check on KeepTradeCut. Roster need is still shown, but it can\'t make a lopsided trade look fair.' },

  ]}

const KIND = {
  new: ['New', 'bg-emerald-500/10 text-emerald-300 border-emerald-500/25'],
  improved: ['Improved', 'bg-sky-500/10 text-sky-300 border-sky-500/25'],
  fixed: ['Fixed', 'bg-amber-500/10 text-amber-300 border-amber-500/25'],
  changed: ['Changed', 'bg-violet-500/10 text-violet-300 border-violet-500/25'],
  removed: ['Removed', 'bg-white/5 text-zinc-400 border-white/10']
};

// "New since your last visit" is per-browser only — a convenience, not state
// anyone else needs. Storage can be blocked (private windows), so every access
// is guarded and the page renders the same without it.
const SEEN_KEY = 'vault_patch_notes_seen';
let lastSeen = null;
try { lastSeen = localStorage.getItem(SEEN_KEY); } catch {}
try { localStorage.setItem(SEEN_KEY, NOTES[0].date); } catch {}

let pageFilter = 'All';
const pages = ['All', ...new Set(NOTES.flatMap(d => d.items.map(i => i.page)))];

function fmtDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  document.getElementById('filters').innerHTML = pages.map(p =>
    `<button onclick="setPage('${p}')" class="text-[12px] px-2.5 py-1 rounded-lg border transition-colors ${pageFilter === p ? 'bg-white/[0.08] border-white/25 text-white' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${p}</button>`
  ).join('');

  const days = NOTES.map(d => ({ ...d, items: d.items.filter(i => pageFilter === 'All' || i.page === pageFilter) })).filter(d => d.items.length);
  document.getElementById('notes').innerHTML = days.map(d => {
    const fresh = lastSeen && d.date > lastSeen;
    return `<section class="card rounded-vault-sm p-5">
      <div class="flex items-center gap-2 mb-3">
        <h2 class="text-[14px] font-semibold text-zinc-100">${fmtDate(d.date)}</h2>
        ${fresh ? '<span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-400 text-black font-semibold">New since your last visit</span>' : ''}
      </div>
      <ul class="space-y-2.5">
        ${d.items.map(i => `<li class="flex gap-3 items-start">
          <span class="shrink-0 w-[74px] text-center text-[11px] px-1.5 py-0.5 rounded border ${KIND[i.kind][1]}">${KIND[i.kind][0]}</span>
          <div class="text-[13px] leading-relaxed text-zinc-300"><span class="text-zinc-100 font-medium">${i.page}</span> · ${i.text}</div>
        </li>`).join('')}
      </ul>
    </section>`;
  }).join('');

  const total = NOTES.reduce((s, d) => s + d.items.length, 0);
  document.getElementById('status').textContent = `${total} changes · last updated ${fmtDate(NOTES[0].date)}`;
}

function setPage(p) { pageFilter = p; render(); }
render();
</script>
</body>
</html>
