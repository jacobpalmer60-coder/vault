<script>
/* Hand-written, manager-facing notes — not the commit log, which is full of
   internal detail and daily data refreshes. Add an entry here with every
   change people will notice. kind: new | improved | fixed | changed | removed. */
const NOTES = [
  { date: '2026-10-28', items: [
    { kind: 'improved', page: 'Trade Coach', text: "Trade Coach is cleaner and quicker. It starts with one search box: type a player (yours or theirs), a position or a team and go. One of yours asks Upgrade, Down-tier or Sell right away; a position or team goes straight to its next step. The top is one line (record, odds, thin and deep spots, timeline as a dropdown) with a breadcrumb like Start › Rome Odunze · Upgrade instead of repeated team names and numbered steps. The players you're sending show as a short Sending row you can add to or clear, not every player at the position. And when a fit is close, it shows the one piece of yours that gets them to yes, with Build starting the trade with it added: Rome Odunze plus your 2029 4th for Emeka Egbuka, likely yes." },
  ] },
  { date: '2026-10-27', items: [
    { kind: 'improved', page: 'Trade Coach', text: "The Coach recommends who to go after. Tick the players you're upgrading, down-tiering or selling (from A player or A position) and it checks every realistic target against them, then lists the best fits first: whether their manager would likely say yes (and how much room is left, or how much more they'd want), how it reads for you, and how many more points a game he scores than yours. Build any one to start the trade. For a down-tier or sale it also says how much more to ask for in extras. On a position you now tick your players and choose Upgrade, Down-tier or Sell, with Add depth as its own choice. Any ticked player can be unticked, the first one too: no more picking something else to clear it. Jeremiyah Love's best upgrade fit: James Cook III, likely yes with room for about 14% more, +6.5 points a game." },
    { kind: 'changed', page: 'Trade Coach', text: "Trade Coach builds the trade you want instead of suggesting trades. Start from a player, a position or a team. A player on another team goes straight to building; one of yours asks what you want to do with him: Upgrade (tick one or more of your players to send together for one better player), Down-tier (a lesser player plus more) or Sell (picks and young players), then the team, with the ones that fit first. A position asks Upgrade (tick who you're upgrading; it lists players who out-score the best of them) or Depth (cheap backups who still score). Then add or take off pieces one at a time: once both sides have something you see both teams' verdicts, whether their manager would likely say yes, and how much more you could ask for or they'd want. Hints come one piece at a time. Then negotiate it, open it in the builder, or copy the offer link. The suggestion lists are gone: in testing, about a third of the trades they listed were ones the other manager would turn down in Negotiate." },
    { kind: 'changed', page: 'Trade Coach', text: "The Trade Calculator opens straight on the Trade Builder, with a big Trade Coach button on top. The start screen that made you pick a tool (Trade Coach, Shop a player, Get a player, Trade Builder) is gone." },
    { kind: 'changed', page: 'Trade Calculator', text: "The verdict (Good trade, Toss-up and so on) runs on KTC values only now. It used to blend in our own values learned from real trades; now it reads each piece at its price with two simple adjustments: stars count for more and small pieces for less (a 9,000 player counts as about 10,400, a 2,000 one as about 1,590), and QBs count 6% more, RBs 2%, TEs 7% less and picks 5% less, with a small nudge for age. Tested on 3.2 million team-sides of 2025 and 2026 trades, it was better than the old blend at picking the teams that went on to beat their playoff odds and gain points a week, and much better for rebuilding teams' value since the trade in 2026. The price (Fair / Lopsided / Unfair) and Trade Grades don't change. When the verdict and the price point different ways, Why still says so and names the players." },
    { kind: 'new', page: 'Player Market', text: "What it takes to get him: on a player's lookup, the packages managers actually sent for him in recent trades, grouped (one player straight up, a player plus picks, players and picks, and so on) with how often each happened, what it added up to against his KTC value and the latest example. Ja'Marr Chase: usually 3 pieces, the best about 71% of his value, a 1st in 56% of deals." },
    { kind: 'new', page: 'Player Market', text: "Trade history: every Sleeper dynasty trade a player was in since 2024 across every league we crawled, month by month (hover for what was paid against KTC), and how the teams that got him did a year later." },
    { kind: 'new', page: 'Player Market', text: "Best time to buy or sell: each lookup shows when players like him (same position and age) are usually cheapest and dearest in the year, from KTC's history since 2020 with the long-term drift taken out. QBs bottom out in November-December (about 5% below their yearly average) and peak in the spring; young TEs swing most (about 9% low in October); RBs and WRs barely move, and the page says so." },
    { kind: 'new', page: 'Player Market', text: "A Picks tab: every 2027-2029 pick, rounds 1-4, at what it goes for in completed trades next to KTC, with early and late on hover and when 1sts and 2nds are cheapest in the year. Click a pick for its trades and price over time." },
    { kind: 'changed', page: 'Trade Lab', text: "Now 2.15 million trades from 111,690 leagues, with 2026 added (was 1.34 million from 2024-2025). How managers trade includes 2026; how trades turned out still uses 2024 and 2025, since 2026 trades are only months old. Each verdict's follow-up is re-scored with today's verdict." },
    { kind: 'changed', page: 'Trade Calculator', text: "The record under each verdict (\"In real trades scored like this...\") is re-measured with the new KTC-only verdict on 2.7 million team-sides of 2024-2025 trades. Every tier came out within about a point of before: Great trades for contenders +7.0 against their playoff odds, Good +3.6, and 85% of rebuilders with a Great trade still ahead later." },
    { kind: 'changed', page: 'Team Analyzer', text: "The Contend or rebuild chart (every team's projected lineup against its dynasty value) moved from League Overview to Team Analyzer's Contend or rebuild? tab, under the contention window, with the team you're looking at in gold. League Overview is just the standings table now. Click any dot to open that team." },
    { kind: 'removed', page: 'Everywhere', text: "The hidden switch to show our own values instead of KTC (?values=vault) is gone, along with the nightly job that built them. Every page runs on KTC values." },
  ] },
  { date: '2026-10-25', items: [
    { kind: 'new', page: 'Player Rankings', text: "Draft picks are in the rankings: every 2027-2029 pick, rounds 1-4, early, mid and late, ranked among the players by value (a 2027 Early 1st is #36 overall in a Superflex TE+ league), with a Picks button to see only them. Open one for its rank and its price over time. Picks are priced the way the Trade Calculator prices them, so a 2027 Late 1st reads 5,033 here and in a trade; its card notes that KTC lists it at 4,772." },
    { kind: 'changed', page: 'Trade Calculator', text: "Upgrading into a cheaper player now counts against you on a smooth curve instead of a cutoff. Turning several pieces into one player used to count 10% below the price only when he was worth under 3,000, so a 2,999 player cost 10% and a 3,001 player nothing. Now it fades with his value: about the full 10% under 2,500, 5% at 4,000, under 2% past 6,000. Tested on 2.7 million team-sides from 2024 and 2025: the verdict got better at predicting value later in both seasons (and on uneven trades especially). At a Fair price, upgrades into a best piece under 4,000 came out ahead later only 28% of the time." },
  ] },
  { date: '2026-10-24', items: [
    { kind: 'changed', page: 'Trade Calculator', text: "Flexible teams' verdicts count the long-term value adjustments (picks, the age-27 cliff, consolidating, WRs) at half strength. At full strength their verdict was best at predicting value later but barely tracked whether the team beat its playoff odds or gained points; at half it does much better on both and keeps most of the value-later read. Contending and rebuilding verdicts don't change. This also changes Trade Coach for flexible teams." },
    { kind: 'improved', page: 'Trade Calculator', text: "When the verdict and the price point different ways, Why now says so up top and names the players behind it. The verdict prices each piece partly on our values learned from real trades, which can rate a star well above his market price: \"our values from real trades put Josh Allen at 10,637 against a market price of 8,544... so the verdict counts Skat Happens Chase Love as getting 7% more value than it sends, though the price says Skat Happens Chase Love pays 10% over.\" Checked on 2025 trades: counting real-trade values this way tracked playoffs and weekly points better than the price alone, and for trades with a top player, value later too." },
    { kind: 'fixed', page: 'Trade Calculator', text: "The KTC's calculator line matches KeepTradeCut's site exactly now. When KTC's bonus for the best piece is too small to show (under about 3% of the trade), KTC leaves it out of the totals, and we were still adding it. Checked live: Jared Goff + Chuba Hubbard for Jordan Love reads 9,752 vs 5,690 on both (we were adding about 180 to Jordan Love's side)." },
    { kind: 'changed', page: 'Trade Calculator', text: "Trade Coach's \"they'd take it\" check matches real trades now: a price has to be Fair on trade value (under 14% off) and not Unfair on KTC's calculator (under 41%). It used to require Fair on KTC (under 14%), but KTC adds such a big bonus for the best piece in a deal that only a quarter of real accepted trades read Fair there, and the old check passed over 82% of the trades managers actually made. Now 40% get through. In The League of Gold, Get a player for Josh Allen finds 4 offers (was 1), and Trades with The Gambler 8 (was 2)." },
    { kind: 'changed', page: 'Trade Calculator', text: "Consolidating counts for teams that aren't contending: getting fewer pieces than you send now counts 6% below the price in a rebuilding or flexible team's verdict, at any value (getting more, 6% above). In real trades, Slight edge or better trades that consolidated ended 10%+ behind later 25% of the time, against 6% for the side that spread out; with this the verdict predicted value later better in both seasons. Contenders don't get it: consolidating into a better starter helps this season." },
    { kind: 'changed', page: 'Trade Calculator', text: "Trade Coach pays over only when the trade is still good for you: Get a player, Fix a position and buying from one team may pay up to 6% over value only when the trade is a Slight edge or better for you; Toss-ups need an even-or-better price. In real trades, Toss-ups that also paid over came out ahead later only 38% of the time." },
    { kind: 'new', page: 'Trade Calculator', text: "How trades like this aged: under Why, the patterns that match your trade and how sides like it stood one, two and four years later, at an even price. The age and position of the best piece you get, getting younger or older, picks for players, consolidating. For example, \"Sides whose best piece got was a RB aged 25-26: 58% ahead a year on, 49% two years on, 48% four years on.\" From 2024-2025 trades and the 2021-2023 long view on Trade Lab." },
    { kind: 'new', page: 'Trade Calculator', text: "A note when a contender pays over for points: if your trade adds 2+ points a week this season but costs you 2% or more in value, the calculator says what that did in real trades (contenders who paid 2-10% over beat their playoff odds by 5.8 points, against 6.4 for those who kept their value, and 36% were still ahead on value later). Information only; it doesn't change the verdict." },
    { kind: 'changed', page: 'Trade Calculator', text: "Age counts more for teams that aren't contending: in the verdict, a RB, WR or TE 27 or older is now valued 10% below his price for rebuilding and flexible teams (it was 5%, and still is for contenders, since veterans do help this season). Tested on 2024-2025 trades, the verdict then predicted which side was ahead later better in both seasons without hurting how it tracks contenders' playoffs; followed four years, 2021-2023 trades showed RBs and WRs that age losing 15-17% of their value. Your own verdict changes only if your team isn't contending; in The League of Gold about 6% of other teams' verdicts on Trade Coach trades moved." },
    { kind: 'fixed', page: 'Trade Lab', text: "How often players change hands: the note said to expect to pay up for a star. Tested on 2024-2025 trades, the least-traded players cost no more to get than the most traded at the same value. Stars come up rarely, but at the usual price." },
    { kind: 'new', page: 'Trade Lab', text: "Deep dives: how accurate the Trade Calculator is (it calls 53% of real accepted trades Fair against 25% for KTC's calculator, 76% of the points it predicts show up, and when it gives 60% playoff odds it happens 60% of the time); how often players change hands (starters worth 2,500-6,000 in about 1 league in 5 a season, the biggest stars in about 1 in 8 or 9); when to buy and sell (QBs and TEs cheapest around October-November, priciest around February-March; rookie TEs climb about a third in their first season); the long view, 2021-2023 trades followed four years (winning the price still holds, and getting 3+ years younger at an even price was ahead 68% of the time); and whether production predicts value gains (it doesn't: by February the price has caught up)." },
    { kind: 'new', page: 'Trade Lab', text: "What it adds up to: Trade Lab now opens with the findings in one list, each with its number and a link to the chart (trades are close but rarely even, winning the price holds, picks gain on players, 27 is a cliff, no deadline premium, and more). New charts: paying extra to win now (contenders who kept their value beat their playoff odds by 6.4 points, those who paid 10%+ over by 4.7), skill or luck (getting a good price repeats; how a trade ages barely does), trading more, rebuild or push, and what each rookie-draft pick turned into in points a game. The header now says how many trades the crawl holds in all: 3.8 million from 2021 to 2026, of which the 2024-2025 ones are judged and followed up." },
    { kind: 'fixed', page: 'Trade Calculator', text: "Draft picks no longer count as instant starters. When the verdict and the Teams page look a few years out, a pick used to become a player worth its trade value in points, so a late 1st counted as a 13.6-point starter in its first season. Across 61,730 rookie drafts of the 2023-2025 classes, the player taken there averaged 9.9. Picks now play like the rookies taken at their slot really did, years 1, 2 and 3, scaled to each league's scoring. Trades for picks read a little less rosy for your future, and a few pick-heavy teams' contention windows got shorter (in The League of Gold, Bye Week's 2028-2029 window came only from its picks)." },
    { kind: 'improved', page: 'Trade Calculator', text: "Cleaner on phones: the verdict, both teams' tiles, the reason and the four numbers (title odds, trade value, KTC's calculator, usual price) now fit on one screen, the numbers two by two. Team names in the tiles stay on one line, the other team's out-of-the-race note moved under the tiles, and your timeline menu has its own line so it isn't cut off." },
    { kind: 'improved', page: 'Trade Calculator', text: "Easier to tap and to hear: on touch screens every button, menu and show/hide row in the calculator and Trade Coach is at least 32px tall (Why and More like this were 15-18px), and each Open button tells screen readers which trade it opens." },
    { kind: 'changed', page: 'Trade Calculator', text: "Trades with one team may now pay up to 6% over trade value when you're the buyer (you get the best piece in the deal): the seller sets the price. The card shows how much you pay. In The League of Gold that adds 10 trades across 8 teams, like Rome Odunze + Cam Skattebo for Kyren Williams at 5% over, still a Good trade for Skat Happens Chase Love." },
    { kind: 'improved', page: 'Trade Calculator', text: "Fix a position now groups its trades by the spot they fill: a new #1 (better than your best there), better starters (your #2 or lower starters) and depth. Each card says which, for example \"New RB2, ahead of Jeremiyah Love (10.2)\" by points a game. Up to three new-#1 trades always make the list, and the Your best move banner stays on the best trade wherever it lands." },
    { kind: 'changed', page: 'Trade Calculator', text: "Fix a position follows the same rules as Get a player: when you're fixing a position you expect to pay a fair price or a little over, so Toss-ups show too (after the better trades, labeled \"Toss-up: a fair price for the help at RB, about even for you\") and offers may pay up to 6% over trade value (the card shows how much). In The League of Gold, RB keeps its 10 starter upgrades and adds three depth options: Tony Pollard, Quinshon Judkins and Rhamondre Stevenson." },
    { kind: 'new', page: 'Trade Calculator', text: "Fix a position now finds depth too: players who wouldn't beat your starters there but would back them up better than your bench does, paid with bench players and picks only (never a starter). Each says what it does: \"Bye and injury weeks would cost your lineup about 2.7 fewer points a week.\" Up to three come after the starter upgrades, with the same checks for both teams. In The League of Gold, TE went from no trades to three (Isaiah Likely, George Kittle, Travis Kelce)." },
    { kind: 'new', page: 'Trade Calculator', text: "Close calls: when a 2% change in price would move a verdict to the next tier (2% is about the noise in a trade's price), the verdict says so, for example \"Toss-up · close to Slight edge\". It shows on about 1 trade in 11, for both teams." },
    { kind: 'improved', page: 'Trade Calculator', text: "Why now shows what each piece does to the other team's lineup too, the same way as yours: who'd start for them, what each player adds or costs them a week, and their total. It shows why they'd say yes or no." },
    { kind: 'changed', page: 'Trade Calculator', text: "When the top Trade Coach suggestion is a Toss-up (Get a player, Trades with one team), its banner says Best offer instead of Your best move." },
    { kind: 'fixed', page: 'Trade Calculator', text: "Trade Coach often came back empty because of how it built offers: it kept the offers best for you, then checked whether the other team would take them, and those were mostly lowballs they'd turn down, so fair offers never got a look. It now keeps only offers the other team would take, then picks the best for you. Get a player, Trades with one team, Go all-in, Fix a position, Sell high and Buy low all use it." },
    { kind: 'changed', page: 'Trade Calculator', text: "Get a player and Trades with one team now show Toss-ups too, after the better trades and labeled (\"Toss-up: a fair price, about even for you\"). You picked the player or the team, and a fair price there usually reads about even: two contenders rarely both win a trade. Get a player may also pay up to 6% over trade value for the player you picked (the card shows how much). In The League of Gold, Get a player now finds offers for Josh Allen, Puka Nacua and Fernando Mendoza, where it found none, and empty lists dropped from 10 of 22 searches to 3." },
  ] },
  { date: '2026-10-23', items: [
    { kind: 'new', page: 'Trade Calculator', text: "More like this on Trade Coach's Best trades: the list stays varied (at most two trades with any team, and each of your players in at most two), but the trades that rule held back aren't thrown away anymore. Each card gets up to three more like it: the same team or the same players, with your verdict on each and one tap to open it. In The League of Gold that's 13 more good trades, on 5 of the 6 cards." },
    { kind: 'new', page: 'Trade Calculator', text: "Why now shows what each piece does to your lineup this season: each player you get or send, how many of the weeks left he'd start, and what he adds or costs a week on his own (\"Kyren Williams RB · starts 10 of 11 weeks left · +5.2 a week\"), then the starting lineup, depth and the total, the same points number the verdict uses." },
    { kind: 'improved', page: 'Trade Calculator', text: "Trade Coach is faster again: Best trades about 35% and the other trade types about 30%, by skipping packages that couldn't pass before grading them and grading each trade once instead of twice. Same trades, same verdicts. Best trades also tries 2-for-2 trades now; they only fill room the other trades leave, so no trade you'd have seen is pushed out." },
    { kind: 'improved', page: 'Trade Calculator', text: "Trade Coach searches take about half as long, even on a first click: Go all-in about 5 seconds instead of 9, Fix a position about 2.5 instead of 4.5. The math that judges each trade (lineups for every week left, depth, how long each team's window lasts) no longer redoes the parts that are the same for every trade. Same trades, same verdicts, just faster, and the calculator's own verdict updates quicker as you add players." },
    { kind: 'new', page: 'Trade Calculator', text: "The verdict stays on screen: when it's out of view (below the fold on a phone, or while you pick players from the rosters), a bar at the bottom shows both teams' verdicts. Tap it to jump back to the trade." },
    { kind: 'improved', page: 'Trade Calculator', text: "The verdict card now says whether the price is usual for the trade's main player in real trades (\"Usual price\", \"Under usual\" or \"Over usual\", next to trade value and KTC's calculator). Tap it to see those trades: every price as a dot, and the three most like yours." },
    { kind: 'improved', page: 'Trade Calculator', text: "Trade Coach's first search is faster. It starts on Best trades and Go all-in as soon as you open it, while you pick a trade type, so by the time you click Find trades most of the work is done. Every search also reuses the trades it already graded instead of grading them again, and Fix a position stops once it has enough upgrades to show." },
    { kind: 'improved', page: 'Trade Calculator', text: "Trade Coach leads with your best move: the top trade gets a big card that says what it does for you in plain numbers (\"+10.3 points a week, title odds 24% → 32%\"), or for Sell high and Buy low how far ahead you come out. In season, a contender's lists are ordered by how much each trade raises your title odds, and trades that barely change your lineup or your odds are left out instead of filling the list. Every card says why it works: the other team's situation (\"1-11 and out of the race: teams that far out sell starters\", or a warning when they're a contender too), who starts over whom on your team, and how that manager trades (they've never made a trade, they trade a lot, or they've paid over market for what you're sending). Managers who've never traded drop to the bottom, marked as a long shot. Go all-in and Fix a position show each player once, with a second way to pay on the same card." },
    { kind: 'new', page: 'Trade Calculator', text: "When a Trade Coach search finds nothing, it now shows the closest deals: the offers that just missed, why each one did, and what would fix it. For example, Get a player for Brock Purdy finds nothing Allen's Creamy Surprise would take, but adding Dallas Goedert to one offer makes it a Toss-up for them. Open any of them in the builder to adjust." },
    { kind: 'new', page: 'Trade Calculator', text: "Quick filters above Trade Coach's results: pay with anything or with picks and bench only (none of your starters go out), up to 1, 2 or 3 pieces each way, and a position you want back (QB, RB, WR, TE or a pick). Changing one searches again." },
    { kind: 'new', page: 'Trade Calculator', text: "Pin to compare: pin up to four trades from the builder and see them side by side, each with both teams' verdicts, the price on trade value and on KTC's calculator, and your title odds. Open any of them back in the builder. Pins are kept for your league in this browser." },
    { kind: 'improved', page: 'Trade Calculator', text: "Trade Coach is faster. Best trades runs its quick checks before the slow ones and keeps what it worked out, so a first search takes about 5 seconds instead of 7, and searching again or changing a filter is close to instant. Fix a position and Go all-in skip the lineup math on offers that would be dropped anyway." },
    { kind: 'improved', page: 'Everywhere', text: "Better on phones. Player Rankings fits the screen (player, value, market price and projected points; age, trend and VORP show on wider screens). Managers shows each team's style under its name and keeps trades and Net Then and Net Now in view. Teams shows its six numbers two across instead of one per row, so the tabs are a scroll away instead of two. League Overview's map no longer piles team names on top of each other: each name takes a free spot around its dot (yours first), and a name with no room is left off (tap the dot). Trade Lab's chart labels and the Trade Calculator's verdict boxes no longer cut off text." },
    { kind: 'improved', page: 'Teams', text: "Teams is split into tabs: Overview, Roster, This season and Contend or rebuild?, one at a time instead of one long page. The team's name, record, playoff odds and value tiles stay on top. Overview answers how the team is doing in two lines (this season's verdict and the suggested path, each linking to its tab), then its weak spots and best trade partners. The five-year contention window now sits inside Contend or rebuild?, next to the four paths, instead of in a separate card." },
    { kind: 'improved', page: 'Teams', text: "Trade partners now name names: which of their players would start for the team and how many points a week each adds, and what they'd want back (its best picks if they're building for later, or bench players who'd start for them). Each partner shows its record and playoff odds. The Trade Calculator's partner suggestions use the same, more specific reasons." },
    { kind: 'fixed', page: 'Trade Calculator', text: "Trade Coach finds many more trades. Fix a position and Go all-in kept only the first offer it built for each player, before checking whether that offer would pass, so a player was dropped when his first package didn't (James Cook was left out over a package KTC's calculator calls off, while another package for him passed everything). They now check every package as they go, keep up to two different ones per player, look at 25 players instead of 15, and list up to 10 instead of 5. They also no longer drop trades that only lean bad for the other team, as intended since Oct 20. Fix a position at RB in The League of Gold went from 1 trade to 10, across 7 running backs." },
    { kind: 'fixed', page: 'Trade Calculator', text: "Trade Coach's Down-tier a player works again: it found nothing, because a lesser player plus extras for one star nearly always looks like the other team overpaying on KTC's calculator (it adds a big bonus for the single best piece), and every trade had to look fair there. Down-tier now skips that check and says on each trade how it reads on KTC, so you know to expect pushback if they look it up. It also checks each package before picking one per player. Down-tiering Ja'Marr Chase in The League of Gold now finds 5 trades, starting with Kyren Williams, Tucker Kraft and Chase Brown." },
    { kind: 'improved', page: 'Trade Calculator', text: "Trade Coach's Best trades lists up to 10, best for you first: when at least three were a Good trade or better it used to show only those (4 in The League of Gold, now 8). Trade with a team checks each trade before choosing which to show, instead of choosing 8 and then dropping the ones that don't help you, which could leave none." },
    { kind: 'fixed', page: 'Trade Grades', text: "A team out of the playoff race when it traded (under 5% playoff odds that week) no longer gets credit or blame for this season's points in its verdict, the same rule the Trade Calculator uses. The odds come from the real standings up to the week of the trade, with the rest of the season played out from there, and the card says when it applies. In The League of Gold, Bye Week was 0-8 when it traded with Skat Happens Chase Love on Oct 8." },
    { kind: 'new', page: 'Trade Grades', text: "A Team picker: show every trade, your trades, or any one team's, with how many each has. It remembers your choice, and the Managers page opens it on that manager." },
    { kind: 'improved', page: 'Trade Grades', text: "Shorter trade cards: the verdicts, what each team got, and one line for the price (\"paid 2% under then (Fair) · 1% under today (Fair)\"). This season's odds and the full breakdown are folded under More, so the list takes about half the scrolling." },
    { kind: 'improved', page: 'Managers', text: "One table instead of a table and a card per manager: tap a manager to open their details (their trading style in a sentence, trades, fit, best and worst moves) right under their row. The intro is two lines, the Description column moved into those details, and W-L now reads Won then and Won now (\"5 of 8\"), so it isn't mistaken for a season record." },
    { kind: 'changed', page: 'Teams', text: "Weak spots read in plain words (\"41% of RB value is in players 27 or older\", \"Few picks: 8th of 10\") instead of labels like RB Age Cliff and Pick Poor. Roster names are no longer cut off: the roster shows three columns on laptop screens and six on wide ones." }
  ] },
  { date: '2026-10-21', items: [
    { kind: 'fixed', page: 'Trade Calculator', text: "A player whose KTC value jumped could get a wildly wrong market price. Case Keenum went from a KTC value of 17 to 827 after he started; managers had paid about 2,000 for him, but that read as 9,806% over his old value, and applied to today's 827 it priced him at 9,157, first in Player Market and in the Trade Calculator. Market prices now leave out trades from when a player's KTC value was more than 1.5 times higher or lower than today's, so they come from trades at prices like his current one." },
    { kind: 'changed', page: 'Player Market', text: "Four tabs instead of seven: Look up a player, All players, Movers (Rising & cooling and Market highs & lows together) and By position. Picks and Rookie drafts moved to Trade Lab, under Picks and rookie drafts. Rising & cooling now starts at a KTC value of 1,000 and leaves out players whose KTC value or price swung so far that the change says more about KTC catching up than about the market (Carson Wentz led Cooling at \"237% over\" from when KTC had him at a few hundred)." },
    { kind: 'improved', page: 'Player Rankings', text: "A simpler table: player (with position and team underneath), age, value, market price, trend, projected points and VORP. Market price is now the price itself, with how far it is from his KTC value underneath (\"9% under KTC\"). Projected points are colored within each position, green for the top fifth to red for the bottom fifth, like League Overview. Value/PPG, Value/VORP and the status log and notes at the bottom are gone." },
    { kind: 'improved', page: 'Trade Search', text: "One number at the top: how many trades from leagues like yours there are, with your league's settings under it. The database total and the separate counts on The market at a glance and Over time are gone." },
    { kind: 'fixed', page: 'Compare', text: "The game log's header row no longer floats over a week's row as you scroll: it stays at the top of the window." }
  ] },
  { date: '2026-10-20', items: [
    { kind: 'changed', page: 'Trade Calculator', text: "Balance and Make it work for both are now one button, Even it out. It shows when either team would see the trade as a bad one. If it's bad for them, it adds one of your pieces (or takes one of theirs out) until it's at least a Toss-up for them, keeping it as good as possible for you. If it's bad for you, they add a piece (or one of yours comes out) until it's at least a Toss-up for you and still fine for them. The written \"to even it up, add…\" suggestion in Details is gone too, so there's one way to do it." },
    { kind: 'improved', page: 'Trade Calculator', text: "The Trade Calculator's answer is now one card: your verdict and the other team's side by side, one line on why, then your title odds and the price on trade value and KTC. The details (what moved the verdict, how trades like it turned out, the market) sit under Why, and the second verdict box further down is gone. New: when a trade is One-sided, Make it work for both makes the smallest change (one of your pieces added, or one of theirs taken out) that turns it into a Toss-up or better for them while keeping it as good as possible for you. Send offer link copies a link for the other manager that opens on their side, as your offer to them (Worth accepting, Worth a counter or Decline); they can adjust it and send it back. The practice button is now Negotiate with (team)." },
    { kind: 'improved', page: 'League Overview', text: "League Overview is rebuilt around two questions: who's good now, and who's good later. A new Contend or rebuild map places every team by its lineup this season against its dynasty value, with your team in gold. The table now opens on Right now, ranked by title odds (it used to rank by total value alone, which put a 3-9 team first); switch to Dynasty for the value ranking. Values read as places in the league (2nd, 8th) with the exact number underneath. The table also shows each team's rank at QB, RB, WR, TE and picks as colored columns, with the value under each rank (green the strongest, yellow the middle, red a need), in place of the Players and Position split columns. A PPG column shows points actually scored per game next to the projected best-lineup points for the rest of the season, and the map says plainly that it uses the projection. Clicking any team opens it in Teams." },
    { kind: 'new', page: 'Teams', text: "Teams has a new This season section: how the team's season is really going, from Sleeper's own weekly scores and projections. A one-line verdict and tags (Lucky, Unlucky, Injury-hit, Lineup leaks, Overperforming, Underperforming), then four parts. Luck: its record against the wins its scores earn when every team plays every other team each week (median games included), plus points against and close games. In The League of Gold, Allen's Creamy Surprise is 12-0 on scores worth about 9 wins. Injuries: the points its best lineup lost to players out each week, and who it missed most. Lineup calls: what the lineups it started scored against the lineups Sleeper's projections picked, with starters who were out or on bye named; coin-flip calls, late scratches and game-time decisions aren't held against anyone, and best ball leagues skip it. Over/under: its starters against their projections, and the players most over and under. A table ranks every team in the league on each; tap one to open it. Works in every league type, IDP, kickers, defenses, best ball and custom scoring included; before week 1 it shows last season." },
    { kind: 'new', page: 'Teams', text: "Teams has a new Contend or rebuild? section, under This season: four ways to play the next few seasons, Push now, Reload, Rebuild and Stay the course, worked out on the team's real roster. Toggle between them to see what each does to this season's title odds, the next two seasons' contention window, how much of the team's value is in RBs, WRs and TEs past the age-27 cliff, and pick capital. Each path lists the case for and against (including whether the record undersells or flatters the roster, from This season), how hard it is in your league (how many contenders would start the players you'd sell, how many teams out of the race have a starter for you), and what happened to teams in the same spot in real leagues. A path is suggested, but every one is laid out so the manager decides, and each has a button into Trade Coach. New research behind it, from 1.34 million trades: teams that bought made the next season's playoffs more often than teams that stood pat at every record level (winning teams 72% against 65%), and after a selling season, teams that bought the next year made the playoffs 53% of the time." },
    { kind: 'changed', page: 'Everywhere', text: "A simpler menu: five tabs instead of fifteen pages. League (League Overview, and Teams for any one team), Trade Calculator, Market (Player Market, Rankings, Compare and Trade Search), League Trades (Trade Grades and Managers) and Trade Lab. A tab with more than one page shows them in a row underneath. Start/Sit, Waivers, Playoff Schedule and Rookie Draft are gone." },
    { kind: 'changed', page: 'Trade Search', text: "Trade Database is now Trade Search, and it opens on what it's for: the search box and real trades from leagues set up like yours, newest first. The market at a glance and Over time are folded into one line each (open them for the charts), so it no longer looks like Trade Lab, which is where the big-picture trade research lives." },
    { kind: 'changed', page: 'Everywhere', text: "Every tool now opens from the home page with your league and your team. Enter your Sleeper username and pick one of your dynasty leagues (your team there is found from your account), or enter a league ID and pick your team. A link to any tool opened without them goes through the home page first and then straight on to that page. The username list shows each league once, at its current season. Before, a page opened without a team quietly showed the league's first team, and a page opened without a league showed one picked by default." },
    { kind: 'fixed', page: 'Everywhere', text: "2QB leagues (two QB spots, no Superflex spot) are now valued like Superflex everywhere. League Overview, Team Analyzer, the Trade Calculator, Player Rankings and Waivers were using 1QB values for them, which undervalued every QB." },
    { kind: 'new', page: 'Everywhere', text: "A line under the menu when it matters: an old season's league (Sleeper starts a new league each season) says so and links to its current season; an IDP league says defensive players have no trade values here; Start/Sit in a best ball league says there's no lineup to set." },
    { kind: 'fixed', page: 'Rookie Draft', text: "In older leagues the pick-by-pick table had a broken heading and came up empty. It now always uses every rookie class that has played a season." },
    { kind: 'fixed', page: 'Data status', text: "The hourly Sleeper trade crawl was timing out most runs while pricing its 3.7 million trades, so the market summaries behind Player Market and Trade Database often went hours without updating, and each timed-out run lost its place in the crawl, so the next one re-crawled the same leagues. Runs now crawl 42 minutes instead of 48 and save their place as soon as the trades are uploaded." },
    { kind: 'new', page: 'Trade Lab', text: "New page, Trade Lab (Trades menu), all about the 1.34 million trades from 64,898 Sleeper dynasty leagues. How managers trade: when (peaks in May and October-November), the shape of deals, how close to even, what moves and how old, who sells points in season, how busy leagues are. What happened after: how each verdict turned out, whether the price holds, which trades won titles, consolidating vs spreading out, picks, age and position. Your league next to everyone on the same definitions (The League of Gold trades closer to even than most, and one team is in 72% of its trades). And Explore it yourself: pick a position, age, shape, timeline, price, time of year or format and see how trades like it turned out. The Trade Database's What 1.3 million trades show section moved here." },
    { kind: 'new', page: 'Trade Coach', text: "Trade Coach's Best trades now also looks for two starters from one team in a single deal, paid with your bench players and picks, priced Fair on KTC and inside what managers in that team's spot accept. None of the searches tried it before. For Skat Happens Chase Love it found Denzel Boston, Cam Skattebo and Rome Odunze for Kyren Williams and Chase Brown: a Great trade for Skat Happens, a Toss-up for Super bo or bust, title odds 24% → 31%." },
    { kind: 'new', page: 'Trade Coach', text: "During the season, every Trade Coach suggestion shows your title odds before and after, the same numbers as the calculator's This season box. For a team already headed to the playoffs, the title is where a trade shows up: in 2024 and 2025, contenders with 85%+ playoff odds won the title 1.35 times as often as their odds said after trades adding 6+ points a week, and 1.12 times (the same as any team that traded) after trades adding about none." },
    { kind: 'changed', page: 'Trade Calculator', text: "Out of the playoff race: during the season, a team with under 5% playoff odds no longer gets credit or blame for this season's points in its verdict. A 2-10 team selling a starter used to read as a Bad trade for it because of the points it loses, though for teams that far out those points said almost nothing about how the trade turned out, and they sell starters about 10 times as often as playoff teams do. The other team's line says when it applies. Trade Coach finds more trades with teams that are out of it." },
    { kind: 'fixed', page: 'Trade Coach', text: "Trade Coach's Go all-in and Fix a position no longer suggest trades that are a Bad trade or worse for the other team, like taking Kenneth Walker from a contender with 100% playoff odds. Contenders with 85%+ playoff odds gave up 5+ points a week in only 2.2% of the in-season trades they accepted, even for extra value." },
    { kind: 'changed', page: 'Trade Calculator', text: "The verdict (Good trade, Toss-up and so on) now blends each player's price with his Vault value, what real trades say he's worth, learned nightly from completed Sleeper dynasty trades: 35% Vault value, 65% price. Tested on 1.58 million team-sides of 2025 trades, each priced by values that had never seen them, verdicts on the blend picked the teams that went on to beat their playoff odds about 50% better, and the ones that gained points a week about 30% better, than verdicts on KTC alone. The price you see (Fair / Lopsided / Unfair) is unchanged and still matches KTC; completed trades on Trade Grades stay KTC-only. Trade Coach finds more fair trades with it: 8 for Skat Happens Chase Love instead of 3." },
  ] },
  { date: '2026-10-19', items: [
    { kind: 'new', page: 'Trade Database', text: "New section, What 1.3 million trades show, from every two-team trade in 2024 and 2025 Sleeper dynasty leagues followed for up to two years. How far behind managers go: about 14% in a 1-for-1 (19% with picks), but only 5-7% once pieces are added. What happened after: picks bought for players at a fair price were ahead 54% of the time within a year and 77% after 21+ months; age 27 is a cliff for RBs, WRs and TEs; the side getting the WR in straight swaps came out about 8% behind; contenders paid no deadline premium in any month. And both sides: a trade good for one side was usually not good for the other (good for both: 2%), and contenders trade with rebuilders 18% more than chance." },
    { kind: 'new', page: 'Player Market', text: "New Picks tab: what early, mid and late picks really trade for next to KTC's prices. KTC prices an early 2027 1st at 1.22x a mid one; real trades pay about 1.06x, because projected finishes hold only so often. In a Superflex TE+ league that's KTC's 6,326 against about 5,494. Plus how picks gain on players over time." },
    { kind: 'new', page: 'Player Market', text: "Each player's chart has an outlook line: how players at his position and age did on value after real trades at an even price, a year on and two years on (e.g. RBs aged 27-28: −5% and −10%)." },
    { kind: 'changed', page: 'Trade Calculator', text: "Your verdict now shows the other team's verdict right under it, on the same ladder. When a trade is good for you but Leans bad or worse for them (a 4th for James Cook), the big headline says One-sided instead of Great trade, with both verdicts underneath and a pointer to how to even it up: they'd likely say no. When it's good for you and at least a Toss-up for them, it's tagged Works for both. In 1.3 million accepted trades, a trade that was Good for one side was a Toss-up or better for the other only about a third of the time, so your verdict alone never said whether they'd like it." },
    { kind: 'changed', page: 'Trade Calculator', text: "Would they accept? now depends on the shape of the trade. Measured on 1.3 million accepted trades: in a 1-for-1 the side that came out behind typically went 13-21% behind (more with picks, whose prices are a matter of opinion), but only 5-9% once pieces are added on either side. The Offer read used about 12% for everything, so it was too generous on multi-piece deals and too strict on 1-for-1s. A manager with their own trade history in your league is still judged on that. Trade Coach uses the same line, so it no longer suggests multi-piece deals that put the other team further behind than managers in their spot usually accept: fewer suggestions in some leagues, but ones they'd actually take." },
    { kind: 'changed', page: 'Trade Calculator', text: "The verdict now also counts age and WRs, from 2.7 million real trade-sides (1,342,426 trades in 64,898 leagues), and only where the result held in both 2024 and 2025. At the same KTC price, a side whose best piece was a RB, WR or TE aged 27 or older came out behind afterward (RBs 5-10%), so that counts 5% against in the verdict. In straight swaps the side getting the WR came out about 8% behind, so a WR counts 3% against (less than measured, in case it's a market cycle). The line under the verdict now lists every adjustment that applies, e.g. paying in picks and getting a 27-year-old RB. The Fair / Lopsided / Unfair price still matches KTC. In The League of Gold one of 50 trade-sides changes: Bye Week's trade for Jake Tonges goes from Good trade to Slight edge." },
    { kind: 'changed', page: 'Managers', text: "Managers are ranked by Net Then (the price they got on the day) instead of Net Now. In 2.7 million real trade-sides, getting good prices was a real, repeatable skill: a manager's edge in some trades predicted their edge in the rest, and the next season. How players moved after a trade wasn't: it didn't carry over from one season to the next at all. The cards lead with Net Then, and notes about trades that gained or lost value afterward now say that part is mostly luck." },
    { kind: 'new', page: 'How We Grade', text: "New section, What 2.7 million trades say: there's no deadline premium (contenders paid within 1% of even all season); among losing teams, those that made 15+ trades won 8% of titles against 3% for those that made none; rebuilds usually take more than a year, but rebuilding beat staying in the middle (40% playoffs the next season against 35%); and picks gain on players over time. The verdict track records were re-measured on the finished data too." },
  ] },
  { date: '2026-10-18', items: [
    { kind: 'changed', page: 'Trade Calculator', text: "The verdict now counts two things the KTC price misses, found in 2.2 million real trade-sides. Picks: at the same KTC price, the side that got picks for players came out ahead on value 59% of the time a year later and 77% two years on, so picks count about 5% above KTC in the verdict. Cheap consolidation: turning several pieces into one player worth under 3,000 came out ahead only 39% of the time, so that counts 10% against. A line under the verdict says when either one applies. The Fair / Lopsided / Unfair price is unchanged and still matches KTC. In The League of Gold one of 50 trade-sides changes: Salt Factory's 2027 2nd for MarShawn Lloyd goes from Toss-up to Leans bad." },
    { kind: 'changed', page: 'Everywhere', text: "Slight edge now starts at a score of +6 instead of +10, and Toss-up covers −6 to +6. On 1,028,227 real trades, scores between −6 and +6 really were a coin flip (49% came out ahead), but +6 to +10 came out ahead 61% of the time, like the rest of Slight edge. About 1 verdict in 10 moves from Toss-up to Slight edge; in The League of Gold that's 3 sides of 25 trades, including Skat Happens' 2027 1st for Jameson Williams. Trade Coach's \"Slight edge or better\" moves with it." },
  ] },
  { date: '2026-10-17', items: [
    { kind: 'improved', page: 'Trade Calculator', text: "The track record under each verdict is re-measured on 1,028,227 real trades from 43,634 leagues (it was about 30,000 trades). The tiers held up in 2024 and 2025 and in Superflex and 1QB alike. For contenders, the line now compares with the average contender who traded: teams that trade at all beat their playoff odds by about 2 points, so a Toss-up used to read as if it helped. A Great trade: contenders did 7.5 points better than that; a Terrible trade, 16 worse. For rebuilders, 87% of Great trades were still ahead on value a year or more later, against 13% of Terrible ones. Verdicts themselves didn't change." },
    { kind: 'fixed', page: 'Trade Grades', text: "A trade that swaps one player for another at the same position (a WR for a WR) no longer gets summed up as \"trimmed WR depth\". And when a trade's This season effect can't be shown because a player in it has since been traded again, the card now says so instead of leaving the section out." },
    { kind: 'improved', page: 'Player Market', text: "Look up a player opens on your most valuable player instead of an empty box. The rookie draft counts now use thousands separators." },
    { kind: 'fixed', page: 'Player Rankings', text: "Team abbreviations match the rest of the site (KC, NE, SF, GB, LV, NO, JAX, TB) instead of KTC's own codes (KCC, NEP and so on)." },
    { kind: 'fixed', page: 'Managers', text: "Manager notes use a proper minus sign (−1.3 yrs per trade), like every other number on the site." },
    { kind: 'changed', page: 'Data status', text: "A background job that's paused on purpose reads \"Paused\" instead of \"Ended: skipped\", and its runs show grey instead of red. The trade crawl is paused while we rebuild the 2024 and 2025 trade data." },
    { kind: 'new', page: 'Waivers', text: "New in Tools: the best free agents in your league for your team. Three lists: who adds the most to your best lineup this week (Sleeper's weekly projections), who adds the most points a week for the rest of the season (byes, injuries and matchups counted), and the free agents with the most dynasty value to stash. Filter by position, and it names the least valuable player outside your best lineup if you need a roster spot." },
    { kind: 'new', page: 'Playoff Schedule', text: "New in Tools: every team's best lineup in your playoff weeks against its level the rest of the season, next to playoff and title odds, so you can see who peaks at the right time. Pick a team to see its lineup for each playoff week, with every starter's opponent and who's on bye." },
    { kind: 'new', page: 'Rookie Draft', text: "New in Tools: what each rookie pick has really turned into. From 47,781 real Sleeper rookie drafts in your QB format (2021-2025 classes), the players taken at each slot and what they're worth on KTC today: a mid 1st became a median 4,300, with 65% starters; an early 2nd, about 2,200. Your own picks are matched to that record, and the latest class's draft order sits below, counted among the positions your league starts (no linebackers in an offense-only league)." },
    { kind: 'improved', page: 'Start/Sit', text: "Who should I start?: pick two or more players, from your roster or anyone Sleeper projects this week, and see who to start and how often each outscores the others. One click opens them side by side in Compare Players." },
    { kind: 'new', page: 'Start/Sit', text: "New Tools section with Start/Sit: this week's lineup against the best one your roster can field, on Sleeper's weekly projections in your league's scoring. It flags starters who are out, on IR or on a bye, locks players whose game has started, and says how sure each swap is: a 1-point projection gap is a coin flip (52%), 4-5 points is right about 70% of the time, 10+ about 90% (from 259,000 real pairs of players). Tested first: nothing we tried beat Sleeper's own projections on close calls." },
    { kind: 'improved', page: 'League Overview', text: "Live scores in the projections: once the week's first game kicks off, the week in progress starts from the points already on the board. Starters whose NFL team has played keep their real points (a zero included), and only the starters still to play are simulated. Before, the whole week was simulated from scratch until it was final. Projected records and playoff and title odds on League Overview, the Trade Calculator's This season, and Trade Grades." },
    { kind: 'improved', page: 'How We Grade', text: "The playoff and title odds section says how accurate they've been: on 949,362 real team-sides from 2024 and 2025 trades, teams given 30% to make the playoffs made it about 30% of the time (average miss under 1 point; about 1 point for title odds). It also now says the season is simulated 4,000 times, as League Overview does, not 2,000." },
  ] },
  { date: '2026-10-11', items: [
    { kind: 'changed', page: 'Trade Grades', text: "Completed trades are won and lost on KTC values only, then and now: each piece at its KTC value on the trade's day and today, combined the way real trades combine them (trade value). Market prices no longer touch them; they stay in the Trade Calculator, for trades you're weighing now. A few stale market reads had flipped who won: Cyrus Allen read 140% over KTC in July, before KTC caught up, so Skat Happens' Cyrus Allen for Tory Horton deal (871 less on KTC) counted as a 1,270 win. The \"Acceptable\" market line is gone from the cards too." },
    { kind: 'changed', page: 'Managers', text: "W-L, Net Then and Net Now, best and worst moves, and Who pays up all go by KTC values (trade value), the same as Trade Grades. Who pays up now reads as paid over or under KTC value." },
  ] },
  { date: '2026-10-10', items: [
    { kind: 'fixed', page: 'Trade Grades', text: "A pick that has already been used is worth, today, the player taken with it: \"2026 R2 (Denzel Boston) 2,999 → 4,619\", not the price of a 2027 2nd. Each trade's \"now\" value and Managers' Net Now count it that way, at the player's market price." },
    { kind: 'fixed', page: 'Everywhere', text: "Pick labels say where a pick falls in its own round: in a 10-team league your 2nd that comes 11th overall is an early 2nd, not a \"late\" one worth more than other teams' early 2nds. Its price is unchanged (the 11th pick still goes for about a late 1st). The calculator's price trend for a pick now follows that pick, and past trades' picks use the same market price as the calculator's." },
    { kind: 'changed', page: 'Player Market', text: "Rising & cooling and Your market's moves compare each player's market price (the one trade value uses) now against the prices of about a month ago, so the \"now\" side is the market price shown everywhere else. Your market's moves are labeled with that date (\"Since Sep 1\") instead of \"This week\"." },
    { kind: 'changed', page: 'Everywhere', text: "No more 25% cap on market prices: every page shows the real number, however far from KTC (Case Keenum goes for about 440% over his 829 KTC value in completed trades), and the grade and past grades use it too. Tested on 275,273 trades: 77.1% graded Fair without the cap, 77.2% with it, so nothing was gained by hiding it. A player the cap had cut short no longer reads oddly against similar players." },
    { kind: 'changed', page: 'Everywhere', text: "Picks are priced at where they should land in next year's draft by each team's projected final record (its real record plus the rest of the season), not lineup strength alone. Allen's Creamy Surprise is 8-0, so its 2027 1st is now a late 1st, not a mid. Later drafts still go by lineup strength. One rule on every page: League Overview, the Trade Calculator, Trade Coach, Team Analyzer and past trade grades." },
    { kind: 'fixed', page: 'League Overview', text: "The value chart's last day now matches the standings table. It had priced early and late 1sts and 2nds at KTC's raw prices, not the adjusted prices every other page uses, and guessed the draft order a different way, so a team could be #1 in the table and #2 on the chart. Past trade grades now price early and late picks the same way the calculator does." },
    { kind: 'fixed', page: 'Everywhere', text: "One market price per player on every page. Player Rankings' Market column now shows his price against his KTC value, the same number as the Trade Calculator, Compare and Player Market (Ja'Marr Chase reads 8% under everywhere, not 1% over on Rankings). Against players like him it always says \"similar players\". Player Market's highs and lows use the same price. The market line on every chart is now the price trade value used on each date, so it ends right on the market price shown beside it." },
    { kind: 'fixed', page: 'Managers', text: "Who pays up judges each trade at the market prices of its own day, as Trade Grades does, instead of today's prices (a player who has risen since made the buyer look like he got a bargain). Trade Coach's Sell high uses the same numbers." },
    { kind: 'changed', page: 'Everywhere', text: "A team's best-lineup points are \"Lineup PPG\" everywhere (it was Opt PPG on some pages and optimal lineup PPG in notes), matching the calculator's This season block. A one-year contention window reads \"2026\", not \"2026–2026\". Negative VORP and points changes use a real minus sign. The market box under a grade explains that its over/under KTC counts pieces the way trade value does, which is why it differs from KTC's calculator. Player Market and the player card describe how the market price is built as it is now." },
    { kind: 'fixed', page: 'Trade Grades', text: "A side with one piece no longer repeats its \"then → now\" value on a second line." },
  ] },
  { date: '2026-10-09', items: [
    { kind: 'changed', page: 'Trade Grades', text: "One way of judging trades everywhere: each completed trade now leads with each team's verdict, the same ladder the Trade Calculator uses (Good trade, Toss-up, Bad trade and so on, from value at the time, roster fit, timeline and this season's points), instead of a separate label mixing price and fit (\"Solid for one team, Fine for the other\"). The price reads only Fair, Lopsided or Unfair, and the filters match; Good and Great are the verdict's words now, everywhere. The \"at market prices\" column is gone (every grade already uses what players were trading for at the time), and so is the second points number in each team's header (This season has it)." },
    { kind: 'changed', page: 'Everywhere', text: "The notes behind a grade say what they mean without extra price tags: \"Fills a real RB need\" or \"Lamb is a proven veteran, exactly what a win-now push wants\", without \"worth closer to 8,463 than its 7,359 KTC value\", a third set of numbers next to trade value and KTC. A swap of like for like (a veteran QB for a veteran QB) no longer shows two notes that cancel out, and the depth note names the starter the trade actually makes harder to cover (\"Joe Burrow gets harder to cover: 2.6 points when he's out, was 1.5\") instead of whoever is hardest to cover on the roster." },
    { kind: 'fixed', page: 'Trade Calculator', text: "The market box no longer says the grade ignores market prices (it uses them now), and its \"most like this one\" examples skip trades of 6+ pieces a side or 50%+ off KTC (a 6-for-6 had shown up as most like a 1-for-2). The trade type matches its own description (Roster-Fit Trade), the extra \"% off by need\" number is gone, and the ± line says what it is: how much these pieces' prices have swung lately, not \"rookies and far-future picks\" when there are none." },
    { kind: 'changed', page: 'Trade Calculator', text: "The consolidation line (\"teams that got a 7,000+ piece by sending 1.15-1.4x its KTC value came out ahead a year later 54% of the time\") is recomputed on today's trade value from 489,557 trades, counting a pick that's since been drafted as the rookie it became. Consolidating into a star held up better than the old numbers said, and into cheaper players worse." },
    { kind: 'changed', page: 'Trade Calculator', text: "Offer gives the other team less extra credit for getting the best piece in the deal: on today's trade value, which already prices consolidating, real teams that did so accepted being about 1% behind, not 5%." },
    { kind: 'fixed', page: 'Trade Grades', text: "The one-line summary under a trade says who came out ahead and by about how much when the price is still fair (\"came out a little ahead in value, about 10%\") instead of calling a 10% edge \"close to even\", and it no longer mixes up which team got younger or older. The Trade Calculator's summary uses the same sentence." },
    { kind: 'changed', page: 'Trade Database', text: "The market at a glance now uses every completed Sleeper trade from the last six weeks, not a 30,000-trade sample: for a 10-team Superflex TE+ league that's about 7,500 trades from leagues exactly like yours instead of 2,700, and \"your exact format\" counts all of them, not just KTC's last few days." },
    { kind: 'fixed', page: 'Everywhere', text: "Pages that read the market load much faster: Player Market showed its first list after 40+ seconds and now in about 3, and Trade Coach's first search took up to 27 seconds and now about 5 to 10. Each completed trade is now valued once instead of once for every piece in it; every number stays exactly the same. Trade Coach and Offer also now wait for managers' trade histories and market prices to finish loading instead of going ahead after 8 seconds, so the same league always gets the same answer, however fast the connection is." },
    { kind: 'changed', page: 'Trade Coach', text: "Trade Coach no longer suggests asking for another team's best player, or one of a contending team's top 3. In about 34,000 real trades, teams sent their most valuable player in only 8% of their trades (contending teams 5%), and when one did move it went for no premium, so a fair price doesn't make those offers likely. You can still go after anyone with Get a player, and the Trade Calculator now says when a trade asks for the other team's best player, and how rarely teams like theirs move one." },
    { kind: 'changed', page: 'Trade Calculator', text: "Grades now match what managers actually accept. Trade value was refitted on 1.5 million completed Sleeper dynasty trades: how much a star counts over the pieces coming back now depends on how close those pieces are to him (when they're well below him, extra pieces count nearly in full), each piece a side sends beyond one more than it gets back counts at 25% (it costs the other team a roster spot), and adding a piece can never make a side worth less. On 275,000 trades from June to October it never saw, 77% grade Fair, against 64% before and 30% on KTC's own calculator, and it picks real winners (points afterward, playoffs against the odds) as well or better. Ja'Marr Chase for CeeDee Lamb and Davante Adams now reads about even (KTC's calculator: 14% over)." },
    { kind: 'changed', page: 'Everywhere', text: "Every grade prices each player and pick at what it actually trades for: its KTC value adjusted by what managers paid for it in completed trades over the last 45 days, in your league's QB format and TE premium (at most 25% either way). Ja'Marr Chase, for example, goes for about 8% under his KTC value, and tight ends in TE-premium leagues well under. Values shown on the page stay KTC's, and KTC's own calculator stays next to every grade. Past trades on Trade Grades and Managers are graded at the prices of their own time, back to October 2023. A player's price against KTC now reads the same on every page." },
    { kind: 'changed', page: 'Trade Calculator', text: "The result is one answer instead of several: the verdict for your team, then one price row (what your team pays on trade value and on KTC's own calculator) and whether managers usually accept trades like it. KTC's number says \"same call\" when it agrees with ours (every 1-for-1 on KTC's values does). When it doesn't, one line says why, with the numbers for real trades like yours (for example, of 4,849 accepted trades with the best piece coming back 70-85% as valuable, KTC's calculator called 24% Fair and trade value 71%), and names any player whose market price moves the trade. Fairness for both teams, the market's recent trades and the consolidation note moved into Details." },
    { kind: 'changed', page: 'Trade Calculator', text: "The track record under the verdict is corrected. It had counted a draft pick that's since been used as worth nothing, which made every team that got picks look like it lost; now it's valued as the rookie it became. Contending teams' line is now how much more or less often they made the playoffs than their odds said (Great trade: 8 points more; Terrible: 20 less), since a contender's verdict is mostly this season's points. And a rebuilding team's verdict counts getting younger and adding picks again: at an even price, rebuilders who got much younger were still ahead later 62% of the time, against 43% for those who got older." },
    { kind: 'changed', page: 'Trade Coach', text: "Trade Coach only suggests trades that work for both teams: at least a Toss-up for the other team, not hurting either roster, no filler pieces, and Fair on KTC's own calculator too, so an offer holds up when the other manager checks it on KTC (Sell high, Buy low and Shop a player are about the gap between KTC and the market, so they skip that check). Each card shows KTC's number next to trade value. Best trades also builds trades where both teams come out ahead in different ways, priced where real trades land (every kind of team trades at about the market price): near even for a contender, whose win is this season's points, and up to about 10% your way for a rebuilder. Sell high and Buy low now price at the market: selling only at what a player actually goes for, or better. The same deal isn't listed twice with a different add-on. If your team is already strong, the list may be short: that's the honest answer." },
    { kind: 'changed', page: 'Managers', text: "Net Then and Net Now are now at what players were trading for then and now, like every grade, so the separate Market columns (which said the same thing) are gone." },
    { kind: 'changed', page: 'How We Grade', text: "Rewritten for all of the above: how trade value is built, where KTC's calculator and ours agree and disagree (with the numbers), why plain addition of values learned from trades doesn't work, how the track records are measured, and how past trades are priced." },
    { kind: 'changed', page: 'Data status', text: "A Grade prices tile shows when the grade's market prices were last rebuilt, how many players and picks trade off their KTC value, and how far back the history for past trades goes." }
  ] },
  { date: '2026-10-08', items: [
    { kind: 'changed', page: 'Trade Calculator', text: 'For a contending team, the verdict now counts this season\'s points a little less (2 per point a week, was 3) and long-term value a little more. Rechecked on about 30,000 real trades from the 2024 and 2025 seasons, it predicts playoffs, titles and who\'s ahead a year later as well or slightly better, and it matched a manager\'s own calls on real trades better. The track-record lines under the verdict now cover both seasons, which agree within a few points at every tier.' },
    { kind: 'changed', page: 'Trade Coach', text: 'Trade Coach no longer suggests trades where you give up value to gain points this season (like Ja\'Marr Chase for Christian McCaffrey and Bucky Irving). Every list except Go all-in now needs you even or ahead on trade value; Go all-in is still the place to spend future value on this season.' },
    { kind: 'changed', page: 'Everywhere', text: 'The star bonus (how much more one great player is worth than two good ones that add up to the same) is half again as big. It was set so a typical accepted trade comes out even; now it\'s set by what wins: on 7,460 real 2025 trades, this size picked the teams that went on to score more and beat their playoff and title odds better (KTC\'s own adjustment did worse than a coin flip). Selling a star for two good players now costs a little more: Ja\'Marr Chase for CeeDee Lamb and Davante Adams reads about 8% under instead of 2%. The track-record lines under the verdict were recalculated to match.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The verdict now has tiers: Great trade, Good trade, Slight edge, Toss-up, Leans bad, Bad trade and Terrible trade. They were set by checking 13,886 real trades in 1,319 completed 2025 Sleeper dynasty leagues against what happened next: a trade just past even turned out to be a coin flip, so it takes a clear edge to read Good trade now (a trade that read Good before may now say Slight edge or Toss-up). Under the verdict, one line gives that tier\'s real track record for your timeline, for example "In real trades scored like this, 77% of contenders were still ahead on value a year later." (measured on trade value, so a star for two good players isn\'t scored as a win for the side that got two)' },
    { kind: 'changed', page: 'Trade Coach', text: 'Trade Coach lists trades rated Slight edge or better for your team, and each card shows the new tier for both teams. Sell high, Buy low and Shop a player also list Toss-ups (labeled as such), since those are about getting a good price.' },
    { kind: 'fixed', page: 'Player Market', text: 'Player Market showed "Maximum call stack size exceeded" on phones instead of loading. Fixed.' },
    { kind: 'fixed', page: 'Trade Coach', text: 'The price on each Trade Coach card ("pays 6% under trade value") now really is trade value. It was the overall price grade, which also blends in both teams\' roster fit and timeline, so it could disagree with the calculator: Ja\'Marr Chase for CeeDee Lamb and Davante Adams showed 6% under when trade value has you paying about 2% over.' },
    { kind: 'improved', page: 'Player Market', text: 'Look up a player: the trade dots are smaller and see-through and sit under the lines, so the KTC value and market trend stay readable for busy players.' },
    { kind: 'fixed', page: 'Player Market', text: 'Rising & cooling no longer shows impossible moves like "3558% over to 5947% over KTC". Those came from trades made while a player\'s KTC value was nearly nothing; moves now only count trades priced between half and double KTC.' },
    { kind: 'improved', page: 'Everywhere', text: 'Playoff and title odds are corrected by how often teams really made it in 9,464 team-weeks of completed 2025 leagues. They were close already, but a little too sure about long shots (teams given about 10% made the playoffs 19% of the time), so long shots now read a bit higher and each league\'s odds still add up.' },
    { kind: 'improved', page: 'Everywhere', text: 'Early and late 1sts and 2nds are priced by what managers really pay, not KTC\'s early/late prices. A pick\'s tier comes from its original team\'s projected finish, which holds only so often (projected-early 1sts ended up early 47% of the time), so managers pay a smaller spread: an early 1st about 10% over a mid 1st (KTC: 17%), a late 1st about 3% under (KTC: 6%), and a late 2nd the same as a mid 2nd.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'For a rebuilding team, the verdict now weighs value and roster fit only, not whether the trade makes you younger or adds picks. Tested on real 2025 trades, that timeline part made rebuilders\' verdicts less accurate (managers overpay for picks at the draft, and getting older didn\'t hurt), and without it the verdict tracks who\'s ahead a year later, points and playoffs better. Contending and flexible verdicts are unchanged.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'At market prices (and Trade Coach\'s market edge, Trade Grades and Offer negotiation) counts 60% of each player\'s recent market premium instead of all of it: replaying about 500,000 trades showed about 60% of a premium carries over to the next trades. What a player has gone for still shows in full.' }
  ] },
  { date: '2026-10-07', items: [
    { kind: 'improved', page: 'Trade Calculator', text: 'The verdict is now tested on real trades: every two-team trade in 2,924 completed 2025 Sleeper dynasty leagues (27,327), each judged as its league stood that day and checked against what happened next. Good trade sides scored 5.7 more points a week than their partner afterward, Bad trade sides 6.3 fewer, and contenders with a Good trade beat their playoff odds (86% against 82%). Contenders now weigh this season\'s points a bit more (3 per point a week, was 2), which tracked playoffs and titles better. Trade Coach\'s "would they take it" now uses only the market\'s price ranges (inside what managers usually pay for every player), not each manager\'s trade history or a rule that the trade can\'t be worse for them: managers accept trades like that all the time. Trades that are not a Bad trade for the other team are listed first; the rest follow, and each card shows the verdict for them too.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'The calculator now gives one answer: Good trade, Bad trade or Toss-up for your team, with one sentence saying why (for example "It costs you 3.9 points a week this season (title odds 32% to 28%), but you get 10% more value than you give"). It weighs value, how the trade fits your roster and timeline, and, if you\'re contending, what it does to your lineup this season; switch your timeline right next to it. The price grade (Fair, Lopsided, Unfair) moves underneath as supporting detail, and the summary at the bottom says the same thing as the verdict. Replaces the For you line.' },
    { kind: 'changed', page: 'Trade Coach', text: 'Trade Coach now seeks improvement: it only lists trades that make your team better (by the same score as the calculator\'s verdict), best for your team first, still Fair and likely to be accepted. Each card shows Good trade or Toss-up like the calculator. It also only suggests trades that are not a Bad trade for the other team by the same measure (their value, fit, timeline and their own season), so they have a reason to say yes; most suggestions are now rebuilding teams selling veterans to a contender. Each card shows the verdict for both teams. Same-position 1-for-1 swaps are skipped unless one of the players is hurt or sliding (15% or more of his KTC value lost in 90 days, like Justin Herbert), and the card says so. Shop a player also keeps Toss-ups, since you have already decided to move him. Extra value beyond about 4% your way doesn\'t move a trade up the list, so it leads with real upgrades rather than the hardest bargains.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Two-way players count at their fantasy position. Sleeper lists Travis Hunter as a DB (he plays both ways), so he was left out of position splits, roster sections and lineups, and the projections never included his offense. He now counts as a WR everywhere (KTC prices him as one), and the projections keep him: the next projections update (every 3 hours) adds his rest-of-season numbers.' },
    { kind: 'new', page: 'League Overview', text: 'Sort on phones: a Sort by menu above the team cards with the same choices as the table headers (overall value, playoff odds, record, player and pick value, Opt PPG, VORP, longevity, age, name). Pick the same one again to reverse it.' },
    { kind: 'fixed', page: 'League Overview', text: 'Full sweep of League Overview: every column, both sort directions, all ten team panels and every chart view checked against the math. Fixed the Player Value chart description, which still said value with picks only had about 12 daily snapshots (it has 249).' },
    { kind: 'fixed', page: 'League Overview', text: 'Sorting by Playoffs now uses the odds the column shows, then title odds as the tiebreaker. Before, three teams all showing 100% were ordered by a tenth of a percent of simulation noise. The season odds also hold still now: the simulation runs 4,000 seasons with the same fixed draws as the Trade Calculator, so the numbers no longer shift by a point on every visit and match the odds in the calculator.' },
    { kind: 'new', page: 'Trade Calculator', text: 'New For you line under the grade. The grade says whether the price is fair for both teams; For you says whether the trade is right for your team: Worth it, Borderline or Not worth it, from trade value, roster fit and timeline on your side plus what it does to your title odds this season. For example, Ja\'Marr Chase and Joe Burrow for Patrick Mahomes, George Pickens and three 1sts reads Fair, For you: Not worth it (title odds 32% to 27%). A contender losing 3 or more points of title odds never reads Worth it. Your timeline (Contending or Rebuilding) can be switched right in that line, since the answer often flips.' },
    { kind: 'changed', page: 'Everywhere', text: 'Good and Great now need every team to be at least an okay fit. Before, Good only needed a strong fit for one side, so a trade that suited one team and hurt the other could read Good: Ja\'Marr Chase and Joe Burrow for Patrick Mahomes, George Pickens and three 1sts graded Good while it cost the league\'s best team 5 points of title odds. That trade now reads Fair, and the calculator says right next to the grade who it\'s a poor fit for. On Trade Grades, 1 of your league\'s 23 trades moves from Good to Fair.' },
  ] },
  { date: '2026-10-06', items: [
    { kind: 'fixed', page: 'Trade Grades', text: 'Cleanup from a full sweep of Trade Grades. The paid figures are labeled then / today / at market prices (they are the overall grade, which includes roster fit and timeline), and when fit moved the grade a line adds what trade value alone says ("trade value alone: 3% over"). The intro says trades are graded on trade value, not KTC prices. Breakdown notes say KTC value instead of sticker price, and wrap cleanly on phones. Grades, filters, sorting, the team filter and every price figure checked out against the math on all 23 trades.' },
