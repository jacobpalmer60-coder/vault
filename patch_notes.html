    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach\'s Get a player shows more offers: up to 8, with up to two built around each of your players. When a manager would take your offer but you\'d be overpaying, the coach has them add a smaller piece (a pick or depth player) to make it Fair, which turns overpays into real alternatives. Lopsided offers only fill in when there are fewer than three Fair ones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach: Your side and Their side rules. Pick players or picks every trade must include, ones you won\'t trade, and whole positions or picks to leave out, and the same for what comes back: players you must get, ones you don\'t want, and positions or picks you won\'t take. Every suggestion follows them. On Rebuild, picking players under Sell these shops only those players, with offers from several teams.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach could say a manager "Would accept" while listing reasons they wouldn\'t, and could disagree with the Trade Analysis verdict below it. Managers now judge an offer from their own side (value plus what it does to their lineup and timeline), never accept what the Trade Analysis says they should decline, and each response splits into what they like and what gives them pause, with which side wins.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Trade Coach lists no longer come back empty when nobody would sell at a Fair price. They show the cheapest deals the other manager would take, clearly flagged as Lopsided against you, and never Unfair.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Trade Coach\'s "Get a player" could only show the player already in your trade. It now has a proper picker: every player in the league by value, searchable by name or team, with position filters.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Trade Coach: one button, one panel with five options. Negotiate a trade: the other manager answers in their own words ("I don\'t think the difference between Chase and Puka is worth my 1st"), and you can ask for something else instead: more value, a QB, RB, WR, or TE, youth, points now, picks, or players from one NFL team. Get a player, Fix a position, Rebuild, and Go all-in each list trades to choose from, best for you first, every one a trade the other manager would likely accept. Load any of them into the calculator in one click.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Negotiation coach: after every response, the site recommends your next move and explains why. Send it as is, accept their counter, counter back with the one change that gets you closer to even that they\'d still take, shop the same player to whichever team in the league would give you the most for them, or walk away. Every option is one click, and shopping opens a new negotiation with that team.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Negotiate: hit "Offer to [team]" and see how that manager would likely respond — accept, or decline with their reasons (value, needs, rebuild or contend timeline, roster spots, and their real trading style), what on your roster they\'d rather have, and a specific counter. Accept it, or edit it and counter back, round after round. It\'s a prediction, not the real manager — send real offers in Sleeper.' },
    { kind: 'new', page: 'Compare Players', text: 'Compare up to four players side by side: value over time on one chart (presets or your own date range), value and projection ranks, recent price moves, projected points and VORP in your scoring, and 70+ fantasy stats for a career, a season, or just the games you tap on (with a game-by-game log), per game or in totals. Stats cover fantasy production, consistency (top-12 and starter weeks, floor, ceiling), usage (snap share, target and carry share, red zone work), efficiency, big plays, touchdowns, and ball security — pick which ones show — and each is ranked against everyone at the position over the same games, shaded green to red. With two players on different teams in your league, one click opens the trade. Also reachable from any player card on Player Rankings.' },
    { kind: 'improved', page: 'Everywhere', text: 'The top bar now has two rows: your team, How We Grade, Patch Notes, and Switch League up top, and every page tab in a row underneath. On phones the tab row opens on the page you\'re on and the bar scrolls away instead of staying pinned.' },
    { kind: 'fixed', page: 'Home', text: 'The sign-in page no longer scrolls sideways on phones.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Share a trade: the Share button next to Reset copies a link (or opens your phone\'s share sheet). Whoever opens it sees the same teams, pieces, and verdict.' },
    { kind: 'new', page: 'Everywhere', text: 'Pick your team from the "Your team" menu at the top. The Trade Calculator and Team Analyzer open on it, and League Overview and Managers mark it with a You tag. If you sign in with your Sleeper username on the home page, it\'s picked for you.' },
    { kind: 'new', page: 'How We Grade', text: 'A new page explaining exactly how every grade is worked out: where the numbers come from, the Fair / Lopsided / Unfair cutoffs, the value + roster fit + timeline blend, VORP, playoff odds, and manager styles.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'On phones, the page no longer scrolls sideways once a trade is loaded.' },
    { kind: 'new', page: 'Managers', text: 'League at a glance: a table at the top with each manager\'s trading style (consolidator, depth builder, youth & picks buyer, win-now buyer, or value trader) and a one-line description of how their trades have gone.' },
    { kind: 'new', page: 'Trade Grades', text: 'Every player and pick now shows its KTC value on the day of the trade and today, with the change, plus a then-vs-now total for each side.' },
    { kind: 'new', page: 'Trade Grades', text: 'League Trade Summary has Net Then and Net Now columns: each manager\'s trade results at trade-day prices and at today\'s.' },
    { kind: 'fixed', page: 'League Overview', text: 'Projected records and playoff odds were skipping the week in progress from Thursday night until it went final. Every team now projects the full season.' },
    { kind: 'improved', page: 'Everywhere', text: 'Pages load much faster: each one used to download about 9 MB of data before showing anything, and now it\'s about 1 MB. A big difference on a phone.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'The fairness bars could show up a few seconds after everything else. The site\'s styling is now built ahead of time instead of in your browser, so they appear right away.' }
  ]},
  { date: '2026-09-24', items: [
    { kind: 'changed', page: 'Trade Calculator', text: 'The fairness grade now weighs KTC value (70%) with roster fit (15%) and timeline (15%). Three small bars under the main one show each piece. Fit can only make a grade worse than KTC alone, never better, so a deal that\'s lopsided on KTC never reads as fair.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Suggested Trades and Balance now look for 1-for-2 and 2-for-1 deals. Cards show the trade\'s shape and warn when someone would have to drop a player to fit it.' },
    { kind: 'changed', page: 'Trade Grades', text: 'Past trades are graded at KTC prices from the day they happened, not today\'s. A deal that was fair when it was made no longer reads as unfair because a player broke out later.' },
    { kind: 'fixed', page: 'Player Rankings', text: 'VORP was undervaluing QBs in superflex: RB and TE replacement level was set near 3 points per game. It now fills every lineup in the league properly (replacement is about 10 PPG for RB, WR, and TE).' },
    { kind: 'fixed', page: 'Team Analyzer', text: 'A team with strong playoff odds no longer shows "No window", and Flaws now lists the same positional needs as the Trade Calculator and trade-partner cards.' },
    { kind: 'fixed', page: 'Everywhere', text: 'Manager names showed as a bare "@". They now show each manager\'s Sleeper name.' },
    { kind: 'new', page: 'Trade Database', text: 'Each market trade shows its % off and Fair / Lopsided / Unfair grade using the same math as the calculator, plus how the whole market splits.' },
    { kind: 'improved', page: 'Managers', text: 'Managers with no trades are no longer ranked, and "consistently" only appears when most of a manager\'s deals actually go that way.' },
    { kind: 'fixed', page: 'Trade Calculator', text: 'Balance could throw out the piece you\'d already picked. It now always keeps your selection and adds to it when that gets the trade to fair.' },
    { kind: 'removed', page: 'Live Scores', text: 'The Live Scores page has been retired.' }
  ]},
  { date: '2026-09-22', items: [
    { kind: 'new', page: 'Trade Calculator', text: 'Five fairness tiers: Great, Good, Fair, Lopsided, and Unfair. Great and Good are fair trades that also fit one or both teams well, shown as violet and blue bands inside the green on the fairness bar.' },
    { kind: 'changed', page: 'Trade Calculator', text: 'Fair / Lopsided / Unfair is decided by KTC value, the number anyone can check on KeepTradeCut. Roster need is still shown, but it can\'t make a lopsided trade look fair.' },
    { kind: 'new', page: 'Trade Calculator', text: 'Warns when a trade would push a team over its active roster limit (taxi and IR spots don\'t count unless the incoming player qualifies).' },
    { kind: 'improved', page: 'Trade Calculator', text: 'One Balance button that adds to whichever side is underpaying, instead of two buttons that could replace your selection.' }
  ]},
  { date: '2026-09-21', items: [
    { kind: 'new', page: 'Trade Grades', text: 'Trade history now covers every past season of the league, not just this one.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'The fairness bar is centered: dead even in the middle, sliding toward whichever team the trade favors.' },
    { kind: 'improved', page: 'Everywhere', text: 'Colored position badges on every roster, lineup, and trade list.' },
    { kind: 'improved', page: 'Trade Calculator', text: 'Suggest a Trade pushes pick-for-pick swaps to the back instead of leading with them.' }
  ]},
  { date: '2026-09-19', items: [
    { kind: 'new', page: 'Trade Calculator', text: '"Who\'s offering" toggle: pick which team is proposing, and the verdict becomes a plain accept-or-decline recommendation for the other side.' },
    { kind: 'improved', page: 'League Overview', text: 'Column bars use a red-to-green scale based on where each team actually ranks.' }
  ]}
];

const KIND = {
  new: ['New', 'bg-emerald-500/10 text-emerald-300 border-emerald-500/25'],
  improved: ['Improved', 'bg-sky-500/10 text-sky-300 border-sky-500/25'],
  fixed: ['Fixed', 'bg-amber-500/10 text-amber-300 border-amber-500/25'],
  changed: ['Changed', 'bg-violet-500/10 text-violet-300 border-violet-500/25'],
  removed: ['Removed', 'bg-white/5 text-zinc-400 border-white/10']
};

// "New since your last visit" is per-browser only — a convenience, not state
// anyone else needs. Storage can be blocked (private windows), so every access
// is guarded and the page renders the same without it.
const SEEN_KEY = 'vault_patch_notes_seen';
let lastSeen = null;
try { lastSeen = localStorage.getItem(SEEN_KEY); } catch {}
try { localStorage.setItem(SEEN_KEY, NOTES[0].date); } catch {}

let pageFilter = 'All';
const pages = ['All', ...new Set(NOTES.flatMap(d => d.items.map(i => i.page)))];

function fmtDate(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  document.getElementById('filters').innerHTML = pages.map(p =>
    `<button onclick="setPage('${p}')" class="text-[12px] px-2.5 py-1 rounded-lg border transition-colors ${pageFilter === p ? 'bg-white/[0.08] border-white/25 text-white' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${p}</button>`
  ).join('');

  const days = NOTES.map(d => ({ ...d, items: d.items.filter(i => pageFilter === 'All' || i.page === pageFilter) })).filter(d => d.items.length);
  document.getElementById('notes').innerHTML = days.map(d => {
    const fresh = lastSeen && d.date > lastSeen;
    return `<section class="card rounded-vault-sm p-5">
      <div class="flex items-center gap-2 mb-3">
        <h2 class="text-[14px] font-semibold text-zinc-100">${fmtDate(d.date)}</h2>
        ${fresh ? '<span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-400 text-black font-semibold">New since your last visit</span>' : ''}
      </div>
      <ul class="space-y-2.5">
        ${d.items.map(i => `<li class="flex gap-3 items-start">
          <span class="shrink-0 w-[74px] text-center text-[11px] px-1.5 py-0.5 rounded border ${KIND[i.kind][1]}">${KIND[i.kind][0]}</span>
          <div class="text-[13px] leading-relaxed text-zinc-300"><span class="text-zinc-100 font-medium">${i.page}</span> · ${i.text}</div>
        </li>`).join('')}
      </ul>
    </section>`;
  }).join('');

  const total = NOTES.reduce((s, d) => s + d.items.length, 0);
  document.getElementById('status').textContent = `${total} changes · last updated ${fmtDate(NOTES[0].date)}`;
}

function setPage(p) { pageFilter = p; render(); }
render();
</script>
</body>
</html>
