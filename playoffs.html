<script src="vault-core.js?v=4b5b682d"></script>

<script>
/* ============================================================
   PLAYOFF RACE
   What every team needs to clinch, or to stay alive, for the
   playoffs and for byes, in any Sleeper league, from live standings
   and the league's own settings (playoff teams, median game, weeks
   left). Shown as one plain status per team; tap for the details.
   The math is the standard magic number: a team's wins plus losses
   by the rivals it has to finish ahead of. Ties on record are taken
   to go to points for (Sleeper's default) only where a line says so.
   ============================================================ */
const esc = s => Vault.escapeHtml(String(s ?? ''));
const get = url => fetch(url).then(r => (r.ok ? r.json() : null)).catch(() => null);
const $ = id => document.getElementById(id);
const rec = t => `${t.wins}-${t.losses}${t.ties ? '-' + t.ties : ''}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const names = (list, many = 'the teams chasing them') => list.length > 3 ? many : list.length <= 1 ? list.join('') : list.slice(0, -1).join(', ') + ' or ' + list[list.length - 1];

let S = null;

// Games X still needs (own wins + Y's losses) so Y can't finish ahead.
// Strict: X clears Y outright. On points: X ends level and wins on points for.
function lockNeed(X, Y, G) {
  const gap = Y.w + G - X.w;
  if (gap < 0) return { strict: 0, onPoints: 0 };
  const strict = Math.floor(gap) + 1;
  const tieable = Number.isInteger(gap);
  return { strict, onPoints: tieable && X.pf > Y.pf ? strict - 1 : strict };
}
// The k-th easiest lock-out among the other teams: lock out k teams and the spot is yours.
function kth(arr, k) {
  if (k <= 0) return 0;
  const s = [...arr].sort((a, b) => a - b);
  return k <= s.length ? s[k - 1] : Infinity;
}
function clinchNum(X, teams, spots, G, key) {
  const others = teams.filter(t => t !== X);
  return kth(others.map(Y => lockNeed(X, Y, G)[key]), teams.length - spots);
}
// Bad results (X's losses + Y's wins) before Y is sure to finish ahead of X.
// X is out once `spots` teams are sure to.
function elimNum(X, teams, spots, G, key) {
  const others = teams.filter(t => t !== X);
  return kth(others.map(Y => lockNeed(Y, X, G)[key]), spots);
}

function byeCount(P, N) {
  if (P <= 1 || P >= N) return 0;
  let b = 1;
  while (b < P) b *= 2;
  return b - P;
}

// Every way next week's games can go (head-to-head winner, plus the median game
// where the league plays one, with exactly half the league winning it). For each
// team: can it clinch, or be knocked out, of the playoffs and the bye this week?
// Ties on record go to today's points for, like the rest of the page.
function weekPossibilities(teams, pairs, { N, P, B, G, gpw }) {
  const out = new Map(teams.map(t => [t.rid, { pc: false, pe: false, bc: false, be: false }]));
  const idx = new Map(teams.map((t, i) => [t.rid, i]));
  const games = pairs.map(([a, b]) => [idx.get(a), idx.get(b)]).filter(([a, b]) => a != null && b != null);
  if (!games.length || games.length > 8) return null;
  const opts = gpw === 2 ? [[1, 1], [1, 0], [0, 0]] : [[0, 0]]; // [winner's median, loser's median]
  const G2 = G - gpw, base = teams.map(t => t.w), w = base.slice(), pf = teams.map(t => t.pf);
  const half = Math.floor(N / 2);
  const check = () => {
    const mx = w.map(x => x + G2);
    for (let i = 0; i < N; i++) {
      const o = out.get(teams[i].rid);
      let below = 0, above = 0; // others sure to finish below / above team i
      for (let j = 0; j < N; j++) {
        if (j === i) continue;
        if (mx[j] < w[i] || (mx[j] === w[i] && pf[j] < pf[i])) below++;
        if (w[j] > mx[i] || (w[j] === mx[i] && pf[j] > pf[i])) above++;
      }
      if (below >= N - P) o.pc = true;
      if (above >= P) o.pe = true;
      if (B) { if (below >= N - B) o.bc = true; if (above >= B) o.be = true; }
    }
  };
  (function go(k, med) {
    if (k === games.length) { if (gpw === 1 || med === half || games.length * 2 !== N) check(); return; }
    const [a, b] = games[k];
    for (const [win, lose] of [[a, b], [b, a]]) {
      for (const [mw, ml] of opts) {
        w[win] += 1 + mw; w[lose] += ml;
        go(k + 1, med + mw + ml);
        w[win] -= 1 + mw; w[lose] -= ml;
      }
    }
  })(0, 0);
  return out;
}

async function load() {
  const lid = Vault.getLeagueId();
  if (!lid) return;
  const [league, users, rosters] = await Promise.all([
    get(`https://api.sleeper.app/v1/league/${lid}`),
    get(`https://api.sleeper.app/v1/league/${lid}/users`),
    get(`https://api.sleeper.app/v1/league/${lid}/rosters`)
  ]);
  if (!league || !rosters?.length) {
    $('status').textContent = "Couldn't load this league from Sleeper. Check your connection and reload.";
    return;
  }
  const st = league.settings || {};
  const gpw = st.league_average_match ? 2 : 1;
  const N = rosters.length;
  const P = Math.min(st.playoff_teams || 6, N);
  const B = byeCount(P, N);
  const regEnd = (st.playoff_week_start || 15) - 1;
  const userBy = new Map((users || []).map(u => [u.user_id, u]));

  const teams = rosters.map(r => {
    const s = r.settings || {};
    const u = userBy.get(r.owner_id) || {};
    const wins = s.wins || 0, losses = s.losses || 0, ties = s.ties || 0;
    return {
      rid: r.roster_id, ownerId: r.owner_id,
      name: Vault.teamLabel(u, r.roster_id),
      mgr: u.display_name || '',
      avatar: u.metadata?.avatar || (u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : ''),
      wins, losses, ties, w: wins + ties / 2,
      pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100
    };
  });
  const played = Math.max(0, ...teams.map(t => t.wins + t.losses + t.ties));
  const weeksDone = Math.round(played / gpw);
  const weeksLeft = Math.max(0, regEnd - weeksDone);
  const G = weeksLeft * gpw;
  teams.forEach(t => { t.max = t.w + G; });
  teams.sort((a, b) => b.w - a.w || b.pf - a.pf);
  teams.forEach((t, i) => { t.rank = i + 1; });

  teams.forEach(t => {
    // Shown numbers count ties on record as going to points for (today's totals);
    // the strict ones (no tiebreaker) only say when a spot rests on points for.
    t.pcs = clinchNum(t, teams, P, G, 'strict');
    t.pc = clinchNum(t, teams, P, G, 'onPoints');
    t.pes = elimNum(t, teams, P, G, 'strict');
    t.pe = elimNum(t, teams, P, G, 'onPoints');
    if (B) {
      t.bcs = clinchNum(t, teams, B, G, 'strict');
      t.bc = clinchNum(t, teams, B, G, 'onPoints');
      t.be = elimNum(t, teams, B, G, 'onPoints');
    }
  });

  const schedule = weeksLeft ? await Vault.fetchRemainingSchedule(lid, league, weeksDone) : [];
  S = { league, teams, N, P, B, G, gpw, weeksDone, weeksLeft, regEnd, schedule, divisions: st.divisions || 0 };
  S.thisWeek = schedule[0] && schedule[0].week === weeksDone + 1 ? weekPossibilities(teams, schedule[0].pairs, { N, P, B, G, gpw }) : null;

  const mine = Vault.myTeam(teams.map(t => ({ ...t, rosterId: t.rid })), lid);
  S.mine = mine ? mine.rid : null;
  S.open = new Set();
  render();
  Vault.buildLeagueTeams(league.league_id).then(({ teams: built }) => {
    S.odds = new Map(built.filter(t => t.playoffPct != null).map(t => [t.rosterId, { playoffs: t.playoffPct, title: t.championshipPct ?? t.projected?.championshipPct ?? 0 }]));
    render();
  }).catch(() => {}); // the race reads fine without them
}

/* ---------- plain-language status ---------- */
// The rivals still to shake off for a spot: the easiest `k` lock-outs not done yet.
function chasers(X, spots) {
  const k = S.N - spots;
  return S.teams.filter(t => t !== X).map(Y => ({ Y, n: lockNeed(X, Y, S.G).onPoints }))
    .sort((a, b) => a.n - b.n).slice(0, k).filter(r => r.n > 0).map(r => esc(r.Y.name));
}
// The teams `X` has to catch to get into the top `spots`.
function above(X, spots) {
  return S.teams.filter(t => t !== X && t.rank <= spots).sort((a, b) => a.w - b.w).slice(0, 2).map(t => esc(t.name));
}
// The one line under each team: what it needs, in words.
function needLine(t) {
  const { P, B, G } = S;
  if (t.pc === 0) return `<span class="ok">${B && t.bc === 0 ? 'Clinched a playoff spot and a bye' : 'Clinched a playoff spot'}${t.pcs ? ' (on points for)' : ''}</span>`;
  if (t.pe === 0) return `<span class="no">Eliminated${t.pes ? ' (on points for)' : ''}</span>`;
  if (t.rank <= P) return t.pc > G ? `Can't clinch yet: needs other teams to lose` : `Needs <b>${plural(t.pc, 'more win')}</b> to clinch`;
  return `Out after <b>${t.pe} more ${t.pe === 1 ? "loss" : "losses"}</b>`;
}
// The second line: how the count can go down besides the team's own results.
function howLine(t) {
  const { P, G } = S;
  if (t.pc === 0 || t.pe === 0) return '';
  if (t.rank <= P) {
    const k = S.N - P;
    const rs = S.teams.filter(x => x !== t).map(Y => ({ Y, n: lockNeed(t, Y, G).onPoints })).sort((x, y) => x.n - y.n).slice(0, k).filter(x => x.n > 0);
    if (!rs.length) return '';
    const who = rs.length > 3 && rs.every(x => x.Y.rank > P) ? 'any team below the playoff line' : names(rs.map(x => esc(x.Y.name)), 'the teams chasing them');
    return t.pc > G ? `Needs ${who} to lose some` : `Each loss by ${who} counts too`;
  }
  const a = above(t, P);
  return a.length ? `Each win by ${names(a)} counts too` : '';
}
function playoffText(t, you) {
  const { P, G, gpw, teams } = S;
  const who = you ? 'You' : esc(t.name);
  if (t.pc === 0) return t.pcs ? `<b>${who} clinched a playoff spot on points for.</b> Every team that could still tie ${you ? 'you' : 'them'} on record is behind on points for; ${plural(t.pcs, 'more win')} makes it certain.` : `<b>${who} clinched a playoff spot.</b>`;
  if (t.pe === 0) return `<b>${who} ${you ? 'are' : 'is'} out of the playoffs.</b>`;
  if (t.rank <= P) {
    const rivals = chasers(t, P);
    const extra = t.pcs > t.pc ? ` That counts on winning a tie on points for; without it, ${t.pcs}.` : '';
    if (t.pc > G) return `<b>Can't clinch alone yet.</b> Even winning all ${G} games left, ${you ? 'you need' : 'they need'} ${names(rivals, you ? 'the teams chasing you' : undefined)} to lose some too.`;
    return `<b>${plural(t.pc, 'more win')} clinches a playoff spot.</b> Every loss by ${names(rivals, you ? 'the teams chasing you' : undefined)} also counts as one.${extra}`;
  }
  const cut = teams.find(x => x.rank === P);
  const gap = cut ? cut.w - t.w : 0;
  return `<b>${gap > 0 ? `${plural(gap, 'game')} behind the playoff line` : 'Level with the playoff line'}</b> (${esc(cut?.name || '')}, ${cut ? rec(cut) : ''}). Out after ${plural(t.pe, 'more bad result')}: ${you ? 'your' : 'their'} losses, or wins by ${names(above(t, P))}.`;
}
function byeText(t, you) {
  const { B, G } = S;
  if (!B) return '';
  if (t.bc === 0) return `<b>Bye clinched.</b>`;
  if (t.be === 0) return t.pe === 0 ? '' : `Out of the bye race.`;
  if (t.rank <= B) {
    const rivals = chasers(t, B);
    return t.bc > G
      ? `In a bye spot now. Locking it up needs ${names(rivals, you ? 'the teams chasing you' : undefined)} to lose some games, since ${t.bc} is more than the ${G} left.`
      : `In a bye spot now. ${plural(t.bc, 'more win')} locks it up, with losses by ${names(rivals, you ? 'the teams chasing you' : undefined)} counting too.`;
  }
  const cut = S.teams.find(x => x.rank === B);
  const gap = cut ? cut.w - t.w : 0;
  return `${gap > 0 ? `${plural(gap, 'game')} out of a bye` : 'Level with the last bye spot'}, held by ${esc(cut?.name || '')}.`;
}
// Points for decides ties on record: where this team stands against the teams it could tie.
function pointsText(t) {
  const { teams, gpw } = S;
  const byPf = [...teams].sort((a, b) => b.pf - a.pf);
  const pfRank = byPf.indexOf(t) + 1;
  const near = teams.filter(x => x !== t && Math.abs(x.w - t.w) <= 2 * gpw)
    .sort((a, b) => Math.abs(a.w - t.w) - Math.abs(b.w - t.w) || a.rank - b.rank).slice(0, 3);
  const bits = near.map(x => {
    const d = t.pf - x.pf;
    return `${d >= 0 ? 'ahead of' : 'behind'} ${esc(x.name)} by ${Math.abs(d).toFixed(1)}`;
  });
  return `<b>Points for: ${t.pf.toFixed(1)}</b>, ${ordinal(pfRank)} in the league.${bits.length ? ` Against the teams close on record (ties go to points for): ${bits.join(', ')}.` : ''}`;
}
function nextGame(t) {
  const w = S.schedule[0];
  const p = w && w.pairs.find(pr => pr.includes(t.rid));
  if (!p) return '';
  const opp = S.teams.find(x => x.rid === (p[0] === t.rid ? p[1] : p[0]));
  return opp ? `Week ${w.week}: vs ${esc(opp.name)} (${rec(opp)}, ${ordinal(opp.rank)}).` : '';
}

function render() {
  const { league, teams, N, P, B, G, gpw, weeksLeft } = S;
  $('status').innerHTML = `${esc(league.name || 'Your league')} · <a href="${esc(Vault.pickLeagueLink())}">Pick another league</a>`;
  $('rules').innerHTML = weeksLeft
    ? `Top <b>${P}</b> make the playoffs${B ? ` and the top <b>${B}</b> get a bye` : ''}. <b>${plural(weeksLeft, 'week')}</b> left${gpw === 2 ? `, two games a week counting the median, so <b>${G} games</b> each` : ''}.`
    : `The regular season is over. Top <b>${P}</b> made the playoffs${B ? `, top <b>${B}</b> got byes` : ''}.`;

  const me = teams.find(t => t.rid === S.mine);
  $('you').hidden = !me;
  if (me) {
    const lead = me.pc === 0 ? `You're in. ${me.bc === 0 ? 'Bye locked up too.' : ''}`
      : me.pe === 0 ? `You're out of the playoffs.`
      : me.rank <= P ? (me.pc > G ? `You're ${ordinal(me.rank)}, but can't clinch on your own yet.` : `You're ${ordinal(me.rank)}, ${plural(me.pc, 'win')} from clinching.`)
      : `You're ${ordinal(me.rank)}, outside the playoff line.`;
    $('you').innerHTML = `<div class="lead">${lead}</div><p>${playoffText(me, true)}</p>${byeText(me, true) ? `<p>${byeText(me, true)}</p>` : ''}<p>${pointsText(me)}</p>${nextGame(me) ? `<p>${nextGame(me)}</p>` : ''}`;
  }

  const rows = [];
  // Everyone's odds at a glance (user, 2026-11-05), the same numbers as League Overview. They
  // arrive after the page: a slow simulation never holds up the race itself.
  const oddsBar = t => {
    const o = S.odds?.get(t.rid);
    if (!o) return '';
    const pct = v => (v > 0 && v < 1 ? '<1' : v > 99 && v < 100 ? '>99' : Math.round(v)) + '%';
    return `<div class="pr-odds"><span class="bar"><i style="width:${Math.min(100, o.playoffs)}%"></i></span><span>${pct(o.playoffs)} playoffs · ${pct(o.title)} title</span></div>`;
  };
  teams.forEach(t => {
    const wk = S.thisWeek?.get(t.rid);
    const wkTxt = wk?.pc ? '<div class="wk">Can clinch this week</div>' : wk?.pe ? '<div class="wk">Can be out this week</div>' : '';
    const initial = esc((t.name.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase());
    const av = t.avatar ? `<img class="pr-av" src="${esc(t.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'pr-av',textContent:'${initial}'}))">` : `<div class="pr-av">${initial}</div>`;
    const byeTag = B && t.rank <= B && t.pe !== 0 ? `<span class="tagbye">${t.bc === 0 ? 'BYE ✓' : 'BYE'}</span>` : '';
    rows.push(`<button type="button" class="pr-row ${t.rid === S.mine ? 'me' : ''}" data-rid="${t.rid}" aria-expanded="${S.open.has(t.rid)}">
      <span class="pr-rank">${t.rank}</span>${av}
      <span class="pr-name"><div class="t"><span>${esc(t.name)}</span>${byeTag}</div><div class="need">${needLine(t)}</div>${howLine(t) ? `<div class="how">${howLine(t)}</div>` : ''}${wkTxt}${oddsBar(t)}</span>
      <span class="pr-rec">${rec(t)}<small>${t.pf.toFixed(1)} PF</small></span>
    </button>`);
    if (S.open.has(t.rid)) {
      const bt = byeText(t, false), ng = nextGame(t);
      rows.push(`<div class="pr-detail"><p>${playoffText(t, false)}</p>${bt ? `<p>${bt}</p>` : ''}<p>${pointsText(t)}</p>${ng ? `<p>${ng}</p>` : ''}</div>`);
    }
    if (B && t.rank === B && B < P) rows.push(`<div class="pr-line dash">Bye line</div>`);
    if (t.rank === P && P < N) rows.push(`<div class="pr-line">Playoff line</div>`);
  });
  $('list').innerHTML = rows.join('');

  // This week: only the games that move a race.
  const next = S.schedule[0];
  const big = [];
  if (next) {
    const byId = new Map(teams.map(t => [t.rid, t]));
    // Close to a line: still alive in that race and within a week and a bit of it.
    const lineAt = k => { const x = teams.find(t => t.rank === k), y = teams.find(t => t.rank === k + 1); return x && y ? (x.w + y.w) / 2 : null; };
    const lines = { po: lineAt(P), bye: B ? lineAt(B) : null };
    const bubble = (t, r) => lines[r] != null && (r === 'po' ? t.pc !== 0 && t.pe !== 0 : t.bc !== 0 && t.be !== 0) && Math.abs(t.w - lines[r]) <= gpw + 1;
    next.pairs.forEach(([a, b]) => {
      const A = byId.get(a), Bt = byId.get(b);
      if (!A || !Bt) return;
      const [hi, lo] = A.rank < Bt.rank ? [A, Bt] : [Bt, A];
      let why = '';
      if (B && bubble(hi, 'bye') && bubble(lo, 'bye')) why = 'Bye race';
      else if (bubble(hi, 'po') && bubble(lo, 'po')) why = 'Playoff line';
      if (a === S.mine || b === S.mine) why = why ? `Your game · ${why}` : 'Your game';
      if (why) big.push({ why, hi, lo, mine: a === S.mine || b === S.mine });
    });
    big.sort((x, y) => y.mine - x.mine || x.hi.rank - y.hi.rank);
  }
  $('weekSec').hidden = !big.length;
  if (big.length) {
    $('weekTitle').innerHTML = `Week ${next.week}: games that matter${Vault.info('bigGames')}`;
    $('week').innerHTML = big.map(g => `<div class="card pr-game"><div class="why">${g.why}</div>${esc(g.hi.name)} <span class="rec">${rec(g.hi)}</span> vs ${esc(g.lo.name)} <span class="rec">${rec(g.lo)}</span></div>`).join('');
  }

  $('foot').innerHTML = `<b>How the counts work:</b> "Needs 3 more wins" assumes the teams chasing them win out. Every loss by one of those teams takes one off, so 2 wins plus a rival's loss does it too.${gpw === 2 ? ' The median game counts as a win or loss like any other.' : ''} "Out after 6 more losses" works the same way: wins by the teams above them count too. Ties on record go to points for, so every count here uses today's points for; a team that's behind on points for needs one more. Points for moves every week, so a close one can flip.`;
  $('prBody').hidden = false;
}

$('list').addEventListener('click', e => {
  const row = e.target.closest('.pr-row');
  if (!row) return;
  const rid = Number(row.dataset.rid);
  S.open.has(rid) ? S.open.delete(rid) : S.open.add(rid);
  render();
});

load().catch(() => { $('status').textContent = "Couldn't load this league from Sleeper. Check your connection and reload."; });
</script>
</body>
</html>
