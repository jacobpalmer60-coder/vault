<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="brand/vault-dial-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="brand/vault-dial-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/vault-dial-180.png">
<title>Trade Grades — The Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css?v=655a9195">

</head>
<body class="text-zinc-100 antialiased">
<div class="vault-bg"></div>

<div id="vault-nav"></div>

<div class="max-w-[1100px] mx-auto px-4 sm:px-6 py-8 lg:py-10" data-league-required>
  <div class="mb-2">
    <h1 class="display text-[28px] font-semibold gold-text">Trade Grades</h1>
    <p id="status" class="text-[13px] text-zinc-400 mt-1">Loading league…</p>
  </div>
  <p class="text-[13px] text-zinc-400 max-w-[720px] mb-6 leading-relaxed">
    Every completed trade in your league, graded on trade value from the day it happened (KTC values, combined the way real trades combine them), then read again at today's values and at what managers actually pay.
    <a id="methodLink" href="how_we_grade.html#grades" class="text-zinc-300 hover:text-white underline underline-offset-2 decoration-white/20">How grading works</a>
  </p>

  <div class="flex items-center justify-between gap-3 flex-wrap mb-5">
    <div id="posFilter" class="flex gap-1.5 flex-wrap"></div>
    <div class="flex items-center gap-1.5">
      <span class="text-[11px] text-zinc-400 uppercase tracking-wider mr-1">Sort</span>
      <div id="sortToggle" class="flex gap-1.5"></div>
    </div>
  </div>

  <div id="teamFilterBar" class="hidden mb-4"></div>
  <div id="list" class="space-y-4"></div>
  <div id="empty" class="hidden text-center text-[13px] text-zinc-400 py-16"></div>
</div>

<script src="vault-core.js?v=53c92135"></script>
<script src="vault-nav.js?v=7ea8e4f2"></script>
<script src="market-data.js?v=fb0369eb"></script>
<script>
const TONE = { good: 'text-emerald-400', bad: 'text-rose-400', neutral: 'text-zinc-300' };
const TONE_DOT = { good: 'bg-emerald-400', bad: 'bg-rose-400', neutral: 'bg-zinc-400' };
// g.verdict.tone (Vault.historyVerdict) isn't quite as clean-cut as trade.html's
// overallVerdict (its 'good' can fire anywhere below LOPSIDED_PCT, not just under
// FAIR_PCT — a pre-existing quirk in historyVerdict's own gating, not introduced
// here), so these check g.bucket explicitly rather than assuming tone alone
// implies Great — same helpers/reasoning as trade.html's verdictColor/verdictDot.
// Every grade wears its own color (Vault.BUCKET_STYLE), the same everywhere.
function verdictColor(tone, bucket) { return (Vault.BUCKET_STYLE[bucket] || Vault.BUCKET_STYLE.Fair).text; }
function verdictDot(tone, bucket) { return (Vault.BUCKET_STYLE[bucket] || Vault.BUCKET_STYLE.Fair).dot; }
const FAIR_FILTERS = ['All', 'Great', 'Good', 'Fair', 'Lopsided', 'Unfair'];
const SORTS = { recent: 'Most Recent', lopsided: 'Most Lopsided' };

let allGraded = [];
// For the This season lines: today's league and remaining schedule.
let ctx = null;
let fairFilter = 'All';
let sortKey = 'recent';

// Vault.fairnessBucket is the shared five-tier read (Great/Good/Fair/Lopsided/
// Unfair) — see its comment in vault-core.js for why Great/Good can only ever
// promote a Fair trade, never rescue a Lopsided/Unfair one.
function fairBucket(pctDiff, fitA, fitB) {
  return Vault.fairnessBucket(pctDiff, fitA, fitB);
}
// Great/Good each get their own hue (violet/blue), not shades of green — see
// bucketColor's comment in trade.html for why.
function fairColor(bucket) { return (Vault.BUCKET_STYLE[bucket] || Vault.BUCKET_STYLE.Fair).text; }

const todayGrade = g => Vault.todayGrade(g);
/* The same trade at what the pieces actually go for: today's grade with its
   value part repriced at market (market-data.js marketEdge on today's values,
   KTC's consolidation adjustment held), roster fit and timeline as in Today.
   Only once market prices load, and only when the market moves it at least a
   point (pieces without enough completed trades stay at KTC). */
function marketGrade(g) {
  const tg = Vault.todayGrade(g);
  if (!tg || !ctx || !Market.data || Market.data.failed || !g.toAToday?.length || !g.toBToday?.length) return null;
  const mk = marketEdge(ctx.league, g.toBToday, g.toAToday); // team A's side: sent toB, got toA
  const delta = mk.market - mk.ktc;                           // + = better for team A at market
  if (Math.abs(delta) < 1) return null;
  const w = VAULT_CONFIG.FAIRNESS_WEIGHTS, cap = VAULT_CONFIG.FAIRNESS_FACTOR_CAP, clamp = x => Math.max(-cap, Math.min(cap, x));
  const v = g.todaySignedPctDiff - delta;                     // + favors team B, like todaySignedPctDiff
  const blend = (w.value * clamp(v) + w.roster * clamp(g.fairness.roster) + w.timeline * clamp(g.fairness.timeline)) / 100;
  const signed = Math.abs(blend) > Math.abs(v) ? blend : v;
  return { signed, bucket: Vault.fairnessBucket(Math.abs(signed), g.combinedFitA, g.combinedFitB) };
}
// Like the calculator: when roster fit and timeline moved the grade past trade
// value, say what trade value alone reads ("trade value alone: 3% over").
function valueAloneText(g) {
  if (!g.fairness.fitMovedIt) return '';
  const t = Vault.tradeSideValues(g.toB, g.toA), v = (t.valueB - t.valueA) / (((t.valueA + t.valueB) / 2) || 1) * 100; // + = team A got more
  if (Math.abs(Math.abs(v) - g.fairness.overallPct) < 2) return ''; // barely moved: not worth a line
  const said = Math.abs(v) < 1 ? 'even' : `${capPct(Math.abs(v)).toFixed(0)}% ${v > 0 ? 'under' : 'over'}`;
  return `<div class="text-[11px] text-zinc-500 mt-1.5">Roster fit and timeline included; trade value alone: ${said}.</div>`;
}
// One read of the trade as what team A paid: "21% under" with "trade value then · Lopsided" underneath.
function priceRead(label, bucket, signed) {
  const a = -signed, even = Math.abs(a) < 1;
  return `<div class="min-w-0"><div class="num text-[22px] sm:text-[26px] whitespace-nowrap text-zinc-100">${even ? 'Even' : `${capPct(Math.abs(a)).toFixed(0)}% ${a > 0 ? 'under' : 'over'}`}</div>
    <div class="text-[11px] mt-1.5 leading-snug"><span class="text-zinc-500">${label}</span> <span class="text-zinc-600">·</span> <span class="${(Vault.BUCKET_STYLE[bucket] || Vault.BUCKET_STYLE.Fair).text}">${bucket}</span></div></div>`;
}
// "% off" is a ratio against the average side value, not a bounded percentage — it
// can mathematically clear 100 for a real one-sided "gift" trade. Display-only cap
// (bucket comparisons above still use the real number) so that reads as "100% off"
// instead of a figure that looks like a bug.
// Floored, not rounded: the Fair/Lopsided/Unfair cutoffs are whole numbers, so a
// 13.96%-off trade (Fair) must never display as "14%" (the Lopsided cutoff).
function capPct(pct) { return Math.sign(pct) * Math.floor(Math.min(100, Math.abs(pct))); }
// Same fairness bar as the Trade Calculator — lives in Vault.fairnessBarHtml.
const fairnessBarHtml = (signedPct, bandPct) => Vault.fairnessBarHtml(signedPct, bandPct);

// Which prices graded this trade, and how the same trade reads at today's prices.
function agedText(g) {
  return g.valuedAt !== 'trade' ? 'Graded at today’s prices (no price history that far back for every piece)' : '';
}

// Same ± band as the Trade Calculator (Vault.tradeConfidenceBand, computed in
// Vault.gradeTrade) — silent when there's not enough price history to say anything,
// a plain "±Xpp" when it wouldn't have changed the verdict, a fuller callout when
// the trade's actual bucket at the time could plausibly have read differently.
function confidenceBandText(g) {
  if (!g.bandPct || g.bandPct < 1) return '';
  const lo = Math.max(0, g.fairness.overallPct - g.bandPct), hi = g.fairness.overallPct + g.bandPct;
  const bucketLo = fairBucket(lo, g.combinedFitA, g.combinedFitB), bucketHi = fairBucket(hi, g.combinedFitA, g.combinedFitB);
  const text = bucketLo === bucketHi
    ? `±${g.bandPct.toFixed(0)}pp based on price swings in the less-established pieces here`
    : `±${g.bandPct.toFixed(0)}pp — could have read anywhere from ${bucketLo} to ${bucketHi} depending on how the rookies/far-future picks here were valued at the time`;
  return `<div class="text-[11px] text-zinc-400 mt-0.5">${text}</div>`;
}
// The synopsis headline gets a bolder version of the same tiers — Lopsided reads as
// an actual warning (red) here, unlike the muted badge above which intentionally
// dials it back so the page isn't drenched in red on a page full of real trades.
function synopsisColor(bucket) { return (Vault.BUCKET_STYLE[bucket] || Vault.BUCKET_STYLE.Fair).text; }

// resolveAssets/gradeTrade/historyVerdict now live in vault-core.js as
// Vault.resolveTradeAssets/Vault.gradeTrade/Vault.historyVerdict — shared with the
// Manager page so both grade the exact same real trades the exact same way.

// Same colored position pill Player Rankings/Trade Calculator use (vault.css's
// .pos-badge-*) — a bare player name with no position shown means a reader can't
// tell what they're looking at without already knowing the league's rosters.
const POS_BADGE = pos => `pos-badge-${['QB', 'RB', 'WR', 'TE'].includes(pos) ? pos : 'default'}`;
// Signed, comma-grouped change with a color: green up, red down, grey flat.
function deltaHtml(d) {
  const r = Math.round(d);
  const color = r > 0 ? 'text-emerald-400' : r < 0 ? 'text-rose-400' : 'text-zinc-400';
  return `<span class="${color}">${Vault.signed(r)}</span>`;
}

// Each asset's KTC price on the trade date and today (when the trade was
// graded at trade-date prices — see Vault.priceAtTradeDate), so a manager can
// see exactly which pieces rose or fell since.
function assetChips(list) {
  if (!list.length) return '<span class="text-zinc-400">Nothing</span>';
  return list.map(a => {
    const then = a.value > 0 ? Math.round(a.value).toLocaleString() : '—';
    const price = a.valueToday != null
      ? `${then} → ${Math.round(a.valueToday).toLocaleString()} <span class="text-[12px]">${deltaHtml(a.valueToday - a.value)}</span>`
      : then;
    return `<span class="inline-flex items-center gap-1.5 mr-3 mb-1">${a.pos && a.pos !== 'PICK' ? `<span class="inline-flex items-center px-1.5 py-px rounded text-[11px] font-semibold border ${POS_BADGE(a.pos)}">${a.pos}</span>` : ''}<span class="text-zinc-200">${Vault.escapeHtml(a.name)}</span><span class="text-zinc-400 text-[12px] mono">${price}</span></span>`;
  }).join('');
}

// One side's haul, summed at the trade-date price and today's price (plain KTC
// sums, no consolidation adjustment, so the numbers match the chips above).
// Acceptable vs fair (Vault.acceptability): how often accepted trades like this
// one were at least this lopsided on trade value at the time. Not the grade.
// Team A sent toB and got toA; priced at the trade's own values against what
// managers pay for these players now (marketAcceptable). Not the grade.
const gradeAccept = g => g.toA.length && g.toB.length && !g.anyMissingValue && ctx ? marketAcceptable(ctx.league, g.toB, g.toA) : null;
const acceptLine = g => marketAcceptHtml(gradeAccept(g), g.teamA.teamName, g.teamB.teamName, 'mt-2.5');

function sideValueLine(list) {
  if (!list.length || list.some(a => a.valueToday == null)) return '';
  const then = list.reduce((s, a) => s + a.value, 0), now = list.reduce((s, a) => s + a.valueToday, 0);
  return `<div class="text-[12px] text-zinc-400 mt-1.5 mono">Worth ${Math.round(then).toLocaleString()} then → ${Math.round(now).toLocaleString()} now (${deltaHtml(now - then)})</div>`;
}

function optDeltaHtml(dOpt) {
  if (Math.abs(dOpt) <= 0.05) return '';
  const color = dOpt > 0 ? 'text-emerald-400/80' : 'text-rose-400/80';
  return ` · Opt PPG <span class="${color}">${Vault.signed(dOpt, x => x.toFixed(1))}</span>`;
}

function vorpDeltaHtml(dVorp) {
  if (!Number.isFinite(dVorp) || Math.abs(dVorp) <= 0.05) return '';
  const color = dVorp > 0 ? 'text-emerald-400/80' : 'text-rose-400/80';
  return ` · VORP <span class="${color}" title="Real, scarcity-adjusted edge over replacement — see the VORP column on Player Rankings">${Vault.signed(dVorp, x => x.toFixed(1))}</span>`;
}

/* This season: what the trade is doing for each team's playoff and title odds
   right now. Undoes the trade on today's rosters (Vault.simulateTrade, sending each
   side's pieces back) and re-runs the season simulation on the same seeded games
   as the baseline, so the gap is the trade. Only this season's trades, only while
   regular-season games remain, and only when every player involved is still on
   the team that got him (otherwise "without this trade" isn't well defined). */
const SEASON_TRIALS = 4000, SEASON_SEED = 20260929;
let seasonBase = null;
const seasonMemo = new Map();
function seasonEffect(g) {
  if (!ctx || !ctx.remainingWeeks.length || String(g.tx.season) !== String(ctx.league.season)) return null;
  if (seasonMemo.has(g.tx.transaction_id)) return seasonMemo.get(g.tx.transaction_id);
  const A = ctx.teams.find(t => t.rosterId === g.teamA.rosterId), B = ctx.teams.find(t => t.rosterId === g.teamB.rosterId);
  const pA = g.toAToday.filter(a => a.type === 'player'), pB = g.toBToday.filter(a => a.type === 'player');
  const has = (team, list) => list.every(p => team.plist.some(x => x.id === p.id));
  let out = null;
  if (A && B && (pA.length || pB.length) && has(A, pA) && has(B, pB)) {
    seasonBase = seasonBase || Vault.simulateSeason(ctx.teams, ctx.league, ctx.remainingWeeks, { trials: SEASON_TRIALS, seed: SEASON_SEED });
    const { before, after } = Vault.simulateTrade(ctx.teams, ctx.slots, A.rosterId, B.rosterId, pA, pB); // send it all back
    // Weekly strength change from undoing it: best lineup plus depth (missed-game cover).
    const dOf = side => (after[side].opt - before[side].opt) + Vault.depthShift('contend', before[side], after[side], ctx.slots).perWeek;
    const dA = dOf('A'), dB = dOf('B');
    // In the simulation each week moves by that week's lineup change (who's
    // available, matchups); dA/dB stay the per-week average shown.
    const weekly = side => {
      const bef = before[side], aft = after[side];
      if (!bef.optByWeek || !aft.optByWeek) return dOf(side);
      return { flat: Vault.depthShift('contend', bef, aft, ctx.slots).perWeek, avg: aft.opt - bef.opt, byWeek: new Map([...aft.optByWeek].map(([w, v]) => [w, v - (bef.optByWeek.get(w) ?? v)])) };
    };
    const without = Vault.simulateSeason(ctx.teams, ctx.league, ctx.remainingWeeks, { trials: SEASON_TRIALS, seed: SEASON_SEED,
      strengthDelta: new Map([[A.rosterId, weekly('A')], [B.rosterId, weekly('B')]]) });
    const row = (team, d) => ({ team, now: seasonBase.get(team.rosterId), without: without.get(team.rosterId), ppw: -d });
    out = [row(A, dA), row(B, dB)];
  }
  seasonMemo.set(g.tx.transaction_id, out);
  return out;
}
function seasonHtml(g) {
  const rows = seasonEffect(g);
  if (!rows) return '';
  if (rows.every(r => Math.abs(r.ppw) < 0.05)) {
    return `<div class="mt-3 pt-3 border-t border-white/5 text-[12px] text-zinc-400"><span class="text-[11px] uppercase tracking-wider text-zinc-400 mr-2">This season</span>Neither starting lineup changed, so no effect on either team's odds this season.</div>`;
  }
  const pct = v => (v < 1 && v > 0 ? '<1' : Math.round(v)) + '%';
  const chg = (now, was) => {
    const d = Math.round(now) - Math.round(was);
    return d ? `<span class="font-semibold ${d > 0 ? 'text-emerald-400' : 'text-rose-400'}">${d > 0 ? '+' : '−'}${Math.abs(d)}</span>` : '<span class="text-zinc-500">±0</span>';
  };
  return `<div class="mt-3 pt-3 border-t border-white/5">
      <div class="text-[11px] uppercase tracking-wider text-zinc-400 mb-1.5" title="Each team as it is now, against the same team with this trade undone, over the ${ctx.remainingWeeks.length} regular-season weeks left (${SEASON_TRIALS.toLocaleString()} simulated seasons, same games both ways). Points per week include depth: what bye and injury weeks cost the lineup.">This season, because of this trade</div>
      <div class="space-y-1 text-[12px]">${rows.map(r => `<div class="flex items-baseline gap-x-3 gap-y-0.5 flex-wrap">
          <span class="text-zinc-200 w-[160px] shrink-0 truncate">${Vault.escapeHtml(r.team.teamName)}</span>
          <span class="text-zinc-400">Playoffs <span class="mono text-zinc-200">${pct(r.now.playoffPct)}</span> vs ${pct(r.without.playoffPct)} without ${chg(r.now.playoffPct, r.without.playoffPct)}</span>
          <span class="text-zinc-400">Title <span class="mono text-zinc-200">${pct(r.now.championshipPct)}</span> vs ${pct(r.without.championshipPct)} ${chg(r.now.championshipPct, r.without.championshipPct)}</span>
          <span class="mono ${Math.abs(r.ppw) < 0.05 ? 'text-zinc-500' : r.ppw > 0 ? 'text-emerald-400' : 'text-rose-400'}">${Math.abs(r.ppw) < 0.05 ? '0.0' : `${r.ppw > 0 ? '+' : '−'}${Math.abs(r.ppw).toFixed(1)}`} pts/week</span>
        </div>`).join('')}</div>
    </div>`;
}

function renderCard(g) {
  const date = new Date(g.created).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const bucket = g.bucket;
  const notes = [
    ...Vault.mergeAssetNotes(g.archA.notes, g.fitA.notes).map(n => ({ ...n, who: g.teamA.teamName })),
    ...g.timelineA.notes.map(n => ({ ...n, who: g.teamA.teamName })),
    ...g.riskA.map(n => ({ ...n, who: g.teamA.teamName })),
    ...(g.optNoteA ? [{ ...g.optNoteA, who: g.teamA.teamName }] : []),
    ...(g.vorpNoteA ? [{ ...g.vorpNoteA, who: g.teamA.teamName }] : []),
    ...(g.depthA?.note ? [{ ...g.depthA.note, who: g.teamA.teamName }] : []),
    ...Vault.mergeAssetNotes(g.archB.notes, g.fitB.notes).map(n => ({ ...n, who: g.teamB.teamName })),
    ...g.timelineB.notes.map(n => ({ ...n, who: g.teamB.teamName })),
    ...g.riskB.map(n => ({ ...n, who: g.teamB.teamName })),
    ...(g.optNoteB ? [{ ...g.optNoteB, who: g.teamB.teamName }] : []),
    ...(g.vorpNoteB ? [{ ...g.vorpNoteB, who: g.teamB.teamName }] : []),
    ...(g.depthB?.note ? [{ ...g.depthB.note, who: g.teamB.teamName }] : [])
  ];
  return `
    <div class="card rounded-vault-sm p-5">
      <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
        <div class="text-[12px] text-zinc-400 mono">${date}</div>
        <div class="flex items-center gap-2">
          <span class="size-2 rounded-full ${verdictDot(g.verdict.tone, g.bucket)}"></span>
          <span class="text-[13px] font-medium ${verdictColor(g.verdict.tone, g.bucket)}">${g.verdict.label}</span>
        </div>
      </div>
      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div>
          <div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-1.5">${Vault.escapeHtml(g.teamA.teamName)} received <span class="text-zinc-400 normal-case tracking-normal">· ${Vault.MODE_LABEL[g.timelineA.mode]}${optDeltaHtml(g.dOptA)}${vorpDeltaHtml(g.dVorpA)}</span></div>
          <div class="text-[13px]">${assetChips(g.toA)}</div>
          ${sideValueLine(g.toA)}
        </div>
        <div>
          <div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-1.5">${Vault.escapeHtml(g.teamB.teamName)} received <span class="text-zinc-400 normal-case tracking-normal">· ${Vault.MODE_LABEL[g.timelineB.mode]}${optDeltaHtml(g.dOptB)}${vorpDeltaHtml(g.dVorpB)}</span></div>
          <div class="text-[13px]">${assetChips(g.toB)}</div>
          ${sideValueLine(g.toB)}
        </div>
      </div>
      <div class="pt-3 border-t border-white/5">
        <p class="text-[13px] font-semibold leading-snug ${synopsisColor(bucket)}">${g.verdict.text}${g.anyMissingValue ? ' <span class="text-zinc-400 font-normal">(some asset values unavailable)</span>' : ''}</p>
        <div class="mt-3" title="Overall: trade value blended with roster fit and timeline (${VAULT_CONFIG.FAIRNESS_WEIGHTS.value}/${VAULT_CONFIG.FAIRNESS_WEIGHTS.roster}/${VAULT_CONFIG.FAIRNESS_WEIGHTS.timeline}), never closer to even than trade value alone. Under ${VAULT_CONFIG.FAIR_PCT}% off is Fair, ${VAULT_CONFIG.FAIR_PCT}-${VAULT_CONFIG.LOPSIDED_PCT}% Lopsided, ${VAULT_CONFIG.LOPSIDED_PCT}%+ Unfair. Great and Good are Fair trades that also fit both or one side well, and neither side poorly.">
          <div class="text-[11px] text-zinc-500">${Vault.escapeHtml(g.teamA.teamName)} paid</div>
          <div class="grid grid-cols-3 gap-4 mt-1 max-w-[560px]">
            ${priceRead(g.valuedAt === 'trade' ? 'then' : 'at today’s values', bucket, g.fairness.overallSigned)}
            ${todayGrade(g) ? priceRead('today', todayGrade(g).bucket, todayGrade(g).signed) : ''}
            ${marketGrade(g) ? priceRead('at market prices', marketGrade(g).bucket, marketGrade(g).signed) : ''}
          </div>
          ${valueAloneText(g)}
        </div>
        ${acceptLine(g)}
        ${agedText(g) ? `<div class="text-[12px] text-zinc-400 mt-2.5">${agedText(g)}</div>` : ''}
      </div>
      ${seasonHtml(g)}
      ${`<details class="group mt-3 pt-3 border-t border-white/5">
        <summary class="flex items-center gap-1.5 py-1 cursor-pointer select-none list-none text-[12px] text-zinc-400 hover:text-zinc-300 transition-colors [&::-webkit-details-marker]:hidden">
          <svg class="size-3 shrink-0 transition-transform group-open:rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          <span>How it's graded${notes.length ? `, and the full breakdown (${notes.length})` : ''}</span>
        </summary>
        <div class="max-w-lg mt-3">${Vault.fairnessPanelHtml(g.fairness, g.bandPct, g.teamA.teamName, g.teamB.teamName, `${capPct(g.fairness.fitMovedIt ? g.fairness.overallPct : g.pctDiff).toFixed(0)}% off`, gradeAccept(g))}</div>
        ${confidenceBandText(g)}
        <div class="space-y-1.5 mt-3">
          ${notes.map(n => `<div class="flex gap-2 text-[12px]"><span class="mt-1 size-1.5 rounded-full shrink-0 ${TONE_DOT[n.tone]}"></span><span class="min-w-0"><span class="text-zinc-400">${Vault.escapeHtml(n.who)}:</span> <span class="${TONE[n.tone]}">${n.text}</span></span></div>`).join('')}
        </div>
      </details>`}
    </div>`;
}

const FAIR_FILTER_TITLE = {
  All: 'Every completed trade, any value gap.',
  Great: `Under ${VAULT_CONFIG.FAIR_PCT}% off overall, AND a strong fit for both sides.`,
  Good: `Under ${VAULT_CONFIG.FAIR_PCT}% off overall, AND a strong fit for at least one side.`,
  Fair: `Under ${VAULT_CONFIG.FAIR_PCT}% off overall.`,
  Lopsided: `${VAULT_CONFIG.FAIR_PCT}-${VAULT_CONFIG.LOPSIDED_PCT}% off — a real tilt, but within normal give-and-take.`,
  Unfair: `${VAULT_CONFIG.LOPSIDED_PCT}%+ off — one side clearly came out ahead on real value.`
};

function renderFilters() {
  document.getElementById('posFilter').innerHTML = FAIR_FILTERS.map(f =>
    `<button onclick="setFairFilter('${f}')" title="${FAIR_FILTER_TITLE[f]}" class="text-[12px] px-2.5 py-1 rounded-lg border transition-colors ${fairFilter === f ? 'bg-white/[0.08] border-white/25 text-white' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${f}</button>`
  ).join('');
  document.getElementById('sortToggle').innerHTML = Object.entries(SORTS).map(([k, label]) =>
    `<button onclick="setSort('${k}')" class="text-[12px] px-2.5 py-1 rounded-lg border transition-colors ${sortKey === k ? 'bg-white/[0.08] border-white/25 text-white' : 'border-white/10 text-zinc-400 hover:text-white hover:border-white/20'}">${label}</button>`
  ).join('');
}

function setFairFilter(f) { fairFilter = f; renderFilters(); renderList(); }

// One manager's trades only (?team=<rosterId>, e.g. from the Managers page).
let teamFilter = new URLSearchParams(location.search).get('team');
function clearTeamFilter() {
  teamFilter = null;
  const u = new URL(location.href); u.searchParams.delete('team'); history.replaceState(null, '', u.toString());
  renderList();
}
function setSort(k) { sortKey = k; renderFilters(); renderList(); }

function renderList() {
  let items = fairFilter === 'All' ? allGraded : allGraded.filter(g => g.bucket === fairFilter);
  const bar = document.getElementById('teamFilterBar');
  const mine = g => String(g.teamA.rosterId) === String(teamFilter) || String(g.teamB.rosterId) === String(teamFilter);
  const who = teamFilter && allGraded.find(mine);
  if (teamFilter && who) {
    items = items.filter(mine);
    const name = String(who.teamA.rosterId) === String(teamFilter) ? who.teamA.teamName : who.teamB.teamName;
    bar.innerHTML = `<div class="flex items-center justify-between gap-3 flex-wrap p-3 rounded-xl border border-amber-400/30 bg-amber-400/[0.06]">
        <span class="text-[13px] text-zinc-200">Showing ${Vault.escapeHtml(name)}'s trades only (${allGraded.filter(mine).length})</span>
        <button onclick="clearTeamFilter()" class="text-[12px] px-3 py-1.5 rounded-lg border border-white/10 text-zinc-300 hover:text-white hover:border-white/20">Show all trades</button>
      </div>`;
    bar.classList.remove('hidden');
  } else bar.classList.add('hidden');
  items = [...items].sort((a, b) => sortKey === 'lopsided' ? b.fairness.overallPct - a.fairness.overallPct : b.created - a.created);

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (!items.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    empty.textContent = allGraded.length ? `No ${fairFilter.toLowerCase()} trades found.` : 'No completed trades found for this league yet.';
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = items.map(renderCard).join('');
}

async function init() {
  const status = document.getElementById('status');
  try {
    const leagueId = Vault.getLeagueId();
    status.textContent = 'Loading player database and trade history…';
    const { league, isSF, teams, slots, remainingWeeks, allGraded: graded } = await Vault.fetchAndGradeAllTrades(leagueId);
    allGraded = graded;
    ctx = { league, teams, slots, remainingWeeks };

    status.textContent = `${allGraded.length} completed trade${allGraded.length === 1 ? '' : 's'} • ${league.name} • ${isSF ? 'Superflex' : '1QB'}`;
    status.className = 'text-[13px] text-zinc-400 mt-1';
    renderFilters();
    renderList();
    // Then each trade's At market line, once completed-trade prices load.
    marketLoad(league).then(() => { if (Market.data && !Market.data.failed) renderList(); });
  } catch (e) {
    console.error(e);
    status.textContent = e.message || 'Failed to load';
    status.className = 'text-[13px] text-rose-400 mt-1';
  }
}
init();
</script>
</body>
</html>
