<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="brand/vault-dial-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="brand/vault-dial-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="brand/vault-dial-180.png">
<title>Rate Trades — The Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vault.css?v=655a9195">
<link rel="stylesheet" href="tailwind.css?v=b88a32b3">
</head>
<body class="text-zinc-100 antialiased">
<div class="vault-bg"></div>
<script>window.VAULT_NO_LEAGUE_OK = true; // anyone can rate trades, league or not</script>
<div id="vault-nav"></div>

<div class="max-w-[760px] mx-auto px-4 sm:px-6 py-8 lg:py-10">
  <div class="mb-2 flex items-end justify-between gap-3 flex-wrap">
    <div>
      <h1 class="display text-[28px] font-semibold gold-text">Rate Trades</h1>
      <p id="rateStatus" class="text-[13px] text-zinc-400 mt-1">Loading trades…</p>
    </div>
    <div id="rateFmt" class="flex items-center bg-black/40 border border-white/[0.08] rounded-xl p-1"></div>
  </div>
  <p class="text-[13px] text-zinc-400 max-w-[680px] mb-5 leading-relaxed">
    Real dynasty trades managers just made in Sleeper leagues. Who won? Vote, then see what KTC's calculator, The Vault's trade value and everyone else said.
    Everyone gets the same trades each day, so the crowd's answers add up. Votes are anonymous.
  </p>

  <div id="rateCard" class="card rounded-vault-sm p-5 mb-5"></div>
  <div id="rateRecord" class="card rounded-vault-sm p-5 mb-5 hidden"></div>
  <p id="rateNote" class="text-[11px] text-zinc-500"></p>
</div>

<script src="vault-core.js?v=22174353"></script>
<script src="vault-nav.js?v=9bf53d54"></script>
<script src="rate-config.js?v=3520b648"></script>
<script src="rate.js?v=2d33b157"></script>
</body>
</html>
